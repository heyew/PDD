name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Read conditioned flush and real-service results
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''PY'\''
          from pathlib import Path
          import json,subprocess
          print("CONDITIONED_FLUSH_P2_RESULT_BEGIN",flush=True)
          print("POLL_REVISION",2,flush=True)
          for filename in ["/root/e251/v2_p2_status.json","/root/e251/pair-v2-a1/result.json","/root/e245/p2-row-a3/result.json"]:
           p=Path(filename)
           if p.is_file():print("RESULT_JSON",json.dumps({"path":filename,"data":json.loads(p.read_text())}),flush=True)
           else:print("MISSING",filename,flush=True)
          for filename in ["/root/e251/pair-v2-a1.log","/root/e245/p2_row_a3/task.log","/root/e245/p2-row-a3/serve.log"]:
           p=Path(filename)
           if not p.is_file():continue
           lines=p.read_text(errors="replace").splitlines()
           print("LOG_TAIL",json.dumps({"path":filename,"lines":lines[-30:]}),flush=True)
           if "serve.log" in filename:
            hits=[i for i,s in enumerate(lines) if any(x in s for x in ["TypeError:","AssertionError:","HTTP/1.1\\\" 500","p2_observer.py","Error in sitecustomize"])]
            ix=set()
            for i in hits[:12]:ix.update(range(max(0,i-4),min(len(lines),i+12)))
            if ix:print("ERROR_CONTEXT",json.dumps({"path":filename,"lines":[[i+1,lines[i]]for i in sorted(ix)]}),flush=True)
          p=Path("/root/e245/p2-row-a3/events.jsonl")
          if p.is_file():print("EVENTS_TAIL",json.dumps({"path":str(p),"lines":p.read_text().splitlines()[-12:]}),flush=True)
          print("GPU_MEMORY_USED",subprocess.check_output(["/usr/local/corex/bin/ixsmi","--query-gpu=memory.used","--format=csv,noheader"],text=True).strip(),flush=True)
          print("CONDITIONED_FLUSH_P2_RESULT_END",flush=True)
          PY'
