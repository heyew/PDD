filename, frames, q_weights, o_weights, anchors):\n    names = [frame.f_code.co_name for frame in frames]\n    forward = next((f for f in frames if f.f_code.co_name == \"forward\" and f.f_code.co_filename == \"/root/e223/probe.py\"), None)\n    layer = int(forward.f_locals.get(\"layer\", -1)) if forward else -1\n    if \"sample\" in names:\n        return -1, \"sampler\"\n    if \"project\" in names:\n        return -1, \"head\"\n    if \"attention\" in names:\n        if name == \"_stage\":\n            return layer, \"kv_stage\"\n        if name == \"_flush\":\n            return layer, \"kv_flush\"\n        if name == \"map_cached\":\n            return layer, \"attention_map\"\n        if name in {\"full_collect_split\", \"merge_refresh\", \"prepare_norm\", \"normalize\", \"select_commit\", \"norm_select\", \"sort_commit\", \"full_collect_refresh\"}:\n            return layer, \"anchor_refresh\"\n        return layer, \"anchor_attention\" if layer in anchors else \"recipient_attention\"\n    if \"grouped_mlp\" in names:\n        stage = {\"_nq_kernel\": \"mlp_norm\", \"producer\": \"mlp_gate_up\", \"_down\": \"mlp_down\", \"_finish\": \"mlp_down_finish\"}.get(name, \"mlp_other\")\n        return layer, stage\n    if \"rope_rot\" in names:\n        return layer, \"rope\"\n    if \"norm_qkv\" in names:\n        return layer, \"qkv_norm\" if name == \"_nq_kernel\" else \"qkv_projection\"\n    linear = next((f for f in frames if f.f_code.co_name == \"linear\" and \"weight\" in f.f_locals), None)\n    if linear is not None:\n        identity = id(linear.f_locals[\"weight\"][0])\n        if identity in q_weights:\n            return q_weights[identity], \"qkv_projection\"\n        if identity in o_weights:\n            return o_weights[identity], \"o_projection\"\n    if \"_norm_ref\" in names:\n        return layer, \"first_layer_norm\"\n    return layer, \"other_true_work\"\n\n\n@contextmanager\ndef launch_map(probe, runtime_jit, records, anchors):\n    originals = []\n    q_weights = {id(layer[1][0]): i for i, layer in enumerate(probe.layers)}\n    o_weights = {id(layer[2][0]): i for i, layer in enumerate(probe.layers)}\n    for cls in dict.fromkeys((*runtime_jit.JITFunction.__mro__, runtime_jit.KernelInterface)):\n        if \"__getitem__\" not in cls.__dict__:\n            continue\n        original = cls.__dict__[\"__getitem__\"]\n\n        def hooked(kernel, grid, _original=original):\n            launch = _original(kernel, grid)\n\n            def call(*args, **kwargs):\n                function = kernel_python_function(kernel, runtime_jit.KernelInterface)\n                name = getattr(function, \"__name__\", type(function).__name__)\n                code = getattr(function, \"__code__\", None)\n                filename = code.co_filename if code else None\n                frames = []\n                frame = inspect.currentframe().f_back\n                while frame is not None:\n                    frames.append(frame)\n                    frame = frame.f_back\n                layer, stage = source_context(name, filename, frames, q_weights, o_weights, anchors)\n                del frames, frame\n                value = launch(*args, **kwargs)\n                metadata = getattr(value, \"metadata\", None)\n                row = {\"ordinal\": len(records), \"kernel_name\": name, \"compiled_name\": getattr(value, \"name\", None),\n                       \"source_file\": filename, \"source_line\": code.co_firstlineno if code else None,\n                       \"layer\": layer, \"stage\": stage,\n                       \"grid\": list(grid) if isinstance(grid, (tuple, list)) else \"callable\",\n                       \"num_warps_argument\": kwargs.get(\"num_warps\"), \"num_stages_argument\": kwargs.get(\"num_stages\")}\n                for key in (\"num_warps\", \"shared\", \"name\"):\n                    val = getattr(metadata, key, None)\n                    if isinstance(val, (str, int, float, bool)) or val is None:\n                        row[\"compiled_\" + key] = val\n                for key in (\"n_regs\", \"n_spills\"):\n                    val = getattr(value, key, None)\n                    if isinstance(val, (int, float)) or val is None:\n                        row[key] = val\n                records.append(row)\n                return value\n            return call\n        cls.__getitem__ = hooked\n        originals.append((cls, original))\n    assert originals\n    try:\n        yield\n    finally:\n        for cls, original in reversed(originals):\n            cls.__getitem__ = original\n\n\ndef trace_ledger(trace_path, launches, external_ms):\n    trace = json.loads(trace_path.read_text())\n    events = trace[\"traceEvents\"]\n    kernels = sorted((e for e in events if e.get(\"ph\") == \"X\" and str(e.get(\"cat\", \"\")).lower() in (\"kernel\", \"gpu_kernel\", \"cuda_kernel\") and \"dur\" in e), key=lambda e: e[\"ts\"])\n    cursor, rows, unmatched, gaps = 0, [], [], []\n    previous_end = None\n    for event in kernels:\n        name = str(event[\"name\"])\n        record = launches[cursor] if cursor < len(launches) else None\n        if record is not None and (name == record[\"kernel_name\"] or name == record.get(\"compiled_name\") or name.startswith(record[\"kernel_name\"] + \"_\")):\n            semantic = {key: record[key] for key in (\"ordinal\", \"kernel_name\", \"source_file\", \"source_line\", \"layer\", \"stage\")}\n            cursor += 1\n        else:\n            semantic = {\"ordinal\": None, \"kernel_name\": name, \"source_file\": None, \"source_line\": None, \"layer\": None, \"stage\": \"unmapped_native_or_sequence_mismatch\"}\n            unmatched.append({\"name\": name, \"next_expected_triton\": record[\"kernel_name\"] if record else None})\n        start, end = float(event[\"ts\"]), float(event[\"ts\"]) + float(event[\"dur\"])\n        gap = max(0., start - previous_end) if previous_end is not None else 0.\n        rows.append(dict(semantic, name=name, ts_us=start, dur_us=float(event[\"dur\"]), gap_before_us=gap,\n                         stream=event.get(\"args\", {}).get(\"stream\"), device=event.get(\"args\", {}).get(\"device\"),\n                         activity_args=event.get(\"args\", {})))\n        if gap:\n            gaps.append({\"before_kernel\": name, \"before_stage\": semantic[\"stage\"], \"before_layer\": semantic[\"layer\"], \"gap_us\": gap})\n        previous_end = max(previous_end, end) if previous_end is not None else end\n    envelope = (max(row[\"ts_us\"] + row[\"dur_us\"] for row in rows) - rows[0][\"ts_us\"]) / 1000 if rows else None\n    merged = []\n    for row in rows:\n        a, b = row[\"ts_us\"], row[\"ts_us\"] + row[\"dur_us\"]\n        if merged and a <= merged[-1][1]:\n            merged[-1][1] = max(merged[-1][1], b)\n        else:\n            merged.append([a, b])\n    union = sum(b - a for a, b in merged) / 1000\n    per_stage, per_name, per_layer = defaultdict(list), defaultdict(list), defaultdict(list)\n    for row in rows:\n        per_stage[row[\"stage\"]].append(row[\"dur_us\"] / 1000)\n        per_name[row[\"name\"]].append(row[\"dur_us\"] / 1000)\n        per_layer[str(row[\"layer\"])].append(row[\"dur_us\"] / 1000)\n\n    def sums(mapping):\n        return {key: {\"count\": len(values), \"sum_ms\": sum(values), \"mean_ms\": mean(values), \"max_ms\": max(values)} for key, values in mapping.items()}\n    return {\"external_event_ms\": external_ms, \"kernel_count\": len(rows), \"captured_triton_launches\": len(launches),\n            \"mapped_triton_launches\": cursor, \"all_triton_launches_mapped_in_order\": cursor == len(launches),\n            \"kernel_sum_ms\": sum(row[\"dur_us\"] for row in rows) / 1000, \"kernel_union_ms\": union,\n            \"kernel_envelope_ms\": envelope, \"within_envelope_gap_ms\": envelope - union if envelope is not None else None,\n            \"external_minus_kernel_envelope_ms\": external_ms - envelope if envelope is not None else None,\n            \"stage_duration_sums\": sums(per_stage), \"kernel_name_duration_sums\": sums(per_name), \"layer_duration_sums\": sums(per_layer),\n            \"top_gaps\": sorted(gaps, key=lambda x: x[\"gap_us\"], reverse=True)[:30], \"unmatched_kernels\": unmatched,\n            \"kernel_timeline\": rows, \"category_counts\": dict(Counter(str(e.get(\"cat\", \"\")) for e in events)),\n            \"mapping_note\": \"Exact ordered matching against an observed real-work Triton launch sequence. Unmapped native kernels stay explicit; no durations or stage labels are invented. CPU profiler ranges are excluded.\"}\n\n\ndef main():\n    ap = argparse.ArgumentParser(description=__doc__)\n    ap.add_argument(\"out\", type=Path)\n    ap.add_argument(\"--phase\", choices=(\"all\", \"ordinary\", \"refresh8\", \"refresh56\", \"ordinary1\", \"refresh1\", \"ordinary_refresh1\"), default=\"ordinary\")\n    ap.add_argument(\"--refresh-row\", type=int, default=0, choices=range(64),\n                    help=\"Physical row of the one-token-ahead request in the custom one-row fixture; default 0\")\n    args = ap.parse_args()\n    args.out.mkdir(parents=True, exist_ok=False)\n    for path, wanted in PINS.items():\n        assert sha256(Path(path).read_bytes()).hexdigest() == wanted, path\n    used = subprocess.check_output([\"ixsmi\", \"--query-gpu=memory.used\", \"--format=csv,noheader\"], text=True)\n    assert int(used.split()[0]) < 256, \"Card is not idle\"\n    sys.path[:0] = [\"/root/e214/candidate-a1/gems/src\", \"/root/e227\"]\n    import torch\n    from triton.runtime import jit as runtime_jit\n    from joint import CANDIDATE, HEAD, HEAD_SHA, I, L, PHASES, X, JointProbe, bits, initialize\n    assert CANDIDATE in Path(I.__file__).resolve().parents\n    assert sha256(Path(HEAD.__file__).read_bytes()).hexdigest() == HEAD_SHA\n    torch.set_num_threads(4)\n    torch.manual_seed(223214)\n    started = time.monotonic()\n    result = {\"scope\": \"real_E214_eager_kernel_activity_with_true_graph_reference_not_graph_stage_timing\", \"source_pins\": PINS,\n              \"build\": json.loads((CANDIDATE / \"build.json\").read_text()), \"phases\": {}, \"errors\": [],\n              \"wrapper_sha256\": sha256(Path(__file__).read_bytes()).hexdigest(),\n              \"custom_refresh_row\": args.refresh_row,\n              \"custom_fixture_note\": \"ordinary1 and refresh1 use one-hot request offset. They are separate valid E214 states; outputs are checked only against the identical-state control, never across phases. No service phase weighting is asserted.\"}\n    with torch.inference_mode():\n        probe = JointProbe()\n        custom_phases = ((\"ordinary1\", 16909, 0, None), (\"refresh1\", 16910, 1, None))\n        selected = {\"ordinary1\", \"refresh1\"} if args.phase == \"ordinary_refresh1\" else {args.phase}\n        for name, base, expected_refresh, weight in (*PHASES, *custom_phases):\n            if \"all\" not in selected and name not in selected:\n                continue\n            try:\n                if name in {\"ordinary1\", \"refresh1\"}:\n                    probe.offset = (torch.arange(64, device=probe.device) == args.refresh_row).long()\n                else:\n                    probe.offset = (torch.arange(64, device=probe.device) >= 56).long()\n                route, indices, token, initial = initialize(probe, base)\n                selected_positions = route[0].tolist()\n                selected_sequence_lengths = route[1].tolist()\n\n                def forward():\n                    logits, layers = probe.forward(token, (route,), record=True)\n                    return logits, layers, probe.sample(logits)\n\n                def parity(observed, wanted, terminal):\n                    assert bits(observed[0], wanted[0]) and bits(observed[2], wanted[2]), name\n                    assert all(bits(a, b) for xs, ys in zip(observed[1], wanted[1], strict=True) for a, b in zip(xs, ys, strict=True)), name\n                    assert not probe.state_diff(terminal, 0, indices), name\n\n                probe.restore(initial, indices)\n                probe.configure(\"control\")\n                wanted = forward()\n                terminal = probe.snapshot(0, indices)\n                refresh = (terminal[1][0] != initial[1][0]).sum(dim=1).tolist()\n                assert refresh == [expected_refresh] * len(X.ANCHORS), (name, refresh)\n                launches = []\n                probe.restore(initial, indices)\n                probe.configure(\"control\")\n                with launch_map(probe, runtime_jit, launches, X.ANCHORS):\n                    mapped_output = forward()\n                parity(mapped_output, wanted, terminal)\n                assert probe.projections == L and probe.recipient_calls == 34 and probe.weight_bytes == 0\n                dump(args.out / (name + \"_launch_map.json\"), launches)\n                probe.restore(initial, indices)\n                probe.configure(\"control\")\n                pregraph = torch.cuda.CUDAGraph()\n                with torch.cuda.graph(pregraph):\n                    preoutput = forward()\n\n                def measure(graph):\n                    first, last = torch.cuda.Event(enable_timing=True), torch.cuda.Event(enable_timing=True)\n                    times = []\n                    for _ in range(5):\n                        probe.restore(initial, indices)\n                        first.record()\n                        graph.replay()\n                        last.record()\n                        last.synchronize()\n                        times.append(first.elapsed_time(last))\n                    return times\n\n                before = measure(pregraph)\n                parity(preoutput, wanted, terminal)\n                eager_before = []\n                eager_a, eager_b = torch.cuda.Event(enable_timing=True), torch.cuda.Event(enable_timing=True)\n                for _ in range(3):\n                    probe.restore(initial, indices)\n                    probe.configure(\"control\")\n                    eager_a.record()\n                    eager_output = forward()\n                    eager_b.record()\n                    eager_b.synchronize()\n                    eager_before.append(eager_a.elapsed_time(eager_b))\n                parity(eager_output, wanted, terminal)\n                probe.restore(initial, indices)\n                probe.configure(\"control\")\n                torch.cuda.synchronize()\n                first, last = torch.cuda.Event(enable_timing=True), torch.cuda.Event(enable_timing=True)\n                with torch.profiler.profile(activities=[torch.profiler.ProfilerActivity.CPU, torch.profiler.ProfilerActivity.CUDA],\n                                            record_shapes=False, profile_memory=False, with_stack=False) as profile:\n                    with torch.profiler.record_function(\"actual_e214_eager_forward_\" + name):\n                        first.record()\n                        observed = forward()\n                        last.record()\n                        last.synchronize()\n                external_ms = first.elapsed_time(last)\n                parity(observed, wanted, terminal)\n                assert probe.projections == L and probe.recipient_calls == 34 and probe.weight_bytes == 0\n                trace = args.out / (name + \".trace.json\")\n                profile.export_chrome_trace(str(trace))\n                after = measure(pregraph)\n                parity(preoutput, wanted, terminal)\n                entry = trace_ledger(trace, launches, external_ms)\n                entry.update(parity=True, refresh_rows_by_anchor=refresh, phase_weight_fixture=weight,\n                             custom_single_row_fixture=name in {\"ordinary1\", \"refresh1\"},\n                             positions=selected_positions, sequence_lengths=selected_sequence_lengths,\n                             refresh_row_indices_by_anchor=[(new != old).nonzero().flatten().tolist()\n                                 for new, old in zip(terminal[1][0], initial[1][0], strict=True)],\n                             unprofiled_graph_before_ms=before, unprofiled_graph_after_ms=after,\n                             graph_drift_relative=median(after) / median(before) - 1,\n                             unprofiled_eager_before_ms=eager_before,\n                             profiler_eager_span_vs_unprofiled_eager_ratio=external_ms / median(eager_before),\n                             eager_kernel_union_vs_graph_median_ratio=entry[\"kernel_union_ms\"] / median(after),\n                             eager_kernel_sum_vs_graph_median_ratio=entry[\"kernel_sum_ms\"] / median(after),\n                             interpret_as_strict_graph_stage_times=False,\n                             no_output_replay_or_omitted_arithmetic=True)\n                result[\"phases\"][name] = entry\n                dump(args.out / \"result.json\", result)\n                print(json.dumps({\"phase\": name, \"external_ms\": external_ms, \"unprofiled_after_median_ms\": median(after),\n                                  \"kernel_count\": entry[\"kernel_count\"], \"mapped\": entry[\"mapped_triton_launches\"],\n                                  \"expected_map\": len(launches), \"parity\": True}), flush=True)\n                if entry[\"kernel_count\"] == 0:\n                    raise RuntimeError(\"True eager forward has no device kernel activity; stop without profiling further phases\")\n            except Exception as exc:\n                result[\"errors\"].append({\"phase\": name, \"error\": repr(exc), \"traceback\": traceback.format_exc()})\n                break\n    result[\"elapsed_wall_s\"] = time.monotonic() - started\n    dump(args.out / \"result.json\", result)\n\n\nif __name__ == \"__main__\":\n    main()\n","run_eager_pair_owned.py":"import json,os,signal,subprocess,sys,time\nfrom pathlib import Path\nroot=Path(__file__).resolve().parent\ndata={\"state\":\"running\",\"start_unix\":time.time(),\"task\":\"true_E214_ordinary_and_single_refresh_eager_profile_with_graph_reference\"}\nstatus=root/\"eager_pair_status.json\"\ncmd=[sys.executable,str(root/\"profile_e214_eager_v2.py\"),str(root/\"eager_pair_a1\"),\"--phase\",\"ordinary_refresh1\"]\nenv=os.environ.copy();env[\"OMP_NUM_THREADS\"]=\"4\";env[\"OPENBLAS_NUM_THREADS\"]=\"4\"\nwith (root/\"eager_pair.log\").open(\"w\") as log:\n    p=subprocess.Popen(cmd,cwd=root,env=env,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\n    data[\"pid\"]=p.pid;status.write_text(json.dumps(data)+\"\\n\")\n    try:rc=p.wait(timeout=300)\n    except subprocess.TimeoutExpired:\n        os.killpg(p.pid,signal.SIGTERM)\n        try:rc=p.wait(timeout=15)\n        except subprocess.TimeoutExpired:os.killpg(p.pid,signal.SIGKILL);rc=p.wait()\n        data[\"timed_out\"]=True\n    data.update(state=\"completed\",exit_code=rc,end_unix=time.time());status.write_text(json.dumps(data)+\"\\n\")\n"}
