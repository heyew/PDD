name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Inspect frozen GPU harness and native profiling tools
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'set -eu
          printf "FLAGOS_HARNESS_AUDIT_V4_BEGIN\n"
          python3 - <<'\''PY'\''
          import pathlib,hashlib,json,shutil
          for base in ("/root/e223","/root/e227","/root/e228","/usr/local/corex/bin","/usr/local/corex/lib64","/usr/local/corex/extras"):
              p=pathlib.Path(base)
              if not p.is_dir(): continue
              names=[x.name for x in sorted(p.iterdir()) if not x.name.startswith(".")]
              if "corex" in base: names=[x for x in names if any(k in x.lower() for k in ("prof","cupti","trace","smi","gdb"))]
              print("TOOL_OR_HARNESS_FILES",base,json.dumps(names[:100]),flush=True)
          for name in ("_window_native.py","_kv_pipeline.py","_cta_native_merge.py"):
              p=pathlib.Path("/root/e214/candidate-a1/gems/src/flag_gems/fused/minicpm")/name
              print("SOURCE_SHA256",str(p),hashlib.sha256(p.read_bytes()).hexdigest(),flush=True)
          for name in ("/root/e223/probe.py","/root/e227/joint.py","/root/e228/mbu.py"):
              p=pathlib.Path(name)
              if p.is_file(): print("HARNESS_SOURCE",json.dumps({"path":str(p),"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"content":p.read_text()}),flush=True)
          for name in ("warm1","warm2"):
              p=pathlib.Path("/root/e241/schedule_a4")/(name+"_steps.jsonl")
              if not p.is_file(): continue
              rows=[json.loads(x) for x in p.read_text().splitlines()]
              hist={}
              for v in rows:
                  shape=(len(v),sum(int(x[3]) for x in v))
                  hist[str(shape)]=hist.get(str(shape),0)+1
              print("SCHEDULE_SHAPES",name,json.dumps(hist),flush=True)
          print("E244_EXISTS",pathlib.Path("/root/e244").exists(),flush=True)
          PY
          printf "FLAGOS_HARNESS_AUDIT_V4_END\n"'
