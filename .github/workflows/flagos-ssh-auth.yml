          files={"profile_capability.py":"#!/usr/bin/env python3\n\"\"\"<60s isolated CUDA/CUPTI timeline capability probe; never changes libraries.\n\nRun only while card idle, e.g. timeout 60s python3 profile_capability.py out_a1\nUses existing torch.profiler first and one legacy autograd fallback only if needed.\nCPU ranges are never counted as GPU kernels. Captures one and two Triton kernels\ninside CUDA graphs and calibrates actual trace intervals against external events.\nThis is a capability test, not a model performance result.\n\"\"\"\nimport argparse\nfrom collections import Counter\nimport json\nfrom pathlib import Path\nimport signal\nfrom statistics import median\nimport subprocess\nimport time\nimport traceback\n\nimport torch\nimport triton\nimport triton.language as tl\n\n\nclass ProbeDeadline(BaseException):\n    pass\n\n\n@triton.jit\ndef _cap_add(X, Y, N: tl.constexpr, BLOCK: tl.constexpr):\n    i = tl.program_id(0) * BLOCK + tl.arange(0, BLOCK)\n    x = tl.load(X + i, i < N, other=0)\n    tl.store(Y + i, x + 1., i < N)\n\n\n@triton.jit\ndef _cap_mul(Y, Z, N: tl.constexpr, BLOCK: tl.constexpr):\n    i = tl.program_id(0) * BLOCK + tl.arange(0, BLOCK)\n    y = tl.load(Y + i, i < N, other=0)\n    tl.store(Z + i, y * 2., i < N)\n\n\ndef summarize_trace(path, expected_kernels, event_ms):\n    trace = json.loads(path.read_text())\n    events = trace if isinstance(trace, list) else trace.get(\"traceEvents\", [])\n    candidates = []\n    for event in events:\n        category = str(event.get(\"cat\", \"\")).lower()\n        name = str(event.get(\"name\", \"\"))\n        # Explicit activity category; a CPU record_function range with the same\n        # name does not establish device timing or kernel visibility.\n        is_kernel = category in (\"kernel\", \"gpu_kernel\", \"cuda_kernel\")\n        if event.get(\"ph\") == \"X\" and is_kernel and \"ts\" in event and \"dur\" in event:\n            candidates.append(event)\n    kernels = [event for event in candidates if \"_cap_add\" in event.get(\"name\", \"\") or \"_cap_mul\" in event.get(\"name\", \"\")]\n    intervals = sorted((float(event[\"ts\"]), float(event[\"ts\"]) + float(event[\"dur\"])) for event in kernels)\n    merged = []\n    for start, end in intervals:\n        if merged and start <= merged[-1][1]:\n            merged[-1][1] = max(merged[-1][1], end)\n        else:\n            merged.append([start, end])\n    envelope_ms = (max(end for _, end in intervals) - min(start for start, _ in intervals)) / 1000 if intervals else None\n    union_ms = sum(end - start for start, end in merged) / 1000\n    duration_ms = sum(float(event[\"dur\"]) for event in kernels) / 1000\n    gap_ms = envelope_ms - union_ms if envelope_ms is not None else None\n    return {\n        \"trace_path\": str(path), \"trace_display_time_unit\": trace.get(\"displayTimeUnit\") if isinstance(trace, dict) else None,\n        \"timestamp_interpretation\": \"Chrome trace ts/dur are microseconds; displayTimeUnit does not rescale serialized numbers\",\n        \"expected_kernel_count\": expected_kernels, \"all_explicit_gpu_kernel_records\": len(candidates),\n        \"matched_triton_gpu_kernel_records\": len(kernels), \"kernel_count_matches\": len(kernels) == expected_kernels,\n        \"positive_kernel_durations\": bool(kernels) and all(float(event[\"dur\"]) > 0 for event in kernels),\n        \"external_event_ms\": event_ms, \"kernel_duration_sum_ms\": duration_ms,\n        \"kernel_union_ms\": union_ms, \"kernel_envelope_ms\": envelope_ms, \"within_envelope_gap_ms\": gap_ms,\n        \"event_minus_kernel_envelope_ms\": event_ms - envelope_ms if envelope_ms is not None else None,\n        \"envelope_fits_external_event\": envelope_ms is not None and envelope_ms <= event_ms + .1,\n        \"trace_category_counts\": dict(Counter(str(event.get(\"cat\", \"\")) for event in events)),\n        \"kernels\": [{\"name\": event.get(\"name\"), \"ts_us\": event[\"ts\"], \"dur_us\": event[\"dur\"],\n                     \"pid\": event.get(\"pid\"), \"tid\": event.get(\"tid\"), \"args\": event.get(\"args\", {})} for event in kernels],\n    }\n\n\ndef main():\n    ap = argparse.ArgumentParser(description=__doc__)\n    ap.add_argument(\"out\", type=Path)\n    args = ap.parse_args()\n    args.out.mkdir(parents=True, exist_ok=False)\n    started = time.monotonic()\n    result = {\"scope\": \"isolated_profiler_capability_not_model_speed\", \"cases\": {}, \"errors\": []}\n\n    def deadline(signum, frame):\n        raise ProbeDeadline(\"Profiler capability probe reached its 50-second runtime deadline\")\n\n    signal.signal(signal.SIGALRM, deadline)\n    signal.alarm(50)\n    try:\n        used = subprocess.check_output([\"ixsmi\", \"--query-gpu=memory.used\", \"--format=csv,noheader\"], text=True)\n        assert int(used.split()[0]) < 256, \"Card is not idle; do not interfere with a service\"\n        result[\"runtime\"] = {\"torch\": torch.__version__, \"torch_cuda\": torch.version.cuda,\n                             \"triton\": triton.__version__, \"cuda_available\": torch.cuda.is_available(),\n                             \"kineto_available\": bool(torch.profiler.kineto_available()) if hasattr(torch.profiler, \"kineto_available\") else None,\n                             \"supported_activities\": [str(x) for x in torch.profiler.supported_activities()] if hasattr(torch.profiler, \"supported_activities\") else None,\n                             \"cupti_file_exists\": Path(\"/usr/local/corex/lib64/libcupti.so.10.2.89\").is_file(),\n                             \"library_changes\": False}\n        assert torch.cuda.is_available()\n        torch.set_num_threads(1)\n        n = 1 << 20\n        x = torch.arange(n, dtype=torch.float32, device=\"cuda\")\n        y, z = torch.empty_like(x), torch.empty_like(x)\n\n        def one():\n            _cap_add[(triton.cdiv(n, 256),)](x, y, n, 256, num_warps=4)\n\n        def two():\n            one()\n            _cap_mul[(triton.cdiv(n, 256),)](y, z, n, 256, num_warps=4)\n\n        two()\n        torch.cuda.synchronize()\n        graphs = {}\n        for name, fn in ((\"graph_one\", one), (\"graph_two\", two)):\n            graph = torch.cuda.CUDAGraph()\n            with torch.cuda.graph(graph):\n                fn()\n            graph.replay()\n            graphs[name] = graph\n        torch.cuda.synchronize()\n        result[\"correctness_max_abs_error\"] = (z - (x + 1) * 2).abs().max().item()\n        assert result[\"correctness_max_abs_error\"] == 0\n        cases = ((\"eager_pair\", two, 1, 2), (\"graph_one\", graphs[\"graph_one\"].replay, 1, 1),\n                 (\"graph_two\", graphs[\"graph_two\"].replay, 1, 2),\n                 (\"graph_two_triple\", graphs[\"graph_two\"].replay, 3, 6))\n\n        def unprofiled(fn, repetitions):\n            values = []\n            start, finish = torch.cuda.Event(enable_timing=True), torch.cuda.Event(enable_timing=True)\n            for _ in range(3):\n                start.record()\n                for _ in range(repetitions):\n                    fn()\n                finish.record()\n                finish.synchronize()\n                values.append(start.elapsed_time(finish))\n            return values\n\n        for name, fn, repetitions, expected in cases:\n            baseline = unprofiled(fn, repetitions)\n            case = {\"unprofiled_external_event_ms\": baseline, \"unprofiled_external_median_ms\": median(baseline)}\n            result[\"cases\"][name] = case\n            start, finish = torch.cuda.Event(enable_timing=True), torch.cuda.Event(enable_timing=True)\n            try:\n                with torch.profiler.profile(activities=[torch.profiler.ProfilerActivity.CPU, torch.profiler.ProfilerActivity.CUDA],\n                                            record_shapes=False, profile_memory=False, with_stack=False) as profiler:\n                    with torch.profiler.record_function(\"capability_\" + name):\n                        start.record()\n                        for _ in range(repetitions):\n                            fn()\n                        finish.record()\n                        finish.synchronize()\n                event_ms = start.elapsed_time(finish)\n                trace = args.out / (name + \".trace.json\")\n                profiler.export_chrome_trace(str(trace))\n                case.update(summarize_trace(trace, expected, event_ms))\n                case[\"profiler_event_vs_unprofiled_ratio\"] = event_ms / median(baseline)\n                case[\"supported\"] = bool(case[\"kernel_count_matches\"] and case[\"positive_kernel_durations\"] and case[\"envelope_fits_external_event\"])\n            except Exception as exc:\n                case.update(supported=False, error=repr(exc), traceback=traceback.format_exc())\n            (args.out / \"result.json\").write_text(json.dumps(result, indent=2) + \"\\n\")\n        modern_ok = all(result[\"cases\"][name].get(\"supported\", False) for name in (\"graph_one\", \"graph_two\", \"graph_two_triple\"))\n        result[\"torch_profiler_graph_kernel_timeline_supported\"] = modern_ok\n        if not modern_ok and time.monotonic() - started < 35:\n            # Legacy event ranges alone do not pass this probe; same explicit\n            # GPU-kernel category and target-symbol checks are required.\n            fallback = {}\n            result[\"legacy_autograd_fallback\"] = fallback\n            try:\n                start, finish = torch.cuda.Event(enable_timing=True), torch.cuda.Event(enable_timing=True)\n                with torch.autograd.profiler.profile(use_cuda=True, use_kineto=False) as profiler:\n                    start.record()\n                    graphs[\"graph_two\"].replay()\n                    finish.record()\n                    finish.synchronize()\n                trace = args.out / \"legacy_graph_two.trace.json\"\n                profiler.export_chrome_trace(str(trace))\n                fallback.update(summarize_trace(trace, 2, start.elapsed_time(finish)))\n                fallback[\"supported\"] = bool(fallback[\"kernel_count_matches\"] and fallback[\"positive_kernel_durations\"] and fallback[\"envelope_fits_external_event\"])\n            except Exception as exc:\n                fallback.update(supported=False, error=repr(exc))\n        result[\"next_gate\"] = \"If graph kernel timelines are supported, profile one warmed E227 control graph replay with an external event span. Real kernel durations, gaps and parent graph stream identities must be preserved; no inference from CPU operator ranges. Profiled total must be compared with unprofiled replay before treating attribution as representative.\"\n    except (ProbeDeadline, Exception) as exc:\n        result[\"errors\"].append({\"error\": repr(exc), \"traceback\": traceback.format_exc()})\n    finally:\n        signal.alarm(0)\n        result[\"elapsed_wall_s\"] = time.monotonic() - started\n        (args.out / \"result.json\").write_text(json.dumps(result, indent=2) + \"\\n\")\n        print(json.dumps({\"output\": str(args.out / \"result.json\"), \"elapsed_wall_s\": result[\"elapsed_wall_s\"],\n                          \"torch_profiler_graph_kernel_timeline_supported\": result.get(\"torch_profiler_graph_kernel_timeline_supported\", False),\n                          \"case_status\": {name: {key: case.get(key) for key in (\"supported\", \"matched_triton_gpu_kernel_records\", \"external_event_ms\", \"kernel_envelope_ms\", \"error\")} for name, case in result[\"cases\"].items()},\n                          \"errors\": result[\"errors\"]}, indent=2))\n\n\nif __name__ == \"__main__\":\n    main()\n"}
          for name,content in files.items():
              path=root/name;path.write_text(content);print("WRITTEN",str(path),hashlib.sha256(path.read_bytes()).hexdigest(),flush=True)
          with (root/"cap.log").open("w") as log:
              proc=subprocess.Popen([sys.executable,str(root/"profile_capability.py"),str(root/"cap_a1")],cwd=root,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
              try:rc=proc.wait(timeout=60)
              except subprocess.TimeoutExpired:
                  os.killpg(proc.pid,signal.SIGTERM)
                  try:rc=proc.wait(timeout=5)
                  except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);rc=proc.wait()
          print("CAP_EXIT",rc,flush=True)
          p=root/"cap_a1/result.json"
          if p.is_file():print("RESULT_JSON",json.dumps({"path":str(p),"data":json.loads(p.read_text())}),flush=True)
          print("CAP_LOG_TAIL",json.dumps((root/"cap.log").read_text().splitlines()[-20:]),flush=True)
          used=subprocess.check_output(["/usr/local/corex/bin/ixsmi","--query-gpu=memory.used","--format=csv,noheader"],text=True);assert int(used.split()[0])<256,"Card is not idle"
          root=Path("/root/e245")
          old=root/"codec_controls.py";assert hashlib.sha256(old.read_bytes()).hexdigest()=="a52c59df7040c7090545d34aa61b88a4acdebc622009905c87e9f0987e8e49d8"
          backup=root/"codec_controls_a1.py";assert not backup.exists();backup.write_bytes(old.read_bytes())
          files={"codec_controls.py":"\"\"\"Fixed weight-derived W4 codecs and same-code expanded group control.\n\nAll encoding happens outside the timed graph. No model-quality claim.\n\"\"\"\nimport triton\nimport triton.language as tl\n\n\n@triton.jit\ndef fit_weight(X, Q, SCALE, K: tl.constexpr, WIDTH: tl.constexpr,\n               BLOCK: tl.constexpr, ROW_SCALE: tl.constexpr):\n    row, group = tl.program_id(0), tl.program_id(1)\n    r = tl.arange(0, BLOCK)\n    x = tl.load(X + row * K + group * WIDTH + r, r < WIDTH, other=0.).to(tl.float32)\n    base = tl.maximum(tl.max(tl.abs(x), 0), 1.e-8) / 7.\n    best, best_error = base, tl.full((), float(\"inf\"), tl.float32)\n    for j in tl.static_range(8):\n        factor = (0.65 + 0.06 * j) if ROW_SCALE else (0.70 + 0.05 * j)\n        scale = base * factor\n        q = tl.minimum(tl.maximum(tl.floor(x / scale + 0.5), -8.), 7.)\n        delta = x - q * scale\n        error = tl.sum(tl.where(r < WIDTH, delta * delta, 0.), 0)\n        best = tl.where(error < best_error, scale, best)\n        best_error = tl.minimum(best_error, error)\n    q = tl.minimum(tl.maximum(tl.floor(x / best + 0.5), -8.), 7.)\n    tl.store(Q + row * K + group * WIDTH + r, q.to(tl.int8), r < WIDTH)\n    tl.store(SCALE + row * (K // WIDTH) + group, best)\n\n\n@triton.jit\ndef expanded_group(Q, SA, W16, SW16, P, K: tl.constexpr,\n                   N: tl.constexpr, BM: tl.constexpr = 64,\n                   BN: tl.constexpr = 64, SPLIT: tl.constexpr = 2):\n    pn, split = tl.program_id(0), tl.program_id(1)\n    m, n, k = tl.arange(0, BM), pn * BN + tl.arange(0, BN), tl.arange(0, 128)\n    groups: tl.constexpr = K // 128\n    acc = tl.zeros((BM, BN), tl.float32)\n    for group in range(split * (groups // SPLIT), (split + 1) * (groups // SPLIT)):\n        a = tl.load(Q + m[:, None] * K + group * 128 + k[None, :])\n        b = tl.load(W16 + n[None, :] * K + group * 128 + k[:, None])\n        dot = tl.dot(a, b, out_dtype=tl.int32)\n        sa = tl.load(SA + m * groups + group)\n        sw = tl.load(SW16 + group * N + n)\n        scaled = dot.to(tl.float32) * sa[:, None]\n        acc += scaled * sw[None, :]\n    tl.store(P + split * BM * N + m[:, None] * N + n[None, :], acc)\n","run_full_a2_owned.py":"import json,os,signal,subprocess,sys,time\nfrom pathlib import Path\nroot=Path(__file__).resolve().parent\nstatus=root/\"full_a2_status.json\"\ncmd=[sys.executable,str(root/\"p0_native_w4.py\"),\"--gems-src\",\"/root/e214/candidate-a1/gems/src\",\"--checkpoint-dir\",\"/workspace/MiniCPM5-2B\",\"--out\",str(root/\"full-a2\"),\"--weight-scales\",\"both\",\"--layers\",\"0,13,27,41\",\"--replays\",\"20\",\"--skip-tiny\"]\nenv=os.environ.copy();env[\"OMP_NUM_THREADS\"]=\"4\";env[\"OPENBLAS_NUM_THREADS\"]=\"4\"\nwith (root/\"full_a2.log\").open(\"w\") as log:\n    proc=subprocess.Popen(cmd,cwd=root,env=env,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\n    data={\"state\":\"running\",\"pid\":proc.pid,\"start_unix\":time.time(),\"task\":\"native_w4_four_real_layers_full_MLP_supported_codec\"}\n    status.write_text(json.dumps(data)+\"\\n\")\n    try:rc=proc.wait(timeout=600)\n    except subprocess.TimeoutExpired:\n        os.killpg(proc.pid,signal.SIGTERM)\n        try:rc=proc.wait(timeout=15)\n        except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);rc=proc.wait()\n        data[\"timed_out\"]=True\n    data.update(state=\"completed\",exit_code=rc,end_unix=time.time());status.write_text(json.dumps(data)+\"\\n\")\n"}
          for name,content in files.items():
