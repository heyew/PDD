name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Audit completed row W4 logits and provenance
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''PY'\''
          """Read-only audit of a completed owned P2 run; emits bounded evidence only."""
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import json
          import numpy as np
          
          root = Path('\''/root/e245/p2-row-a3'\'')
          cfg = json.loads((root / '\''cases.json'\'').read_text())
          events = [json.loads(s) for s in (root / '\''events.jsonl'\'').read_text().splitlines()]
          index = {(e['\''label'\''], e['\''case_id'\''], e['\''step'\'']): e for e in events if e['\''stage'\''] == '\''logits'\''}
          assert len(index) == 3 * 8 * 17
          print('\''P2_READ_AUDIT_BEGIN'\'', flush=True)
          for name in ('\''weights.json'\'', '\''cases.json'\'', '\''events.jsonl'\''):
              payload = (root / name).read_bytes()
              print('\''AUDIT_FILE'\'', json.dumps(dict(path=str(root / name), size=len(payload),
                  sha256=hashlib.sha256(payload).hexdigest(), encoding='\''base64+gzip'\'',
                  data=base64.b64encode(gzip.compress(payload, mtime=0)).decode())), flush=True)
          manifest = []
          for p in sorted((root / '\''logits'\'').glob('\''*.npy'\'')):
              data = p.read_bytes()
              manifest.append(dict(name=p.name, size=len(data), sha256=hashlib.sha256(data).hexdigest()))
          records = []
          control_exact = True
          for c in cfg['\''cases'\'']:
              for step in range(17):
                  a, repeat, b = [np.load(root / '\''logits'\'' / index[(label, c['\''case_id'\''], step)]['\''filename'\''], allow_pickle=False)
                                  for label in ('\''w8a'\'', '\''w8b'\'', '\''row'\'')]
                  assert a.dtype == b.dtype == repeat.dtype == np.float32
                  assert a.shape == b.shape == repeat.shape == (130560,)
                  assert np.isfinite(a).all() and np.isfinite(b).all()
                  control_exact &= bool(np.array_equal(a.view(np.uint32), repeat.view(np.uint32)))
                  # Independent stable log-normalizer, separate from the service driver'\''s scorer.
                  a, b = a.astype(np.float64), b.astype(np.float64)
                  za = float(a.max() + np.log(np.exp(a - a.max()).sum()))
                  zb = float(b.max() + np.log(np.exp(b - b.max()).sum()))
                  pa = np.exp(a - za)
                  target = c['\''target_ids'\''][step]
                  records.append(dict(case_id=c['\''case_id'\''], step=step,
                      kl=float(np.dot(pa, (a - b) + (zb - za))),
                      delta_nll=float((a[target] - b[target]) + (zb - za)),
                      top1_same=bool(a.argmax() == b.argmax())))
          decode = [r for r in records if r['\''step'\''] > 0]
          assert len(decode) == 128
          audit = dict(scope='\''INDEPENDENT_READ_ONLY_VOCAB_LEVEL_RECOMPUTATION'\'',
              original_result_sha256=hashlib.sha256((root / '\''result.json'\'').read_bytes()).hexdigest(),
              w8_repeat_all_136_positions_bitwise=control_exact,
              unique_decode_positions=128, logit_files=len(manifest),
              mean_kl=float(np.mean([r['\''kl'\''] for r in decode])),
              mean_delta_nll=float(np.mean([r['\''delta_nll'\''] for r in decode])),
              top1_same_count=sum(r['\''top1_same'\''] for r in decode),
              max_history_delta_nll=max(float(np.mean([r['\''delta_nll'\''] for r in decode if r['\''case_id'\'']==c['\''case_id'\'']])) for c in cfg['\''cases'\'']),
              records=records, raw_logit_manifest=manifest,
              raw_logits_remain_on_card=True, raw_logits_in_download_bundle=False)
          print('\''P2_AUDIT_JSON'\'', json.dumps(audit), flush=True)
          print('\''P2_READ_AUDIT_END'\'', flush=True)
          
          PY'
