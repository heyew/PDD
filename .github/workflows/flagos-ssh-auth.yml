] = ast.copy_location(ast.Constant(self.axes[axis]), node.args[0])\\n        return node\\n\\n\\ndef build(source_dir):\\n    source_dir = Path(source_dir)\\n    sources = {}\\n    for name, wanted in SOURCE_PINS.items():\\n        data = (source_dir / name).read_bytes()\\n        actual = hashlib.sha256(data).hexdigest()\\n        assert actual == wanted, (name, actual, wanted)\\n        sources[name] = data.decode()\\n    pieces, audit = [], {}\\n    for name, (file, axes, before_grid, after_grid) in SPECS.items():\\n        original = next(n for n in ast.parse(sources[file]).body\\n                        if isinstance(n, ast.FunctionDef) and n.name == name)\\n        transform = PermuteAxes(axes)\\n        changed = transform.visit(copy.deepcopy(original))\\n        assert sorted(transform.seen) == sorted(axes), (name, transform.seen)\\n        inverse = PermuteAxes({v: k for k, v in axes.items()})\\n        restored = inverse.visit(copy.deepcopy(changed))\\n        assert ast.dump(original, include_attributes=False) == ast.dump(restored, include_attributes=False)\\n        pieces.append(ast.unparse(ast.fix_missing_locations(changed)))\\n        audit[name] = {\\n            \\\"program_id_axis_remapping\\\": axes,\\n            \\\"original_grid\\\": before_grid,\\n            \\\"candidate_grid\\\": after_grid,\\n            \\\"inverse_ast_exact\\\": True,\\n            \\\"program_id_calls_changed\\\": len(transform.seen),\\n        }\\n    text = HEADER + \\\"\\\\n\\\\n\\\".join(pieces) + \\\"\\\\n\\\"\\n    ast.parse(text)\\n    return text, {\\\"sources\\\": SOURCE_PINS, \\\"functions\\\": audit,\\n                  \\\"generated_sha256\\\": hashlib.sha256(text.encode()).hexdigest(),\\n                  \\\"inline_asm_unchanged\\\": True, \\\"fixed_sr\\\": 32}\\n\\n\\ndef write(source_dir, target):\\n    text, audit = build(source_dir)\\n    Path(target).write_text(text)\\n    return audit\\n\"},{\"local\":\"analysis_remote/attention/refresh_grid_order/pr