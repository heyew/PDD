name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Read-only remote system and accelerator inventory
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'printf "ROUND2_ENV_START\n"
             printf "USER: "; id -un
             printf "KERNEL: "; uname -srm
             printf "OS: "; if test -r /etc/os-release; then grep -E "^(PRETTY_NAME)=" /etc/os-release; else echo unknown; fi
             printf "PYTHON: "; if command -v python3 >/dev/null 2>&1; then python3 --version; else echo not_found; fi
             printf "CUDA_COMPILER: "; if command -v nvcc >/dev/null 2>&1; then nvcc --version | tail -n 1; else echo not_found; fi
             printf "NVIDIA_GPU:\n"; if command -v nvidia-smi >/dev/null 2>&1; then timeout 12 nvidia-smi -L || true; else echo not_found; fi
             printf "NPU:\n"; if command -v npu-smi >/dev/null 2>&1; then timeout 12 npu-smi info -l || true; else echo not_found; fi
             printf "ROCM_GPU:\n"; if command -v rocm-smi >/dev/null 2>&1; then timeout 12 rocm-smi --showproductname || true; else echo not_found; fi
             printf "ROUND2_ENV_END\n"'
