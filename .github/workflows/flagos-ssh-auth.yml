name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Read E256 lifecycle and startup progress
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''E256_STATUS'\''
          import json,time,subprocess
          from pathlib import Path
          out=Path('\''/root/e256/lifecycle-a2'\'')
          guard=Path(str(out)+'\''.guard.json'\'')
          end=time.monotonic()+45
          while time.monotonic()<end:
           d=json.loads(guard.read_text()) if guard.exists() else {}
           if d.get('\''status'\'') not in ('\''RUNNING'\'','\''STARTING'\'',None): break
           time.sleep(1)
          print('\''E256_STATUS_BEGIN'\'',flush=True)
          for p in [guard,out/'\''result.json'\'',out/'\''observer_error.json'\'',out/'\''startup_observer_error.json'\'',out/'\''observer_summary.json'\'']:
           if p.exists():
            d=json.loads(p.read_text())
            if p.name=='\''result.json'\'': d={k:d.get(k) for k in ['\''complete'\'','\''functional_passed'\'','\''decision'\'','\''error'\'','\''timings'\'','\''responses'\'','\''ready63'\'','\''released_A'\'','\''released_B'\'','\''audit'\'','\''cleanup'\'']}
            print('\''FILE'\'',str(p),json.dumps(d),flush=True)
          print('\''FILES'\'',[(p.name,p.stat().st_size) for p in out.iterdir() if p.is_file()],flush=True)
          for name in ['\''serve.log'\'','\''startup.jsonl'\'','\''startup_events.jsonl'\'']:
           p=out/name
           if p.exists(): print('\''TAIL'\'',name,p.read_text(errors='\''replace'\'')[-14000:],flush=True)
          print('\''GPU_MEMORY'\'',subprocess.check_output(['\''ixsmi'\'','\''--query-gpu=memory.used'\'','\''--format=csv,noheader'\''],text=True,timeout=5),flush=True)
          print('\''E256_STATUS_END'\'',flush=True)
          E256_STATUS'
