name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Read available CoreX hotspot profiling events
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''PY'\''
          """Read-only SDK inventory; no model, kernel launch, or production mutation."""
          from ctypes import CDLL, byref, c_int, c_size_t, c_uint, create_string_buffer, sizeof
          from pathlib import Path
          import json
          import subprocess
          
          print('\''E252_INVENTORY_BEGIN'\'', flush=True)
          used = subprocess.check_output(['\''/usr/local/corex/bin/ixsmi'\'', '\''--query-gpu=memory.used'\'', '\''--format=csv,noheader'\''], text=True).strip()
          print('\''GPU_MEMORY_USED'\'', used, flush=True)
          print('\''NEXT_DIRS'\'', json.dumps({str(i): Path('\''/root'\'',f'\''e{i}'\'').exists() for i in range(252,257)}), flush=True)
          print('\''HOST_MEMORY'\'', subprocess.check_output(['\''free'\'','\''-m'\''],text=True).strip(), flush=True)
          assert int(used.split()[0]) < 256, '\''Another GPU workload is active; no profiling context created'\''
          
          def attributes(getter, identifier):
              fields = []
              for attr in (0,1,2):
                  buf = create_string_buffer(2048); length = c_size_t(sizeof(buf))
                  code = getter(c_uint(identifier), attr, byref(length), buf)
                  fields.append(buf.value.decode(errors='\''replace'\'') if code == 0 else None)
              return dict(id=int(identifier), name=fields[0], description=fields[1], detail=fields[2])
          
          driver, api = CDLL('\''libcuda.so.1'\''), CDLL('\''libcupti.so'\'')
          assert driver.cuInit(0) == 0
          dev = c_int(); assert driver.cuDeviceGet(byref(dev),0) == 0
          count = c_uint(); assert api.cuptiDeviceGetNumMetrics(dev,byref(count)) == 0
          ids = (c_uint*count.value)(); size = c_size_t(sizeof(ids))
          assert api.cuptiDeviceEnumMetrics(dev,byref(size),ids) == 0
          metrics=[]
          for identifier in ids[:size.value//sizeof(c_uint)]:
              item=attributes(api.cuptiMetricGetAttribute,identifier)
              if not (item['\''name'\''].startswith(('\''issue_stall_reason_'\'', '\''active_warps_'\'', '\''selected_warps_'\'', '\''eligible_warps_'\'', '\''stalled_warps_'\''))
                 or item['\''name'\''] in ('\''multiprocessor_activity'\'','\''ns_scheduler_unit_util'\'','\''alu_function_unit_util'\'','\''load_store_function_unit_util'\'',
                     '\''ipc'\'','\''matrix_inst'\'','\''sfu_inst'\'','\''shared_load_transactions_per_request'\'','\''shared_load_throughput'\'','\''llc_mem_req'\'','\''llc_hit_rate'\'')):
                  continue
              ec=c_uint(); assert api.cuptiMetricGetNumEvents(c_uint(identifier),byref(ec)) == 0
              es=(c_uint*ec.value)(); n=c_size_t(sizeof(es)); assert api.cuptiMetricEnumEvents(c_uint(identifier),byref(n),es)==0
              item['\''events'\'']=[attributes(api.cuptiEventGetAttribute,e) for e in es[:n.value//sizeof(c_uint)]]
              for attr,name in ((4,'\''value_kind'\''),(5,'\''evaluation_mode'\'')):
                  value=c_int();n=c_size_t(sizeof(value));rc=api.cuptiMetricGetAttribute(c_uint(identifier),attr,byref(n),byref(value))
                  item[name]=dict(rc=rc,value=value.value)
              metrics.append(item)
          print('\''METRICS_JSON'\'',json.dumps(dict(count=count.value,selected=metrics)),flush=True)
          
          for directory in ('\''/usr/local/corex/include'\'','\''/usr/local/corex/extras/CUPTI/include'\''):
              for filename in ('\''cupti_metrics.h'\'','\''cupti_events.h'\''):
                  p=Path(directory,filename)
                  if not p.is_file():continue
                  lines=p.read_text(errors='\''replace'\'').splitlines(); selected=set()
                  patterns=('\''CUpti_MetricValueKind'\'','\''CUpti_MetricValue;'\'','\''cuptiMetricGetValue('\'', '\''cuptiMetricGetValue2('\'',
                            '\''CUPTI_METRIC_ATTR_VALUE_KIND'\'','\''CUpti_EventGroupAttribute'\'','\''cuptiEventGroupReadEvent('\'')
                  for i,line in enumerate(lines):
                      if any(s in line for s in patterns): selected.update(range(max(0,i-24), min(len(lines),i+20)))
                  print('\''SDK_HEADER'\'',json.dumps(dict(path=str(p),lines=[[i+1,lines[i]] for i in sorted(selected)])),flush=True)
          print('\''E252_INVENTORY_END'\'',flush=True)
          
          PY'
