name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Preserve E256 evidence and build exact runtime candidate
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''E256_COLLECT'\''
          import base64,gzip,hashlib,json,shutil,subprocess,sys
          from pathlib import Path
          root=Path('\''/root/e256'\'');dst=root/'\''bundle-a4'\''
          assert not dst.exists()
          u=json.loads(gzip.decompress(base64.b64decode('\'''\'')))
          shutil.copytree(root/'\''bundle-a3'\'',dst,ignore=shutil.ignore_patterns('\''__pycache__'\'','\''*.pyc'\''))
          for name,content in u.items():
           p=dst/name;assert p.resolve().is_relative_to(dst);p.write_text(content)
          r=subprocess.run([sys.executable,str(dst/'\''build_service_candidate.py'\''),'\''--baseline'\'',str(root/'\''baseline-official'\''),'\''--out'\'',str(root/'\''candidate-runtime-a1'\'')],capture_output=True,text=True,timeout=30)
          print('\''E256_BUILD_RETURN '\''+str(r.returncode));print(r.stdout);print(r.stderr)
          assert r.returncode==0
          paths=[]
          for a in ('\''a1'\'','\''a2'\'','\''a3'\'','\''a4'\''):
           for name in ('\''done-'\''+a+'\''.json'\'','\''guard-'\''+a+'\''.json'\'','\''device-'\''+a+'\''.log'\''):
            p=root/name
            if p.is_file():paths.append(p)
           d=root/('\''device-'\''+a)
           if d.is_dir():paths.extend(p for p in d.iterdir() if p.is_file() and p.suffix in ('\''.json'\'','\''.isa'\''))
          paths.extend(root/n for n in ('\''baseline_official_receipt.json'\'','\''baseline_differences.json'\'','\''fixture_audit.json'\'') if (root/n).is_file())
          files={str(p.relative_to(root)):p.read_text() for p in paths}
          raw=json.dumps(files).encode();z=gzip.compress(raw,mtime=0)
          print('\''E256_EVIDENCE_INFO '\''+json.dumps({'\''files'\'':len(files),'\''raw_bytes'\'':len(raw),'\''gzip_bytes'\'':len(z),'\''sha256'\'':hashlib.sha256(raw).hexdigest()}))
          print('\''E256_EVIDENCE_GZIP_B64 '\''+base64.b64encode(z).decode())
          E256_COLLECT'
