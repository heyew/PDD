name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Collect W4 prefetch and request accounting then measure resident MMA
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''PY'\''
          import gzip,hashlib,json,subprocess,sys
          from pathlib import Path
          print("FLAGOS_E248_LAUNCH_BEGIN",flush=True)
          for name in ["/root/e247/followups_status.json","/root/e245/prefetch-tiny-a1/result.json","/root/e245/prefetch-full-a1/result.json"]:
              p=Path(name)
              if p.is_file():print("RESULT_JSON",json.dumps({"path":name,"data":json.loads(p.read_text())}),flush=True)
          for name in ["/root/e245/prefetch_tiny.log","/root/e245/prefetch_full.log"]:
              p=Path(name)
              if p.is_file():print("LOG_TAIL",json.dumps({"path":name,"lines":p.read_text().splitlines()[-12:]}),flush=True)
          prior=json.loads(Path("/root/e247/followups_status.json").read_text());assert prior["state"] in ("completed","stopped"),"Other owned GPU tasks still running"
          used=subprocess.check_output(["/usr/local/corex/bin/ixsmi","--query-gpu=memory.used","--format=csv,noheader"],text=True);assert int(used.split()[0])<256,"Card is not idle"
          p=Path("/root/e244/account_requests.py");assert not p.exists();p.write_text("#!/usr/bin/env python3\n\"\"\"CPU accounting of actual request-associated warm model work from full_steps.\n\nNo timing fit. Validates cached prompt + actually scheduled prompt, continuation\nlengths, and the narrow same-epoch LAST recovery opportunity. The latter remains\na CPU eligibility proxy; it is not a claim of observed device REFRESH flags.\n\"\"\"\nimport argparse\nfrom collections import Counter, defaultdict\nimport json\nfrom pathlib import Path\n\n\ndef metrics_values(snapshot):\n    result = {}\n    for line in snapshot.get(\"prefix_cache_counter_lines\", []):\n        key, value = line.rsplit(None, 1)\n        result[key] = float(value)\n    return result\n\n\ndef main():\n    ap = argparse.ArgumentParser(description=__doc__)\n    ap.add_argument(\"steps\", type=Path)\n    ap.add_argument(\"--rounds\", type=Path)\n    ap.add_argument(\"--prompt-tokens\", type=int, default=16384)\n    ap.add_argument(\"--output-tokens\", type=int, default=1024)\n    ap.add_argument(\"-o\", \"--output\", type=Path, required=True)\n    args = ap.parse_args()\n    phases = defaultdict(list)\n    for line in args.steps.read_text().splitlines():\n        row = json.loads(line)\n        phases[row[\"phase\"]].append(row)\n    rounds = json.loads(args.rounds.read_text()) if args.rounds else {}\n    result = {\"scope\": \"observed_request_model_work_no_fitted_latency\", \"phases\": {}}\n    for phase, steps in phases.items():\n        requests = defaultdict(list)\n        misalignment = []\n        for step in steps:\n            rows = step.get(\"scheduled_rows\", [])\n            if step[\"tokens\"] and (not step.get(\"batch_schedule_alignment\") or len(rows) != step[\"requests\"] or sum(r[\"query_len\"] for r in rows) != step[\"tokens\"]):\n                misalignment.append(step[\"step_index\"])\n            for row in rows:\n                requests[row[\"request_alias\"]].append(dict(row, step_index=step[\"step_index\"],\n                                                          step_requests=step[\"requests\"], step_tokens=step[\"tokens\"]))\n        request_rows, discontinuities = [], []\n        possible, last_pure, since_mixed = [], {}, defaultdict(list)\n        for step in steps:\n            pure = step[\"requests\"] > 0 and step[\"tokens\"] == step[\"requests\"]\n            eligible = []\n            for row in step.get(\"scheduled_rows\", []):\n                rid = row[\"request_alias\"]\n                if not pure:\n                    since_mixed[rid].append((row[\"query_len\"], row[\"window_slot\"], row[\"sequence_length\"]))\n                    continue\n                prior = last_pure.get(rid)\n                gap = since_mixed[rid]\n                if prior is not None and gap:\n                    length, slot = row[\"sequence_length\"], row[\"window_slot\"]\n                    if (row[\"query_len\"] == 1 and slot >= 0 and prior[\"window_slot\"] == slot\n                            and length // 16 == prior[\"sequence_length\"] // 16\n                            and all(q == 1 and s == slot for q, s, _ in gap)\n                            and length == prior[\"sequence_length\"] + len(gap) + 1):\n                        eligible.append({\"request_alias\": rid, \"window_slot\": slot,\n                                         \"old_last\": prior[\"sequence_length\"], \"new_length\": length,\n                                         \"intervening_mixed_steps\": len(gap)})\n                last_pure[rid] = row\n                since_mixed[rid] = []\n            if eligible:\n                possible.append({\"step_index\": step[\"step_index\"], \"requests\": step[\"requests\"],\n                                 \"tokens\": step[\"tokens\"], \"whole_gpu_ms\": step.get(\"whole_gpu_ms\"),\n                                 \"eligible_rows\": eligible})\n        for rid, rows in requests.items():\n            first, last = rows[0], rows[-1]\n            for a, b in zip(rows, rows[1:]):\n                if a[\"sequence_length\"] != b[\"computed_tokens\"]:\n                    discontinuities.append({\"request_alias\": rid, \"previous_step\": a[\"step_index\"],\n                                            \"current_step\": b[\"step_index\"], \"previous_end\": a[\"sequence_length\"],\n                                            \"current_computed\": b[\"computed_tokens\"]})\n            prefill = sum(max(0, min(row[\"query_len\"], args.prompt_tokens - row[\"computed_tokens\"])) for row in rows)\n            scheduled = sum(row[\"query_len\"] for row in rows)\n            request_rows.append({\"request_alias\": rid, \"first_step\": first[\"step_index\"], \"last_step\": last[\"step_index\"],\n                                 \"first_computed_tokens\": first[\"computed_tokens\"],\n                                 \"last_sequence_length\": last[\"sequence_length\"],\n                                 \"scheduled_model_input_tokens\": scheduled,\n                                 \"scheduled_prompt_tokens\": prefill,\n                                 \"scheduled_decode_input_tokens\": scheduled - prefill,\n                                 \"implied_generated_outputs\": max(0, last[\"sequence_length\"] - args.prompt_tokens + 1),\n                                 \"cached_prompt_tokens_at_first_observation\": min(args.prompt_tokens, first[\"computed_tokens\"])})\n        total_prompt = len(requests) * args.prompt_tokens\n        cached = sum(row[\"cached_prompt_tokens_at_first_observation\"] for row in request_rows)\n        new_prefill = sum(row[\"scheduled_prompt_tokens\"] for row in request_rows)\n        outputs = sum(row[\"implied_generated_outputs\"] for row in request_rows)\n        model_inputs = sum(step[\"tokens\"] for step in steps)\n        expected_inputs = len(requests) * (args.prompt_tokens + args.output_tokens - 1) - cached\n        mixed_m_gt64 = [step for step in steps if step[\"tokens\"] > 64 and step[\"tokens\"] > step[\"requests\"]\n                       and any(row[\"query_len\"] == 1 for row in step.get(\"scheduled_rows\", []))]\n        prefix_delta = {}\n        if phase in rounds:\n            entry = rounds[phase]\n            before = metrics_values(entry.get(\"prefix_metrics_before\", {}))\n            after = metrics_values(entry.get(\"prefix_metrics_after\", {}))\n            prefix_delta = {key: after[key] - value for key, value in before.items() if key in after}\n        result[\"phases\"][phase] = {\n            \"steps\": len(steps), \"requests\": len(requests), \"misaligned_step_indices\": misalignment,\n            \"per_request_discontinuities\": discontinuities,\n            \"model_input_tokens_total\": model_inputs, \"expected_model_input_tokens_from_output_length\": expected_inputs,\n            \"scheduled_prefill_tokens\": new_prefill, \"cached_prompt_tokens\": cached,\n            \"full_prompt_token_numerator\": total_prompt, \"cached_fraction\": cached / total_prompt if total_prompt else None,\n            \"implied_output_tokens\": outputs,\n            \"checks\": {\"request_rows_match_steps\": not misalignment, \"request_sequences_contiguous\": not discontinuities,\n                       \"cached_plus_scheduled_prompt_equals_full_prompts\": cached + new_prefill == total_prompt,\n                       \"scheduled_tokens_match_requested_outputs\": model_inputs == expected_inputs,\n                       \"all_requested_outputs_present\": outputs == len(requests) * args.output_tokens},\n            \"first_computed_histogram\": dict(Counter(row[\"first_computed_tokens\"] for row in request_rows)),\n            \"scheduled_prefill_per_request_histogram\": dict(Counter(row[\"scheduled_prompt_tokens\"] for row in request_rows)),\n            \"prefix_metric_deltas\": prefix_delta,\n            \"LAST_recovery_cpu_eligibility\": {\"steps\": len(possible), \"row_occurrences\": sum(len(x[\"eligible_rows\"]) for x in possible),\n                                              \"events\": possible, \"scope\": \"same request/window slot, unchanged epoch, only qlen1 mixed gaps; actual GPU tags/NPG/state not read, not an exactness or speed claim\"},\n            \"mixed_M_gt64_with_decode\": {\"steps\": len(mixed_m_gt64),\n                                         \"whole_gpu_ms_sum\": sum(step.get(\"whole_gpu_ms\", 0) for step in mixed_m_gt64),\n                                         \"shapes\": [[step[\"step_index\"], step[\"requests\"], step[\"tokens\"], step.get(\"whole_gpu_ms\")] for step in mixed_m_gt64]},\n            \"request_rows\": request_rows,\n        }\n    args.output.parent.mkdir(parents=True, exist_ok=True)\n    args.output.write_text(json.dumps(result, indent=2) + \"\\n\")\n    print(json.dumps({phase: {key: value[key] for key in (\"steps\", \"requests\", \"scheduled_prefill_tokens\", \"cached_prompt_tokens\", \"model_input_tokens_total\", \"checks\")} for phase, value in result[\"phases\"].items()}, indent=2))\n\n\nif __name__ == \"__main__\":\n    main()\n")
          subprocess.run([sys.executable,str(p),"/root/e244/ledger_a1/steps.jsonl","--rounds","/root/e244/ledger_a1/rounds.json","-o","/root/e244/ledger_a1/request_accounting.json"],check=True,timeout=30)
          p=Path("/root/e244/ledger_a1/request_accounting.json");print("RESULT_JSON",json.dumps({"path":str(p),"data":json.loads(p.read_text())}),flush=True)
          p=Path("/root/e244/ledger_a1/steps.jsonl");raw=p.read_bytes();packed=gzip.compress(raw,compresslevel=6,mtime=0)
          q=p.with_suffix(p.suffix+".gz");assert not q.exists();q.write_bytes(packed)
          print("TRACE_ARCHIVE",json.dumps({"path":str(q),"bytes":len(packed),"raw_bytes":len(raw),"raw_sha256":hashlib.sha256(raw).hexdigest(),"gzip_sha256":hashlib.sha256(packed).hexdigest(),"lines":len(raw.splitlines())}),flush=True)
          root=Path("/root/e248");root.mkdir(exist_ok=False)
          files={"resident_mma.py":"\"\"\"BI-V150 resident native-MMA reference, official image Triton only.\n\nDiagnostic, not a model candidate. No production import or patch. Root owns\nremote execution and must confirm the experiment number and idle GPU first.\nThe operation ledger is per WARP instruction; never multiply it by 64 lanes.\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport hashlib\nimport json\nfrom pathlib import Path\nimport re\nfrom statistics import median\nimport time\n\nimport torch\nimport triton\nimport triton.language as tl\n\n\nCHAINS = 4\nUNROLL = 16\nWARP_WIDTH = 64\nOPS_PER_MMA = {'\''i8'\'': 2*16*16*32, '\''f16'\'': 2*16*16*16}\nK_DIM = {'\''i8'\'': 32, '\''f16'\'': 16}\nOPCODE = {'\''i8'\'': '\''ml_matrix_mad_i32_i8_m16n16k32'\'',\n          '\''f16'\'': '\''ml_matrix_mad_f32_f16_m16n16k16'\''}\n\n\ndef generate(kind, export_all=False):\n    \"\"\"Four independent four-register accumulators, inputs constant one.\"\"\"\n    # Every fixed register written by the opaque ASM is an explicit\n    # early-clobber output, including input fragments and loop bound. The OUT\n    # pointer and thread offsets are live in Triton after this block and must\n    # never be allocated into one of these registers. Merely naming the\n    # highest vector/scalar register is NOT a clobber-range declaration.\n    outputs=[f'\''=&{{v{r}}}'\''for r in range(20)]+['\''=&{v35}'\'','\''=&{s6}'\'','\''=&{s7}'\'']\n    input_index = len(outputs)\n    a=[]; e=a.append\n    e(f'\''ml_mov_v2s_b32 s6, ${input_index}, 0x0'\'')\n    e('\''sl_mov_b32 s7, 0x0'\'')\n    for r in range(16): e(f'\''ml_mov_b32 v{r}, 0x0'\'')\n    bits='\''0x1010101'\'' if kind=='\''i8'\'' else '\''0x3c003c00'\''\n    for r in range(16,20): e(f'\''ml_mov_b32 v{r}, {bits}'\'')\n    e('\''sl_cmp_lt_i32 wcr, s7, s6'\'')\n    e('\''sl_cbr_wcrz .Lroof_done'\'')\n    e('\''.Lroof_loop:'\'')\n    for _ in range(UNROLL):\n        for chain in range(CHAINS):\n            r=4*chain\n            e(f'\''{OPCODE[kind]} v[{r}:{r+3}], v[16:17], v[18:19], v[{r}:{r+3}]'\'')\n    e('\''sl_add_i32 s7, s7, 0x1'\'')\n    e('\''sl_cmp_lt_i32 wcr, s7, s6'\'')\n    e('\''sl_cbr_wcrnz .Lroof_loop'\'')\n    e('\''.Lroof_done:'\'')\n    # Keep every chain live and verify every accumulator register. Only one\n    # checksum word/lane is stored in the timed kernel, with no masked wave.\n    add='\''ml_add_i32'\'' if kind=='\''i8'\'' else '\''ml_add_f32'\''\n    e('\''ml_mov_b32 v35, v0'\'')\n    for r in range(1,16):e(f'\''{add} v35, v35, v{r}'\'')\n    code='\'';\\n'\''.join(a)+'\'';\\n'\''\n    return code, '\'','\''.join(outputs+['\''r'\'','\''~{memory}'\''])\n\n\nI8, I8_CONS = (tl.constexpr(x)for x in generate('\''i8'\''))\nF16, F16_CONS = (tl.constexpr(x)for x in generate('\''f16'\''))\nI8_TINY, I8_TINY_CONS = (tl.constexpr(x)for x in generate('\''i8'\'',True))\nF16_TINY, F16_TINY_CONS = (tl.constexpr(x)for x in generate('\''f16'\'',True))\n\n\n@triton.jit(do_not_specialize=['\''OUTER'\''])\ndef resident(OUT, OUTER, KIND:tl.constexpr, WARPS:tl.constexpr):\n    t=tl.arange(0,64*WARPS)\n    if KIND==0:\n        code:tl.constexpr=I8\n        cons:tl.constexpr=I8_CONS\n    else:\n        code:tl.constexpr=F16\n        cons:tl.constexpr=F16_CONS\n    x=tl.inline_asm_elementwise(code,cons,[t*0+OUTER],\n       dtype=(tl.int32,tl.int32,tl.int32,tl.int32,tl.int32,tl.int32,tl.int32,tl.int32,\n              tl.int32,tl.int32,tl.int32,tl.int32,tl.int32,tl.int32,tl.int32,tl.int32,\n              tl.int32,tl.int32,tl.int32,tl.int32,tl.int32,tl.int32,tl.int32),\n       is_pure=False,pack=1)\n    tl.store(OUT+tl.program_id(0)*64*WARPS+t,x[20])\n\n\n@triton.jit(do_not_specialize=['\''OUTER'\''])\ndef tiny(OUT, OUTER, KIND:tl.constexpr):\n    lane=tl.arange(0,64)\n    if KIND==0:\n        code:tl.constexpr=I8_TINY\n        cons:tl.constexpr=I8_TINY_CONS\n    else:\n        code:tl.constexpr=F16_TINY\n        cons:tl.constexpr=F16_TINY_CONS\n    x=tl.inline_asm_elementwise(code,cons,[lane*0+OUTER],\n       dtype=(tl.int32,tl.int32,tl.int32,tl.int32,tl.int32,tl.int32,tl.int32,tl.int32,\n              tl.int32,tl.int32,tl.int32,tl.int32,tl.int32,tl.int32,tl.int32,tl.int32,\n              tl.int32,tl.int32,tl.int32,tl.int32,tl.int32,tl.int32,tl.int32),\n       is_pure=False,pack=1)\n    for r in tl.static_range(16):tl.store(OUT+r*64+lane,x[r])\n\n\ndef emit(stage,**fields):\n    print(json.dumps(dict(stage=stage,**fields)),flush=True)\n\n\ndef isa_ledger(compiled,kind):\n    asm=compiled.asm['\''asm'\'']\n    start=re.search(r'\''^\\s*\\.Lroof_loop:\\s*;?\\s*$'\'',asm,re.M)\n    assert start is not None,'\''dynamic loop label missing'\''\n    end=re.search(r'\''^\\s*sl_cbr_wcrnz\\s+\\.Lroof_loop\\b[^\\n]*'\'',asm[start.end():],re.M)\n    assert end is not None,'\''dynamic back edge missing'\''\n    body=asm[start.end():start.end()+end.end()]\n    instructions=re.findall(r'\''^\\s*((?:ml|sl)_[A-Za-z0-9_]+)\\b'\'',body,re.M)\n    mmacount=instructions.count(OPCODE[kind])\n    assert mmacount==CHAINS*UNROLL,(kind,mmacount)\n    assert len(instructions)==CHAINS*UNROLL+3,(kind,instructions)\n    assert not re.search(r'\''\\b(?:ml|sl)_(?:lsa|slb|sme)_(?:load|store)'\'',body),body\n    assert compiled.n_spills==0,compiled.n_spills\n    assert compiled.metadata.shared==0,compiled.metadata.shared\n    assert compiled.n_regs<=128,compiled.n_regs\n    ttgir=compiled.asm.get('\''ttgir'\'','\'''\'')\n    widths=re.findall(r'\''(?:threads-per-warp|threads_per_warp)[^\\n,}]{0,24}?\\b(\\d+)\\b'\'',ttgir)\n    widths=sorted({int(w)for w in widths})\n    if widths:assert widths==[64],widths\n    return dict(loop_mma_instructions=mmacount,loop_other_instructions=len(instructions)-mmacount,\n                loop_memory_instructions=0,loop_back_edge=True,registers=compiled.n_regs,\n                spills=compiled.n_spills,lds=compiled.metadata.shared,\n                ttgir_threads_per_warp=widths,asm_sha256=hashlib.sha256(asm.encode()).hexdigest()),asm\n\n\ndef numerical_tiny(kind,outdir):\n    out=torch.empty((16,64),device='\''cuda'\'',dtype=torch.int32)\n    outer=7\n    compiled=tiny[(1,)](out,outer,KIND=0 if kind=='\''i8'\''else 1,num_warps=1,num_stages=1)\n    ledger,asm=isa_ledger(compiled,kind)\n    values=out if kind=='\''i8'\''else out.view(torch.float32)\n    expected=K_DIM[kind]*UNROLL*outer\n    assert torch.equal(values,torch.full_like(values,expected)),dict(kind=kind,min=float(values.min()),max=float(values.max()),wanted=expected)\n    # Four native matrices: 4 regs/lane * 64 lanes = 256 output elements each.\n    logical=values.reshape(4,4,64)\n    assert logical.numel()==CHAINS*16*16\n    (outdir/f'\''tiny_{kind}.asm'\'').write_text(asm)\n    result=dict(kind=kind,passed=True,outer=outer,mmas_per_warp=outer*UNROLL*CHAINS,\n                matrices=4,elements_per_matrix=256,expected_each_element=expected,\n                all_1024_elements_exact=True,resources=ledger)\n    emit('\''tiny'\'',**result)\n    return result\n\n\ndef make_graph(kind,grid,warps,outer,out,nodes):\n    def call():\n        return resident[(grid,)](out,outer,KIND=0 if kind=='\''i8'\''else 1,WARPS=warps,\n                                 num_warps=warps,num_stages=1)\n    compiled=call()\n    graph=torch.cuda.CUDAGraph()\n    with torch.cuda.graph(graph):\n        for _ in range(nodes):call()\n    return graph,compiled\n\n\ndef device_info():\n    prop=torch.cuda.get_device_properties(0)\n    fields={}\n    for name in ('\''name'\'','\''major'\'','\''minor'\'','\''total_memory'\'','\''multi_processor_count'\'','\''warp_size'\'','\''clock_rate'\''):\n        value=getattr(prop,name,None)\n        if value is not None:fields[name]=value\n    fields['\''repr'\'']=str(prop)\n    fields['\''torch_version'\'']=torch.__version__\n    fields['\''triton_version'\'']=triton.__version__\n    fields['\''compute_unit_count_source'\'']='\''torch.cuda.get_device_properties.multi_processor_count'\''\n    return fields\n\n\ndef run_point(kind,grid,warps,outer,nodes,groups,outdir,cu_count):\n    out=torch.empty(grid*warps*64,device='\''cuda'\'',dtype=torch.int32)\n    graph,compiled=make_graph(kind,grid,warps,outer,out,nodes)\n    base,basecompiled=make_graph(kind,grid,warps,0,out,nodes)\n    ledger,asm=isa_ledger(compiled,kind)\n    baseledger,_=isa_ledger(basecompiled,kind)\n    assert ledger['\''asm_sha256'\'']==baseledger['\''asm_sha256'\''],'\''zero-loop baseline must execute the same compiled dynamic-loop kernel'\''\n    key=f'\''{kind}_g{grid}_w{warps}'\''\n    (outdir/(key+'\''.asm'\'')).write_text(asm)\n    if '\''ttgir'\''in compiled.asm:(outdir/(key+'\''.ttgir'\'')).write_text(compiled.asm['\''ttgir'\''])\n    start,end=(torch.cuda.Event(enable_timing=True)for _ in range(2))\n    raw={'\''full'\'':[],'\''zero_loop'\'':[]}\n    graphs={'\''full'\'':graph,'\''zero_loop'\'':base}\n    for group in range(groups):\n        order=('\''full'\'','\''zero_loop'\'')if group%2==0 else('\''zero_loop'\'','\''full'\'')\n        for arm in order:\n            start.record();graphs[arm].replay();end.record();end.synchronize()\n            raw[arm].append(start.elapsed_time(end)/nodes)\n    base.replay();torch.cuda.synchronize()\n    assert torch.equal(out,torch.zeros_like(out)),key+'\'' baseline nonzero'\''\n    graph.replay();torch.cuda.synchronize()\n    values=out if kind=='\''i8'\''else out.view(torch.float32)\n    expected=16*K_DIM[kind]*UNROLL*outer\n    assert torch.equal(values,torch.full_like(values,expected)),dict(key=key,wanted=expected,min=float(values.min()),max=float(values.max()))\n    mmas_per_warp=CHAINS*UNROLL*outer\n    total_mmas=grid*warps*mmas_per_warp\n    total_ops=total_mmas*OPS_PER_MMA[kind]\n    full_ms=median(raw['\''full'\'']);baseline_ms=median(raw['\''zero_loop'\''])\n    result=dict(kind=kind,grid_ctas=grid,warps_per_cta=warps,total_warps=grid*warps,\n                runtime_cu_count=cu_count,launched_warps_per_cu=grid*warps/cu_count if cu_count else None,\n                resident_warps_per_cu='\''not directly measured; launched/CU can exceed residency'\'',\n                outer=outer,unroll=UNROLL,independent_accumulator_chains=CHAINS,\n                mma_instructions_per_warp=mmas_per_warp,total_mma_instructions=total_mmas,\n                logical_ops_per_mma=OPS_PER_MMA[kind],total_logical_ops=total_ops,\n                operation_convention='\''one multiply + one add = 2; per warp matrix instruction, NO extra factor64'\'',\n                output_bytes=out.numel()*4,graph_nodes=nodes,raw_ms_per_kernel=raw,\n                full_median_ms=full_ms,zero_loop_median_ms=baseline_ms,\n                baseline_fraction=baseline_ms/full_ms,\n                attained_tops_or_tflops=total_ops/(full_ms*1e9),\n                attained_mma_per_us_per_cu=total_mmas/(full_ms*1000*cu_count)if cu_count else None,\n                paired_incremental_median_ms=median([a-b for a,b in zip(raw['\''full'\''],raw['\''zero_loop'\''])]),\n                arithmetic_checksum_each_lane=expected,all_lane_checksums_exact=True,\n                resources=ledger)\n    emit('\''point'\'',**result)\n    return result\n\n\ndef main():\n    p=argparse.ArgumentParser();p.add_argument('\''--out'\'',required=True)\n    p.add_argument('\''--outer'\'',type=int,default=1024);p.add_argument('\''--groups'\'',type=int,default=5)\n    p.add_argument('\''--nodes'\'',type=int,default=2);p.add_argument('\''--wall-budget-s'\'',type=float,default=50)\n    a=p.parse_args()\n    # Exact i32 and f32 all-one arithmetic; bound also prevents accidental long\n    # kernels. Default max FP32 accumulator=262144, checksum=4194304.\n    assert 1<=a.outer<=1024 and 3<=a.groups<=5 and 1<=a.nodes<=2\n    assert 16*32*UNROLL*a.outer<2**31\n    assert 16*16*UNROLL*a.outer<=2**24\n    outdir=Path(a.out);outdir.mkdir(parents=True,exist_ok=False)\n    torch.set_num_threads(2)\n    start=time.monotonic();info=device_info();emit('\''device'\'',**info)\n    cu_count=info.get('\''multi_processor_count'\'')\n    result=dict(scope='\''register-resident attained native MMA reference; no model speed claim'\'',\n                source_sha256=hashlib.sha256(Path(__file__).read_bytes()).hexdigest(),device=info,\n                expected_card_for_operator_review='\''BI-V150; historically16CUs and64threads/warp'\'',\n                operation_definition=OPS_PER_MMA,tiny=[],points=[],complete=False)\n    save=lambda:(outdir/'\''result.json'\'').write_text(json.dumps(result,indent=2)+'\''\\n'\'')\n    save()\n    for kind in ('\''i8'\'','\''f16'\''):\n        result['\''tiny'\''].append(numerical_tiny(kind,outdir));save()\n    for kind in ('\''i8'\'','\''f16'\''):\n        for warps in (4,8):\n            for grid in (64,128,256):\n                if time.monotonic()-start>a.wall_budget_s:\n                    result['\''stop_reason'\'']='\''wall budget reached before next configuration'\'';save();emit('\''bounded_stop'\'',**result);return\n                result['\''points'\''].append(run_point(kind,grid,warps,a.outer,a.nodes,a.groups,outdir,cu_count));save()\n    result['\''complete'\'']=True\n    result['\''elapsed_wall_s'\'']=time.monotonic()-start\n    result['\''best_measured'\'']={kind:max((x for x in result['\''points'\'']if x['\''kind'\'']==kind),key=lambda x:x['\''attained_tops_or_tflops'\''])for kind in ('\''i8'\'','\''f16'\'')}\n    result['\''interpretation_limits'\'']=[\n        '\''This is attained throughput of four independent resident MMA chains, not a proof of absolute silicon peak.'\'',\n        '\''No HBM or LDS operand supply; 660GB/s continuous read is a separate experiment and cannot supply this compute number.'\'',\n        '\''No conversion, unpack, scale, softmax, synchronization, real tile shapes, or model scheduling is charged.'\'',\n        '\''Main throughput uses total GPU event time including launch/store; zero-loop cost is reported, not silently subtracted.'\'',\n        '\''If runtime CU count differs from16, report it rather than forcing a historical assumption.'\'',\n        '\''The maximum launched warps/CU is not hardware resident warp occupancy.'\''\n    ]\n    save();emit('\''done'\'',complete=True,elapsed_wall_s=result['\''elapsed_wall_s'\''],best={k:dict(rate=v['\''attained_tops_or_tflops'\''],grid=v['\''grid_ctas'\''],warps=v['\''warps_per_cta'\''])for k,v in result['\''best_measured'\''].items()})\n\n\nif __name__=='\''__main__'\'':main()\n","run_owned.py":"import json,os,signal,subprocess,sys,time\nfrom pathlib import Path\nroot=Path(__file__).resolve().parent\ndata={\"state\":\"running\",\"start_unix\":time.time()}\nstatus=root/\"status.json\"\nwith (root/\"run.log\").open(\"w\") as log:\n    p=subprocess.Popen([sys.executable,str(root/\"resident_mma.py\"),\"--out\",str(root/\"a1\")],cwd=root,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\n    data[\"pid\"]=p.pid;status.write_text(json.dumps(data)+\"\\n\")\n    try:rc=p.wait(timeout=70)\n    except subprocess.TimeoutExpired:\n        os.killpg(p.pid,signal.SIGTERM)\n        try:rc=p.wait(timeout=10)\n        except subprocess.TimeoutExpired:os.killpg(p.pid,signal.SIGKILL);rc=p.wait()\n        data[\"timed_out\"]=True\n    data.update(state=\"completed\",exit_code=rc,end_unix=time.time());status.write_text(json.dumps(data)+\"\\n\")\n"}
