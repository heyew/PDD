name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Read E241 E242 E243 numerical and performance evidence
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'set -eu
          printf "FLAGOS_RECENT_EVIDENCE_V3_BEGIN\n"
          python3 - <<'\''PY'\''
          import pathlib,json,hashlib
          for base in ("/root/e242/a1","/root/e243/a1","/root/e243/a2","/root/e241/schedule_a4"):
              p=pathlib.Path(base)
              if not p.is_dir(): continue
              files=[q for q in sorted(p.rglob("*")) if q.is_file() and "__pycache__" not in str(q)]
              print("EVIDENCE_FILES",base,json.dumps([{"name":str(q.relative_to(p)),"bytes":q.stat().st_size} for q in files[:100]]),flush=True)
              for q in files:
                  if q.suffix==".json" and q.stat().st_size<150000 and any(k in q.name.lower() for k in ("result","summary","resource","timing","status")):
                      print("EVIDENCE_JSON",json.dumps({"path":str(q),"data":json.loads(q.read_text())}),flush=True)
          for name in ("/root/e241/full_result.json","/root/e214/candidate-a1/build.json"):
              p=pathlib.Path(name)
              if p.is_file(): print("EVIDENCE_JSON",json.dumps({"path":str(p),"data":json.loads(p.read_text())}),flush=True)
          for name in ("/root/e241/sitecustomize.py","/root/e241/run_schedule.py","/root/e243/probe_kv.py"):
              p=pathlib.Path(name)
              if p.is_file():
                  print("EVIDENCE_SOURCE",json.dumps({"path":str(p),"content":p.read_text()}),flush=True)
          for name in ("_native_pair_mlp.py","_group_a8_mlp.py","w8a8.py","crosslayer.py","_cta_native_merge.py"):
              p=pathlib.Path("/root/e214/candidate-a1/gems/src/flag_gems/fused/minicpm")/name
              if p.is_file(): print("SOURCE_SHA256",str(p),hashlib.sha256(p.read_bytes()).hexdigest(),flush=True)
          PY
          printf "FLAGOS_RECENT_EVIDENCE_V3_END\n"'
