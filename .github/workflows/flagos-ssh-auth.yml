name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Validate E256 split shared arenas and full chain
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''E256_A4'\''
          import base64,gzip,hashlib,json,shutil,subprocess,sys,time
          from pathlib import Path
          root=Path('\''/root/e256'\'');src=root/'\''bundle-a2'\'';dst=root/'\''bundle-a3'\''
          assert not dst.exists()
          used=subprocess.check_output(['\''/usr/local/corex/bin/ixsmi'\'','\''--query-gpu=memory.used'\'','\''--format=csv,noheader'\''],text=True).strip()
          assert int(used.split()[0])<256,('\''GPU occupied; no process stopped'\'',used)
          u=json.loads(gzip.decompress(base64.b64decode('\'''\'')))
          shutil.copytree(src,dst,ignore=shutil.ignore_patterns('\''__pycache__'\'','\''*.pyc'\''))
          for name,content in u['\''changes'\''].items():
           p=dst/name;assert p.resolve().is_relative_to(dst)
           p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content)
          (root/'\''device_guard_a4.py'\'').write_text(u['\''guard'\''])
          log=(root/'\''guard-a4.log'\'').open('\''ab'\'',buffering=0)
          p=subprocess.Popen([sys.executable,str(root/'\''device_guard_a4.py'\'')],cwd=root,stdin=subprocess.DEVNULL,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
          print('\''E256_A4_LAUNCHED '\''+json.dumps({'\''guard_pid'\'':p.pid,'\''changed'\'':list(u['\''changes'\'']),'\''gpu_before'\'':used}),flush=True)
          deadline=time.monotonic()+50
          while not (root/'\''done-a4.json'\'').exists() and time.monotonic()<deadline:time.sleep(1)
          for name in ('\''guard-a4.json'\'','\''done-a4.json'\''):
              p=root/name
              print(name+'\'' '\''+(p.read_text() if p.exists() else '\''RUNNING'\''))
          p=root/'\''device-a4.log'\''
          print('\''E256_LOG_TAIL\n'\''+(p.read_text(errors='\''replace'\'')[-14000:] if p.exists() else '\''NOT_READY'\''))
          p=root/'\''device-a4/result.json'\''
          if p.exists():
              raw=p.read_bytes(); r=json.loads(raw)
              summary={k:r.get(k) for k in ('\''status'\'','\''complete'\'','\''elapsed_host_s'\'','\''one_load_init_s'\'','\''failure'\'','\''device_preflight'\'')}
              summary['\''scopes'\'']=[{'\''name'\'':s['\''name'\''],'\''cases'\'':{n:{k:c.get(k) for k in ('\''same_code_bitwise'\'','\''production_vs_reference_bitwise'\'','\''mean_saving_ms_per_step'\'','\''mean_ms_per_step'\'','\''paired_group_mean_saving_ms_per_step'\'','\''arms'\'')} for n,c in s['\''cases'\''].items()}} for s in r.get('\''scopes'\'',[])]
              for scope in summary['\''scopes'\'']:
                  for case in scope['\''cases'\''].values():
                      for arm in (case.get('\''arms'\'') or {}).values():
                          arm.pop('\''graph_identity'\'',None)
              print('\''E256_RESULT_SUMMARY '\''+json.dumps(summary,allow_nan=False))
              print('\''E256_RESULT_SHA256 '\''+hashlib.sha256(raw).hexdigest())
          print('\''E256_GPU_MEMORY '\''+subprocess.check_output(['\''/usr/local/corex/bin/ixsmi'\'','\''--query-gpu=memory.used'\'','\''--format=csv,noheader'\''],text=True).strip())
          E256_A4'
