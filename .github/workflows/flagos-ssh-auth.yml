name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Measure complete W8 GU post conditional budget
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''PY'\''
          from pathlib import Path
          import json,hashlib,gzip,base64,subprocess,os,signal,time,traceback
          root=Path('\''/root/e254'\'')
          used=subprocess.check_output(['\''/usr/local/corex/bin/ixsmi'\'','\''--query-gpu=memory.used'\'','\''--format=csv,noheader'\''],text=True).strip()
          print('\''GPU_MEMORY_BEFORE '\''+used,flush=True)
          assert int(used.split()[0])<256,('\''GPU not idle'\'',used)
          assert not root.exists(),'\''E254 directory already exists; refusing overwrite'\''
          blob=gzip.decompress(base64.b64decode('\'''\''))
          assert hashlib.sha256(blob).hexdigest()=='\''926c1581ae950f1ea1165c67ea363d594660bc19fdc89326243e13ffe6ef4a4c'\''
          files=json.loads(blob);root.mkdir()
          for name,item in files.items():
           assert '\''/'\'' not in name and name.endswith('\''.py'\'')
           b=item['\''text'\''].encode();assert hashlib.sha256(b).hexdigest()==item['\''sha256'\''];(root/name).write_bytes(b)
          (root/'\''sources.json'\'').write_text(json.dumps({n:v['\''sha256'\''] for n,v in files.items()},indent=2)+'\''\n'\'')
          argv=['\''python3'\'',str(root/'\''p0_post_bound.py'\''),'\''--gems-src'\'','\''/root/e214/candidate-a1/gems/src'\'','\''--checkpoint-dir'\'','\''/workspace/MiniCPM5-2B'\'','\''--fixture-dir'\'','\''/root/e252'\'','\''--sampler-dir'\'','\''/root/e252'\'','\''--out'\'',str(root/'\''a1'\''),'\''--replays'\'','\''20'\'','\''--max-host-s'\'','\''55'\'']
          started=time.monotonic();meta={'\''argv'\'':argv,'\''hard_timeout_s'\'':60,'\''status'\'':'\''RUNNING'\''}
          with (root/'\''run.log'\'').open('\''w'\'') as log:
           p=subprocess.Popen(argv,cwd=root,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
           meta['\''owned_process_group'\'']=p.pid
           try:
            meta['\''returncode'\'']=p.wait(timeout=60)
            meta['\''status'\'']='\''EXITED'\''
           except subprocess.TimeoutExpired:
            meta['\''status'\'']='\''HARD_TIMEOUT'\'';os.killpg(p.pid,signal.SIGTERM)
            try:p.wait(timeout=2)
            except subprocess.TimeoutExpired:os.killpg(p.pid,signal.SIGKILL);p.wait(timeout=2)
            meta['\''returncode'\'']=p.returncode
          meta['\''process_elapsed_s'\'']=time.monotonic()-started
          (root/'\''guard.json'\'').write_text(json.dumps(meta,indent=2)+'\''\n'\'')
          print('\''GUARD '\''+json.dumps(meta),flush=True)
          print('\''RUN_LOG_BEGIN\n'\''+(root/'\''run.log'\'').read_text()+'\''RUN_LOG_END'\'',flush=True)
          bundle={}
          for name in ['\''sources.json'\'','\''guard.json'\'','\''run.log'\'','\''a1/result.json'\'','\''a1/w8_gu.isa'\'','\''a1/bound_gu.isa'\'']:
           path=root/name
           if path.is_file():
            b=path.read_bytes();bundle[name]={'\''text'\'':b.decode(),'\''sha256'\'':hashlib.sha256(b).hexdigest()}
          b=json.dumps(bundle,sort_keys=True).encode();print('\''BUNDLE_INFO '\''+json.dumps({'\''files'\'':len(bundle),'\''bytes'\'':len(b),'\''sha256'\'':hashlib.sha256(b).hexdigest()}));print('\''BUNDLE_GZIP_B64 '\''+base64.b64encode(gzip.compress(b,mtime=0)).decode(),flush=True)
          print('\''GPU_MEMORY_AFTER '\''+subprocess.check_output(['\''/usr/local/corex/bin/ixsmi'\'','\''--query-gpu=memory.used'\'','\''--format=csv,noheader'\''],text=True).strip(),flush=True)
          assert meta['\''status'\'']=='\''EXITED'\'' and meta['\''returncode'\'']==0,meta
          assert json.loads((root/'\''a1/result.json'\'').read_text())['\''status'\'']=='\''COMPLETE'\''
          PY'
