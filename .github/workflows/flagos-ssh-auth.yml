name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Run E253 connected 42 layer graph
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''E253P1PY'\''
          import base64, gzip, hashlib, json, subprocess, sys, time
          from pathlib import Path
          root=Path("/root/e253/p1")
          assert not root.exists(), "E253 P1 already exists; do not overwrite"
          previous=Path("/root/e253/attempt2/p0-a2/result.json").read_bytes()
          assert hashlib.sha256(previous).hexdigest()=="6917a26446d05bcfd1407b9fd3317e304c160dad2202f0f8830958b3b871e571"
          assert json.loads(previous)["decision"]=="COST_SCREEN_PASS_NEEDS_42_LAYER_AND_QUALITY"
          used=subprocess.check_output(["/usr/local/corex/bin/ixsmi","--query-gpu=memory.used","--format=csv,noheader"],text=True).strip()
          assert int(used.split()[0]) < 256, ("GPU not idle; no process stopped",used)
          files=json.loads(base64.b64decode(""))
          root.mkdir()
          manifest={}
          for name,content in files.items():
              assert Path(name).name == name
              (root/name).write_text(content)
              manifest[name]=hashlib.sha256((root/name).read_bytes()).hexdigest()
          (root/"source_manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          log=(root/"guard.log").open("ab",buffering=0)
          p=subprocess.Popen([sys.executable,str(root/"guard.py")],cwd=root,stdin=subprocess.DEVNULL,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
          print(json.dumps({"launched":"E253_P1_A1","guard_pid":p.pid,"gpu_memory_before":used,"source_sha256":manifest},sort_keys=True),flush=True)
          deadline=time.monotonic()+55
          while not (root/"done.json").exists() and time.monotonic()<deadline:
              time.sleep(1)
          for name in ("guard_state.json","done.json"):
              item=root/name
              print(name+": "+(item.read_text() if item.exists() else "NOT_READY"))
          item=root/"child.log"
          print("CHILD_LOG_TAIL\n"+(item.read_text(errors="replace")[-18000:] if item.exists() else "NOT_READY"))
          item=root/"result-a1/result.json"
          if item.exists():
              b=item.read_bytes()
              print("RESULT_SHA256 "+hashlib.sha256(b).hexdigest())
              print("RESULT_GZIP_B64 "+base64.b64encode(gzip.compress(b,mtime=0)).decode())
          print("GPU_MEMORY "+subprocess.check_output(["/usr/local/corex/bin/ixsmi","--query-gpu=memory.used","--format=csv,noheader"],text=True).strip())
          E253P1PY'
