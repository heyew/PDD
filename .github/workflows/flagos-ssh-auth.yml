          payload=json.loads("[{\"local\":\"analysis_remote/attention/refresh_grid_order_adaptive/adaptive_codegen.py\",\"remote\":\"/root/e249/adaptive_codegen.py\",\"sha256\":\"c2f2d88b58792787fb891275785ac4b40fcc7fcc965777371acd708d755c8e62\",\"content\":\"\\\"\\\"\\\"E249b: one fixed grid, GPU count selects collector task order only.\\\"\\\"\\\"\\nimport ast\\nimport copy\\nfrom hashlib import sha256\\nimport importlib.util\\nfrom pathlib import Path\\n\\n\\nCOMMON_SHA = \\\"b39674ab6d641c8f8925167d6303fb929454b35c479e0a79b72edbcc30b6802e\\\"\\ncommon_path = Path(__file__).with_name(\\\"grid_codegen.py\\\")\\nif not common_path.exists():\\n    common_path = Path(__file__).parent.parent / \\\"refresh_grid_order\\\" / \\\"grid_codegen.py\\\"\\nassert sha256(common_path.read_bytes()).hexdigest() == COMMON_SHA, common_path\\nspec = importlib.util.spec_from_file_location(\\\"e249a_grid_codegen\\\", common_path)\\ncommon = importlib.util.module_from_spec(spec)\\nspec.loader.exec_module(common)\\nSOURCE_PINS = common.SOURCE_PINS\\nSPECS = dict(common.SPECS)\\n# Collector launch stays exactly the original grid in both arms. The fixed\\n# post kernels retain the E249a transpose, with no new count or buffer.\\nSPECS[\\\"full_collect_split\\\"] = (\\\"_refresh_split.py\\\", {1: 2, 2: 1}, (1, 64, 32), (1, 64, 32))\\n\\nPREAMBLE = '\'''\'''\''\\noriginal_seq = tl.program_id(1)\\noriginal_sp = tl.program_id(2)\\nlinear = original_seq + 64 * original_sp\\ntransposed_seq = linear // 32\\ntransposed_sp = linear % 32\\noriginal_flag = tl.load(REFRESH + original_seq)\\ntransposed_flag = tl.load(REFRESH + transposed_seq)\\nif (original_flag == 0) & (transposed_flag == 0):\\n    return\\nsmall = _refresh_count(REFRESH, N) <= THRESH\\nseq = tl.where(small, transposed_seq, original_seq)\\nsp = tl.where(small, transposed_sp, original_sp)\\nif tl.where(small, transposed_flag, original_flag) == 0:\\n    return\\nqrow = tl.load(CU_Q + seq)\\nif tl.load(CU_Q + seq + 1) - qrow != 1:\\n    return\\n'\'''\'''\''\\n\\n\\ndef build(source_dir):\\n    source_dir = Path(source_dir)\\n    old_text, audit = common.build(source_dir)\\n    module = ast.parse(old_text)\\n    source = ast.parse((source_dir / \\\"_refresh_split.py\\\").read_text())\\n    original = next(n for n in source.body if isinstance(n, ast.FunctionDef) and n.name == \\\"full_collect_split\\\")\\n    assert isinstance(original.body[5], ast.Assign) and original.body[5].targets[0].id == \\\"small\\\"\\n    assert isinstance(original.body[6], ast.Assign) and original.body[6].targets[0].id == \\\"splits\\\"\\n    changed = copy.deepcopy(original)\\n    prefix = ast.parse(PREAMBLE).body\\n    changed.body = prefix + copy.deepcopy(original.body[6:])\\n    suffix = ast.Module(body=changed.body[len(prefix):], type_ignores=[])\\n    original_suffix = ast.Module(body=original.body[6:], type_ignores=[])\\n    assert ast.dump(suffix, include_attributes=False) == ast.dump(original_suffix, include_attributes=False)\\n    for i, node in enumerate(module.body):\\n        if isinstance(node, ast.FunctionDef) and node.name == \\\"full_collect_split\\\":\\n            module.body[i] = changed\\n            break\\n    else:\\n        raise AssertionError(\\\"collector not found\\\")\\n    text = ast.unparse(ast.fix_missing_locations(module)) + \\\"\\\\n\\\"\\n    ast.parse(text)\\n    audit[\\\"functions\\\"][\\\"full_collect_split\\\"] = {\\n        \\\"original_grid\\\": [1, 64, 32], \\\"candidate_grid\\\": [1, 64, 32],\\n        \\\"mapping\\\": \\\"R<=16: seq=linear//32, sp=linear%32; R>16: original seq/sp\\\",\\n        \\\"linear\\\": \\\"original_seq + 64*original_sp; all values fit int32\\\",\\n        \\\"count_source\\\": \\\"actual GPU REFRESH via existing _refresh_count(REFRESH,N)\\\",\\n        \\\"ordinary_guard\\\": \\\"both original-row and transposed-row flags zero => return before count\\\",\\n        \\\"unchanged_math_suffix_ast\\\": True, \\\"new_global_writes\\\": False,\\n    }\\n    audit.update(generated_sha256=sha256(text.encode()).hexdigest(),\\n                 common_codegen_sha256=COMMON_SHA,\\n                 adaptive_codegen_sha256=sha256(Path(__file__).read_bytes()).hexdigest(),\\n                 fixed_sr=32, new_scratch_bytes=0, new_launches=0,\\n                 post_kernels=\\\"same E249a fixed transpose; no new refresh count\\\")\\n    return text, audit\\n\\n\\ndef write(source_dir, target):\\n    text, audit = build(source_dir)\\n    Path(target).write_text(text)\\n    return audit\\n\"},{\"local\":\"analysis_remote/attention/refresh_grid_order_adaptive/probe_grid_order_adaptive.py\",\"remote\":\"/root/e249/probe_grid_order_adaptive.py\",\"sha256\":\"b327524a2024c8de04173750602238bafd6f0a81647634e9214fd38d30dca7e2\",\"content\":\"\\\"\\\"\\\"E249b adaptive collector order plus fixed post transpose, full E214 graph.\\n\\nReal checkpoint weights, synthetic KV/token fixture from pinned E223/E227.\\nNo change to request epochs, page budgets, reductions, inline ASM or scratch.\\nRemote/GPU execution belongs to the root agent, not this source author.\\n\\\"\\\"\\\"\\nimport argparse\\nfrom hashlib import sha256\\nimport importlib.util\\nimport json\\nfrom pathlib import Path\\nfrom statistics import median\\nimport subprocess\\nimport sys\\nimport time\\n\\nfrom adaptive_codegen import SPECS, SOURCE_PINS, write\\n\\nHARNESS_PINS = {\\n    \\\"/root/e223/probe.py\\\": \\\"b00f58ef4225bb7f5c2b2165ada291f969dbab6fa5f3fe70cad287a6361f2071\\\",\\n    \\\"/root/e227/joint.py\\\": \\\"701893bb5d09cc0248fb3dbb773665589683dc4bcf182bb211fb056e7965ba7a\\\",\\n}\\nARMS = (\\\"control\\\", \\\"adaptive_collector_fixed_post\\\")\\nPHASES = (\\n    (\\\"ordinary1\\\", 16909, 0, \\\"one_hot\\\"),\\n    (\\\"refresh1\\\", 16910, 1, \\\"one_hot\\\"),\\n    (\\\"ordinary\\\", 16902, 0, \\\"two_cohorts\\\"),\\n    (\\\"refresh8\\\", 16910, 8, \\\"two_cohorts\\\"),\\n    (\\\"refresh56\\\", 16911, 56, \\\"two_cohorts\\\"),\\n    (\\\"refresh61\\\", 16911, 61, \\\"tail61\\\"),\\n    (\\\"refresh62\\\", 16911, 62, \\\"tail62\\\"),\\n    (\\\"refresh61_holes\\\", 16911, 61, \\\"holes61\\\"),\\n)\\nE244_COUNTS = {\\n    \\\"b1\\\": {\\\"ordinary\\\": 1637, \\\"one\\\": 186, \\\"two\\\": 62, \\\"large61\\\": 61, \\\"large62\\\": 62},\\n    \\\"b2\\\": {\\\"ordinary\\\": 1570, \\\"one\\\": 310, \\\"two\\\": 0, \\\"large61\\\": 61, \\\"large62\\\": 63},\\n}\\n\\n\\ndef dump(path, value):\\n    Path(path).write_text(json.dumps(value, indent=2) + \\\"\\\\n\\\")\\n\\n\\nclass GridLaunch:\\n    def __init__(self, owner, name, kernel, transpose):\\n        self.owner, self.name, self.kernel, self.transpose = owner, name, kernel, transpose\\n\\n    def __getitem__(self, grid):\\n        old_grid, new_grid = SPECS[self.name][2:]\\n        assert tuple(grid) == old_grid, (self.name, grid, old_grid)\\n        chosen = new_grid if self.transpose else old_grid\\n\\n        def launch(*args, **kwargs):\\n            if self.name in (\\\"full_collect_split\\\", \\\"merge_refresh\\\"):\\n                assert kwargs[\\\"SR\\\"] == 32 and kwargs[\\\"THRESH\\\"] == 16\\n            self.owner.calls[self.name] += 1\\n            compiled = self.kernel[chosen](*args, **kwargs)\\n            suffix = (\\\"_adaptive\\\" if self.name == \\\"full_collect_split\\\" else \\\"_axis\\\") if self.transpose else \\\"_original\\\"\\n            key = self.name + suffix\\n            key += \\\"_v2\\\" if kwargs.get(\\\"V2\\\", False) else \\\"_v4_or_na\\\"\\n            if key not in self.owner.resources:\\n                asm = compiled.asm.get(\\\"asm\\\", \\\"\\\")\\n                assert asm, (key, \\\"missing actual ISA\\\")\\n                (self.owner.out / (key + \\\".asm\\\")).write_text(asm)\\n                if \\\"ttgir\\\" in compiled.asm:\\n                    (self.owner.out / (key + \\\".ttgir\\\")).write_text(compiled.asm[\\\"ttgir\\\"])\\n                self.owner.resources[key] = dict(\\n                    registers=compiled.n_regs, spills=compiled.n_spills,\\n                    lds=compiled.metadata.shared, grid=chosen, num_warps=kwargs[\\\"num_warps\\\"],\\n                    asm_sha256=sha256(asm.encode()).hexdigest())\\n                assert compiled.n_spills == 0, (key, self.owner.resources[key])\\n            return compiled\\n        return launch\\n\\n\\nclass Controller:\\n    def __init__(self, crosslayer, module, out):\\n        self.crosslayer, self.module, self.out = crosslayer, module, out\\n        self.original = {name: getattr(crosslayer, name) for name in SPECS}\\n        self.resources = {}\\n        self.set_arm(\\\"control\\\")\\n\\n    def set_arm(self, arm):\\n        assert arm in ARMS\\n        self.calls = {name: 0 for name in SPECS}\\n        for name, original in self.original.items():\\n            changed = arm == \\\"adaptive_collector_fixed_post\\\"\\n            kernel = getattr(self.module, name) if changed else original\\n            setattr(self.crosslayer, name, GridLaunch(self, name, kernel, changed))\\n\\n    def clear(self):\\n        for name, kernel in self.original.items():\\n            setattr(self.crosslayer, name, kernel)\\n\\n\\ndef load_kernels(source_dir, out):\\n    target = out / \\\"axis_kernels.py\\\"\\n    audit = write(source_dir, target)\\n    name = \\\"e249b_axis_kernels\\\"\\n    spec = importlib.util.spec_from_file_location(name, target)\\n    module = importlib.util.module_from_spec(spec)\\n    sys.modules[name] = module\\n    spec.loader.exec_module(module)\\n    return module, audit\\n\\n\\ndef parity(torch, bits, probe, observed, wanted, terminal, indices, label):\\n    assert bits(observed[0], wanted[0]), (label, \\\"logits\\\")\\n    assert bits(observed[2], wanted[2]), (label, \\\"sampled_tokens\\\")\\n    fields = (\\\"qkv\\\", \\\"attention\\\", \\\"o\\\", \\\"mlp\\\", \\\"residual\\\")\\n    for layer, (have, expect) in enumerate(zip(observed[1], wanted[1], strict=True)):\\n        for field, a, b in zip(fields, have, expect, strict=True):\\n            assert bits(a, b), (label, layer, field)\\n    diff = probe.state_diff(terminal, 0, indices)\\n    assert not diff, (label, diff)\\n    assert torch.isfinite(observed[0]).all().item(), label\\n\\n\\ndef economics(phases):\\n    guards = (\\\"ordinary1\\\", \\\"ordinary\\\", \\\"refresh8\\\", \\\"refresh56\\\", \\\"refresh61\\\", \\\"refresh62\\\", \\\"refresh61_holes\\\")\\n    result = {}\\n    for arm in ARMS[1:]:\\n        gain = {name: p[\\\"median_savings_ms\\\"][arm] for name, p in phases.items()}\\n        if not all(name in gain for name, *_ in PHASES):\\n            result[arm] = {\\\"complete\\\": False, \\\"passed\\\": False}\\n            continue\\n        ordinary_regression = min(0.0, gain[\\\"ordinary\\\"], gain[\\\"ordinary1\\\"])\\n        unmatched_allowance = min(0.0, *(gain[name] for name in guards))\\n        projections = {}\\n        for phase, counts in E244_COUNTS.items():\\n            r61 = \\\"refresh61_holes\\\" if phase == \\\"b1\\\" else \\\"refresh61\\\"\\n            ms = (counts[\\\"one\\\"] * gain[\\\"refresh1\\\"]\\n                  + counts[\\\"ordinary\\\"] * ordinary_regression\\n                  + counts[\\\"two\\\"] * unmatched_allowance\\n                  + counts[\\\"large61\\\"] * gain[r61]\\n                  + counts[\\\"large62\\\"] * gain[\\\"refresh62\\\"])\\n            projections[phase] = ms / 1000.0\\n        passed = (gain[\\\"refresh1\\\"] >= 0.50\\n                  and all(gain[name] >= -0.05 for name in guards)\\n                  and min(projections.values()) >= 0.10)\\n        result[arm] = dict(\\n            complete=True, passed=passed, refresh1_saved_ms=gain[\\\"refresh1\\\"],\\n            phase_guard_saved_ms={name: gain[name] for name in guards},\\n            projected_round_saved_s=projections,\\n            large_cohort_mapping={\\\"b1_R61\\\": \\\"rows0+4..63\\\", \\\"b2_R61\\\": \\\"rows3..63\\\", \\\"both_R62\\\": \\\"rows2..63\\\"},\\n            projection_caveat=\\\"Actual observed E244 proxy-bin counts and actual large-cohort row sets. R2 not measured: no positive credit, worst guard regression charged. Only negative ordinary change charged. Fixed full-hot synthetic fixture and context differ from service; projection is not a proven bound.\\\")\\n    return result\\n\\n\\ndef main():\\n    ap = argparse.ArgumentParser()\\n    ap.add_argument(\\\"--out\\\", type=Path, required=True)\\n    ap.add_argument(\\\"--refresh-row\\\", type=int, default=0, choices=range(64))\\n    ap.add_argument(\\\"--groups\\\", type=int, default=6)\\n    ap.add_argument(\\\"--replays\\\", type=int, default=3)\\n    ap.add_argument(\\\"--wall-budget\\\", type=float, default=270.0)\\n    args = ap.parse_args()\\n    assert 4 <= args.groups <= 6 and 2 <= args.replays <= 3 and 30 <= args.wall_budget <= 280\\n    args.out.mkdir(parents=True, exist_ok=False)\\n    started = time.monotonic()\\n    result = dict(scope=\\\"E214 full 42 layers + head + sample; adaptive collector order and fixed post transpose; SR32 unchanged\\\",\\n                  harness_pins=HARNESS_PINS, source_pins=SOURCE_PINS,\\n                  script_sha256=sha256(Path(__file__).read_bytes()).hexdigest(),\\n                  codegen_sha256=sha256(Path(__file__).with_name(\\\"adaptive_codegen.py\\\").read_bytes()).hexdigest(),\\n                  phases={}, errors=[], gate=dict(refresh1_saved_ms=0.50, max_other_regression_ms=0.05,\\n                                                  min_projected_saved_s_each_round=0.10),\\n                  e244_proxy_counts=E244_COUNTS,\\n                  fixture=\\\"Actual E223/E227 real weights; synthetic KV and input tokens. No official quality/TPS claim.\\\")\\n    controller = None\\n    try:\\n        for path, expected in HARNESS_PINS.items():\\n            assert sha256(Path(path).read_bytes()).hexdigest() == expected, path\\n        used = subprocess.check_output([\\\"ixsmi\\\", \\\"--query-gpu=memory.used\\\", \\\"--format=csv,noheader\\\"], text=True)\\n        assert int(used.split()[0]) < 256, used\\n        sys.path[:0] = [\\\"/root/e214/candidate-a1/gems/src\\\", \\\"/root/e227\\\", \\\"/root/e223\\\"]\\n        import torch\\n        from joint import B, CANDIDATE, HEAD, HEAD_SHA, I, L, X, JointProbe, bits, emit, initialize\\n        assert B == 64 and L == 42 and len(X.ANCHORS) == 8\\n        assert CANDIDATE in Path(I.__file__).resolve().parents\\n        assert sha256(Path(HEAD.__file__).read_bytes()).hexdigest() == HEAD_SHA\\n        assert X.REFRESH_SPLITS == 32 and X.REFRESH_THRESH == 16 and X.NORM_LOOP == 4\\n        module, audit = load_kernels(Path(I.__file__).parent, args.out)\\n        result[\\\"generated\\\"] = audit\\n        result[\\\"build\\\"] = json.loads((CANDIDATE / \\\"build.json\\\").read_text())\\n        torch.set_num_threads(4)\\n        torch.manual_seed(223214)\\n\\n        def deadline():\\n            if time.monotonic() - started >= args.wall_budget:\\n                raise TimeoutError(\\\"E249 bounded wall budget reached; preserve completed phases, no further work\\\")\\n\\n        class Probe(JointProbe):\\n            refresh_ledger = None\\n\\n            def attention(self, layer, *a, **kw):\\n                value = super().attention(layer, *a, **kw)\\n                if self.refresh_ledger is not None and layer in X.ANCHORS:\\n                    self.refresh_ledger.append((layer, self.ws[0].refresh[:B].clone()))\\n                return value\\n\\n        with torch.inference_mode():\\n            probe = Probe()\\n            controller = Controller(X, module, args.out)\\n            for name, base, expected_r, geometry in PHASES:\\n                deadline()\\n                batch_rows = torch.arange(B, device=probe.device)\\n                if geometry == \\\"one_hot\\\":\\n                    offset = batch_rows == args.refresh_row\\n                elif geometry == \\\"two_cohorts\\\":\\n                    offset = batch_rows >= 56\\n                elif geometry == \\\"tail61\\\":\\n                    offset = batch_rows < 3\\n                elif geometry == \\\"tail62\\\":\\n                    offset = batch_rows < 2\\n                elif geometry == \\\"holes61\\\":\\n                    offset = (batch_rows >= 1) & (batch_rows <= 3)\\n                else:\\n                    raise AssertionError(geometry)\\n                probe.offset = offset.long()\\n                controller.set_arm(\\\"control\\\")\\n                route, indices, token, initial = initialize(probe, base)\\n\\n                def forward():\\n                    logits, layers = probe.forward(token, (route,), record=True)\\n                    return logits, layers, probe.sample(logits)\\n\\n                probe.restore(initial, indices)\\n                probe.configure(\\\"control\\\")\\n                controller.set_arm(\\\"control\\\")\\n                probe.refresh_ledger = []\\n                wanted = forward()\\n                flags = [(layer, values.tolist()) for layer, values in probe.refresh_ledger]\\n                probe.refresh_ledger = None\\n                assert [layer for layer, _ in flags] == list(X.ANCHORS)\\n                assert [sum(values) for _, values in flags] == [expected_r] * 8, (name, flags)\\n                terminal = probe.snapshot(0, indices)\\n                epoch_changed = [(new != old).nonzero().flatten().tolist()\\n                                 for new, old in zip(terminal[1][0], initial[1][0], strict=True)]\\n                actual_rows = [[row for row, value in enumerate(values) if value] for _, values in flags]\\n                assert epoch_changed == actual_rows, (name, epoch_changed, actual_rows)\\n                graphs, outputs, launches = {}, {}, {}\\n                for arm in ARMS:\\n                    deadline()\\n                    probe.restore(initial, indices)\\n                    probe.configure(\\\"control\\\")\\n                    controlle