name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Encode E253 verified canonical W4 on CPU
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''PY'\''
          from pathlib import Path
          import base64,gzip,json,hashlib,subprocess,os,time
          root=Path('\''/root/e253/quality'\'')
          assert root.is_dir() and not (root/'\''encode_guard-a1.json'\'').exists()
          assert not (root/'\''encoded-block128-a1'\'').exists()
          assert json.loads((root/'\''done.json'\'').read_text())['\''status'\'']=='\''COMPLETE'\''
          assert hashlib.sha256((root/'\''fullk_feedback_cpu.py'\'').read_bytes()).hexdigest()=='\''de7b746157e5e8a6b10932d213a922b60bb9034124e4f5aea7bd8f1792f3ab3e'\''
          payload=json.loads(gzip.decompress(base64.b64decode('\'''\'')))
          for name,v in payload.items():
           p=root/name; assert not p.exists()
           b=v['\''text'\''].encode();assert hashlib.sha256(b).hexdigest()==v['\''sha256'\'']
           p.write_bytes(b)
          print('\''SOURCES '\''+json.dumps({n:v['\''sha256'\''] for n,v in payload.items()}),flush=True)
          with (root/'\''encode-supervisor-a1.log'\'').open('\''xb'\'',buffering=0) as log:
           child=subprocess.Popen(['\''python3'\'',str(root/'\''encode_guard.py'\'')],cwd=root,stdin=subprocess.DEVNULL,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
          print('\''LAUNCHED '\''+json.dumps({'\''guard_pid'\'':child.pid,'\''output'\'':str(root/'\''encoded-block128-a1'\''),'\''cpu_only'\'':True}),flush=True)
          PY'
