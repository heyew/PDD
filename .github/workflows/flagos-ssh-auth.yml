\nimport triton\\nimport triton.language as tl\\n\\n\\nCHAINS = 4\\nUNROLL = 16\\nWARP_WIDTH = 64\\nOPS_PER_MMA = {'\''i8'\'': 2*16*16*32, '\''f16'\'': 2*16*16*16}\\nK_DIM = {'\''i8'\'': 32, '\''f16'\'': 16}\\nOPCODE = {'\''i8'\'': '\''ml_matrix_mad_i32_i8_m16n16k32'\'',\\n          '\''f16'\'': '\''ml_matrix_mad_f32_f16_m16n16k16'\''}\\n\\n\\ndef generate(kind, export_all=False):\\n    \\\"\\\"\\\"Four independent four-register accumulators, inputs constant one.\\\"\\\"\\\"\\n    # Every fixed register written by the opaque ASM is an explicit\\n    # early-clobber output, including input fragments and loop bound. The OUT\\n    # pointer and thread offsets are live in Triton after this block and must\\n    # never be allocated into one of these registers. Merely naming the\\n    # highest vector/scalar register is NOT a clobber-range declaration.\\n    outputs=[f'\''=&{{v{r}}}'\''for r in range(20)]+['\''=&{v35}'\'','\''=&{s6}'\'','\''=&{s7}'\'']\\n    input_index = len(outputs)\\n    a=[]; e=a.append\\n    e(f'\''ml_mov_v2s_b32 s6, ${input_index}, 0x0'\'')\\n    e('\''sl_mov_b32 s7, 0x0'\'')\\n    for r in range(16): e(f'\''ml_mov_b32 v{r}, 0x0'\'')\\n    bits='\''0x1010101'\'' if kind=='\''i8'\'' else '\''0x3c003c00'\''\\n    for r in range(16,20): e(f'\''ml_mov_b32 v{r}, {bits}'\'')\\n    e('\''sl_cmp_lt_i32 wcr, s7, s6'\'')\\n    e('\''sl_cbr_wcrz .Lroof_done'\'')\\n    e('\''.Lroof_loop:'\'')\\n    for _ in range(UNROLL):\\n        for chain in range(CHAINS):\\n            r=4*chain\\n            e(f'\''{OPCODE[kind]} v[{r}:{r+3}], v[16:17], v[18:19], v[{r}:{r+3}]'\'')\\n    e('\''sl_add_i32 s7, s7, 0x1'\'')\\n    e('\''sl_cmp_lt_i32 wcr, s7, s6'\'')\\n    e('\''sl_cbr_wcrnz .Lroof_loop'\'')\\n    e('\''.Lroof_done:'\'')\\n    # Keep every chain live and verify every accumulator register. Only one\\n    # checksum word/lane is stored in the timed kernel, with no masked wave.\\n    add='\''ml_add_i32'\'' if kind=='\''i8'\'' else '\''ml_add_f32'\''\\n    e('\''ml