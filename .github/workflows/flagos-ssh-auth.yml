name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Preserve sixteen E256 raw lifecycle logits
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''E256_LOGITS'\''
          import json,hashlib,base64,lzma,subprocess
          from pathlib import Path
          out=Path('\''/root/e256/lifecycle-a2'\'')
          assert hashlib.sha256((out/'\''result.json'\'').read_bytes()).hexdigest()=='\''85fc675045e6297b6d60c589a1451c67aeb819cc535ddf82bce749fdbe1636f1'\''
          r=json.loads((out/'\''result.json'\'').read_text());assert r['\''complete'\''] and r['\''functional_passed'\'']
          files=sorted((out/'\''logits'\'').glob('\''*.npz'\''));assert len(files)==16
          data={str(p.relative_to('\''/root/e256'\'')):base64.b64encode(p.read_bytes()).decode() for p in files}
          raw=json.dumps(data,sort_keys=True).encode();packed=lzma.compress(raw,format=lzma.FORMAT_XZ,check=lzma.CHECK_SHA256,preset=6)
          print('\''E256_LOGITS_META'\'',json.dumps({'\''files'\'':len(files),'\''raw_bytes'\'':len(raw),'\''xz_bytes'\'':len(packed),'\''raw_sha256'\'':hashlib.sha256(raw).hexdigest(),'\''files_sha256'\'':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in files}}),flush=True)
          print('\''E256_LOGITS_B64_BEGIN'\'',flush=True)
          s=base64.b64encode(packed).decode()
          for i in range(0,len(s),60000):print(s[i:i+60000],flush=True)
          print('\''E256_LOGITS_B64_END'\'',flush=True)
          print('\''GPU_MEMORY'\'',subprocess.check_output(['\''ixsmi'\'','\''--query-gpu=memory.used'\'','\''--format=csv,noheader'\''],text=True,timeout=5),flush=True)
          E256_LOGITS'
