name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Read completed lifecycle and hardware followup results
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''PY'\''
          import json,subprocess
          from pathlib import Path
          print("FLAGOS_E244_SERIAL_STATUS_V4_BEGIN",flush=True)
          for name in ["/root/e244/ledger_status.json","/root/e244/ledger_a1/stage.json","/root/e244/ledger_a1/rounds.json","/root/e244/ledger_a1/observer-error.json","/root/e244/ledger_a1/observer_overhead.json","/root/e244/ledger_a1/ledger.json","/root/e247/followups_status.json","/root/e247/cap_b1/result.json","/root/e245/prefetch-tiny-a1/result.json","/root/e245/prefetch-full-a1/result.json"]:
              p=Path(name)
              if p.is_file():print("RESULT_JSON",json.dumps({"path":name,"data":json.loads(p.read_text())}),flush=True)
          for name in ["/root/e244/driver.log","/root/e247/cap_b.log","/root/e245/prefetch_tiny.log","/root/e245/prefetch_full.log"]:
              p=Path(name)
              if p.is_file():print("LOG_TAIL",json.dumps({"path":name,"lines":p.read_text(errors="replace").splitlines()[-18:]}),flush=True)
          p=Path("/root/e244/ledger_a1/serve.log")
          if p.is_file():
              lines=p.read_text(errors="replace").splitlines()
              selected=[x for x in lines if any(word in x for word in ("Error","ERROR","Exception","Traceback","Application startup complete"))]
              print("SERVICE_ERRORS_OR_READY",json.dumps(selected[-12:]),flush=True)
          p=Path("/root/e244/ledger_a1/steps.jsonl")
          if p.is_file():print("TRACE_FILE_BYTES",p.stat().st_size,flush=True)
          print("CARD_MEMORY",subprocess.check_output(["/usr/local/corex/bin/ixsmi","--query-gpu=memory.used","--format=csv,noheader"],text=True).strip(),flush=True)
          print("FLAGOS_E244_SERIAL_STATUS_V4_END",flush=True)
          PY'
