name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Repair isolated codec buffer dtype and restart owned quality diagnostic
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''PY'\''
          from pathlib import Path
          import ast,hashlib,json,os,signal,subprocess
          print("P2_FP32_REPAIR_BEGIN",flush=True)
          root=Path("/root/e245/p2_row_a2");assert not root.exists()
          payload=json.loads("[{\"name\":\"run_p2.py\",\"sha256\":\"cc8c7af109711896a00b54d6ee297db728a59680949b314279a1b8674f309153\",\"content\":\"\\\"\\\"\\\"One owned E214 service: real-text W8a/W8b self-control then row-W4.\\n\\nThis diagnostic changes sampled outputs to a fixed real-text continuation and\\nholds admission to obtain a reproducible B64. It is not a benchmark command.\\nFrozen source files and dispatch registrations remain untouched on disk.\\n\\\"\\\"\\\"\\nfrom __future__ import annotations\\nimport argparse\\nfrom hashlib import sha256\\nimport json\\nimport os\\nfrom pathlib import Path\\nimport runpy\\nimport signal\\nimport subprocess\\nimport sys\\nimport time\\n\\nimport numpy as np\\nimport requests\\n\\n\\ndef digest(path):\\n    return sha256(path.read_bytes()).hexdigest()\\n\\n\\ndef write(path, value):\\n    temporary = path.with_suffix(path.suffix + \\\".tmp\\\")\\n    temporary.write_text(json.dumps(value, indent=2) + \\\"\\\\n\\\")\\n    temporary.replace(path)\\n\\n\\ndef build_cases(model, texts):\\n    from transformers import AutoTokenizer\\n    tokenizer = AutoTokenizer.from_pretrained(model, local_files_only=True, trust_remote_code=True)\\n    books, hashes = {}, {}\\n    for book in (1342, 1400, 2009):\\n        path = texts / f\\\"{book}.txt\\\"\\n        raw = path.read_bytes()\\n        hashes[str(book)] = sha256(raw).hexdigest()\\n        books[book] = tokenizer.encode(raw.decode(\\\"utf-8\\\"), add_special_tokens=False)\\n    cases = []\\n    # Fixed, uncalibrated real text; unique histories are not fitted to the model.\\n    # 17 generated positions = first prefill prediction + 16 genuine decode steps.\\n    for i in range(8):\\n        book = (1342, 1400, 2009)[i % 3]\\n        end = 65536 + (i // 3) * 8192\\n        prompt, target = books[book][end-4096:end], books[book][end:end+17]\\n        assert len(prompt) == 4096 and len(target) == 17, (book, end, len(books[book]))\\n        cases.append(dict(case_id=f\\\"h{i}\\\", book=book, start=end-4096, stop=end,\\n            text_sha256=hashes[str(book)], prompt_ids=prompt, target_ids=target,\\n            prompt_sha256=sha256(np.asarray(prompt, dtype=\\\"<i4\\\").tobytes()).hexdigest()))\\n    return dict(scope=\\\"real books; 8 unique histories, each replicated 8 times; no calibration\\\",\\n        cases=cases, steps=17, pure_decode_steps=16, batch=64, text_sha256=hashes,\\n        tokenizer_files={p.name: digest(p) for p in Path(model).glob(\\\"tokenizer*\\\") if p.is_file()})\\n\\n\\ndef score(out, first, second, cfg):\\n    rows, exact = [], True\\n    events = [json.loads(line) for line in (out / \\\"events.jsonl\\\").read_text().splitlines()]\\n    meta = {(e[\\\"label\\\"], e[\\\"case_id\\\"], e[\\\"step\\\"]): e for e in events if e[\\\"stage\\\"] == \\\"logits\\\"}\\n    for case in cfg[\\\"cases\\\"]:\\n        records = []\\n        for step in range(cfg[\\\"steps\\\"]):\\n            keys = [(label, case[\\\"case_id\\\"], step) for label in (first, second)]\\n            for key in keys:\\n                m = meta[key]\\n                assert m[\\\"batch_rows\\\"] == 64\\n                assert m[\\\"query_tokens\\\"] == (16 if step == 0 else 1), m\\n                assert m[\\\"scheduled_tokens\\\"] == (1024 if step == 0 else 64), m\\n            a32, b32 = (np.load(out / \\\"logits\\\" / meta[key][\\\"filename\\\"]) for key in keys)\\n            bitwise = bool(np.array_equal(a32.view(np.uint32), b32.view(np.uint32)))\\n            exact &= bitwise\\n            a, b = a32.astype(np.float64), b32.astype(np.float64)\\n            la = a - a.max(); la -= np.log(np.exp(la).sum())\\n            lb = b - b.max(); lb -= np.log(np.exp(lb).sum())\\n            target = case[\\\"target_ids\\\"][step]\\n            records.append(dict(step=step, boundary=\\\"prefill\\\" if step == 0 else \\\"pure_decode_B64\\\",\\n                bitwise=bitwise, max_abs_logits=float(np.max(np.abs(a-b))),\\n                kl_control_to_candidate=float((np.exp(la) * (la-lb)).sum()),\\n                delta_nll=float(la[target]-lb[target]), top1_same=bool(np.argmax(a)==np.argmax(b))))\\n        active = records[1:]\\n        rows.append(dict(case_id=case[\\\"case_id\\\"], book=case[\\\"book\\\"],\\n            mean_kl=float(np.mean([r[\\\"kl_control_to_candidate\\\"] for r in active])),\\n            mean_delta_nll=float(np.mean([r[\\\"delta_nll\\\"] for r in active])),\\n            top1_agreement=float(np.mean([r[\\\"top1_same\\\"] for r in active])), records=records))\\n    return dict(bitwise_all_positions=exact, unique_histories=8, repetitions_per_history=8,\\n        unique_decode_positions=128, scope=\\\"actual E214 A8 and packed KV; 4096 prefixes; teacher forcing\\\",\\n        mean_kl=float(np.mean([r[\\\"mean_kl\\\"] for r in rows])),\\n        mean_delta_nll=float(np.mean([r[\\\"mean_delta_nll\\\"] for r in rows])),\\n        max_history_delta_nll=float(max(r[\\\"mean_delta_nll\\\"] for r in rows)),\\n        top1_agreement=float(np.mean([r[\\\"top1_agreement\\\"] for r in rows])), rows=rows)\\n\\n\\ndef main():\\n    ap = argparse.ArgumentParser()\\n    ap.add_argument(\\\"--out\\\", type=Path, required=True)\\n    ap.add_argument(\\\"--source-control\\\", type=Path, default=Path(\\\"/root/e241\\\"))\\n    ap.add_argument(\\\"--frozen\\\", type=Path, default=Path(\\\"/root/e214/candidate-a1\\\"))\\n    ap.add_argument(\\\"--model\\\", type=Path, default=Path(\\\"/workspace/MiniCPM5-2B\\\"))\\n    ap.add_argument(\\\"--texts\\\", type=Path, default=Path(\\\"/root/e139/texts\\\"))\\n    ap.add_argument(\\\"--url\\\", default=\\\"http://127.0.0.1:9031\\\")\\n    ap.add_argument(\\\"--max-runtime\\\", type=float, default=420)\\n    args = ap.parse_args()\\n    root, out = Path(__file__).resolve().parent, args.out.resolve()\\n    assert not out.exists()\\n    used = subprocess.check_output([\\\"ixsmi\\\", \\\"--query-gpu=memory.used\\\", \\\"--format=csv,noheader\\\"], text=True)\\n    assert int(used.split()[0]) < 256, used\\n    try:\\n        occupied = requests.get(args.url + \\\"/v1/models\\\", timeout=1)\\n        raise RuntimeError(f\\\"A service already owns the pinned port: HTTP {occupied.status_code}\\\")\\n    except requests.RequestException:\\n        pass\\n    out.mkdir(); (out / \\\"logits\\\").mkdir()\\n    cfg = build_cases(args.model, args.texts)\\n    write(out / \\\"cases.json\\\", cfg)\\n    command_path = args.source_control / \\\"frozen_commands.json\\\"\\n    command = json.loads(command_path.read_text())\\n    for relative, expected in command[\\\"candidate_sources\\\"].items():\\n        assert digest(args.frozen / relative) == expected, relative\\n    build_path, bytelevel_path = (args.source_control / name for name in (\\\"build_bytelevel.py\\\", \\\"bytelevel.py\\\"))\\n    build = runpy.run_path(str(build_path))[\\\"build\\\"]\\n    plugin = out / \\\"plugin\\\"\\n    assert build(args.frozen / \\\"plugin\\\", bytelevel_path, plugin) == command[\\\"bytelevel_registration\\\"]\\n    gems = args.frozen / \\\"gems/src\\\"\\n    serve = [\\\"/usr/local/bin/vllm\\\", *command[\\\"serve\\\"][1:]]\\n    assert serve[serve.index(\\\"--port\\\") + 1] == args.url.rsplit(\\\":\\\", 1)[1]\\n    write(out / \\\"phase.json\\\", dict(stage=\\\"idle\\\", arm=\\\"w8\\\", label=\\\"\\\"))\\n    sources = {str(p): digest(p) for p in [*root.glob(\\\"*.py\\\"), root.parent / \\\"codec_controls.py\\\",\\n        command_path, build_path, bytelevel_path]}\\n    result = dict(scope=\\\"ISOLATED_E214_ROW_W4_REALTEXT_P2_NOT_OFFICIAL_MATH_OR_SPEED\\\",\\n        production_unchanged=True, source_sha256=sources, commands=dict(serve=serve),\\n        boundary=\\\"row W4 expanded int8(q4*16), FP32 scale/16, original E214 kernels\\\",\\n        prefill_and_decode_same_candidate_weights=True, fixed_admission_diagnostic_only=True,\\n        arms={}, complete=False)\\n    write(out / \\\"result.json\\\", result)\\n    env = {k: v for k, v in os.environ.items() if k != \\\"PYTHONPATH\\\" and not k.startswith(\\\"VLLM_\\\")}\\n    env.update(VLLM_PLUGINS=\\\"fl\\\", E245_P2_OUT=str(out),\\n        PYTHONPATH=os.pathsep.join(map(str, (root, root.parent, gems, plugin))))\\n    started = time.monotonic()\\n    deadline = started + args.max_runtime\\n    def remaining():\\n        value = deadline - time.monotonic()\\n        if value <= 0:\\n            raise TimeoutError(\\\"P2 owned service runtime budget exhausted\\\")\\n        return value\\n    def post(path, data=None):\\n        r = requests.post(args.url + path, json=data, timeout=min(120, remaining()))\\n        r.raise_for_status()\\n        return r\\n    with (out / \\\"serve.log\\\").open(\\\"w\\\") as log:\\n        child = subprocess.Popen(serve, cwd=\\\"/workspace\\\", env=env,\\n            stdout=log, stderr=subprocess.STDOUT, start_new_session=True)\\n        previous_handlers = {sig: signal.getsignal(sig) for sig in (signal.SIGTERM, signal.SIGINT)}\\n        def interrupted(signum, _frame):\\n            raise TimeoutError(f\\\"P2 driver interrupted by signal {signum}; cleaning owned service\\\")\\n        for sig in previous_handlers:\\n            signal.signal(sig, interrupted)\\n        try:\\n            print(\\\"P2 loading isolated E214 service\\\", flush=True)\\n            while True:\\n                assert child.poll() is None, child.returncode\\n                remaining()\\n                try:\\n                    if requests.get(args.url + \\\"/v1/models\\\", timeout=2).ok:\\n                        break\\n                except requests.RequestException:\\n                    pass\\n                time.sleep(0.5)\\n            for label, arm in ((\\\"w8a\\\", \\\"w8\\\"), (\\\"w8b\\\", \\\"w8\\\"), (\\\"row\\\", \\\"row\\\")):\\n                if label == \\\"row\\\":\\n                    control = score(out, \\\"w8a\\\", \\\"w8b\\\", cfg)\\n                    result[\\\"control_repeat\\\"] = control\\n                    write(out / \\\"result.json\\\", result)\\n                    if not control[\\\"bitwise_all_positions\\\"]:\\n                        result[\\\"decision\\\"] = \\\"INCONCLUSIVE_CONTROL_REPLAY_NOT_BITWISE_NO_ROW_ARM_RUN\\\"\\n                        return\\n                # Clear stale KV before changing the weight image on next execution.\\n                write(out / \\\"phase.json\\\", dict(stage=\\\"idle\\\", arm=arm, label=label))\\n                post(\\\"/reset_prefix_cache\\\")\\n                write(out / \\\"phase.json\\\", dict(stage=\\\"seed\\\", arm=arm, label=label))\\n                for case in cfg[\\\"cases\\\"]:\\n                    seed = post(\\\"/v1/completions\\\", dict(model=\\\"minicpm\\\", prompt=case[\\\"prompt_ids\\\"], max_tokens=1,\\n                        temperature=0, ignore_eos=True, add_special_tokens=False, return_token_ids=True)).json()\\n                    assert seed[\\\"usage\\\"][\\\"completion_tokens\\\"] == 1 and len(seed[\\\"choices\\\"]) == 1\\n                # One API batch; scheduler diagnostic releases its 64 prompts together.\\n                prompts = [c[\\\"prompt_ids\\\"] for c in cfg[\\\"cases\\\"] for _ in range(8)]\\n                write(out / \\\"phase.json\\\", dict(stage=\\\"eval\\\", arm=arm, label=label))\\n                payload = post(\\\"/v1/completions\\\", dict(model=\\\"minicpm\\\", prompt=prompts,\\n                    max_tokens=cfg[\\\"steps\\\"], temperature=0, ignore_eos=True,\\n                    add_special_tokens=False, return_token_ids=True)).json()\\n                choices = sorted(payload[\\\"choices\\\"], key=lambda v: v[\\\"index\\\"])\\n                assert len(choices) == 64\\n                for i, choice in enumerate(choices):\\n                    assert choice.get(\\\"token_ids\\\") == cfg[\\\"cases\\\"][i // 8][\\\"target_ids\\\"], (label, i, choice)\\n                events = [json.loads(line) for line in (out / \\\"events.jsonl\\\").read_text().splitlines()]\\n                cache = [e for e in events if e[\\\"stage\\\"] == \\\"cache_prefix\\\" and e[\\\"label\\\"] == label]\\n                cold = [e for e in cache if e[\\\"phase\\\"] == \\\"seed\\\"]\\n                warm = [e for e in cache if e[\\\"phase\\\"] == \\\"eval\\\"]\\n                assert len(cold) == 8 and all(e[\\\"computed_tokens\\\"] == 0 for e in cold)\\n                assert len(warm) == 64 and all(e[\\\"computed_tokens\\\"] == 4080 for e in warm)\\n                result[\\\"arms\\\"][label] = dict(forced_tokens_all64_exact=True,\\n                    completion_tokens=payload[\\\"usage\\\"][\\\"completion_tokens\\\"],\\n                    real_cold_prefills=8, seeded_prefix_hits=64, prefix_reset_verified_from_scheduler=True,\\n                    elapsed_s=time.monotonic()-started)\\n                write(out / \\\"result.json\\\", result)\\n                print(json.dumps(dict(stage=\\\"arm_complete\\\", label=label, **result[\\\"arms\\\"][label])), flush=True)\\n                write(out / \\\"phase.json\\\", dict(stage=\\\"idle\\\", arm=arm, label=label))\\n            result[\\\"row_quality\\\"] = score(out, \\\"w8a\\\", \\\"row\\\", cfg)\\n            result.update(complete=True, decision=\\\"REVIEW_ACTUAL_ROW_W4_P2_OFFICIAL_MATH_STILL_REQUIRED\\\")\\n        except Exception as exc:\\n            result.update(error=dict(type=type(exc).__name__, message=str(exc)),\\n                decision=\\\"STOP_EARLIEST_MISSING_MARKER_REPAIR_REQUIRED\\\")\\n            raise\\n        finally:\\n            result[\\\"elapsed_s\\\"] = time.monotonic() - started\\n            # A second TERM must not interrupt cleanup of the independent PG.\\n            for sig in previous_handlers:\\n                signal.signal(sig, signal.SIG_IGN)\\n            try:\\n                try:\\n                    write(out / \\\"result.json\\\", result)\\n                    write(out / \\\"phase.json\\\", dict(stage=\\\"idle\\\", arm=\\\"w8\\\", label=\\\"\\\"))\\n                finally:\\n                    if child.poll() is None:\\n                        os.killpg(child.pid, signal.SIGTERM)\\n                        try:\\n                            child.wait(timeout=15)\\n                        except subprocess.TimeoutExpired:\\n                            os.killpg(child.pid, signal.SIGKILL)\\n                            child.wait()\\n            finally:\\n                for sig, handler in previous_handlers.items():\\n                    signal.signal(sig, handler)\\n    print(json.dumps(result.get(\\\"row_quality\\\", {})), flush=True)\\n\\n\\nif __name__ == \\\"__main__\\\":\\n    main()\\n\"},{\"name\":\"p2_observer.py\",\"sha256\":\"53c346ec05e541c2d4cb8600312a949ae3acc1b074b73df1b0ec20a1f632291f\",\"content\":\"\\\"\\\"\\\"Production E214 arithmetic, row W4 image substitution, fixed real-text replay.\\n\\nNever enabled without E245_P2_OUT. Expanded W4 is a numerical surrogate,\\nnot a memory-saving implementation or performance measurement.\\n\\\"\\\"\\\"\\nfrom functools import wraps\\nfrom hashlib import sha256\\nimport json\\nimport os\\nfrom pathlib import Path\\nimport re\\nimport time\\n\\nROOT = Path(os.environ[\\\"E245_P2_OUT\\\"])\\n\\n\\ndef phase():\\n    return json.loads((ROOT / \\\"phase.json\\\").read_text())\\n\\n\\ndef event(stage, **data):\\n    with (ROOT / \\\"events.jsonl\\\").open(\\\"a\\\") as f:\\n        f.write(json.dumps(dict(stage=stage, pid=os.getpid(), time=time.time(), **data)) + \\\"\\\\n\\\")\\n\\n\\ndef attach_cache(cls):\\n    original = cls.get_computed_blocks\\n\\n    @wraps(original)\\n    def computed(self, request):\\n        result = original(self, request)\\n        p = phase()\\n        if p.get(\\\"stage\\\") in (\\\"seed\\\", \\\"eval\\\"):\\n            expected = 0 if p[\\\"stage\\\"] == \\\"seed\\\" else 4080\\n            event(\\\"cache_prefix\\\", label=p[\\\"label\\\"], phase=p[\\\"stage\\\"],\\n                request_id=request.request_id, prompt_tokens=request.num_prompt_tokens,\\n                computed_tokens=result[1], expected=expected)\\n            assert request.num_prompt_tokens == 4096 and result[1] == expected, (\\n                \\\"P2 prefix reset/seed proof failed\\\", p, result[1], expected)\\n        return result\\n\\n    cls.get_computed_blocks = computed\\n\\n\\ndef attach_scheduler(cls):\\n    \\\"\\\"\\\"Hold only a diagnostic eval admission until its entire B64 is queued.\\n\\n    No blocking wait: an empty ordinary scheduling pass lets EngineCore poll\\n    further requests. Original queues are restored before returning.\\n    \\\"\\\"\\\"\\n    from vllm.v1.core.sched.request_queue import create_request_queue\\n    original = cls.schedule\\n    admitted, first_seen = set(), {}\\n\\n    @wraps(original)\\n    def schedule(self, *args, **kwargs):\\n        p = phase()\\n        label = p.get(\\\"label\\\", \\\"\\\")\\n        if p.get(\\\"stage\\\") == \\\"eval\\\" and label not in admitted:\\n            assert not self.running, \\\"P2 eval admission overlapped running requests\\\"\\n            for name in (\\\"kv_holding_waiting\\\", \\\"async_kv_waiting\\\", \\\"deferred_waiting\\\"):\\n                assert not getattr(self, name, ()), (\\\"unexpected deferred queue\\\", name)\\n            count = len(self.waiting)\\n            if count:\\n                first_seen.setdefault(label, time.monotonic())\\n                assert time.monotonic() - first_seen[label] < 10, \\\"P2 B64 did not arrive in 10s\\\"\\n            if count < 64:\\n                saved = self.waiting\\n                self.waiting = create_request_queue(self.policy)\\n                try:\\n                    result = original(self, *args, **kwargs)\\n                finally:\\n                    self.waiting = saved\\n                assert result.total_num_scheduled_tokens == 0\\n                return result\\n            assert count == 64, (\\\"P2 expects exactly 64 queued requests\\\", count)\\n            admitted.add(label)\\n            result = original(self, *args, **kwargs)\\n            sizes = list(result.num_scheduled_tokens.values())\\n            event(\\\"fixed_admission\\\", label=label, requests=len(sizes), tokens=result.total_num_scheduled_tokens,\\n                  sizes=sizes)\\n            assert len(sizes) == 64 and set(sizes) == {16}, sizes\\n            return result\\n        return original(self, *args, **kwargs)\\n\\n    cls.schedule = schedule\\n\\n\\ndef attach_runner(cls):\\n    import numpy as np\\n    import torch\\n    import triton\\n    from flag_gems.fused.minicpm import _h128_basis as H, w8a8 as W\\n    import codec_controls as C\\n\\n    cfg = json.loads((ROOT / \\\"cases.json\\\").read_text())\\n    cases = {c[\\\"prompt_sha256\\\"]: c for c in cfg[\\\"cases\\\"]}\\n    original_load, original_execute, original_sample = cls.load_model, cls.execute_model, cls._sample\\n    cpu_options, quant_defaults = {}, {}\\n    records, steps = set(), {}\\n    req_case = {}\\n\\n    def digest(tensor):\\n        return sha256(tensor.contiguous().numpy().tobytes()).hexdigest()\\n\\n    @wraps(original_load)\\n    def load(self, *args, **kwargs):\\n        original_quant = H.quant_weight\\n\\n        def quant(weight):\\n            q8, s8 = original_quant(weight)\\n            assert tuple(weight.shape) == (2048, 6144)\\n            assert weight.dtype == torch.bfloat16 and q8.dtype == torch.int8 and s8.dtype == torch.float32\\n            rotated = torch.empty_like(weight)\\n            maxima = torch.empty((2048, 48), device=weight.device, dtype=torch.float32)\\n            H.rotate[(32, 48)](weight, W._h128(weight.device), rotated, maxima,\\n                M=2048, K=6144, BM=64, num_warps=4, num_stages=1)\\n            q4 = torch.empty_like(q8)\\n            scale = torch.empty((2048, 1), device=weight.device, dtype=torch.float32)\\n            C.fit_weight[(2048, 1)](rotated, q4, scale, K=6144, WIDTH=6144,\\n                BLOCK=8192, ROW_SCALE=True, num_warps=8)\\n            assert maxima.dtype == scale.dtype == torch.float32 and q4.dtype == torch.int8\\n            options = (q8.cpu(), s8.cpu(), (q4 * 16).cpu(), (scale.flatten() / 16).cpu())\\n            assert [x.dtype for x in options] == [torch.int8, torch.float32, torch.int8, torch.float32]\\n            cpu_options[q8.data_ptr()] = options\\n            quant_defaults[q8.data_ptr()] = str(torch.get_default_dtype())\\n            return q8, s8\\n\\n        H.quant_weight = quant\\n        try:\\n            result = original_load(self, *args, **kwargs)\\n        finally:\\n            H.quant_weight = original_quant\\n        matrices, metadata = [], []\\n        for name, module in self.model.named_modules():\\n            if not name.endswith(\\\"mlp.down_proj\\\"):\\n                continue\\n            match = re.search(r\\\"layers\\\\.(\\\\d+)\\\\.mlp\\\\.down_proj$\\\", name)\\n            assert match and getattr(module, \\\"_e110_h128_down\\\", False), name\\n            assert module.weight.dtype == torch.int8 and module.weight.is_contiguous()\\n            options = cpu_options.pop(module.weight.data_ptr())\\n            default_dtype = quant_defaults.pop(module.weight.data_ptr())\\n            matrices.append((int(match[1]), module, options))\\n            metadata.append(dict(layer=int(match[1]), module=name, shape=list(module.weight.shape),\\n                w8_sha256=digest(options[0]), w8_scale_sha256=digest(options[1]),\\n                row_expanded_sha256=digest(options[2]), row_scale16_sha256=digest(options[3]),\\n                option_dtypes=[str(x.dtype) for x in options], default_dtype_at_quant=default_dtype))\\n        assert len(matrices) == 42 and not cpu_options and not quant_defaults\\n        assert sorted(row[0] for row in matrices) == list(range(42))\\n        self._e245_matrices = sorted(matrices, key=lambda v: v[0])\\n        self._e245_kind = \\\"w8\\\"\\n        (ROOT / \\\"weights.json\\\").write_text(json.dumps