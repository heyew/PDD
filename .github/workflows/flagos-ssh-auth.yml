name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Read current FlagOS stack and idle BI-V150 status
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''READ_CHECK'\''
          import os
          import json
          import subprocess
          from pathlib import Path
          print("PROBE_START", flush=True)
          print("IDENTITY", subprocess.check_output(["id","-un"],text=True).strip())
          print("PWD", os.getcwd())
          try:
           print("IXSMI", subprocess.check_output(["ixsmi"],text=True,timeout=8)[0:6000])
          except Exception as e:
           print("IXSMI_ERROR",type(e).__name__,str(e)[:200])
          for root in [Path("/root"),Path("/workspace")]:
           try:
            entries=sorted(root.iterdir(),key=lambda x:x.name)
            print("ROOT_ENTRIES",str(root),[(x.name,"dir" if x.is_dir() else "file") for x in entries][:140])
           except Exception as e:print("LIST_ERROR",str(root),str(e)[:150])
          for root in [Path("/root"),Path("/workspace")]:
           if not root.exists(): continue
           found=[]
           for base, dirs, files in os.walk(root):
            depth=len(Path(base).relative_to(root).parts)
            dirs[:]=[d for d in dirs if d not in [".git","node_modules",".cache","venv",".venv","site-packages"] and not d.startswith(".") and depth<4]
            if "CURRENT.md" in files:
             found.append(Path(base)/"CURRENT.md")
             if len(found)>=12:break
           print("CURRENT_PATHS",str(root),[str(x) for x in found])
           for f in found[:4]:
            data=f.read_text(errors="replace")
            print("CURRENT_FILE",str(f),"BYTES",len(data),"TAIL",data[-15000:])
          for name in ["e253","e255","e256","e257","e258","e259","e260","e261","e262","e263"]:
           root=Path("/root")/name
           if root.exists():
            print("EXP_DIR",name,[(x.name,"d" if x.is_dir() else "f") for x in sorted(root.iterdir(),key=lambda y:y.name)][:65])
          print("PROBE_END",flush=True)
                    READ_CHECK'
