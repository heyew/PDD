name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Read native W4 correctness and resource results
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'set -eu
          printf "FLAGOS_E245_STATUS_BEGIN\n"
          python3 - <<'\''PY'\''
          import pathlib,json,subprocess
          root=pathlib.Path("/root/e245")
          for name in ("smoke_status.json","tiny-a1/result.json","tiny-a1/tiny_checks.json"):
              p=root/name
              if p.is_file(): print("RESULT_JSON",json.dumps({"path":str(p),"data":json.loads(p.read_text())}),flush=True)
          p=root/"smoke.log"
          if p.is_file():
              print("OWNED_TASK_LOG_TAIL_BEGIN",flush=True)
              print("\n".join(p.read_text(errors="replace").splitlines()[-65:]),flush=True)
              print("OWNED_TASK_LOG_TAIL_END",flush=True)
          print(subprocess.check_output(["/usr/local/corex/bin/ixsmi","--query-gpu=memory.used,utilization.gpu","--format=csv,noheader"],text=True),flush=True)
          PY
          printf "FLAGOS_E245_STATUS_END\n"'
