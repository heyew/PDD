name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Read earliest isolated P2 engine failure context
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''PY'\''
          from pathlib import Path
          import json,subprocess
          print("P2_EARLIEST_FAILURE_READ_BEGIN",flush=True)
          for name in ["p2-row-a1","p2-row-a2"]:
           p=Path("/root/e245")/name/"serve.log"
           if not p.is_file():continue
           lines=p.read_text(errors="replace").splitlines()
           hits=[i for i,s in enumerate(lines)if any(x in s for x in ["Traceback","TypeError:","ValueError:","AssertionError:","Unsupported","unsupported","p2_observer.py","weights_prepared","Error in sitecustomize"])]
           chosen=set()
           for i in hits[:20]:chosen.update(range(max(0,i-5),min(len(lines),i+18)))
           print("ERROR_CONTEXT",json.dumps({"path":str(p),"lines":[[i+1,lines[i]]for i in sorted(chosen)]}),flush=True)
           p=Path("/root/e245")/name/"result.json"
           if p.is_file():print("RESULT_JSON",json.dumps({"path":str(p),"data":json.loads(p.read_text())}),flush=True)
          p=Path("/root/e245/p2_row_a2/status.json")
          if p.is_file():print("RESULT_JSON",json.dumps({"path":str(p),"data":json.loads(p.read_text())}),flush=True)
          print("P2_EARLIEST_FAILURE_READ_END",flush=True)
          PY'
