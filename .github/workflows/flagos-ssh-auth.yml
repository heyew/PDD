name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Read true kernel profiles and inspect recent MMA compiler output
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''PY'\''
          import json
          from pathlib import Path
          print("FLAGOS_PROFILE_AND_MMA_ASM_BEGIN",flush=True)
          for name in ["/root/e247/eager_pair_status.json","/root/e247/eager_pair_a1/result.json"]:
              p=Path(name)
              if p.is_file():print("RESULT_JSON",json.dumps({"path":name,"data":json.loads(p.read_text())}),flush=True)
          p=Path("/root/e247/eager_pair.log")
          if p.is_file():print("EAGER_LOG_TAIL",json.dumps(p.read_text(errors="replace").splitlines()[-30:]),flush=True)
          found=[]
          for root in [Path("/root/.triton/cache"),Path("/root/.cache/triton")]:
              if not root.is_dir():continue
              for p in root.glob("*/tiny.asm"):
                  if p.stat().st_mtime<1794485500:continue
                  txt=p.read_text(errors="replace")
                  if "ml_matrix_mad_i32_i8_m16n16k32" not in txt:continue
                  found.append(str(p))
                  print("RECENT_MMA_ASM",json.dumps({"path":str(p),"content":txt}),flush=True)
                  if len(found)>=2:break
          print("RECENT_MMA_ASM_COUNT",len(found),flush=True)
          print("FLAGOS_PROFILE_AND_MMA_ASM_END",flush=True)
          PY'
