name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Validate E256 production W8 runtime lifecycle
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''E256_REMOTE_SERVICE'\''
          import base64,gzip,hashlib,json,os,subprocess,sys,time
          from pathlib import Path
          payload='\'''\''
          expected_changes={'\''gems/src/flag_gems/fused/minicpm/_e256_attention.py'\'': '\''d34f1478487435b3e9023bd802a1d7dbcbd23c320ed80090ce5447bc9c0c4590'\'', '\''gems/src/flag_gems/fused/minicpm/_e256_attention_plan.py'\'': '\''4a0d4b313974d29f0fb9c32372f1eb4d3062540ecdcb51de8eba56a3e911dbc1'\'', '\''gems/src/flag_gems/fused/minicpm/_e256_contracts.py'\'': '\''d46b53c6f01b6d6979652a19686f97086930e0479354958bba2bffcbdbd37682'\'', '\''gems/src/flag_gems/fused/minicpm/_e256_hooks.py'\'': '\''bff35bd4d7a126f93a62e5fa3c6f261c098c618092b91b7fb247f3a2a6486097'\'', '\''gems/src/flag_gems/fused/minicpm/_e256_mlp.py'\'': '\''6e4d4d852b8dc199719042ca05a789816a7cd4bbb11f82e0fb5017932f866a8f'\'', '\''gems/src/flag_gems/fused/minicpm/_e256_mlp_layout.py'\'': '\''c56e674ac860a69164c739c0bbab71f75ee7290fb17dd3693443122c2975ba7b'\'', '\''gems/src/flag_gems/fused/minicpm/_e256_prefill_plan.py'\'': '\''80b2ecde9ad8315be8a6cb94e3045ba87d4fa3c1aa8fca48c03a361b20586646'\'', '\''gems/src/flag_gems/fused/minicpm/_e256_runtime.py'\'': '\''c0060fa63daa2ee3c59efacd9c7b51fd40efebea610fe5a3556f6448d27c448e'\'', '\''gems/src/flag_gems/fused/minicpm/int4_kv.py'\'': '\''293e4bc126a214b37aa9d2aea01a82a1842244f869f4a15b3a978b8eeffee6fc'\'', '\''plugin/vllm_fl/dispatch/backends/vendor/iluvatar/attention.py'\'': '\''bfdbbc5ebdb60b731cc841dcb805ee1415c0dac0c2785d323fb67cbefa461b8a'\'', '\''plugin/vllm_fl/dispatch/backends/vendor/iluvatar/engine_runtime.py'\'': '\''429e916003fc238f9c37c7dbba793f1e7ad029812bb96275ce00108c0eace777'\'', '\''plugin/vllm_fl/worker/worker.py'\'': '\''3b9a36bda38532348a2ad0a345deaac7976e09c34ab5ac1c74d8dbd608bf7348'\''}
          service=Path('\''/root/e256/service'\'')
          assert not service.exists(), '\''Refusing to overwrite an existing service bundle'\''
          files=json.loads(gzip.decompress(base64.b64decode(payload)))
          service.mkdir()
          for name,encoded in files.items():
              path=service/name
              assert path.parent==service
              path.write_bytes(base64.b64decode(encoded))
          manifest=service/'\''bundle_sha256.json'\''
          assert hashlib.sha256(manifest.read_bytes()).hexdigest()=='\''653eaed919b06e58048028a3511a68918a226ef33e39771516c2fc5b73aab3e9'\''
          for name,want in json.loads(manifest.read_text())['\''files'\''].items():
              assert hashlib.sha256((service/name).read_bytes()).hexdigest()==want, name
          candidate=Path('\''/root/e256/candidate-runtime-a1'\'')
          rp=candidate/'\''source_manifest.json'\''
          r=json.loads(rp.read_text())
          assert r['\''changed_or_new'\'']==expected_changes
          assert r['\''bundle_manifest_sha256'\'']=='\''d46f5b4bc63d5db55bfbd3ceeded7b1aa7dec4bbf46de6eabc1147b1550272dd'\''
          assert r['\''pinned_baseline_files'\'']==232 and r['\''runtime_mlp_mode'\'']=='\''production'\''
          assert r['\''baseline'\'']=='\''/root/e256/baseline-official'\''
          receipt_sha=hashlib.sha256(rp.read_bytes()).hexdigest()
          sys.path.insert(0,str(service))
          from service_contract import verify_candidate
          verify_candidate(candidate,receipt_sha)
          print('\''E256_SERVICE_LAUNCH'\'',json.dumps({'\''receipt_sha256'\'':receipt_sha,'\''candidate_files'\'':len(r['\''files'\'']),'\''service_manifest_sha256'\'':hashlib.sha256(manifest.read_bytes()).hexdigest(),'\''runtime_mlp_mode'\'':r['\''runtime_mlp_mode'\'']}),flush=True)
          used=subprocess.check_output(['\''ixsmi'\'','\''--query-gpu=memory.used'\'','\''--format=csv,noheader'\''],text=True,timeout=5)
          assert int(used.split()[0])<256, used
          out=Path('\''/root/e256/lifecycle-a1'\'')
          assert not out.exists()
          with open(str(out)+'\''.outer.log'\'','\''xb'\'',buffering=0) as log:
              child=subprocess.Popen([sys.executable,str(service/'\''guard_service.py'\''),'\''--candidate'\'',str(candidate),'\''--receipt-sha256'\'',receipt_sha,'\''--out'\'',str(out),'\''--run-service'\''],cwd=service,stdin=subprocess.DEVNULL,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
          print('\''E256_SERVICE_GUARD_PID'\'',child.pid,flush=True)
          end=time.monotonic()+35
          while time.monotonic()<end and child.poll() is None:
              time.sleep(1)
          for p in [Path(str(out)+'\''.guard.json'\''),out/'\''result.json'\'',out/'\''observer_error.json'\'',out/'\''startup_observer_error.json'\'']:
              if p.exists():
                  print('\''FILE'\'',str(p),flush=True)
                  if p.name=='\''result.json'\'':
                      d=json.loads(p.read_text()); print(json.dumps({k:d.get(k) for k in ['\''complete'\'','\''decision'\'','\''error'\'','\''timings'\'','\''service_pid'\'','\''runtime_mlp_mode'\'']}),flush=True)
                  else: print(p.read_text(),flush=True)
          for p in [Path(str(out)+'\''.driver.log'\''),out/'\''serve.log'\'']:
              if p.exists(): print('\''LOG_TAIL'\'',str(p),'\''\n'\'',p.read_text(errors='\''replace'\'')[-7000:],flush=True)
          print('\''E256_SERVICE_INITIAL_STATUS_COMPLETE'\'',flush=True)
          
          E256_REMOTE_SERVICE'
