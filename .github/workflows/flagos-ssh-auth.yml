name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Read-only latest FlagOS stack and experiment inventory
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'set -eu
          printf "FLAGOS_STACK_INVENTORY_V2_BEGIN\n"
          python3 - <<'\''PY'\''
          import pathlib, json, hashlib, importlib.util
          for base in ("/root/e214","/root/e241","/root/e242","/root/e243"):
              p=pathlib.Path(base)
              print("EXPERIMENT_FILES",base,flush=True)
              if p.is_dir():
                  for x in sorted(p.iterdir())[:60]:
                      if not x.name.startswith("."):
                          print(str(x),"<dir>" if x.is_dir() else x.stat().st_size,flush=True)
                          if x.is_dir() and any(t in x.name for t in ("attempt","candidate","result","artifact")):
                              print("CHILDREN",json.dumps([y.name for y in sorted(x.iterdir())[:50] if not y.name.startswith(".")]),flush=True)
          for base in ("/root/e241","/root/e242","/root/e243"):
              p=pathlib.Path(base)
              for name in ("CURRENT.md","report.md","contract.md","manifest.json"):
                  q=p/name
                  if q.is_file():
                      print("PROJECT_DOCUMENT_BEGIN",str(q),flush=True)
                      print(q.read_text()[:18000],flush=True)
                      print("PROJECT_DOCUMENT_END",flush=True)
          for base in ("/workspace/FlagGems","/workspace/vllm-plugin-FL","/workspace/MiniCPM5-2B"):
              p=pathlib.Path(base)
              print("WORKSPACE_TOP",base,json.dumps([x.name for x in sorted(p.iterdir()) if not x.name.startswith(".")][:50]),flush=True)
              for suffix in ("experiments/CURRENT.md","CURRENT.md"):
                  q=p/suffix
                  if q.is_file():
                      print("CURRENT_BEGIN",str(q),flush=True)
                      print(q.read_text()[:22000],flush=True)
                      print("CURRENT_END",flush=True)
          for name in ("_native_pair_mlp.py","_group_a8_mlp.py","w8a8.py","crosslayer.py"):
              for base in ("/usr/local/lib/python3.12/site-packages/flag_gems/fused/minicpm","/workspace/FlagGems/src/flag_gems/fused/minicpm"):
                  p=pathlib.Path(base)/name
                  if p.is_file(): print("SOURCE_SHA256",str(p),hashlib.sha256(p.read_bytes()).hexdigest(),flush=True)
          q=pathlib.Path("/workspace/MiniCPM5-2B/config.json")
          if q.is_file():
              d=json.loads(q.read_text())
              print("MODEL_DIMS",json.dumps({k:d.get(k) for k in ("architectures","hidden_size","intermediate_size","num_hidden_layers","num_attention_heads","num_key_value_heads","vocab_size","torch_dtype")}),flush=True)
          import torch,triton
          print("RUNTIME",torch.__version__,triton.__version__,flush=True)
          print("DEVICE_PROPERTIES",str(torch.cuda.get_device_properties(0)),flush=True)
          PY
          printf "FLAGOS_STACK_INVENTORY_V2_END\n"'
