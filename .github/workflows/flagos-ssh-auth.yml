name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Collect W4 full-chain result then test isolated cold QK8 recipient
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'set -eu
          printf "FLAGOS_E245_FULL_AND_E246_LAUNCH_BEGIN\n"
          python3 - <<'\''PY'\''
          from pathlib import Path
          import subprocess,json,hashlib,sys
          old=Path("/root/e245")
          for name in ("full_status.json","full-a1/result.json"):
              path=old/name
              if path.is_file():print("RESULT_JSON",json.dumps({"path":str(path),"data":json.loads(path.read_text())}),flush=True)
          path=old/"full.log"
          if path.is_file(): print("FULL_LOG_TAIL",json.dumps(path.read_text(errors="replace").splitlines()[-25:]),flush=True)
          status=json.loads((old/"full_status.json").read_text())
          assert status["state"]=="completed","Previous GPU probe still running"
          mem=subprocess.check_output(["/usr/local/corex/bin/ixsmi","--query-gpu=memory.used","--format=csv,noheader"],text=True).strip()
          assert int(mem.split()[0])<256,"GPU occupied"
          root=Path("/root/e246");root.mkdir(exist_ok=False)
          files={"qk8_codegen.py":"\"\"\"Isolated E214 recipient cold-QK8 / original-f16-PV experiment.\n\nPure Python: no torch/Triton import and no production mutation.  We load only\nthe frozen pure assembly generators, transform the cold score operands, then\nreuse the original hot loop and full CTA merge/inverse.  This is one query,\nnot the stopped multi-position/speculation mechanism.\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport ast\nimport hashlib\nimport json\nfrom pathlib import Path\nimport re\nimport struct\n\n\nPINS = {\n    \"_window_native.py\": \"3d86bda211843018eff14407220f9f3e7d517812a745d790ad6ac0926cac45f4\",\n    \"_kv_pipeline.py\": \"6bd7ffbf7c2923b68d6daa3cd3c8e25d53d8610388468d713bfec0d469a595ef\",\n    \"_cta_native_merge.py\": \"5a8122292568844e99dec0a245699af8ffb5e8e7ad46dc597eb90dfc3bb0e31f\",\n}\n\n\ndef f32(x):\n    return \"0x%08x\" % struct.unpack(\"<I\", struct.pack(\"<f\", x))[0]\n\n\ndef one(text, old, new):\n    assert text.count(old) == 1, (\"expected unique source pattern\", old, text.count(old))\n    return text.replace(old, new, 1)\n\n\ndef _source_functions(path, wanted, namespace, first_only=()):\n    tree = ast.parse(path.read_text())\n    body = []\n    seen = set()\n    for node in tree.body:\n        if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in wanted:\n            if node.name in first_only and node.name in seen:\n                continue\n            seen.add(node.name)\n            assert not node.decorator_list, node.name\n            body.append(node)\n    assert seen == set(wanted), (path, set(wanted) - seen)\n    exec(compile(ast.Module(body=body, type_ignores=[]), str(path), \"exec\"), namespace)\n\n\ndef load_namespace(source_dir):\n    source_dir = Path(source_dir)\n    hashes = {name: hashlib.sha256((source_dir / name).read_bytes()).hexdigest() for name in PINS}\n    assert hashes == PINS, {name: (PINS[name], hashes[name]) for name in PINS if PINS[name] != hashes[name]}\n    ns = {\"re\": re,\n          \"CURRENT\": set(range(56, 60)) | set(range(64, 72)) | set(range(80, 88)),\n          \"LOOKAHEAD\": set(range(60, 64)) | set(range(72, 80)) | set(range(88, 96))}\n    _source_functions(source_dir / \"_kv_pipeline.py\", {\"_registers\", \"_rename\", \"pipeline\"}, ns)\n    _source_functions(source_dir / \"_window_native.py\",\n                      {\"_window_asm\", \"_cold_remapped\", \"_cold_remapped_v2\", \"_fused_asm\", \"_tagged_asm\", \"_register_asm\"},\n                      ns, first_only={\"_cold_remapped\"})\n    _source_functions(source_dir / \"_cta_native_merge.py\", {\"_post\"}, ns)\n    ns[\"_original_v4\"] = ns[\"_cold_remapped\"]\n    ns[\"_original_v2\"] = ns[\"_cold_remapped_v2\"]\n    return ns, hashes\n\n\ndef _query_prologue():\n    \"\"\"E049 mq3 mapping, recycled E214 float-Q registers (no new VGPR peak).\n\n    Q8:119..126; qk*scale:127; K lane offset:128; saved Q byte offset:129;\n    saved Q pointer:130..131. s0/s1 hold K byte-permute selectors, unused by\n    original pipeline/hot/merge. Quantization scratch0..43 is dead initially.\n    \"\"\"\n    a = []; e = a.append\n    e(\"ml_mov_b32 v130, s40\"); e(\"ml_mov_b32 v131, s41\")\n    e(\"ml_mov_b32 v129, v112\")\n    e(\"ml_shl_b32 v109, v136, 0x5\"); e(\"ml_add_i32 v109, v129, v109\")\n    for g in range(2):\n        for bb in range(4):\n            for p2 in range(2):\n                k = 8*g + 2*bb + p2\n                e(f\"ml_lsa_load_dword v{16+k}, s[40:43], unsigned v109, noreg, #{128*g+8*bb+4*p2}, ca\")\n    e(\"sl_wait vmcnt(0)\")\n    # In ascending k, both outputs precede any still unread packed source.\n    for k in range(16):\n        e(f\"ml_shl_b32 v{2*k}, v{16+k}, 0x10\")\n        e(f\"ml_and_b32 v{2*k+1}, v{16+k}, 0xffff0000\")\n    e(\"ml_mov_b32 v40, 0x1e3ce508\")\n    for r in range(32):\n        e(f\"ml_and_b32 v41, v{r}, 0x7fffffff\")\n        e(\"ml_max_f32 v40, v40, v41\")\n    for x in (117, 118):\n        e(f\"ml_slb_shuffle_rtn_b32 v41, v40, v{x}\")\n        e(\"sl_wait lmcnt(0)\"); e(\"ml_max_f32 v40, v40, v41\")\n    # Existing s30=qk_scale*2**24 is preserved for the original hot transition.\n    e(f\"ml_mul_f32 v127, v40, {f32(2**-24 / 127)}\")\n    e(\"ml_mul_f32 v127, s30, v127\")\n    e(\"ml_rcp_f32 v41, v40\"); e(\"ml_mul_f32 v41, v41, 0x42fe0000\")\n    e(\"ml_mov_b32 v42, 0x4b400000\")\n    for r in range(32):\n        e(f\"ml_fma_f32 v{r}, v{r}, v41, v42\")\n    # Prologue-only s6/s7 are overwritten by production V4 prefetch afterwards.\n    e(\"sl_mov_b32 s6, 0x400\"); e(\"sl_mov_b32 s7, 0x5040100\")\n    for j in range(4):\n        g, p2 = j >> 1, j & 1\n        for rr in range(2):\n            src = [2*(8*g+2*bb+p2)+rr for bb in range(4)]\n            e(f\"ml_byte_permute_b32 v109, v{src[0]}, v{src[1]}, s6\")\n            e(f\"ml_byte_permute_b32 v110, v{src[2]}, v{src[3]}, s6\")\n            e(f\"ml_byte_permute_b32 v{119+2*j+rr}, v109, v110, s7\")\n    e(\"ml_mov_b32 v96, 0x1010101\"); e(\"ml_mov_b32 v97, 0x1010101\")\n    for g in range(2):\n        d = 36 + 4*g\n        for r in range(d, d+4): e(f\"ml_mov_b32 v{r}, 0x0\")\n        for jj in range(2):\n            q = 119 + 4*g + 2*jj\n            e(f\"ml_matrix_mad_i32_i8_m16n16k32 v[{d}:{d+3}], v[96:97], v[{q}:{q+1}], v[{d}:{d+3}]\")\n        e(f\"ml_cvt_f32_i32 v{107+g}, v{d}\")\n        e(f\"ml_xor_b32 v{107+g}, v{107+g}, 0x80000000\")\n    e(\"ml_and_b32 v109, v135, 0xf\"); e(\"ml_shl_b32 v109, v109, 0x2\")\n    e(\"ml_shl_b32 v128, v136, 0x7\"); e(\"ml_add_i32 v128, v128, v109\")\n    e(\"sl_mov_b32 s0, 0x6040200\"); e(\"sl_mov_b32 s1, 0x7050301\")\n    return \";\\n\".join(a) + \";\\n\"\n\n\ndef _score_for_head(h):\n    a=[]; e=a.append\n    for g in range(2):\n        d = 36 + 8*h + 4*g\n        src = 64 + 4*h + 2*g\n        for jj in range(2):\n            q = 119 + 4*g + 2*jj\n            e(f\"ml_byte_permute_b32 v109, v{src}, v{src+1}, s{jj}\")\n            e(\"ml_and_b32 v96, v109, 0xf0f0f0f\")\n            e(\"ml_pk_srl_b8 v97, v109, 0x4040404\")\n            c=d if jj else 52\n            e(f\"ml_matrix_mad_i32_i8_m16n16k32 v[{d}:{d+3}], v[96:97], v[{q}:{q+1}], v[{c}:{c+3}]\")\n    return \";\\n\".join(a) + \";\\n\"\n\n\ndef transform_cold(code, v2):\n    start = code.index(\"ml_shl_b32 v109, v136, 0x4;\\n\")\n    finish = code.index(\"ml_mov_b32 v137, 0xff800000;\\n\", start)\n    original_q = code[start:finish]\n    code = code[:start] + _query_prologue() + code[finish:]\n    start = code.index(\"ml_mov_b32 v113, 0x10001;\\n\")\n    finish = code.index(\"ml_xor_b32 v108, v40, 0x80000000;\\n\", start) + len(\"ml_xor_b32 v108, v40, 0x80000000;\\n\")\n    original_sum = code[start:finish]\n    code = code[:start] + code[finish:]\n    # Preserve production descriptors and load/wait order; only byte offsets\n    # change to the device-validated native int8 A operand image.\n    for desc, expected in ((\"s[40:43]\", 0 if v2 else 1), (\"s[32:35]\", 2 if v2 else 0)):\n        for i in range(8):\n            old = f\"ml_lsa_load_dword v{64+i}, {desc}, unsigned v115, {'\''noreg'\'' if i<4 else '\''s47'\''}, #{256*(i%4)}, ca;\"\n            new = f\"ml_lsa_load_dword v{64+i}, {desc}, unsigned v128, {'\''noreg'\'' if i<4 else '\''s47'\''}, #{(0,64,512,576)[i%4]}, ca;\"\n            assert code.count(old) == expected, (old, code.count(old), expected)\n            code = code.replace(old, new)\n    # Each head has an adjacent block of QK arithmetic, with a V2 load wait\n    # immediately before it. Replace just those blocks and leave those waits.\n    for h in range(2):\n        start = code.index(f\"ml_byte_permute_b32 v109, v{64+4*h}, v{64+4*h}, s2;\\n\")\n        endline = f\"ml_matrix_mad_f32_f16_m16n16k16 v[{40+8*h}:{43+8*h}], v[96:97], v[133:134], v[{40+8*h}:{43+8*h}];\\n\"\n        finish = code.index(endline, start) + len(endline)\n        code = code[:start] + _score_for_head(h) + code[finish:]\n    # Head selection is unchanged. Convert only the selected integer scores.\n    mark = \"ml_bfe2_b32 v109, v56, 0x90;\\n\"\n    convert = \"\".join(f\"ml_cvt_f32_i32 v{r}, v{r};\\n\" for r in range(36,44))\n    code = one(code, mark, convert + mark)\n    for r in range(36,40):\n        code = one(code, f\"ml_mul_f32 v{r}, s30, v{r};\", f\"ml_mul_f32 v{r}, v127, v{r};\")\n    # Recreate the *original* BF16->FP16 Q fragments and float group sums for\n    # hot attention. Reloading is deliberate: avoids adding 8 persistent Q8\n    # registers and changing the established CTA occupancy.\n    restore = (\"ml_mov_v2s_b32 s40, v130, 0x0;\\n\"\n               \"ml_mov_v2s_b32 s41, v131, 0x0;\\n\"\n               \"ml_mov_b32 v112, v129;\\n\" + original_q + original_sum)\n    return code, restore\n\n\ndef build(source_dir, skip_empty=True):\n    ns, hashes = load_namespace(source_dir)\n    restore = {}\n    v4, restore[False] = transform_cold(ns[\"_original_v4\"](), False)\n    v2, restore[True] = transform_cold(ns[\"_original_v2\"](), True)\n    assert restore[False] == restore[True]\n    ns[\"_cold_remapped\"] = lambda slack=6.0: ns[\"pipeline\"](v4)\n    ns[\"_cold_remapped_v2\"] = lambda slack=6.0: v2\n    original_fused = ns[\"_fused_asm\"]\n    def fused(v2=False, token=False):\n        text = original_fused(v2, token)\n        marker = \"sl_mov_b64 s[16:17], s[48:49];\\n\"\n        return one(text, marker, restore[v2] + marker)\n    ns[\"_fused_asm\"] = fused\n    output = {}\n    for flag, name in ((False,\"v4\"),(True,\"v2\")):\n        text = ns[\"_register_asm\"](flag,tagged=True,token=True,split_meta=True,\n                                      shift_inputs=False,skip_empty=skip_empty) + ns[\"_post\"]()\n        assert max(ns[\"_registers\"](text)) == 143\n        assert \"ml_matrix_mad_i32_i8_m16n16k32\" in text\n        # No new global partial output and no new shared allocation is added.\n        control_ns, _ = load_namespace(source_dir)\n        control_ns[\"_cold_remapped\"] = lambda slack=6.0: control_ns[\"pipeline\"](control_ns[\"_original_v4\"](slack))\n        control = control_ns[\"_register_asm\"](flag,tagged=True,token=True,split_meta=True,\n                        shift_inputs=False,skip_empty=skip_empty)+control_ns[\"_post\"]()\n        def tail(x): return x[x.index('\''.Lk14_loop:;\\n'\''):]\n        assert tail(text) == tail(control), \"hot loop and CTA merge must be byte-identical\"\n        output[name] = text\n    stats = {name: {\"sha256\": hashlib.sha256(text.encode()).hexdigest(),\n                    \"instructions\": len([x for x in text.splitlines() if x and not x.startswith('\''.'\'')]),\n                    \"i8_mma_static\": text.count(\"ml_matrix_mad_i32_i8_m16n16k32\"),\n                    \"f16_mma_static\": text.count(\"ml_matrix_mad_f32_f16_m16n16k16\"),\n                    \"max_vector_register\": 143, \"lds_bytes_unchanged\": 32768,\n                    \"cold_score_mma_per_page\": 8, \"original_cold_score_mma_per_page\": 16,\n                    \"hot_and_merge_byte_identical\": True} for name,text in output.items()}\n    return output, {\"source_sha256\": hashes,\"variant\": stats,\n                    \"scope\": \"one-query cold Q8K4; f16 PV; original hot+merge; mathematical change\"}\n\n\ndef emit_module(source_dir, destination):\n    destination = Path(destination)\n    asm, metadata = build(source_dir)\n    # The JIT wrapper is retained verbatim: same 4-wave grid, work partition,\n    # 32KiB scratch, final output, tags, skip guard, and implicit operands.\n    tree = ast.parse((Path(source_dir) / \"_cta_native_merge.py\").read_text())\n    fn = next(x for x in tree.body if isinstance(x, ast.FunctionDef) and x.name == \"recipient\")\n    wrapper = ast.get_source_segment((Path(source_dir)/\"_cta_native_merge.py\").read_text(),fn)\n    header = (\"import triton\\nimport triton.language as tl\\n\"\n              \"import triton.experimental.tle.language.gpu as tleg\\n\"\n              \"from flag_gems.fused.minicpm.int4_kv import _lo32, _hi32, _wstart\\n\"\n              \"FUSED_CONS=tl.constexpr('\''={v143},={s57},'\''+'\'','\''.join(['\''r'\'']*29)+'\'',~{memory}'\'')\\n\")\n    # Generate both actual SKIP_EMPTY branches: guard-free does not silently\n    # masquerade as guard-enabled in an integration with other contexts.\n    full, _ = build(source_dir, skip_empty=False)\n    for label, value in ((\"SKIP_ASM\",asm[\"v4\"]),(\"SKIP2_ASM\",asm[\"v2\"]),\n                         (\"FUSED_ASM\",full[\"v4\"]),(\"FUSED2_ASM\",full[\"v2\"])):\n        header += f\"{label}=tl.constexpr({value!r})\\n\"\n    destination.parent.mkdir(parents=True, exist_ok=True)\n    destination.write_text(header+\"\\n@triton.jit\\n\"+wrapper+\"\\n\")\n    destination.with_suffix('\''.json'\'').write_text(json.dumps(metadata,indent=2)+\"\\n\")\n    for name,text in asm.items(): destination.with_name(destination.stem+'\''_'\''+name+'\''.asm'\'').write_text(text)\n    return metadata\n\n\nif __name__ == \"__main__\":\n    p=argparse.ArgumentParser()\n    p.add_argument('\''--source-dir'\'', required=True)\n    p.add_argument('\''--out'\'', required=True)\n    a=p.parse_args()\n    print(json.dumps(emit_module(a.source_dir,a.out),indent=2))\n","probe_qk8.py":"\"\"\"Card-only isolated full-recipient correctness and matched-chain timing.\n\nNo production patch. This owns its small synthetic native KV fixture. Random\ndata is an instruction/layout diagnostic, not a model quality result. Both\narms include cold, 128-token hot window, CTA reduction, H128, BF16 output.\n\"\"\"\nfrom __future__ import annotations\nimport argparse\nimport importlib.util\nimport json\nfrom pathlib import Path\nfrom statistics import median\nimport sys\n\nimport numpy as np\nimport torch\n\nfrom flag_gems.fused.minicpm import _cta_native_merge as C\nfrom qk8_codegen import emit_module, PINS\n\n\ndef emit(stage, **fields):\n    print(json.dumps(dict(stage=stage, **fields)), flush=True)\n\n\ndef load_variant(out):\n    source=Path(C.__file__).parent\n    path=out/'\''recipient_qk8.py'\''\n    metadata=emit_module(source,path)\n    spec=importlib.util.spec_from_file_location('\''e246_recipient_qk8'\'',path)\n    mod=importlib.util.module_from_spec(spec)\n    sys.modules[spec.name]=mod\n    spec.loader.exec_module(mod)\n    return mod.recipient, metadata\n\n\ndef fixture(batch,pages,v2,seed=246,query_scale=1.0,keep_cpu=True):\n    rng=np.random.default_rng(seed)\n    n=max(1,batch*pages)\n    raw=rng.integers(0,256,size=(n,4224),dtype=np.uint8)\n    meta=raw[:,4096:].reshape(n,2,16,4)\n    meta[...,:2]=rng.integers(48,64,size=meta[...,:2].shape,dtype=np.uint8)\n    meta[...,3]=np.uint8(52 if v2 else 44)\n    hot=rng.integers(0,256,size=(batch,8,8192),dtype=np.uint8)\n    hm=np.full((batch,8,64),0.01,np.float32)\n    q=torch.from_numpy(rng.normal(size=(batch,16,128)).astype(np.float32)*query_scale).to('\''cuda'\'',torch.bfloat16)\n    pg=torch.from_numpy(raw.copy()).cuda()\n    wp=torch.from_numpy(hot.copy().view(np.int32)).cuda().flatten()\n    wm=torch.from_numpy(hm.copy()).cuda().flatten()\n    tab=torch.arange(batch*pages,device='\''cuda'\'',dtype=torch.int32).reshape(batch,pages) if pages else torch.zeros((batch,1),device='\''cuda'\'',dtype=torch.int32)\n    count=torch.full((batch,),pages,device='\''cuda'\'',dtype=torch.int32)\n    seq=torch.full((batch,),16512,device='\''cuda'\'',dtype=torch.int32)\n    cu=torch.arange(batch+1,device='\''cuda'\'',dtype=torch.int32)\n    rows=torch.arange(batch,device='\''cuda'\'',dtype=torch.int32)\n    tags=torch.arange(16384,16512,device='\''cuda'\'',dtype=torch.int32).expand(batch,-1).contiguous()\n    sign=torch.from_numpy(rng.choice(np.array([-1.,1.],np.float32),size=128)).cuda()\n    output=torch.empty((batch,16,128),device='\''cuda'\'',dtype=torch.bfloat16)\n    args=(q,pg.flatten(),tab,tab,count,wp,wm,seq,cu,rows,tags.flatten(),output,sign,\n          128**-0.5*np.log2(np.e),q.stride(0),q.stride(1),tab.stride(0),tab.stride(0))\n    return dict(args=args,v2=v2,batch=batch,pages=pages,raw=raw if keep_cpu else None,\n                hot=hot if keep_cpu else None,hm=hm if keep_cpu else None)\n\n\ndef launch(kernel,f):\n    return kernel[(f['\''batch'\''],)](*f['\''args'\''],V2=f['\''v2'\''],SKIP_EMPTY=True,num_warps=4,num_stages=1)\n\n\ndef decoded(f):\n    \"\"\"Independent host decode of the serialized native page and ring images.\"\"\"\n    b,p=f['\''batch'\''],f['\''pages'\'']\n    raw=f['\''raw'\''][:b*p]\n    h=np.arange(2)[:,None,None];t=np.arange(16)[None,:,None];e=np.arange(32)[None,None,:]\n    ix=512*h+256*(e>>4)+128*(t>>3)+2*((e&15)+16*((t>>1)&3))+(t&1)\n    words=raw.view(np.uint16).reshape(b*p,2112)\n    kw=words[:,ix]\n    k=((kw[...,None]>>(4*np.arange(4)))&15).astype(np.float32).reshape(b*p,2,16,128)\n    meta=raw[:,4096:].reshape(b*p,2,16,4)\n    scales=((meta[...,:2].astype(np.uint16)<<7).view(np.float16)).astype(np.float32)\n    z=np.stack((meta[...,2]&15,meta[...,2]>>4),axis=-1).astype(np.float32)\n    k=(k-z.repeat(64,axis=-1))*scales.repeat(64,axis=-1)\n    c=e&15\n    kt=((t>>2)&1)|((t&1)<<1)|(((t>>1)&1)<<2)|(((t>>3)&1)<<3)\n    if f['\''v2'\'']:\n        vi=1024+256*h+128*(c>>3)+2*(kt+16*((c>>1)&3))+(c&1)\n        vw=words[:,vi]\n        vc=((vw[...,None]>>(8*(e>>4)[...,None]+2*np.arange(4)))&3).astype(np.float32)\n        v=vc.reshape(b*p,2,16,128)-1.5\n    else:\n        vi=1024+512*h+256*(e>>4)+128*(c>>3)+2*(kt+16*((c>>1)&3))+(c&1)\n        vw=words[:,vi]\n        v=((vw[...,None]>>(4*np.arange(4)))&15).astype(np.float32).reshape(b*p,2,16,128)-8.0\n    vs=((meta[...,3].astype(np.uint16)<<7).view(np.float16)).astype(np.float32)\n    v*=vs[...,None]\n    k=k.reshape(b,p,2,16,128).transpose(0,2,1,3,4).reshape(b,2,p*16,128)\n    v=v.reshape(b,p,2,16,128).transpose(0,2,1,3,4).reshape(b,2,p*16,128)\n    hw=f['\''hot'\''].reshape(b,8,2,16,2,128).astype(np.float32)-128\n    hk=hw[:,:,0].transpose(0,3,1,2,4).reshape(b,2,128,128)*0.01\n    hv=hw[:,:,1].transpose(0,3,1,2,4).reshape(b,2,128,128)*0.01\n    return k,v,hk,hv\n\n\ndef reference(f,q8):\n    k,v,hk,hv=decoded(f)\n    q=f['\''args'\''][0].float().cpu().numpy().reshape(f['\''batch'\''],2,8,128)\n    qhot=q.astype(np.float16).astype(np.float32)\n    if q8:\n        scale=np.maximum(np.max(np.abs(q),axis=-1,keepdims=True),np.float32(1e-20))/127\n        qc=np.rint(q/scale).clip(-127,127)*scale\n    else: qc=qhot\n    s=np.concatenate((np.einsum('\''bhqd,bhtd->bhqt'\'',qc,k),np.einsum('\''bhqd,bhtd->bhqt'\'',qhot,hk)),axis=-1)*np.float32(128**-0.5)\n    s-=s.max(axis=-1,keepdims=True)\n    prob=np.exp(s);prob/=prob.sum(axis=-1,keepdims=True)\n    out=np.einsum('\''bhqt,bhtd->bhqd'\'',prob,np.concatenate((v,hv),axis=2)).reshape(f['\''batch'\''],16,128)\n    # Exact real-valued reference; native PV and output-rounding are expected\n    # small departures, measured for both original and candidate arms.\n    for bit in range(7):\n        old=out.copy(); step=1<<bit\n        for j in range(128):\n            out[...,j]=old[...,j^step]-old[...,j] if j&step else old[...,j]+old[...,j^step]\n    out*=np.float32(128**-0.5)*f['\''args'\''][12].cpu().numpy()\n    return out\n\n\ndef error(actual,wanted):\n    delta=actual.astype(np.float64)-wanted.astype(np.float64)\n    return dict(rms=float(np.sqrt(np.mean(delta**2))),max_abs=float(np.max(np.abs(delta))),\n                relative_rms=float(np.sqrt(np.sum(delta**2)/max(np.sum(wanted.astype(np.float64)**2),1e-30))))\n\n\ndef correctness(candidate,out):\n    rows=[]\n    for v2 in (False,True):\n        for pages,qs in ((0,1.),(3,1.),(8,0.),(8,4.)):\n            f=fixture(1,pages,v2,query_scale=qs)\n            row=dict(v2=v2,pages=pages,query_scale=qs)\n            values={}\n            for arm,kernel,q8 in (('\''control'\'',C.recipient,False),('\''candidate'\'',candidate,True)):\n                compiled=launch(kernel,f)\n                actual=f['\''args'\''][11].float().cpu().numpy()\n                wanted=reference(f,q8)\n                values[arm]=actual\n                row[arm]=dict(error=error(actual,wanted),registers=compiled.n_regs,spills=compiled.n_spills,lds=compiled.metadata.shared)\n                (out/f\"{arm}_{'\''v2'\'' if v2 else '\''v4'\''}.device.asm\").write_text(compiled.asm['\''asm'\''])\n                assert np.isfinite(actual).all(),row\n                # Broad layout/instruction correctness gate, not model quality.\n                assert row[arm]['\''error'\'']['\''relative_rms'\''] < 0.015,row\n                assert compiled.n_spills==0,row\n            row['\''candidate_vs_original'\'']=error(values['\''candidate'\''],values['\''control'\''])\n            if pages==0 or qs==0:\n                assert np.array_equal(values['\''candidate'\''],values['\''control'\'']),row\n            rows.append(row);emit('\''correctness'\'',**row)\n    return rows\n\n\ndef timed_chain(candidate,repeats,layers):\n    fixtures=[fixture(64,101,i%34<22,seed=246+i,keep_cpu=False) for i in range(layers)]\n    for kernel in (C.recipient,candidate):\n        for f in fixtures:launch(kernel,f)\n    graphs={}\n    for arm,kernel in (('\''control'\'',C.recipient),('\''candidate'\'',candidate)):\n        graph=torch.cuda.CUDAGraph()\n        with torch.cuda.graph(graph):\n            for f in fixtures:launch(kernel,f)\n        graphs[arm]=graph\n    start,end=(torch.cuda.Event(enable_timing=True)for _ in range(2))\n    raw={k:[]for k in graphs}\n    for group in range(8):\n        for arm in (('\''control'\'','\''candidate'\'')if group%2==0 else('\''candidate'\'','\''control'\'')):\n            for _ in range(4):graphs[arm].replay()\n            start.record()\n            for _ in range(repeats):graphs[arm].replay()\n            end.record();end.synchronize()\n            raw[arm].append(start.elapsed_time(end)/repeats)\n    save=[a-b for a,b in zip(raw['\''control'\''],raw['\''candidate'\''])]\n    result=dict(scope='\''full recipient cold+hot+merge chain, distinct synthetic KV per layer; not whole model'\'',\n                batch=64,layers=layers,pages_per_row=101,v2_layers=sum(f['\''v2'\'']for f in fixtures),\n                cold_read_bytes=sum(64*101*(3200 if f['\''v2'\'']else 4224) for f in fixtures),\n                raw_ms=raw,paired_saved_ms=save,paired_median_saved_ms=median(save),\n                relative_gain=median(save)/median(raw['\''control'\'']))\n    result['\''performance_gate_pass'\'']=(layers==34 and median(save)>=0.20 and result['\''relative_gain'\'']>=0.08)\n    return result\n\n\ndef main():\n    p=argparse.ArgumentParser();p.add_argument('\''--out'\'',required=True)\n    p.add_argument('\''--chain'\'',action='\''store_true'\'');p.add_argument('\''--layers'\'',type=int,default=34)\n    p.add_argument('\''--repeats'\'',type=int,default=20);a=p.parse_args()\n    out=Path(a.out);out.mkdir(parents=True,exist_ok=False)\n    torch.set_num_threads(4);torch.manual_seed(246)\n    candidate,metadata=load_variant(out);emit('\''source'\'',**metadata)\n    result=dict(source=metadata,correctness=correctness(candidate,out))\n    if a.chain:\n        result['\''chain'\'']=timed_chain(candidate,a.repeats,a.layers);emit('\''chain'\'',**result['\''chain'\''])\n    (out/'\''result.json'\'').write_text(json.dumps(result,indent=2)+'\''\\n'\'')\n    emit('\''done'\'',output=str(out/'\''result.json'\''))\n\n\nif __name__=='\''__main__'\'':main()\n","run_tiny_owned.py":"import json,os,signal,subprocess,sys,time\nfrom pathlib import Path\nroot=Path(__file__).resolve().parent\nstatus=root/\"tiny_status.json\"\ncmd=[sys.executable,str(root/\"probe_qk8.py\"),\"--out\",str(root/\"tiny-a1\")]\nenv=os.environ.copy();env[\"PYTHONPATH\"]=\"/root/e214/candidate-a1/gems/src\";env[\"OMP_NUM_THREADS\"]=\"4\";env[\"OPENBLAS_NUM_THREADS\"]=\"4\"\nwith (root/\"tiny.log\").open(\"w\") as log:\n    proc=subprocess.Popen(cmd,cwd=root,env=env,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\n    data={\"state\":\"running\",\"pid\":proc.pid,\"start_unix\":time.time(),\"task\":\"cold_QK8_original_PV_full_rec