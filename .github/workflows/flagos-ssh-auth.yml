name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Read bounded E253 CPU encoder status
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''PY'\''
          from pathlib import Path
          import json,subprocess,hashlib,gzip,base64
          root=Path('\''/root/e253/quality'\'')
          for name in ('\''encode_guard-a1.json'\'','\''encoded-block128-a1/manifest.json'\''):
           p=root/name
           if p.exists():
            d=json.loads(p.read_text())
            summary={k:d[k] for k in ('\''status'\'','\''complete'\'','\''elapsed_host_s'\'','\''returncode'\'','\''failure'\'','\''reason'\'','\''active_matrix'\'','\''last_budget_projection'\'','\''self_test'\'','\''attempts'\'','\''all_8_existing_32row_sentinels_bitwise'\'') if k in d}
            if '\''files'\'' in d:summary.update(matrices=len(d['\''files'\'']),last_matrices=[{k:x[k] for k in ('\''layer'\'','\''role'\'','\''wall_matrix_s'\'','\''timings'\'','\''sentinel_equivalence'\'') if k in x} for x in d['\''files'\''][-2:]])
            print('\''STATE '\''+name+'\'' '\''+json.dumps(summary))
           if p.exists() and d.get('\''status'\'') in ('\''COMPLETE'\'','\''FAILED'\'','\''PAUSED_BUDGET'\'','\''TIMEOUT'\''):
            b=p.read_bytes(); print('\''FILE_INFO '\''+json.dumps({'\''path'\'':name,'\''sha256'\'':hashlib.sha256(b).hexdigest(),'\''bytes'\'':len(b)}))
            print('\''FILE_GZIP_B64 '\''+name+'\'' '\''+base64.b64encode(gzip.compress(b,mtime=0)).decode())
          log=root/'\''encode-a1.log'\''
          if log.exists():
           print('\''LOG_TAIL_BEGIN'\'')
           print('\''\n'\''.join(log.read_text(errors='\''replace'\'').splitlines()[-8:]))
          print('\''GPU_MEMORY '\''+subprocess.check_output(['\''/usr/local/corex/bin/ixsmi'\'','\''--query-gpu=memory.used'\'','\''--format=csv,noheader'\''],text=True).strip())
          PY'
