name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Run bounded E214 topdown hardware diagnosis
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''E252_DEPLOY_PY'\''
          from pathlib import Path
          import hashlib,json,subprocess,sys
          files=json.loads("{\"run_topdown.py\":\"\\\"\\\"\\\"One-process E252 baseline diagnosis. No candidate or service mutation.\\\"\\\"\\\"\\nfrom __future__ import annotations\\nimport argparse\\nfrom hashlib import sha256\\nimport json\\nfrom pathlib import Path\\nfrom statistics import median\\nimport subprocess\\nimport time\\nimport traceback\\n\\n\\nMETRICS = (\\n    '\''active_warps_per_active_cycle'\'', '\''eligible_warps_per_active_cycle'\'',\\n    '\''selected_warps_per_active_cycle'\'', '\''stalled_warps_per_active_cycle'\'',\\n    '\''issue_stall_reason_memory_dependency'\'', '\''issue_stall_reason_synchronization'\'',\\n    '\''issue_stall_reason_execution_dependency'\'', '\''issue_stall_reason_pipeline_busy'\'',\\n    '\''issue_stall_reason_memory_throttle'\'', '\''issue_stall_reason_instruction_fetch'\'',\\n    '\''issue_stall_reason_other'\'', '\''multiprocessor_activity'\'', '\''ipc'\'',\\n    '\''shared_load_transactions_per_request'\'', '\''llc_mem_req'\'', '\''llc_hit_rate'\'',\\n)\\n\\n\\ndef main():\\n    ap = argparse.ArgumentParser()\\n    ap.add_argument('\''--gems-src'\'', type=Path, required=True)\\n    ap.add_argument('\''--checkpoint-dir'\'', type=Path, required=True)\\n    ap.add_argument('\''--out'\'', type=Path, required=True)\\n    ap.add_argument('\''--target-ms'\'', type=float, default=12.0)\\n    args = ap.parse_args()\\n    assert not args.out.exists(), args.out\\n    used = subprocess.check_output(['\''/usr/local/corex/bin/ixsmi'\'',\\n        '\''--query-gpu=memory.used'\'', '\''--format=csv,noheader'\''], text=True).strip()\\n    assert int(used.split()[0]) < 256, ('\''GPU not idle'\'', used)\\n    args.out.mkdir(parents=True)\\n    root = Path(__file__).resolve().parent\\n    result = dict(experiment='\''E252'\'', status='\''building'\'', gpu_memory_before=used,\\n        source_sha256={p.name: sha256(p.read_bytes()).hexdigest()\\n            for p in sorted(root.glob('\''*.py'\''))},\\n        scope='\''Representative frozen production graph ranges; no algorithm or service change'\'',\\n        official_performance_result=False, official_quality_result=False, cases=[], errors=[])\\n    start_host = time.perf_counter()\\n\\n    def save():\\n        result['\''elapsed_host_s'\''] = time.perf_counter() - start_host\\n        tmp = args.out / '\''result.json.tmp'\''\\n        tmp.write_text(json.dumps(result, indent=2) + '\''\\\\n'\'')\\n        tmp.replace(args.out / '\''result.json'\'')\\n\\n    def emit(stage, **data):\\n        print(json.dumps(dict(stage=stage, **data)), flush=True)\\n\\n    save()\\n    import torch\\n    from cupti_sampler import MetricSampler, COREX_CONSTANTS\\n    from mlp_fixture import build_cases as build_mlp\\n    from attention_fixture import build_cases as build_attention\\n    torch.set_num_threads(4)\\n    torch.manual_seed(252)\\n    bundles = []\\n    try:\\n        for name, build in (('\''mlp'\'', build_mlp), ('\''attention'\'', build_attention)):\\n            t = time.perf_counter()\\n            bundle = build(args.gems_src, args.checkpoint_dir)\\n            bundles.append(bundle)\\n            emit('\''fixture_ready'\'', name=name, cases=[c['\''name'\''] for c in bundle['\''cases'\'']],\\n                preparation_s=time.perf_counter()-t)\\n        cases = [c for bundle in bundles for c in bundle['\''cases'\'']]\\n        sampler = MetricSampler(COREX_CONSTANTS, torch)\\n        try:\\n            result['\''read_semantics'\''] = sampler.verify_read_semantics(cases[0]['\''replay'\''], repeats=2)\\n            result['\''warp_read_semantics'\''] = sampler.verify_read_semantics(\\n                cases[0]['\''replay'\''], repeats=2, metric_name='\''warps_launched'\'')\\n        except Exception as error:\\n            result['\''graph_counter_semantics_failure'\''] = repr(error)\\n            try:\\n                result['\''eager_diagnostic_only'\''] = sampler.verify_read_semantics(\\n                    cases[0]['\''eager_replay'\''], repeats=2)\\n            except Exception as eager_error:\\n                result['\''eager_diagnostic_failure'\''] = repr(eager_error)\\n            result['\''status'\''] = '\''STOP_COUNTER_SEMANTICS_REQUIRES_REVIEW'\''\\n            save(); emit('\''done'\'', status=result['\''status'\'']); return\\n        emit('\''read_semantics'\'', mode=result['\''read_semantics'\'']['\''read_mode'\''])\\n        result['\''status'\''] = '\''validating_counter_units'\''\\n        save()\\n        count_ok = True\\n        for case in cases:\\n            row = dict(name=case['\''name'\''], metadata=case['\''metadata'\''], checks=case['\''checks'\''],\\n                count_checks={}, metrics={})\\n            result['\''cases'\''].append(row)\\n            for metric, expected_key in (\\n                ('\''matrix_inst'\'', '\''expected_warp_matrix_instructions_per_graph'\''),\\n                ('\''warps_launched'\'', '\''expected_warps_launched_per_graph'\'')):\\n                data = sampler.sample_metric(metric, case['\''replay'\''], repeats=2)\\n                expected = case['\''metadata'\'']['\''expected_counts'\''][expected_key] * 2\\n                observed = data['\''evaluation'\''].get('\''value'\'')\\n                row['\''count_checks'\''][metric] = dict(expected=expected, observed=observed,\\n                    exact=observed == expected, sample=data)\\n                count_ok = count_ok and observed == expected\\n            emit('\''counter_units'\'', name=case['\''name'\''], checks={k:{a:b for a,b in v.items()\\n                if a!='\''sample'\''} for k,v in row['\''count_checks'\''].items()})\\n            save()\\n        result['\''all_instruction_and_warp_counts_exact'\''] = count_ok\\n        if not count_ok:\\n            result['\''status'\''] = '\''STOP_COUNTER_UNIT_REQUIRES_REVIEW'\''\\n            save(); return\\n        result['\''status'\''] = '\''sampling'\''\\n        save()\\n        for case, row in zip(cases, result['\''cases'\''], strict=True):\\n            timings = [sampler._run(case['\''replay'\''], 20) / 20 for _ in range(3)]\\n            per_graph_ms = median(timings)\\n            repeats = max(4, min(512, round(args.target_ms / per_graph_ms)))\\n            row['\''unprofiled_ms_per_graph'\''] = timings\\n            row['\''repeats_per_metric'\''] = repeats\\n            for metric in METRICS:\\n                try:\\n                    data = sampler.sample_metric(metric, case['\''replay'\''], repeats=repeats)\\n                    row['\''metrics'\''][metric] = data\\n                    value = data['\''evaluation'\''].get('\''value'\'')\\n                    emit('\''metric'\'', case=case['\''name'\''], metric=metric, value=value,\\n                        baseline_us_per_call=per_graph_ms*1000/case['\''metadata'\'']['\''calls_per_graph'\''])\\n                except Exception as error:\\n                    diagnostic = dict(case=case['\''name'\''], metric=metric,\\n                        error=type(error).__name__ + '\'': '\'' + str(error))\\n                    result['\''errors'\''].append(diagnostic)\\n                    emit('\''metric_error'\'', **diagnostic)\\n                save()\\n            row['\''unprofiled_after_ms_per_graph'\''] = [\\n                sampler._run(case['\''replay'\''], 20) / 20 for _ in range(3)]\\n            save()\\n        result['\''status'\''] = '\''COMPLETE'\'' if not result['\''errors'\''] else '\''COMPLETE_WITH_EXPLICIT_METRIC_ERRORS'\''\\n        result['\''interpretation_limits'\''] = [\\n            '\''These are short graph range counters, not per-instruction stall-site attribution.'\'',\\n            '\''Continuous counters include their host/API boundaries. total_cycles-derived ratios can be diluted.'\'',\\n            '\''Synthetic activations/KV do not reproduce real-text lazy-softmax branch frequencies.'\'',\\n            '\''Do not add independently measured stage durations or convert stall percentages directly to removable time.'\'',\\n            '\''No service throughput or model-quality gain is claimed by this diagnostic.'\'',\\n        ]\\n        save()\\n        emit('\''done'\'', status=result['\''status'\''], elapsed_host_s=result['\''elapsed_host_s'\''])\\n    except BaseException as error:\\n        result['\''status'\''] = '\''FAILED'\''\\n        result['\''failure'\''] = dict(type=type(error).__name__, message=str(error), traceback=traceback.format_exc())\\n        save()\\n        raise\\n\\n\\nif __name__ == '\''__main__'\'':\\n    main()\\n\",\"mlp_fixture.py\":\"\\\"\\\"\\\"Frozen E214 four-layer baseline graphs for in-process counter collection.\\n\\nNo candidate, service, remote access, timing, or counter collection lives here.\\nbuild_cases() prepares real weights once and returns graphs plus all owners.\\nAll tensor copies/checks occur before the caller'\''s profiling ranges.\\n\\\"\\\"\\\"\\nfrom hashlib import sha256\\nimport json\\nfrom pathlib import Path\\nimport sys\\n\\n\\nPINS = {\\n    \\\"_native_pair_mlp.py\\\": \\\"f328af93a666468c0460caa2b285a1e6b580fe25b81c28756f9bd06af5632aa8\\\",\\n    \\\"_group_a8_mlp.py\\\": \\\"0e6f3d01553dc828f314d1cee23562a6dabe4aa6a6da2fa3751e241eb2da82ce\\\",\\n    \\\"_h128_basis.py\\\": \\\"1acc1785bbbd5863d8d5fd3fe7bb2390f95af2fe67af99896eb7a57c267cb36f\\\",\\n    \\\"w8a8.py\\\": \\\"06b113a81633f4c8436627cef857ff533abcd5153588a2471197cfb49014863e\\\",\\n    \\\"fused_layers.py\\\": \\\"095f4437b6d1a47acddcdc12244f09de76f1fc24e4827d489508dd1182884e02\\\",\\n}\\n\\n\\ndef build_cases(gems_src, checkpoint_dir, *, layers=(0, 13, 27, 41), seed=252081):\\n    \\\"\\\"\\\"Return cases with graph replay, eager fallback, metadata and checks.\\n\\n    The three graphs share the same four distinct real weight sets and fixed\\n    synthetic BF16 inputs. They do not form a sequential 42-layer model.\\n    GU-only receives valid q/qs from the actual preceding norm before capture.\\n    \\\"\\\"\\\"\\n    gems_src, checkpoint_dir = Path(gems_src).resolve(), Path(checkpoint_dir).resolve()\\n    assert tuple(layers) == (0, 13, 27, 41), \\\"This fixture fixes the four-layer cold-weight cycle\\\"\\n    base = gems_src / \\\"flag_gems/fused/minicpm\\\"\\n    for name, wanted in PINS.items():\\n        assert sha256((base / name).read_bytes()).hexdigest() == wanted, name\\n    sys.path.insert(0, str(gems_src))\\n    import torch\\n    from safetensors import safe_open\\n    from flag_gems.fused.minicpm import _native_pair_mlp as GU, _group_a8_mlp as G\\n    from flag_gems.fused.minicpm import _h128_basis as H, fused_layers as F, w8a8 as W\\n    for module in (GU, G, H, F, W):\\n        assert Path(module.__file__).resolve().parent == base, module.__file__\\n\\n    index = checkpoint_dir / \\\"model.safetensors.index.json\\\"\\n    if index.exists():\\n        mapping = json.loads(index.read_text())[\\\"weight_map\\\"]\\n        def filename(name):\\n            return checkpoint_dir / mapping[name]\\n    else:\\n        files = list(checkpoint_dir.glob(\\\"*.safetensors\\\"))\\n        assert len(files) == 1, files\\n        def filename(name):\\n            return files[0]\\n\\n    def read(name):\\n        with safe_open(str(filename(name)), framework=\\\"pt\\\", device=\\\"cpu\\\") as handle:\\n            return handle.get_tensor(name).to(device=\\\"cuda\\\", dtype=torch.bfloat16)\\n\\n    eps = float(json.loads((checkpoint_dir / \\\"config.json\\\").read_text())[\\\"rms_norm_eps\\\"])\\n    rng = torch.Generator(device=\\\"cuda\\\").manual_seed(seed)\\n    data = []\\n    for layer in layers:\\n        prefix = f\\\"model.layers.{layer}.\\\"\\n        raw = torch.cat((read(prefix + \\\"mlp.gate_proj.weight\\\"), read(prefix + \\\"mlp.up_proj.weight\\\")))\\n        qgu, sgu = W.quantize_weight(raw, False)\\n        gu, sg = GU.prepare_weight(qgu, sgu)\\n        del raw, qgu, sgu\\n        wd, sd = H.quant_weight(read(prefix + \\\"mlp.down_proj.weight\\\"))\\n        assert tuple(gu.shape) == (12288, 2048) and tuple(wd.shape) == (2048, 6144)\\n        a = torch.randn((64, 2048), device=\\\"cuda\\\", dtype=torch.bfloat16, generator=rng)\\n        data.append(dict(layer=layer, a=a,\\n            b=torch.randn((64, 2048), device=\\\"cuda\\\", dtype=torch.bfloat16, generator=rng),\\n            nw=read(prefix + \\\"post_attention_layernorm.weight\\\"), gu=gu, sg=sg, wd=wd, sd=sd,\\n            q=torch.empty((64, 2048), device=\\\"cuda\\\", dtype=torch.int8),\\n            qs=torch.empty((64,), device=\\\"cuda\\\", dtype=torch.float32), res=torch.empty_like(a),\\n            codes=torch.empty((64, 6144), device=\\\"cuda\\\", dtype=torch.int8),\\n            scales=torch.empty((64, 48), device=\\\"cuda\\\", dtype=torch.float32),\\n            partial=torch.empty((2, 64, 2048), device=\\\"cuda\\\", dtype=torch.float32), y=torch.empty_like(a)))\\n\\n    compiled = {}\\n    def norm(d):\\n        compiled[\\\"norm\\\"] = F._nq_kernel[(64,)](d[\\\"a\\\"], d[\\\"b\\\"], d[\\\"res\\\"], d[\\\"nw\\\"], d[\\\"q\\\"], d[\\\"qs\\\"],\\n            64, eps, K=2048, num_warps=8)\\n\\n    def producer(d):\\n        compiled[\\\"gu\\\"] = GU.run(d[\\\"q\\\"], d[\\\"qs\\\"], d[\\\"gu\\\"], d[\\\"sg\\\"], d[\\\"codes\\\"], d[\\\"scales\\\"], direct_a=True)\\n\\n    def finish_mlp(d):\\n        compiled[\\\"down\\\"] = G._down[(32, 2)](d[\\\"codes\\\"], d[\\\"scales\\\"], d[\\\"wd\\\"], d[\\\"sd\\\"], d[\\\"partial\\\"],\\n            K=6144, N=2048, BM=64, BN=64, SPLIT=2, num_warps=8, num_stages=2)\\n        compiled[\\\"finish\\\"] = G._finish[(512,)](d[\\\"partial\\\"], d[\\\"sd\\\"], d[\\\"y\\\"],\\n            N=2048, M=64, SPLIT=2, BLOCK=256, num_warps=4)\\n\\n    # Initialize all buffers and compile every baseline kernel before capture.\\n    stock_checks = []\\n    for d in data:\\n        norm(d); producer(d); finish_mlp(d)\\n        stock, residual = G.norm_mlp(d[\\\"a\\\"], d[\\\"b\\\"], d[\\\"nw\\\"], eps, d[\\\"gu\\\"], d[\\\"sg\\\"], d[\\\"wd\\\"], d[\\\"sd\\\"])\\n        exact = bool(torch.equal(stock.view(torch.int16), d[\\\"y\\\"].view(torch.int16))\\n            and torch.equal(residual.view(torch.int16), d[\\\"res\\\"].view(torch.int16)))\\n        assert exact, (\\\"Explicit full chain differs from frozen norm_mlp\\\", d[\\\"layer\\\"])\\n        stock_checks.append(dict(layer=d[\\\"layer\\\"], stock_norm_mlp_bf16_and_residual_bitwise=exact))\\n        del stock, residual\\n    torch.cuda.synchronize()\\n\\n    def resources(kernel):\\n        asm = kernel.asm.get(\\\"asm\\\", \\\"\\\")\\n        return dict(regs=kernel.n_regs, spills=kernel.n_spills, shared_bytes=kernel.metadata.shared,\\n            sme_row_static=asm.count(\\\"sl_sme_load_16x1b64_row\\\"),\\n            sme_col_static=asm.count(\\\"sl_sme_load_16x1b64_col\\\"),\\n            mma_i8_static=asm.count(\\\"ml_matrix_mad_i32_i8\\\"), isa_sha256=sha256(asm.encode()).hexdigest())\\n\\n    observed = {name: resources(kernel) for name, kernel in compiled.items()}\\n    assert observed[\\\"gu\\\"][\\\"mma_i8_static\\\"] == 16 and observed[\\\"gu\\\"][\\\"shared_bytes\\\"] == 40960\\n    assert observed[\\\"down\\\"][\\\"mma_i8_static\\\"] == 8 and observed[\\\"down\\\"][\\\"shared_bytes\\\"] == 32768\\n    assert all(row[\\\"spills\\\"] == 0 for row in observed.values()), observed\\n\\n    def fingerprint(fields):\\n        rows = []\\n        for d in data:\\n            hashes = {}\\n            for key in fields:\\n                tensor = d[key]\\n                raw = tensor.detach().contiguous().view(torch.uint8).cpu().numpy().tobytes()\\n                hashes[key] = dict(sha256=sha256(raw).hexdigest(), shape=list(tensor.shape), dtype=str(tensor.dtype))\\n            rows.append(dict(layer=d[\\\"layer\\\"], outputs=hashes))\\n        return rows\\n\\n    per_layer_bytes = dict(gu_weight_int8=25165824, gu_weight_scales_fp32=49152,\\n        gu_unique_A8_input=131072, gu_unique_input_scales=256,\\n        gu_CTA_A8_SME_requests=6291456, gu_output_codes=393216, gu_output_scales=12288,\\n        norm_unique_BF16_inputs_and_gamma=528384, norm_outputs_residual_q_and_scale=393472,\\n        down_weight_int8=12582912, down_weight_scales_fp32=8192,\\n        down_unique_activation_codes_and_scales=405504, down_partial_write=1048576,\\n        finish_partial_read=1048576, finish_BF16_output=262144)\\n    cases, graphs = [], []\\n    specs = (\\n        (\\\"mlp_gu_only\\\", (\\\"gu\\\",), (\\\"codes\\\", \\\"scales\\\")),\\n        (\\\"mlp_norm_gu\\\", (\\\"norm\\\", \\\"gu\\\"), (\\\"q\\\", \\\"qs\\\", \\\"res\\\", \\\"codes\\\", \\\"scales\\\")),\\n        (\\\"mlp_full\\\", (\\\"norm\\\", \\\"gu\\\", \\\"down\\\", \\\"finish\\\"), (\\\"q\\\", \\\"qs\\\", \\\"res\\\", \\\"codes\\\", \\\"scales\\\", \\\"partial\\\", \\\"y\\\")),\\n    )\\n    for name, stages, fields in specs:\\n        def run(stages=stages):\\n            for d in data:\\n                if \\\"norm\\\" in stages: norm(d)\\n                producer(d)\\n                if \\\"down\\\" in stages: finish_mlp(d)\\n        run()\\n        torch.cuda.synchronize()\\n        reference = fingerprint(fields)\\n        graph = torch.cuda.CUDAGraph()\\n        with torch.cuda.graph(graph):\\n            run()\\n        graph.replay()\\n        torch.cuda.synchronize()\\n        replay1 = fingerprint(fields)\\n        graph.replay()\\n        torch.cuda.synchronize()\\n        replay2 = fingerprint(fields)\\n        assert reference == replay1 == replay2, (\\\"Eager/replay mismatch\\\", name)\\n        graphs.append(graph)\\n        has_norm, has_down = \\\"norm\\\" in stages, \\\"down\\\" in stages\\n        expected = dict(kernel_launches=4 * len(stages),\\n            gu_ctas=4 * 48, gu_warps_per_cta=8, gu_K64_iterations=32,\\n            gu_native_warp_matrix_instructions=4 * 48 * 8 * 32 * 16,\\n            integer_MMA_ops=4 * (3221225472 + (1610612736 if has_down else 0)),\\n            total_launched_ctas=4 * (48 + (64 if has_norm else 0) + (64 + 512 if has_down else 0)),\\n            total_launched_warps=4 * (48 * 8 + (64 * 8 if has_norm else 0) + (64 * 8 + 512 * 4 if has_down else 0)))\\n        if has_down:\\n            expected.update(down_ctas=4 * 64, down_warps_per_cta=8, down_K128_iterations_per_split=24,\\n                down_native_warp_matrix_instructions=4 * 64 * 8 * 24 * 8)\\n        expected.update(calls_per_graph=4,\\n            expected_kernel_launches_per_graph=expected[\\\"kernel_launches\\\"],\\n            expected_ctas_launched_per_graph=expected[\\\"total_launched_ctas\\\"],\\n            expected_warps_launched_per_graph=expected[\\\"total_launched_warps\\\"],\\n            expected_warp_matrix_instructions_per_graph=(expected[\\\"gu_native_warp_matrix_instructions\\\"]\\n                + expected.get(\\\"down_native_warp_matrix_instructions\\\", 0)),\\n            expected_integer_MMA_ops_per_graph=expected[\\\"integer_MMA_ops\\\"])\\n        metadata = dict(scope=\\\"FROZEN_E214_BASELINE_FOUR_DISTINCT_LAYERS_SYNTHETIC_INPUTS\\\",\\n            layer_ids=list(layers), stages=list(stages), source_pins=PINS,\\n            adapter_sha256=sha256(Path(__file__).read_bytes()).hexdigest(), seed=seed,\\n            expected_counts=expected, calls_per_graph=4, observed_compilation={key: observed[key] for key in stages},\\n            logical_bytes_per_layer=per_layer_bytes,\\n            unique_weight_bytes_used_per_replay=4 * (25165824 + 49152 + (12582912 + 8192 if has_down else 0)),\\n            accounting=\\\"Logical tensor/interface bytes, not measured HBM. CTA A8 requests are separately labeled; scale/read repetitions and cache effects require counters.\\\",\\n            counter_semantics=\\\"Native matrix counts above are source-level warp instructions; calibrate CUPTI event units before comparing.\\\",\\n            boundary=\\\"GU includes BF16 g/u rounding, SiLU, H128 and group128 A8. No online A packing. GU-only q/qs initialized by actual norm.\\\",\\n            limitations=\\\"Four independent inputs, not a sequential 42-layer model. No performance or residency claim from this factory.\\\")\\n        cases.append(dict(name=name, graph=graph, replay=graph.replay, eager_replay=run, metadata=metadata,\\n            checks=dict(eager_and_two_graph_replays_bitwise_fingerprint=True,\\n                fingerprints=replay2, stock_full_chain=stock_checks)))\\n    return dict(cases=cases, refs=[data, graphs, compiled])\\n\\n\\nbuild = build_cases\\n\",\"attention_fixture.py\":\"\\\"\\\"\\\"Frozen E214 recipient graphs for an external CoreX counter sampler.\\n\\nNo candidate, timing loop, counter API, source patch, or model loading lives here.\\nThe unified sampler calls build_cases(gems_src, checkpoint_dir), retains ``refs``,\\nand measures the four returned cases. Each graph contains exactly four calls\\nof the production recipient with four independent cold/hot memory regions.\\n\\nData is the already device-validated E246 synthetic fixture, now at the actual\\nE228 recipient page-count / V-bitwidth strata.  Its page IDs are contiguous and\\nits Q/K distribution is synthetic.  In particular this is not a real-text lazy\\nsoftmax profile, nor a proof that every load misses cache.\\n\\\"\\\"\\\"\\nfrom __future__ import annotations\\n\\nimport hashlib\\nimport importlib\\nfrom pathlib import Path\\nimport sys\\n\\n\\nSOURCE_PINS = {\\n    \\\"_window_native.py\\\": \\\"3d86bda211843018eff14407220f9f3e7d517812a745d790ad6ac0926cac45f4\\\",\\n    \\\"_kv_pipeline.py\\\": \\\"6bd7ffbf7c2923b68d6daa3cd3c8e25d53d8610388468d713bfec0d469a595ef\\\",\\n    \\\"_cta_native_merge.py\\\": \\\"5a8122292568844e99dec0a245699af8ffb5e8e7ad46dc597eb90dfc3bb0e31f\\\",\\n}\\nE246_FIXTURE_SHA = \\\"616ca856ba51823a6bac378a1fbca4c8b1e41b089cdb767e23b74b4b9bca4eed\\\"\\nBATCH = 64\\nPOOLS = 4\\nSTRATA = (\\n    (\\\"v2_p132\\\", True, 132, 9),\\n    (\\\"v2_p66\\\", True, 66, 13),\\n    (\\\"v4_p132\\\", False, 132, 9),\\n    (\\\"v4_p66\\\", False, 66, 3),\\n)\\n\\n\\ndef expected_counts(v2: bool, pages: int) -> dict:\\n    \\\"\\\"\\\"Logical work, independent of counter event unit/instance normalization.\\n\\n    Cold and hot each have 16 QK + 16 PV + 1 offset warp-MMA per page.\\n    The cold prologue has eight Q-sum MMA per warp, once before both loops.\\n    No MMA occurs in the lazy-max slow branch or the CTA merge/H128 tail.\\n    These are issued matrix operations, including unused GQA products; they\\n    are not a useful-model-FLOP efficiency metric.\\n    \\\"\\\"\\\"\\n    assert pages in (66, 132)\\n    matrix_one = BATCH * (33 * (pages + 8) + 8 * 4)\\n    cold_one = BATCH * pages * (3200 if v2 else 4224)\\n    hot_one = BATCH * 8 * 8448\\n    return {\\n        \\\"calls_per_graph\\\": POOLS,\\n        \\\"ctas_per_call\\\": BATCH,\\n        \\\"warps_per_cta\\\": 4,\\n        \\\"warp_size\\\": 64,\\n        \\\"expected_warps_launched_per_graph\\\": POOLS * BATCH * 4,\\n        \\\"expected_warp_matrix_instructions_per_call\\\": matrix_one,\\n        \\\"expected_warp_matrix_instructions_per_graph\\\": POOLS * matrix_one,\\n        \\\"issued_matrix_flops_per_call\\\": matrix_one * 8192,\\n        \\\"cold_page_visits_per_call\\\": BATCH * pages,\\n        \\\"hot_page_visits_per_call\\\": BATCH * 8,\\n        \\\"logical_cold_bytes_per_call\\\": cold_one,\\n        \\\"logical_hot_bytes_per_call\\\": hot_one,\\n        \\\"logical_cold_hot_bytes_per_graph\\\": POOLS * (cold_one + hot_one),\\n        \\\"counter_unit_note\\\": \\\"Verify raw counter units and domain instance normalization against these warp-level expectations; do not assume a lane factor.\\\",\\n    }\\n\\n\\ndef build_attention_fixture(e246_source_dir: str | Path = \\\"/root/e246\\\") -> dict:\\n    \\\"\\\"\\\"Build once; return graphs, serializable metadata, and tensor keepalive.\\n\\n    Imported at call time so CPU consumers can inspect expected_counts without\\n    Torch/Triton or a GPU.  All allocations, JIT, eager checks and graph parity\\n    happen before returning, outside the external sampler'\''s counter interval.\\n    No weights are loaded or reloaded across counter passes.\\n    \\\"\\\"\\\"\\n    import torch\\n    from flag_gems.fused.minicpm import _cta_native_merge as C\\n\\n    fixture_dir = Path(e246_source_dir).resolve()\\n    fixture_path = fixture_dir / \\\"probe_qk8.py\\\"\\n    actual_fixture_sha = hashlib.sha256(fixture_path.read_bytes()).hexdigest()\\n    assert actual_fixture_sha == E246_FIXTURE_SHA, (str(fixture_path), actual_fixture_sha)\\n    sys.path.insert(0, str(fixture_dir))\\n    fixture_module = importlib.import_module(\\\"probe_qk8\\\")\\n    assert Path(fixture_module.__file__).resolve() == fixture_path\\n    assert fixture_module.C.recipient is C.recipient\\n    source_dir = Path(C.__file__).parent\\n    actual_pins = {name: hashlib.sha256((source_dir / name).read_bytes()).hexdigest()\\n                   for name in SOURCE_PINS}\\n    assert actual_pins == SOURCE_PINS, actual_pins\\n\\n    graphs, keepalive, strata_metadata, cases = {}, {}, {}, []\\n    allocation_bytes = 0\\n    for index, (name, v2, pages, model_layers) in enumerate(STRATA):\\n        fixtures = [fixture_module.fixture(\\n            BATCH, pages, v2, seed=24600 + index * POOLS + pool, keep_cpu=False,\\n        ) for pool in range(POOLS)]\\n        cold_ptrs = [f[\\\"args\\\"][1].data_ptr() for f in fixtures]\\n        hot_ptrs = [f[\\\"args\\\"][5].data_ptr() for f in fixtures]\\n        assert len(set(cold_ptrs)) == POOLS and len(set(hot_ptrs)) == POOLS\\n        resources = []\\n        for f in fixtures:\\n            compiled = fixture_module.launch(C.recipient, f)\\n            resources.append({\\n                \\\"n_regs\\\": compiled.n_regs,\\n                \\\"n_spills\\\": compiled.n_spills,\\n                \\\"shared_bytes\\\": compiled.metadata.shared,\\n                \\\"asm_sha256\\\": hashlib.sha256(compiled.asm[\\\"asm\\\"].encode()).hexdigest(),\\n            })\\n            assert compiled.n_spills == 0\\n            assert compiled.metadata.shared == 32768\\n        torch.cuda.synchronize()\\n        eager_outputs = [f[\\\"args\\\"][11].clone() for f in fixtures]\\n        assert all(torch.isfinite(y).all().item() for y in eager_outputs)\\n        graph = torch.cuda.CUDAGraph()\\n        with torch.cuda.graph(graph):\\n            for f in fixtures:\\n                fixture_module.launch(C.recipient, f)\\n        graph.replay()\\n        torch.cuda.synchronize()\\n        assert all(torch.equal(f[\\\"args\\\"][11], y) for f, y in zip(fixtures, eager_outputs))\\n        for f in fixtures:\\n            # Unique backing storages only: TAB and ORIGINAL intentionally alias.\\n            storages = {a.untyped_storage().data_ptr(): a.untyped_storage().nbytes()\\n                        for a in f[\\\"args\\\"] if isinstance(a, torch.Tensor)}\\n            allocation_bytes += sum(storages.values())\\n        graphs[name] = graph\\n        keepalive[name] = fixtures\\n        strata_metadata[name] = {\\n            \\\"v2\\\": v2,\\n            \\\"selected_cold_pages_per_row\\\": pages,\\n            \\\"model_layer_multiplicity\\\": model_layers,\\n            \\\"graph_eager_bitwise\\\": True,\\n            \\\"resources\\\": resources,\\n            **expected_counts(v2, pages),\\n        }\\n        cases.append({\\n            \\\"name\\\": name,\\n            \\\"replay\\\": graph.replay,\\n            \\\"eager_replay\\\": lambda fs=fixtures: [fixture_module.launch(C.recipient, f) for f in fs],\\n            \\\"graph\\\": graph,\\n            \\\"model_layer_multiplicity\\\": model_layers,\\n            \\\"calls_per_graph\\\": POOLS,\\n            \\\"expected_counts\\\": expected_counts(v2, pages),\\n            \\\"logical_bytes\\\": {\\n                \\\"cold_per_call\\\": expected_counts(v2, pages)[\\\"logical_cold_bytes_per_call\\\"],\\n                \\\"hot_per_call\\\": expected_counts(v2, pages)[\\\"logical_hot_bytes_per_call\\\"],\\n                \\\"cold_hot_per_graph\\\": expected_counts(v2, pages)[\\\"logical_cold_hot_bytes_per_graph\\\"],\\n            },\\n            \\\"resources\\\": resources,\\n        })\\n        del eager_outputs\\n\\n    metadata = {\\n        \\\"scope\\\": \\\"Frozen production full recipient only: cold + full hot128 + CTA merge + H128 + BF16 output; synthetic data and contiguous selected page addresses.\\\",\\n        \\\"source_sha256\\\": actual_pins,\\n        \\\"fixture_sha256\\\": actual_fixture_sha,\\n        \\\"strata\\\": strata_metadata,\\n        \\\"unique_tensor_storage_bytes\\\": allocation_bytes,\\n        \\\"model_recipients\\\": sum(s[3] for s in STRATA),\\n        \\\"model_expected_warp_matrix_instructions\\\": sum(\\n            weight * expected_counts(v2, pages)[\\\"expected_warp_matrix_instructions_per_call\\\"]\\n            for _, v2, pages, weight in STRATA\\n        ),\\n        \\\"model_logical_cold_bytes\\\": sum(\\n            weight * expected_counts(v2, pages)[\\\"logical_cold_bytes_per_call\\\"]\\n            for _, v2, pages, weight in STRATA\\n        ),\\n        \\\"model_logical_hot_bytes\\\": sum(\\n            weight * expected_counts(v2, pages)[\\\"logical_hot_bytes_per_call\\\"]\\n            for _, v2, pages, weight in STRATA\\n        ),\\n        \\\"aggregation\\\": \\\"Each graph has four calls. Normalize each additive event to one call, weight by 9/13/9/3, then evaluate aggregate ratios from their numerator/denominator. Do not average metric percentages.\\\",\\n        \\\"limitations\\\": [\\n            \\\"Four rotating independent regions exceed the reported 16 MiB L2; this does not prove every load is cold. Check actual memory counters.\\\",\\n            \\\"No QKV, O projection, anchor/selector, writer, model weights, head, sampler, or service scheduling is timed by these graphs.\\\",\\n            \\\"Synthetic Q/K can alter lazy-softmax slow-branch frequency. Do not identify real-text softmax latency from this fixture alone.\\\",\\n            \\\"These graphs hold the full 128-token hot suffix. They do not represent fresh prefix-hit window growth.\\\",\\n        ],\\n    }\\n    assert metadata[\\\"model_recipients\\\"] == 34\\n    assert metadata[\\\"model_expected_warp_matrix_instructions\\\"] == 7_892_480\\n    assert metadata[\\\"model_logical_cold_bytes\\\"] == 793_706_496\\n    assert metadata[\\\"model_logical_hot_bytes\\\"] == 147_062_784\\n    return {\\\"cases\\\": cases, \\\"graphs\\\": graphs, \\\"metadata\\\": metadata, \\\"keepalive\\\": keepalive}\\n\\n\\ndef build_cases(gems_src: str | Path, checkpoint_dir: str | Path) -> dict:\\n    \\\"\\\"\\\"Unified topdown provider API. This fixture does not load checkpoint data.\\\"\\\"\\\"\\n    gems_src = Path(gems_src).resolve()\\n    sys.path.insert(0, str(gems_src))\\n    bundle = build_attention_fixture()\\n    from flag_gems.fused.minicpm import _cta_native_merge as C\\n    expected_source_dir = gems_src / \\\"flag_gems\\\" / \\\"fused\\\" / \\\"minicpm\\\"\\n    assert Path(C.__file__).resolve().parent == expected_source_dir\\n    cases = []\\n    for case in bundle[\\\"cases\\\"]:\\n        name = case[\\\"name\\\"]\\n        cases.append({\\n            \\\"name\\\": name,\\n            \\\"graph\\\": case[\\\"graph\\\"],\\n            \\\"replay\\\": case[\\\"replay\\\"],\\n            \\\"eager_replay\\\": case[\\\"eager_replay\\\"],\\n            \\\"metadata\\\": {\\n                \\\"model_layer_multiplicity\\\": case[\\\"model_layer_multiplicity\\\"],\\n                \\\"calls_per_graph\\\": case[\\\"calls_per_graph\\\"],\\n                \\\"expected_counts\\\": case[\\\"expected_counts\\\"],\\n                \\\"logical_bytes\\\": case[\\\"logical_bytes\\\"],\\n                \\\"resources\\\": case[\\\"resources\\\"],\\n                \\\"source_sha256\\\": bundle[\\\"metadata\\\"][\\\"source_sha256\\\"],\\n                \\\"fixture_sha256\\\": bundle[\\\"metadata\\\"][\\\"fixture_sha256\\\"],\\n                \\\"scope\\\": bundle[\\\"metadata\\\"][\\\"scope\\\"],\\n                \\\"limitations\\\": bundle[\\\"metadata\\\"][\\\"limitations\\\"],\\n                \\\"checkpoint_data_loaded\\\": False,\\n            },\\n            \\\"checks\\\": {\\n                \\\"graph_eager_bitwise\\\": bundle[\\\"metadata\\\"][\\\"strata\\\"][name][\\\"graph_eager_bitwise\\\"],\\n                \\\"all_zero_spill\\\": all(r[\\\"n_spills\\\"] == 0 for r in case[\\\"resources\\\"]),\\n                \\\"all_shared_32768\\\": all(r[\\\"shared_bytes\\\"] == 32768 for r in case[\\\"resources\\\"]),\\n                \\\"production_flags\\\": {\\\"V2\\\": bundle[\\\"metadata\\\"][\\\"strata\\\"][name][\\\"v2\\\"],\\n                                     \\\"SKIP_EMPTY\\\": True, \\\"num_warps\\\": 4, \\\"num_stages\\\": 1},\\n            },\\n        })\\n    return {\\\"cases\\\": cases, \\\"refs\\\": {\\\"bundle\\\": bundle}}\\n\",\"cupti_sampler.py\":\"\\\"\\\"\\\"Small ctypes CUPTI sampler for already-built, repeatable CUDA graphs.\\n\\nNo model loading, graph capture, library replacement, or GPU work on import.\\nConstants are supplied from the actual installed CoreX headers. Each metric\\nuses the vendor'\''s event-pass planner and cuptiMetricGetValue evaluator.\\n\\\"\\\"\\\"\\nfrom __future__ import annotations\\n\\nimport ctypes as C\\nfrom dataclasses import dataclass\\nimport math\\nimport time\\n\\n\\nU32, U64, SZ, PTR = C.c_uint32, C.c_uint64, C.c_size_t, C.c_void_p\\n\\n# Exact values read from this card'\''s ixpti_events.h and ixpti_metrics.h.\\n# The cupti compatibility wrappers include those headers; no NVIDIA GPU\\n# occupancy limit or counter formula is imported here.\\nCONSTANTS = {\\n    \\\"CUPTI_EVENT_COLLECTION_MODE_CONTINUOUS\\\": 0,\\n    \\\"CUPTI_EVENT_GROUP_ATTR_EVENT_DOMAIN_ID\\\": 0,\\n    \\\"CUPTI_EVENT_GROUP_ATTR_PROFILE_ALL_DOMAIN_INSTANCES\\\": 1,\\n    \\\"CUPTI_EVENT_GROUP_ATTR_NUM_EVENTS\\\": 3,\\n    \\\"CUPTI_EVENT_GROUP_ATTR_INSTANCE_COUNT\\\": 5,\\n    \\\"CUPTI_EVENT_DOMAIN_ATTR_TOTAL_INSTANCE_COUNT\\\": 3,\\n    \\\"CUPTI_EVENT_READ_FLAG_NONE\\\": 0,\\n    \\\"CUPTI_METRIC_ATTR_VALUE_KIND\\\": 4,\\n    \\\"CUPTI_METRIC_ATTR_EVALUATION_MODE\\\": 5,\\n    \\\"CUPTI_METRIC_EVALUATION_MODE_PER_INSTANCE\\\": 1,\\n    \\\"CUPTI_METRIC_EVALUATION_MODE_AGGREGATE\\\": 2,\\n    \\\"CUPTI_METRIC_VALUE_KIND_DOUBLE\\\": 0,\\n    \\\"CUPTI_METRIC_VALUE_KIND_UINT64\\\": 1,\\n    \\\"CUPTI_METRIC_VALUE_KIND_PERCENT\\\": 2,\\n    \\\"CUPTI_METRIC_VALUE_KIND_THROUGHPUT\\\": 3,\\n    \\\"CUPTI_METRIC_VALUE_KIND_INT64\\\": 4,\\n    \\\"CUPTI_METRIC_VALUE_KIND_UTILIZATION_LEVEL\\\": 5,\\n}\\nCOREX_CONSTANTS = CONSTANTS\\nSDK_HEADER_SHA256 = {\\n    \\\"ixpti_events.h\\\": \\\"0051a54429a1ba2a0c50858ed99a594efe24664267e216af2a32d1c1e62dd2b8\\\",\\n    \\\"ixpti_metrics.h\\\": \\\"32e2f79b9c8f41cff7ed885d60df78676206d58d24739979bbedb79a16f7739a\\\",\\n    \\\"ixpti_result.h\\\": \\\"c182317109eca2c1f6edd34a25c7a9146ec464bc9c75e29f4335d57a7a935852\\\",\\n}\\nABI = dict(pointer_bytes=C.sizeof(PTR), size_t_bytes=C.sizeof(SZ),\\n           event_id_bytes=C.sizeof(U32), event_value_bytes=C.sizeof(U64))\\n\\n\\nclass EventGroupSet(C.Structure):\\n    _fields_ = [(\\\"numEventGroups\\\", U32), (\\\"eventGroups\\\", C.POINTER(PTR))]\\n\\n\\nclass EventGroupSets(C.Structure):\\n    _fields_ = [(\\\"numSets\\\", U32), (\\\"sets\\\", C.POINTER(EventGroupSet))]\\n\\n\\nclass MetricValue(C.Union):\\n    _fields_ = [(\\\"metricValueDouble\\\", C.c_double), (\\\"metricValueUint64\\\", U64),\\n                (\\\"metricValueInt64\\\", C.c_int64), (\\\"metricValuePercent\\\", C.c_double),\\n                (\\\"metricValueThroughput\\\", U64), (\\\"metricValueUtilizationLevel\\\", C.c_int)]\\n\\n\\nclass CuptiError(RuntimeError):\\n    pass\\n\\n\\n@dataclass\\nclass Metric:\\n    name: str\\n    id: int\\n    kind: int\\n    evaluation_mode: int\\n    events: tuple[int, ...]\\n\\n\\ndef event_delta(before, after, read_mode):\\n    \\\"\\\"\\\"Never subtract a discarded pre-read when the API resets on read.\\\"\\\"\\\"\\n    assert before.keys() == after.keys()\\n    out = {}\\n    for event in before:\\n        b, a = before[event], after[event]\\n        assert b[\\\"instances\\\"] == a[\\\"instances\\\"]\\n        assert b[\\\"total_instances\\\"] == a[\\\"total_instances\\\"]\\n        assert b[\\\"domain\\\"] == a[\\\"domain\\\"]\\n        values = a[\\\"values\\\"] if read_mode == \\\"reset_on_read\\\" else [\\n            x-y for x, y in zip(a[\\\"values\\\"], b[\\\"values\\\"], strict=True)]\\n        assert read_mode in (\\\"reset_on_read\\\", \\\"cumulative\\\")\\n        assert all(0 <= v < (1 << 64)-2 for v in values), (event, values)\\n        # Do not silently extrapolate from a subset of instances.\\n        assert a[\\\"instances\\\"] == a[\\\"total_instances\\\"] > 0, a\\n        out[event] = dict(domain=a[\\\"domain\\\"], instances=a[\\\"instances\\\"],\\n                          total_instances=a[\\\"total_instances\\\"], values=list(values),\\n                          aggregate=sum(values))\\n    return out\\n\\n\\nclass MetricSampler:\\n    \\\"\\\"\\\"Use only after creating a CUDA context and capturing the workload.\\n\\n    ``constants`` must come from the installed cupti_{events,metrics}.h;\\n    ``header_provenance`` is recorded by the caller, not inferred here.\\n    No percent is computed in Python. PER_INSTANCE-only metrics are retained\\n    as per-instance values; unsupported evaluations fail explicitly.\\n    \\\"\\\"\\\"\\n    def __init__(self, constants, torch, *, library=\\\"libcupti.so\\\"):\\n        self.k, self.torch = dict(constants), torch\\n        self.api, self.driver = C.CDLL(library), C.CDLL(\\\"libcuda.so.1\\\")\\n        self._bind()\\n        self.context, device = PTR(), C.c_int()\\n        self.check(self.driver.cuCtxGetCurrent(C.byref(self.context)), \\\"cuCtxGetCurrent\\\")\\n        self.check(self.driver.cuCtxGetDevice(C.byref(device)), \\\"cuCtxGetDevice\\\")\\n        assert self.context.value, \\\"A context must already exist\\\"\\n        self.device, self.read_mode = device.value, None\\n        self.check(self.api.cuptiSetEventCollectionMode(self.context,\\n            self.k[\\\"CUPTI_EVENT_COLLECTION_MODE_CONTINUOUS\\\"]), \\\"collection mode\\\")\\n        self.start, self.end = (torch.cuda.Event(enable_timing=True) for _ in range(2))\\n        self.start.record(); self.end.record(); self.end.synchronize()\\n\\n    @staticmethod\\n    def check(code, call):\\n        if code:\\n            raise CuptiError(f\\\"{call}: CUPTI/driver return {int(code)}\\\")\\n\\n    def _bind(self):\\n        signatures = {\\n            \\\"cuptiSetEventCollectionMode\\\": [PTR, C.c_int],\\n            \\\"cuptiMetricGetIdFromName\\\": [C.c_int, C.c_char_p, C.POINTER(U32)],\\n            \\\"cuptiMetricGetAttribute\\\": [U32, C.c_int, C.POINTER(SZ), PTR],\\n            \\\"cuptiMetricGetNumEvents\\\": [U32, C.POINTER(U32)],\\n            \\\"cuptiMetricEnumEvents\\\": [U32, C.POINTER(SZ), C.POINTER(U32)],\\n            \\\"cuptiMetricCreateEventGroupSets\\\": [PTR, SZ, C.POINTER(U32), C.POINTER(C.POINTER(EventGroupSets))],\\n            \\\"cuptiEventGroupSetsDestroy\\\": [C.POINTER(EventGroupSets)],\\n            \\\"cuptiEventGroupSetEnable\\\": [C.POINTER(EventGroupSet)],\\n            \\\"cuptiEventGroupSetDisable\\\": [C.POINTER(EventGroupSet)],\\n            \\\"cuptiEventGroupSetAttribute\\\": [PTR, C.c_int, SZ, PTR],\\n            \\\"cuptiEventGroupGetAttribute\\\": [PTR, C.c_int, C.POINTER(SZ), PTR],\\n            \\\"cuptiDeviceGetEventDomainAttribute\\\": [C.c_int, U32, C.c_int, C.POINTER(SZ), PTR],\\n            \\\"cuptiEventGroupReadAllEvents\\\": [PTR, C.c_int, C.POINTER(SZ), C.POINTER(U64), C.POINTER(SZ), C.POINTER(U32), C.POINTER(SZ)],\\n            \\\"cuptiMetricGetValue\\\": [C.c_int, U32, SZ, C.POINTER(U32), SZ, C.POINTER(U64), U64, C.POINTER(MetricValue)],\\n        }\\n        for name, arguments in signatures.items():\\n            fn = getattr(self.api, name)\\n            fn.argtypes, fn.restype = arguments, C.c_int\\n        self.driver.cuCtxGetCurrent.argtypes = [C.POINTER(PTR)]\\n        self.driver.cuCtxGetCurrent.restype = C.c_int\\n        self.driver.cuCtxGetDevice.argtypes = [C.POINTER(C.c_int)]\\n        self.driver.cuCtxGetDevice.restype = C.c_int\\n\\n    def _attribute(self, function, arguments, ctype=U32):\\n        value, size = ctype(), SZ(C.sizeof(ctype))\\n        self.check(function(*arguments, C.byref(size), C.byref(value)), \\\"attribute\\\")\\n        assert size.value == C.sizeof(ctype)\\n        return value.value\\n\\n    def metric(self, name):\\n        metric = U32()\\n        self.check(self.api.cuptiMetricGetIdFromName(self.device, name.encode(), C.byref(metric)), name)\\n        attr = self.api.cuptiMetricGetAttribute\\n        kind = self._attribute(attr, (metric, self.k[\\\"CUPTI_METRIC_ATTR_VALUE_KIND\\\"]))\\n        mode = self._attribute(attr, (metric, self.k[\\\"CUPTI_METRIC_ATTR_EVALUATION_MODE\\\"]))\\n        count = U32()\\n        self.check(self.api.cuptiMetricGetNumEvents(metric, C.byref(count)), \\\"metric event count\\\")\\n        assert 0 < count.value <= 256, (name, count.value)\\n        ids = (U32 * count.value)(); size = SZ(C.sizeof(ids))\\n        self.check(self.api.cuptiMetricEnumEvents(metric, C.byref(size), ids), \\\"metric events\\\")\\n        assert size.value == C.sizeof(ids)\\n        return Metric(name, metric.value, kind, mode, tuple(ids))\\n\\n    def _plan(self, metric):\\n        pointer = C.POINTER(EventGroupSets)()\\n        ids = (U32 * 1)(metric.id)\\n        self.check(self.api.cuptiMetricCreateEventGroupSets(self.context, C.sizeof(ids), ids,\\n            C.byref(pointer)), \\\"metric event pass planner\\\")\\n        assert pointer and 0 < pointer.contents.numSets <= 16\\n        one = U32(1)\\n        for index in range(pointer.contents.numSets):\\n            group_set = pointer.contents.sets[index]\\n            assert 0 < group_set.numEventGroups <= 16\\n            for j in range(group_set.numEventGroups):\\n                self.check(self.api.cuptiEventGroupSetAttribute(group_set.eventGroups[j],\\n                    self.k[\\\"CUPTI_EVENT_GROUP_ATTR_PROFILE_ALL_DOMAIN_INSTANCES\\\"],\\n                    C.sizeof(one), C.byref(one)), \\\"profile all instances\\\")\\n        return pointer\\n\\n    def _read_set(self, group_set):\\n        result = {}\\n        for index in range(group_set.numEventGroups):\\n            group = group_set.eventGroups[index]\\n            attr = self.api.cuptiEventGroupGetAttribute\\n            count = self._attribute(attr, (group, self.k[\\\"CUPTI_EVENT_GROUP_ATTR_NUM_EVENTS\\\"]))\\n            instances = self._attribute(attr, (group, self.k[\\\"CUPTI_EVENT_GROUP_ATTR_INSTANCE_COUNT\\\"]))\\n            domain = self._attribute(attr, (group, self.k[\\\"CUPTI_EVENT_GROUP_ATTR_EVENT_DOMAIN_ID\\\"]))\\n            total = self._attribute(self.api.cuptiDeviceGetEventDomainAttribute,\\n                (self.device, domain, self.k[\\\"CUPTI_EVENT_DOMAIN_ATTR_TOTAL_INSTANCE_COUNT\\\"]))\\n            assert 0 < count <= 256 and 0 < instances <= 4096\\n            assert instances == total, (\\\"not all instances collected\\\", domain, instances, total)\\n            values, ids = (U64 * (count * instances))(), (U32 * count)()\\n            value_bytes, id_bytes, read_count = SZ(C.sizeof(values)), SZ(C.sizeof(ids)), SZ()\\n            self.check(self.api.cuptiEventGroupReadAllEvents(group, self.k[\\\"CUPTI_EVENT_READ_FLAG_NONE\\\"],\\n                C.byref(value_bytes), values, C.byref(id_bytes), ids, C.byref(read_count)), \\\"read all events\\\")\\n            assert read_count.value == count and id_bytes.value == C.sizeof(ids)\\n            assert value_bytes.value == C.sizeof(values)\\n            for j, event in enumerate(ids):\\n                assert event not in result, (\\\"duplicate event within pass\\\", event)\\n                vector = [values[i * count + j] for i in range(instances)]\\n                assert all(v < (1 << 64)-2 for v in vector), \\\"invalid or overflow event\\\"\\n                result[event] = dict(domain=domain, instances=instances, total_instances=total,\\n                                     values=vector, aggregate=sum(vector))\\n        return result\\n\\n    def _run(self, replay, repeats):\\n        self.start.record()\\n        for _ in range(repeats): replay()\\n        self.end.record(); self.end.synchronize()\\n        value = self.start.elapsed_time(self.end)\\n        assert math.isfinite(value) and value > 0\\n        return value\\n\\n    def verify_read_semantics(self, replay, *, repeats=2, metric_name=\\\"matrix_inst\\\",\\n                              expected_per_replay=None):\\n        \\\"\\\"\\\"A hardware-work counter must distinguish destructive from cumulative reads.\\\"\\\"\\\"\\n        metric, plan = self.metric(metric_name), None\\n        assert len(metric.events) == 1, \\\"Use a single-event instruction/warp count for this test\\\"\\n        replay(); self.torch.cuda.synchronize()\\n        try:\\n            plan = self._plan(metric)\\n            assert plan.contents.numSets == 1\\n            group_set = plan.contents.sets[0]\\n            self.check(self.api.cuptiEventGroupSetEnable(C.byref(group_set)), \\\"enable semantics pass\\\")\\n            try:\\n                pre = self._read_set(group_set)\\n                self._run(replay, repeats); first = self._read_set(group_set)\\n                empty = self._read_set(group_set)\\n                self._run(replay, repeats); second = self._read_set(group_set)\\n                self._run(replay, repeats * 2); doubled = self._read_set(group_set)\\n            finally:\\n                self.check(self.api.cuptiEventGroupSetDisable(C.byref(group_set)), \\\"disable semantics pass\\\")\\n            key = metric.events[0]\\n            a, b, c = (snapshot[key][\\\"aggregate\\\"] for snapshot in (first, empty, second))\\n            assert a > 0, \\\"Counter did not observe graph work\\\"\\n            if b == 0 and c == a:\\n                observed_mode = \\\"reset_on_read\\\"\\n            elif b == a and c - b == a - pre[key][\\\"aggregate\\\"]:\\n                observed_mode = \\\"cumulative\\\"\\n            else:\\n                raise AssertionError((\\\"unverified counter read behavior\\\", a, b, c))\\n            assert self.read_mode in (None, observed_mode), \\\"Different counters have different read behavior\\\"\\n            self.read_mode = observed_mode\\n            first_delta = event_delta(pre, first, self.read_mode)[key][\\\"aggregate\\\"]\\n            twice_delta = event_delta(second, doubled, self.read_mode)[key][\\\"aggregate\\\"]\\n            assert twice_delta == 2 * first_delta, (\\\"graph replay count is not linear\\\", first_delta, twice_delta)\\n            if expected_per_replay is not None:\\n                assert first_delta == expected_per_replay * repeats, (\\n                    \\\"source expected count disagrees with hardware\\\", first_delta, expected_per_replay, repeats)\\n            return dict(metric=metric.__dict__, read_mode=self.read_mode,\\n                        before=pre, first=first, empty=empty, second=second, doubled=doubled,\\n                        repeats=repeats, counted_per_replay=first_delta / repeats,\\n                        expected_per_replay=expected_per_replay, repeat_linearity_exact=True)\\n        finally:\\n            if plan: self.check(self.api.cuptiEventGroupSetsDestroy(plan), \\\"destroy semantics plan\\\")\\n\\n    def _evaluate(self, metric, values, duration_ns):\\n        ids = (U32 * len(metric.events))(*metric.events)\\n        counts = (U64 * len(metric.events))(*(values[e] for e in metric.events))\\n        output = MetricValue()\\n        self.check(self.api.cuptiMetricGetValue(self.device, metric.id, C.sizeof(ids), ids,\\n            C.sizeof(counts), counts, int(duration_ns), C.byref(output)), \\\"official metric evaluation\\\")\\n        for suffix, field in ((\\\"DOUBLE\\\", \\\"Double\\\"), (\\\"UINT64\\\", \\\"Uint64\\\"),\\n                (\\\"INT64\\\", \\\"Int64\\\"), (\\\"PERCENT\\\", \\\"Percent\\\"),\\n                (\\\"THROUGHPUT\\\", \\\"Throughput\\\"), (\\\"UTILIZATION_LEVEL\\\", \\\"UtilizationLevel\\\")):\\n            if metric.kind == self.k[\\\"CUPTI_METRIC_VALUE_KIND_\\\" + suffix]:\\n                value = getattr(output, \\\"metricValue\\\" + field)\\n                assert not isinstance(value, float) or math.isfinite(value)\\n                return dict(kind=suffix, value=value)\\n        raise AssertionError((\\\"unknown metric value kind\\\", metric.kind))\\n\\n    def sample_metric(self, name, replay, *, repeats, prepare=None):\\n        assert self.read_mode is not None, \\\"Run verify_read_semantics first\\\"\\n        assert 1 <= repeats <= 4096\\n        metric, plan = self.metric(name), None\\n        prepare = prepare or (lambda: None)\\n        prepare(); replay(); self.torch.cuda.synchronize()\\n        off_before = self._run(replay, repeats)\\n        passes, collected, duplicates = [], {}, {}\\n        try:\\n            plan = self._plan(metric)\\n            for index in range(plan.contents.numSets):\\n                prepare(); replay(); self.torch.cuda.synchronize()\\n                group_set = plan.contents.sets[index]\\n                host_start = time.perf_counter_ns()\\n                self.check(self.api.cuptiEventGroupSetEnable(C.byref(group_set)), \\\"enable metric pass\\\")\\n                try:\\n                    before = self._read_set(group_set)\\n                    ms = self._run(replay, repeats)\\n                    after = self._read_set(group_set)\\n                finally:\\n                    self.check(self.api.cuptiEventGroupSetDisable(C.byref(group_set)), \\\"disable metric pass\\\")\\n                host_end = time.perf_counter_ns()\\n                deltas = event_delta(before, after, self.read_mode)\\n                for event, data in deltas.items():\\n                    if event in collected:\\n                        # A scheduler/cycle event need not be identical across\\n                        # separate replays. Never sum duplicate passes as work.\\n                        duplicates.setdefault(event, [collected[event][\\\"aggregate\\\"]]).append(data[\\\"aggregate\\\"])\\n                    else:\\n                        collected[event] = data\\n                passes.append(dict(pass_index=index, event_ms=ms,\\n                    host_enabled_window_ms=(host_end-host_start)/1e6,\\n                    before=before, after=after, event_deltas=deltas))\\n        finally:\\n            if plan: self.check(self.api.cuptiEventGroupSetsDestroy(plan), \\\"destroy metric plan\\\")\\n        prepare(); replay(); self.torch.cuda.synchronize()\\n        off_after = self._run(replay, repeats)\\n        assert set(metric.events) <= collected.keys()\\n        # Multi-pass copies represent the same number of replays, not more work.\\n        duration_ns = round(sum(p[\\\"event_ms\\\"] for p in passes) / len(passes) * 1e6)\\n        try:\\n            if metric.evaluation_mode & self.k[\\\"CUPTI_METRIC_EVALUATION_MODE_AGGREGATE\\\"]:\\n                evaluation = dict(mode=\\\"aggregate_all_instances\\\", **self._evaluate(metric,\\n                    {e: collected[e][\\\"aggregate\\\"] for e in metric.events}, duration_ns))\\n            elif metric.evaluation_mode & self.k[\\\"CUPTI_METRIC_EVALUATION_MODE_PER_INSTANCE\\\"]:\\n                shape = {(collected[e][\\\"domain\\\"], collected[e][\\\"instances\\\"]) for e in metric.events}\\n                assert len(shape) == 1, \\\"Cannot align instances from different event domains\\\"\\n                instances = next(iter(shape))[1]\\n                evaluation = dict(mode=\\\"per_instance\\\", instances=[self._evaluate(metric,\\n                    {e: collected[e][\\\"values\\\"][i] for e in metric.events}, duration_ns)\\n                    for i in range(instances)])\\n            else:\\n                raise AssertionError((\\\"unsupported metric evaluation mode\\\", metric.evaluation_mode))\\n        except CuptiError as error:\\n            # Keep measured raw events if the vendor evaluator is unsupported.\\n            evaluation = dict(status=\\\"VENDOR_EVALUATION_UNAVAILABLE\\\", error=str(error))\\n        return dict(scope=\\\"graph_range_counter_metric_not_per_kernel_profile\\\", metric=metric.__dict__,\\n            repeats=repeats, passes=passes, evaluation=evaluation,\\n            normalized_all_instance_events={e: collected[e][\\\"aggregate\\\"] for e in metric.events},\\n            duplicate_event_pass_values=duplicates,\\n            duplicate_policy=\\\"first observation retained; all pass values preserved, never summed\\\",\\n            evaluation_duration_ns=duration_ns, duration_policy=\\\"mean_external_event_span_of_identical_pass_work\\\",\\n            unprofiled_before_ms=off_before, unprofiled_after_ms=off_after,\\n            read_mode=self.read_mode,\\n            caveat=\\\"Continuous counters include API/host boundary intervals. total_cycles-derived activity can be diluted by these intervals; no empty-window subtraction is silently applied.\\\")\\n\",\"guard.py\":\"from pathlib import Path\\nimport json,os,signal,subprocess,sys,time\\nroot=Path('\''/root/e252'\'')\\nstarted=time.time()\\ncmd=[sys.executable,str(root/'\''run_topdown.py'\''),'\''--gems-src'\'','\''/root/e214/candidate-a1/gems/src'\'','\''--checkpoint-dir'\'','\''/workspace/MiniCPM5-2B'\'','\''--out'\'',str(root/'\''a1'\'')]\\np=subprocess.Popen(cmd,stdin=subprocess.DEVNULL,start_new_session=True)\\nstatus={'\''pid'\'':p.pid,'\''started'\'':started,'\''command'\'':cmd}\\n(root/'\''child.json'\'').write_text(json.dumps(status))\\ntry:\\n status['\''returncode'\'']=p.wait(timeout=180)\\nexcept subprocess.TimeoutExpired:\\n status['\''timeout'\'']=True\\n os.killpg(p.pid,signal.SIGTERM)\\n try:status['\''returncode'\'']=p.wait(timeout=5)\\n except subprocess.TimeoutExpired:\\n  os.killpg(p.pid,signal.SIGKILL);status['\''returncode'\'']=p.wait()\\nstatus['\''elapsed_s'\'']=time.time()-started\\n(root/'\''done.json'\'').write_text(json.dumps(status,indent=2)+'\''\\\\n'\'')\\nprint('\''E252_CHILD_DONE'\'',json.dumps(status),flush=True)\\n\"}")
