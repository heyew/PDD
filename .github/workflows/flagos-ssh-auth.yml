name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Launch isolated native W4 eight-warp correctness probe
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'set -eu
          printf "FLAGOS_E245_LAUNCH_BEGIN\n"
          python3 - <<'\''PY'\''
          from pathlib import Path
          import subprocess,json,hashlib,sys
          mem=subprocess.check_output(["/usr/local/corex/bin/ixsmi","--query-gpu=memory.used","--format=csv,noheader"],text=True).strip()
          assert int(mem.split()[0])<256, "GPU already occupied; do not launch"
          root=Path("/root/e245")
          root.mkdir(exist_ok=False)
          files={"native_w4_down.py":"\"\"\"Isolated native W4 down: legacy 4-warp and new 8-warp ownership.\n\nOriginal legacy implementation is preserved below for same-code controls.\nNew 8-warp path uses M16xN32 per warp, BM64/BN64, 64 CTAs at split2.\nBoth per-output weight scales and K128 weight scales are supported.\nUNCOMPILED until run in the official BI-V150 image; no production hook.\n\"\"\"\nimport triton\nimport triton.experimental.tle.language.gpu as tleg\nimport triton.language as tl\n\n\ndef _assembly(tile_n, row_scale=False):\n    lines = []\n    emit = lines.append\n    # A is strided, B is K128 group-major. The wider CTA shares one A\n    # copy between two adjacent warps, which own different N64 tiles.\n    wide = tile_n == 128\n    for index, reg in enumerate((16, 17, 20, 21, 24, 25, 8, 9, 12, 13, 36, 37, 38, 39, 40, 43)):\n        emit(f\"ml_mov_v2s_b32 s{reg}, ${106 + index}, 0x0\")\n    for index, reg in enumerate((48, 49, 36, 37)):\n        emit(f\"ml_mov_b32 v{reg}, ${122 + index}\")\n    for reg in (8, 12, 16, 20, 24):\n        emit(f\"sl_mov_b32 s{reg + 2}, 0x40000000\")\n        stride = {16: \"s43\", 20: \"0x40\"}.get(reg, \"0xffffffff\")\n        emit(f\"sl_mov_b32 s{reg + 3}, {stride}\")\n    emit(\"sl_shl_b32 s44, s37, 0x2\")\n    for reg in (2, 41, 42):\n        emit(f\"sl_mov_b32 s{reg}, 0x0\")\n    for reg in range(16, 32):\n        emit(f\"ml_mov_b32 v{reg}, 0x0\")\n\n    def copy(stage, label):\n        if wide:\n            emit(\"sl_cmp_lt_i32 wcr, s38, 0x4\")\n            emit(f\"sl_cbr_wcrz .Ldown_skip_a_{label}\")\n        emit(\"sl_shl_b32 s4, s38, 0xa\")\n        emit(f\"sl_add_i32 s33, s39, {stage}\")\n        emit(\"sl_add_i32 s33, s33, s4\")\n        for half in range(2):\n            emit(\"sl_mov_b32 s32, 0x0\")\n            if half:\n                emit(\"sl_add_i32 s33, s33, 0x1000\")\n            emit(\"sl_sme_load_16x1b64_rowxfb8 s[16:19], s[32:33], 0x0, 0x0, 0x0, 0x1\")\n            emit(\"sl_add_i64 s[16:17], s[16:17], 0x40\")\n        if wide:\n            emit(f\".Ldown_skip_a_{label}:\")\n            emit(f\"sl_mov_b32 s31, {stage}\")\n            emit(\"sl_shl_b32 s4, s38, 0xa\")\n        else:\n            emit(f\"sl_srl_b32 s31, {stage}, 0x1\")\n        emit(\"sl_add_i32 s31, s40, s31\")\n        emit(\"sl_add_i32 s31, s31, s4\")\n        emit(\"sl_mov_b32 s30, 0x0\")\n        emit(\"sl_sme_load_16x1b64_rowxfb8 s[20:23], s[30:31], 0x0, 0x0, 0x0, 0x1\")\n        emit(f\"sl_add_i64 s[20:21], s[20:21], 0x{tile_n * 64:x}\")\n\n    copy(\"s2\", \"first\")\n    emit(\".Ldown_group:\")\n    emit(\"sl_wait g2scnt(0)\")\n    emit(\"sl_barrier\")\n    emit(\"sl_xor_b32 s3, s2, 0x2000\")\n    emit(\"sl_cmp_gt_i32 wcr, s36, 0x1\")\n    emit(\"sl_cbr_wcrz .Ldown_last\")\n    copy(\"s3\", \"next\")\n    emit(\".Ldown_last:\")\n    # Scale loads overlap the integer dot and are consumed once per K128.\n    if not row_scale:\n        for fragment in range(4):\n            emit(f\"ml_lsa_load_dword v{44 + fragment}, s[12:15], unsigned v37, s42, #{fragment * 64}, ca\")\n    emit(\"sl_shl_b32 s45, s43, 0x2\")  # 4 output rows per accumulator register\n    emit(\"sl_srl_b32 s45, s45, 0x5\")  # 4 * (K / 128) * sizeof(float)\n    emit(\"sl_mov_b32 s46, s41\")\n    for row in range(4):\n        emit(f\"ml_lsa_load_dword v{40 + row}, s[8:11], unsigned v36, s46, #0, ca\")\n        emit(\"sl_add_i32 s46, s46, s45\")\n    if wide:\n        emit(\"sl_srl_b32 s4, s38, 0x1\")\n        emit(\"sl_shl_b32 s4, s4, 0xa\")\n    else:\n        emit(\"sl_shl_b32 s4, s38, 0xa\")\n    emit(\"sl_add_i32 s4, s39, s4\")\n    emit(\"sl_add_i32 s4, s4, s2\")\n    if wide:\n        emit(\"sl_and_b32 s5, s38, 0x1\")\n        emit(\"sl_shl_b32 s5, s5, 0xc\")\n        emit(\"sl_add_i32 s5, s5, s2\")\n    else:\n        emit(\"sl_srl_b32 s5, s2, 0x1\")\n    emit(\"sl_add_i32 s5, s5, s40\")\n    emit(\"ml_add_i32 v51, s5, v48\")\n    for reg in range(16):\n        emit(f\"ml_mov_b32 v{reg}, 0x0\")\n    for step in range(4):\n        for word in range(2):\n            kword = 2 * (step % 2) + word\n            emit(f\"ml_add_i32 v50, v48, 0x{kword * 64:x}\")\n            emit(\"ml_and_b32 v50, v50, 0xff\")\n            emit(\"ml_add_i32 v50, s4, v50\")\n            if step >= 2:\n                emit(\"ml_add_i32 v50, v50, 0x1000\")\n            offset = kword * 256\n            emit(f\"ml_slb_load_b32x1 v{32 + word}, v50, noreg, #{offset}, null\")\n        for fragment in range(4):\n            offset = (step // 2) * 2048 + fragment * 512 + (step % 2) * 256\n            emit(f\"ml_add_i32 v52, v51, 0x{offset:x}\")\n            emit(f\"ml_slb_load_b32x1 v{54 + fragment}, v52, noreg, #0, null\")\n        emit(\"sl_wait lmcnt(0)\")\n        for fragment in range(4):\n            packed = 54 + fragment\n            emit(f\"ml_shl_b32 v38, v{packed}, 0x4\")\n            emit(\"ml_and_b32 v38, v38, 0xf0f0f0f0\")\n            emit(f\"ml_and_b32 v39, v{packed}, 0xf0f0f0f0\")\n            acc = f\"v[{4 * fragment}:{4 * fragment + 3}]\"\n            emit(f\"ml_matrix_mad_i32_i8_m16n16k32 {acc}, v[32:33], v[38:39], {acc}\")\n    emit(\"sl_wait vmcnt(0)\")\n    for fragment in range(4):\n        for row in range(4):\n            dot = fragment * 4 + row\n            out = 16 + dot\n            emit(f\"ml_cvt_f32_i32 v{dot}, v{dot}\")\n            if row_scale:\n                emit(f\"ml_fma_f32 v{out}, v{dot}, v{40 + row}, v{out}\")\n            else:\n                emit(f\"ml_mul_f32 v{dot}, v{dot}, v{40 + row}\")\n                emit(f\"ml_fma_f32 v{out}, v{dot}, v{44 + fragment}, v{out}\")\n    emit(\"sl_add_i32 s41, s41, 0x4\")\n    if not row_scale:\n        emit(\"sl_add_i32 s42, s42, s44\")\n    emit(\"sl_add_i32 s36, s36, 0xffffffff\")\n    emit(\"sl_mov_b32 s2, s3\")\n    emit(\"sl_cmp_gt_i32 wcr, s36, 0x0\")\n    emit(\"sl_cbr_wcrnz .Ldown_group\")\n    for row in range(4):\n        emit(f\"sl_mull_u32 s6, s37, 0x{16 * row:x}\")\n        for fragment in range(4):\n            emit(f\"ml_lsa_store_dword v{16 + 4 * fragment + row}, s[24:27], unsigned v49, s6, #{64 * fragment}, wb\")\n    emit(\"sl_wait vmcnt(0)\")\n    return \";\\n\".join(lines) + \";\\n\"\n\n\n_ASM64 = tl.constexpr(_assembly(64))\n_ASM128 = tl.constexpr(_assembly(128))\n_ASM64_ROW = tl.constexpr(_assembly(64, row_scale=True))\n_CONSTRAINTS = tl.constexpr(\",\".join(\n    [f\"=&{{v{i}}}\" for i in range(58)]\n    + [f\"=&{{s{i}}}\" for i in range(48)]\n    + [\"r\"] * 20 + [\"~{memory}\"]\n))\n\n\n@triton.jit\ndef pack_b4(W, Packed, Lut, K: tl.constexpr, TILE_N: tl.constexpr):\n    pn = tl.program_id(0)\n    group = tl.program_id(1)\n    unit = tl.program_id(2)\n    i = tl.arange(0, 1024)\n    lane = (i % 256) // 4\n    n = pn * TILE_N + (unit // 4) * 64 + (unit % 2) * 32 + (i // 512) * 16 + lane % 16\n    k = group * 128 + ((unit // 2) % 2) * 64 + ((i % 512) // 256) * 32 + 4 * (lane // 16) + i % 4\n    low = tl.load(W + n * K + k).to(tl.int32) & 15\n    high = tl.load(W + n * K + k + 16).to(tl.int32) & 15\n    dst = (pn * (K // 128) + group) * (TILE_N * 64) + unit * 1024 + tl.load(Lut + i)\n    tl.store(Packed + dst, (low | (high << 4)).to(tl.uint8))\n\n\n@triton.jit\ndef down(Q, SA, B, SB, P, K: tl.constexpr, N: tl.constexpr, SPLIT: tl.constexpr, TILE_N: tl.constexpr,\n         ROW_SCALE: tl.constexpr = False):\n    pn = tl.program_id(0)\n    split = tl.program_id(1)\n    groups: tl.constexpr = K // 128\n    tl.static_assert(groups % SPLIT == 0)\n    start = split * (groups // SPLIT)\n    tl.static_assert(TILE_N == 64 or TILE_N == 128)\n    tid = tl.arange(0, TILE_N * 4)\n    warp, lane = tid // 64, tid % 64\n    if TILE_N == 128:\n        row = (warp // 2) * 16 + lane // 16\n        col = (warp % 2) * 64 + lane % 16\n    else:\n        row = warp * 16 + lane // 16\n        col = lane % 16\n    z = tid * 0\n    if ROW_SCALE:\n        tl.static_assert(TILE_N == 64)\n        buf_a = tleg.alloc((16384,), tl.uint8, scope=tleg.smem, nv_mma_shared_layout=False)\n        buf_b = tleg.alloc((8192,), tl.uint8, scope=tleg.smem, nv_mma_shared_layout=False)\n        ptr_a = tleg.local_ptr(buf_a, (0,))\n        ptr_b = tleg.local_ptr(buf_b, (0,))\n        tl.store(ptr_a, 0)\n        tl.store(ptr_b, 0)\n        asm: tl.constexpr = _ASM64_ROW\n    else:\n        smem = tleg.alloc((32768,), tl.uint8, scope=tleg.smem, nv_mma_shared_layout=False)\n        ptr_a = tleg.local_ptr(smem, (0,))\n        ptr_b = ptr_a + 16384\n        tl.store(ptr_a, 0)\n        asm: tl.constexpr = _ASM128 if TILE_N == 128 else _ASM64\n    tl.debug_barrier()\n    shared_a = ptr_a.to(tl.uint64).to(tl.int32) + z\n    shared_b = ptr_b.to(tl.uint64).to(tl.int32) + z\n\n    a = (Q + (warp % 4) * 16 * K + start * 128).to(tl.uint64)\n    b = (B + (pn * groups + start) * (TILE_N * 64) + warp * 1024).to(tl.uint64)\n    output = (P + split * 64 * N + pn * TILE_N + z).to(tl.uint64)\n    sa = (SA + start + z).to(tl.uint64)\n    if ROW_SCALE:\n        sb = z.to(tl.uint64)\n    else:\n        sb = (SB + start * N + pn * TILE_N + z).to(tl.uint64)\n    tl.inline_asm_elementwise(\n        asm, _CONSTRAINTS,\n        [(a & 0xffffffff).to(tl.int32), (a >> 32).to(tl.int32),\n         (b & 0xffffffff).to(tl.int32), (b >> 32).to(tl.int32),\n         (output & 0xffffffff).to(tl.int32), (output >> 32).to(tl.int32),\n         (sa & 0xffffffff).to(tl.int32), (sa >> 32).to(tl.int32),\n         (sb & 0xffffffff).to(tl.int32), (sb >> 32).to(tl.int32),\n         z + groups // SPLIT, z + N, warp, shared_a, shared_b, z + K,\n         lane * 4, (row * N + col) * 4, row * groups * 4, col * 4],\n        dtype=(tl.int32,) * 106, is_pure=False, pack=1,\n    )\n\n\ndef _assembly8(row_scale=False):\n    tile_n = 64\n    lines = []\n    emit = lines.append\n    # A is strided, B is K128 group-major. The wider CTA shares one A\n    # copy between two adjacent warps, which own different N64 tiles.\n    wide = False\n    for index, reg in enumerate((16, 17, 20, 21, 24, 25, 8, 9, 12, 13, 36, 37, 38, 39, 40, 43)):\n        emit(f\"ml_mov_v2s_b32 s{reg}, ${106 + index}, 0x0\")\n    for index, reg in enumerate((48, 49, 36, 37)):\n        emit(f\"ml_mov_b32 v{reg}, ${122 + index}\")\n    for reg in (8, 12, 16, 20, 24):\n        emit(f\"sl_mov_b32 s{reg + 2}, 0x40000000\")\n        stride = {16: \"s43\", 20: \"0x40\"}.get(reg, \"0xffffffff\")\n        emit(f\"sl_mov_b32 s{reg + 3}, {stride}\")\n    emit(\"sl_shl_b32 s44, s37, 0x2\")\n    for reg in (2, 41, 42):\n        emit(f\"sl_mov_b32 s{reg}, 0x0\")\n    for reg in range(16, 24):\n        emit(f\"ml_mov_b32 v{reg}, 0x0\")\n\n    def copy(stage, label):\n        # The first four warps copy the complete A and compressed B tiles once.\n        # All eight warps subsequently consume M16 x N32 output fragments.\n        emit(\"sl_cmp_lt_i32 wcr, s38, 0x4\")\n        emit(f\"sl_cbr_wcrz .Ldown8_skip_copy_{label}\")\n        emit(\"sl_shl_b32 s4, s38, 0xa\")\n        emit(f\"sl_add_i32 s33, s39, {stage}\")\n        emit(\"sl_add_i32 s33, s33, s4\")\n        for half in range(2):\n            emit(\"sl_mov_b32 s32, 0x0\")\n            if half:\n                emit(\"sl_add_i32 s33, s33, 0x1000\")\n            emit(\"sl_sme_load_16x1b64_rowxfb8 s[16:19], s[32:33], 0x0, 0x0, 0x0, 0x1\")\n            emit(\"sl_add_i64 s[16:17], s[16:17], 0x40\")\n        emit(f\"sl_srl_b32 s31, {stage}, 0x1\")\n        emit(\"sl_add_i32 s31, s40, s31\")\n        emit(\"sl_add_i32 s31, s31, s4\")\n        emit(\"sl_mov_b32 s30, 0x0\")\n        emit(\"sl_sme_load_16x1b64_rowxfb8 s[20:23], s[30:31], 0x0, 0x0, 0x0, 0x1\")\n        emit(\"sl_add_i64 s[20:21], s[20:21], 0x1000\")\n        emit(f\".Ldown8_skip_copy_{label}:\")\n\n    copy(\"s2\", \"first\")\n    emit(\".Ldown8_group:\")\n    emit(\"sl_wait g2scnt(0)\")\n    emit(\"sl_barrier\")\n    emit(\"sl_xor_b32 s3, s2, 0x2000\")\n    emit(\"sl_cmp_gt_i32 wcr, s36, 0x1\")\n    emit(\"sl_cbr_wcrz .Ldown8_last\")\n    copy(\"s3\", \"next\")\n    emit(\".Ldown8_last:\")\n    # Scale loads overlap the integer dot and are consumed once per K128.\n    if not row_scale:\n        for fragment in range(2):\n            emit(f\"ml_lsa_load_dword v{44 + fragment}, s[12:15], unsigned v37, s42, #{fragment * 64}, ca\")\n    emit(\"sl_shl_b32 s45, s43, 0x2\")  # 4 output rows per accumulator register\n    emit(\"sl_srl_b32 s45, s45, 0x5\")  # 4 * (K / 128) * sizeof(float)\n    emit(\"sl_mov_b32 s46, s41\")\n    for row in range(4):\n        emit(f\"ml_lsa_load_dword v{40 + row}, s[8:11], unsigned v36, s46, #0, ca\")\n        emit(\"sl_add_i32 s46, s46, s45\")\n    emit(\"sl_srl_b32 s4, s38, 0x1\")\n    emit(\"sl_shl_b32 s4, s4, 0xa\")\n    emit(\"sl_add_i32 s4, s39, s4\")\n    emit(\"sl_add_i32 s4, s4, s2\")\n    emit(\"sl_srl_b32 s5, s2, 0x1\")\n    emit(\"sl_and_b32 s6, s38, 0x1\")\n    emit(\"sl_shl_b32 s6, s6, 0xa\")\n    emit(\"sl_add_i32 s5, s5, s6\")\n    emit(\"sl_add_i32 s5, s5, s40\")\n    emit(\"ml_add_i32 v51, s5, v48\")\n    for reg in range(8):\n        emit(f\"ml_mov_b32 v{reg}, 0x0\")\n    for step in range(4):\n        for word in range(2):\n            kword = 2 * (step % 2) + word\n            emit(f\"ml_add_i32 v50, v48, 0x{kword * 64:x}\")\n            emit(\"ml_and_b32 v50, v50, 0xff\")\n            emit(\"ml_add_i32 v50, s4, v50\")\n            if step >= 2:\n                emit(\"ml_add_i32 v50, v50, 0x1000\")\n            offset = kword * 256\n            emit(f\"ml_slb_load_b32x1 v{32 + word}, v50, noreg, #{offset}, null\")\n        for fragment in range(2):\n            offset = (step // 2) * 2048 + fragment * 512 + (step % 2) * 256\n            emit(f\"ml_add_i32 v52, v51, 0x{offset:x}\")\n            emit(f\"ml_slb_load_b32x1 v{54 + fragment}, v52, noreg, #0, null\")\n        emit(\"sl_wait lmcnt(0)\")\n        for fragment in range(2):\n            packed = 54 + fragment\n            emit(f\"ml_shl_b32 v38, v{packed}, 0x4\")\n            emit(\"ml_and_b32 v38, v38, 0xf0f0f0f0\")\n            emit(f\"ml_and_b32 v39, v{packed}, 0xf0f0f0f0\")\n            acc = f\"v[{4 * fragment}:{4 * fragment + 3}]\"\n            emit(f\"ml_matrix_mad_i32_i8_m16n16k32 {acc}, v[32:33], v[38:39], {acc}\")\n    emit(\"sl_wait vmcnt(0)\")\n    for fragment in range(2):\n        for row in range(4):\n            dot = fragment * 4 + row\n            out = 16 + dot\n            emit(f\"ml_cvt_f32_i32 v{dot}, v{dot}\")\n            if row_scale:\n                emit(f\"ml_fma_f32 v{out}, v{dot}, v{40 + row}, v{out}\")\n            else:\n                emit(f\"ml_mul_f32 v{dot}, v{dot}, v{40 + row}\")\n                emit(f\"ml_fma_f32 v{out}, v{dot}, v{44 + fragment}, v{out}\")\n    emit(\"sl_add_i32 s41, s41, 0x4\")\n    if not row_scale:\n        emit(\"sl_add_i32 s42, s42, s44\")\n    emit(\"sl_add_i32 s36, s36, 0xffffffff\")\n    emit(\"sl_mov_b32 s2, s3\")\n    emit(\"sl_cmp_gt_i32 wcr, s36, 0x0\")\n    emit(\"sl_cbr_wcrnz .Ldown8_group\")\n    for row in range(4):\n        emit(f\"sl_mull_u32 s6, s37, 0x{16 * row:x}\")\n        for fragment in range(2):\n            emit(f\"ml_lsa_store_dword v{16 + 4 * fragment + row}, s[24:27], unsigned v49, s6, #{64 * fragment}, wb\")\n    emit(\"sl_wait vmcnt(0)\")\n    return \";\\n\".join(lines) + \";\\n\"\n\n\n_ASM8_ROW = tl.constexpr(_assembly8(True))\n_ASM8_GROUP = tl.constexpr(_assembly8(False))\n\n@triton.jit\ndef down8(Q, SA, B, SB, P, K: tl.constexpr, N: tl.constexpr, SPLIT: tl.constexpr, TILE_N: tl.constexpr,\n         ROW_SCALE: tl.constexpr = False):\n    pn = tl.program_id(0)\n    split = tl.program_id(1)\n    groups: tl.constexpr = K // 128\n    tl.static_assert(groups % SPLIT == 0)\n    start = split * (groups // SPLIT)\n    tl.static_assert(TILE_N == 64)\n    tid = tl.arange(0, 512)\n    warp, lane = tid // 64, tid % 64\n    row = (warp // 2) * 16 + lane // 16\n    col = (warp % 2) * 32 + lane % 16\n    z = tid * 0\n    buf_a = tleg.alloc((16384,), tl.uint8, scope=tleg.smem, nv_mma_shared_layout=False)\n    buf_b = tleg.alloc((8192,), tl.uint8, scope=tleg.smem, nv_mma_shared_layout=False)\n    ptr_a = tleg.local_ptr(buf_a, (0,))\n    ptr_b = tleg.local_ptr(buf_b, (0,))\n    tl.store(ptr_a, 0)\n    tl.store(ptr_b, 0)\n    asm: tl.constexpr = _ASM8_ROW if ROW_SCALE else _ASM8_GROUP\n    tl.debug_barrier()\n    shared_a = ptr_a.to(tl.uint64).to(tl.int32) + z\n    shared_b = ptr_b.to(tl.uint64).to(tl.int32) + z\n\n    a = (Q + (warp % 4) * 16 * K + start * 128).to(tl.uint64)\n    b = (B + (pn * groups + start) * (TILE_N * 64) + (warp % 4) * 1024).to(tl.uint64)\n    output = (P + split * 64 * N + pn * TILE_N + z).to(tl.uint64)\n    sa = (SA + start + z).to(tl.uint64)\n    if ROW_SCALE:\n        sb = z.to(tl.uint64)\n    else:\n        sb = (SB + start * N + pn * TILE_N + z).to(tl.uint64)\n    tl.inline_asm_elementwise(\n        asm, _CONSTRAINTS,\n        [(a & 0xffffffff).to(tl.int32), (a >> 32).to(tl.int32),\n         (b & 0xffffffff).to(tl.int32), (b >> 32).to(tl.int32),\n         (output & 0xffffffff).to(tl.int32), (output >> 32).to(tl.int32),\n         (sa & 0xffffffff).to(tl.int32), (sa >> 32).to(tl.int32),\n         (sb & 0xffffffff).to(tl.int32), (sb >> 32).to(tl.int32),\n         z + groups // SPLIT, z + N, warp, shared_a, shared_b, z + K,\n         lane * 4, (row * N + col) * 4, row * groups * 4, col * 4],\n        dtype=(tl.int32,) * 106, is_pure=False, pack=1,\n    )\n","smoke_native_w4.py":"\"\"\"Independent small-K CPU integer oracle for native 4/8-warp W4 down.\n\nNo checkpoint, production hook, timing, or quality claim. Execute only on card A.\n\"\"\"\nimport argparse\nimport hashlib\nimport json\nfrom pathlib import Path\nimport sys\n\n\ndef checks(native, N, torch, out):\n    rows = []\n    for groups, split in ((1, 1), (2, 1), (4, 2), (6, 3)):\n        k, n = groups * 128, 128\n        q = torch.randint(-32, 33, (64, k), device=\"cuda\", dtype=torch.int8)\n        w = torch.randint(-8, 8, (n, k), device=\"cuda\", dtype=torch.int8)\n        binary = torch.tensor([0.5, 0.25, 0.125, 0.0625], device=\"cuda\", dtype=torch.float32)\n        sa = binary[torch.randint(0, 4, (64, groups), device=\"cuda\")]\n        sw = binary[torch.randint(0, 4, (groups, n), device=\"cuda\")]\n        packed = torch.empty(n * k // 2, device=\"cuda\", dtype=torch.uint8)\n        native.pack_b4[(n // 64, groups, 4)](w, packed, N.lut(\"cuda\"), K=k, TILE_N=64, num_warps=4)\n        qc, wc, sac, swc = q.cpu().to(torch.int64), w.cpu().to(torch.int64) * 16, sa.cpu(), sw.cpu()\n        for row_scale in (True, False):\n            ref = torch.zeros((split, 64, n), dtype=torch.float32)\n            for g in range(groups):\n                integer = qc[:, g * 128:(g + 1) * 128] @ wc[:, g * 128:(g + 1) * 128].T\n                value = integer.float() * sac[:, g, None]\n                if not row_scale:\n                    value = value * swc[g, None, :]\n                ref[g // (groups // split)] += value\n            for warps, kernel in ((4, native.down), (8, native.down8)):\n                partial = torch.full((split, 64, n), float(\"nan\"), device=\"cuda\")\n                compiled = kernel[(n // 64, split)](q, sa, packed, sw, partial,\n                    K=k, N=n, SPLIT=split, TILE_N=64, ROW_SCALE=row_scale,\n                    num_warps=warps, num_stages=1)\n                actual = partial.cpu()\n                exact = torch.equal(actual, ref)\n                asm = compiled.asm.get(\"asm\", \"\")\n                item = dict(groups=groups, split=split, row_scale=row_scale, warps=warps,\n                    exact=exact, max_abs=float((actual - ref).abs().max()),\n                    regs=compiled.n_regs, spills=compiled.n_spills,\n                    lds=compiled.metadata.shared, asm_present=bool(asm),\n                    sme=asm.count(\"sl_sme_load\"), mma=asm.count(\"ml_matrix_mad_i32_i8\"))\n                print(json.dumps(item), flush=True)\n                rows.append(item)\n                (out / \"tiny_checks.json\").write_text(json.dumps(rows, indent=2) + \"\\n\")\n                (out / f\"tiny_{groups}_{split}_{int(row_scale)}_{warps}.isa\").write_text(asm)\n                if not exact:\n                    torch.save(dict(q=q.cpu(), w=w.cpu(), sa=sac, sw=swc,\n                                    actual=actual, expected=ref), out / \"tiny_mismatch.pt\")\n                assert exact and compiled.n_spills == 0 and asm and item[\"sme\"] > 0 and item[\"mma\"] > 0, item\n                if warps == 8:\n                    assert compiled.metadata.shared <= 32768 and compiled.n_regs <= 128, item\n    return rows\n\n\ndef main():\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"--gems-src\", type=Path, required=True)\n    ap.add_argument(\"--out\", type=Path, required=True)\n    args = ap.parse_args()\n    args.out.mkdir(parents=True, exist_ok=False)\n    sys.path.insert(0, str(args.gems_src))\n    import torch\n    from flag_gems.fused.minicpm import _native_pair_mlp as N\n    import native_w4_down as D\n    torch.set_num_threads(4)\n    torch.manual_seed(244081)\n    result = dict(scope=\"CARD_A_NATIVE_W4_8WARP_TINY_INTEGER_ORACLE_ONLY\",\n                  source_sha256=hashlib.sha256(Path(D.__file__).read_bytes()).hexdigest(),\n                  checks=checks(D, N, torch, args.out))\n    (args.out / \"result.json\").write_text(json.dumps(result, indent=2) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    main()\n","run_smoke_owned.py":"import json,os,signal,subprocess,sys,time\nfrom pathlib import Path\nroot=Path(__file__).resolve().parent\nstatus=root/\"smoke_status.json\"\ncmd=[sys.executable,str(root/\"smoke_native_w4.py\"),\"--gems-src\",\"/root/e214/candidate-a1/gems/src\",\"--out\",str(root/\"tiny-a1\")]\nenv=os.environ.copy()\nenv[\"PYTHONPATH\"]=\"/root/e214/candidate-a1/gems/src\"\nenv[\"OMP_NUM_THREADS\"]=\"4\"\nenv[\"OPENBLAS_NUM_THREADS\"]=\"4\"\nwith (root/\"smoke.log\").open(\"w\") as log:\n    proc=subprocess.Popen(cmd,cwd=root,env=env,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\n    data={\"state\":\"running\",\"pid\":proc.pid,\"start_unix\":time.time(),\"task\":\"native_w4_64cta_8warp_integer_oracle\"}\n    status.write_text(json.dumps(data)+\"\\n\")\n    try:\n        rc=proc.wait(timeout=600)\n    except subprocess.TimeoutExpired:\n        os.killpg(proc.pid,signal.SIGTERM)\n        try:rc=proc.wait(timeout=15)\n        except subprocess.TimeoutExpired:\n            os.killpg(proc.pid,signal.SIGKILL);rc=proc.wait()\n        data[\"timed_out\"]=True\n    data.update(state=\"completed\",exit_code=rc,end_unix=time.time())\n    status.write_text(json.dumps(data)+\"\\n\")\n"}
