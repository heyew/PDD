name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Test conditioned flush timing then isolated real-text W4 replay
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''PY'\''
          from pathlib import Path
          import ast,hashlib,json,subprocess
          print("CONDITIONED_FLUSH_AND_P2_LAUNCH_BEGIN",flush=True)
          prior=json.loads(Path("/root/e250/serial_status.json").read_text());assert prior["state"]=="completed",prior
          used=subprocess.check_output(["/usr/local/corex/bin/ixsmi","--query-gpu=memory.used","--format=csv,noheader"],text=True);print("GPU_MEMORY_USED",used.strip(),flush=True);assert int(used.split()[0])<256
          payload=json.loads("[{\"remote\":\"/root/e251/pair_graph_v2.py\",\"sha256\":\"362c953835cff30db7fa4bcd1509919f6177554889a1d9d445572ea6a67355d4\",\"content\":\"#!/usr/bin/env python3\\n\\\"\\\"\\\"E251 v2: conditioned true two-step graph, same-stream flush order.\\n\\nEach trial begins with an untimed, same-arm true prefix-step graph. Its actual\\nsample and KV feed the timed two-step graph directly, without an intervening\\nrestore, synchronization or D2H. This prevents v1 from counting an unpaid\\npost-flush disturbance at the end while clearing the matching entry cost.\\n\\nNo production mutation, no replayed outputs, no omitted work, no cross-step\\nwrite debt. Every step issues its complete two-kernel KV flush before the next\\nstep starts. Distinct from E233: that experiment STARTED side-stream flushing\\nat layer41 attention and joined after sampling; this treatment STARTS flushing\\nafter sampling, on the default stream. Graphs include both flushes in timing.\\n\\nUse only on an idle card. Suggested outer bound: timeout 300s python3\\n/root/e251/pair_graph_v2.py --out /root/e251/pair-v2-a1\\n\\\"\\\"\\\"\\nimport argparse\\nfrom hashlib import sha256\\nimport json\\nfrom pathlib import Path\\nfrom statistics import mean, median\\nimport subprocess\\nimport sys\\nimport time\\nimport traceback\\n\\nPINS = {\\n    '\''/root/e223/probe.py'\'': '\''b00f58ef4225bb7f5c2b2165ada291f969dbab6fa5f3fe70cad287a6361f2071'\'',\\n    '\''/root/e227/joint.py'\'': '\''701893bb5d09cc0248fb3dbb773665589683dc4bcf182bb211fb056e7965ba7a'\'',\\n}\\nCASES = (('\''ordinary_pair'\'', 16902, (0, 0)), ('\''cross_refresh1_pair'\'', 16909, (0, 1)))\\nARMS = ('\''attention_tail'\'', '\''sample_tail'\'')\\n\\n\\ndef write(path, value):\\n    temporary = path.with_suffix(path.suffix + '\''.tmp'\'')\\n    temporary.write_text(json.dumps(value, indent=2) + '\''\\\\n'\'')\\n    temporary.replace(path)\\n\\n\\ndef main():\\n    ap = argparse.ArgumentParser(description=__doc__)\\n    ap.add_argument('\''--out'\'', type=Path, required=True)\\n    ap.add_argument('\''--groups'\'', type=int, default=6)\\n    ap.add_argument('\''--samples-per-group'\'', type=int, default=5)\\n    args = ap.parse_args()\\n    assert args.groups >= 4 and args.samples_per_group >= 3\\n    assert not args.out.exists()\\n    for filename, expected in PINS.items():\\n        assert sha256(Path(filename).read_bytes()).hexdigest() == expected, filename\\n    used = subprocess.check_output(['\''ixsmi'\'', '\''--query-gpu=memory.used'\'', '\''--format=csv,noheader'\''], text=True)\\n    assert int(used.split()[0]) < 256, '\''Card is not idle'\''\\n    args.out.mkdir(parents=True)\\n    sys.path[:0] = ['\''/root/e214/candidate-a1/gems/src'\'', '\''/root/e227'\'']\\n    import torch\\n    from joint import B, CANDIDATE, HEAD, HEAD_SHA, I, L, X, JointProbe, bits, initialize\\n    assert CANDIDATE in Path(I.__file__).resolve().parents\\n    assert sha256(Path(HEAD.__file__).read_bytes()).hexdigest() == HEAD_SHA\\n    torch.set_num_threads(4)\\n    torch.manual_seed(251214)\\n    started = time.monotonic()\\n    result = dict(scope='\''E251_v2_conditioned_actual_two_step_default_stream_graph'\'',\\n        method_version=2, supersedes_v1_cost_gate=True,\\n        predecessor_sha256='\''62f812f657a27e25043b338583380ae099aef68ff2d119eed4da68073658b9f5'\'',\\n        v1_limit='\''Unconditioned entry and two-step exit can leave one shifted post-flush disturbance outside the interval; any v1 cost gate is exploratory only.'\'',\\n        entry_condition='\''One same-arm actual prefix-step graph immediately before the start event; true sample and KV carry into the measured pair'\'',\\n        wrapper_sha256=sha256(Path(__file__).read_bytes()).hexdigest(), source_pins=PINS,\\n        build=json.loads((CANDIDATE / '\''build.json'\'').read_text()),\\n        gate=dict(ordinary_minimum_median_paired_saving_ms_per_step=0.10,\\n                  cross_refresh1_median_saving_must_be_nonnegative=True,\\n                  all_full_layer_logits_sample_KV_parity_required=True),\\n        timed_record=False, timed_first_logits_retained=False, retained_layers_for_parity_only=True,\\n        baseline_flush_start='\''after layer41 attention on default stream'\'',\\n        treatment_flush_start='\''after sampler on default stream; before next step'\'',\\n        distinction_from_E233='\''E233 starts a side-stream flush at attention tail and joins after sampler; this starts the same work only after sampler and never uses another stream.'\'',\\n        cases={}, complete=False, errors=[])\\n    write(args.out / '\''result.json'\'', result)\\n    with torch.inference_mode():\\n        probe = JointProbe()\\n        probe.offset = (torch.arange(B, device=probe.device) == 0).long()\\n        original_flush = probe.writer.flush\\n        state = {'\''arm'\'': '\''attention_tail'\'', '\''deferred'\'': False, '\''forward_calls'\'': 0, '\''actual_flush_calls'\'': 0}\\n\\n        def intercepted_flush():\\n            # Called at the exact original Probe.attention layer41 call site.\\n            assert probe.writer.pending_layers == list(range(L))\\n            assert not state['\''deferred'\''], '\''A previous step left KV writes pending'\''\\n            if state['\''arm'\''] == '\''sample_tail'\'':\\n                state['\''deferred'\''] = True\\n            else:\\n                original_flush()\\n                state['\''actual_flush_calls'\''] += 1\\n\\n        probe.writer.flush = intercepted_flush\\n\\n        def begin(arm):\\n            assert not state['\''deferred'\''] and not probe.writer.pending_layers\\n            state.update(arm=arm, deferred=False, forward_calls=0, actual_flush_calls=0)\\n            probe.configure('\''control'\'')\\n\\n        def decode_step(token, route, retain):\\n            assert not state['\''deferred'\''] and not probe.writer.pending_layers\\n            logits, layers = probe.forward(token, (route,), record=retain)\\n            sampled = probe.sample(logits).reshape(B)\\n            if state['\''arm'\''] == '\''sample_tail'\'':\\n                assert state['\''deferred'\'']\\n                original_flush()\\n                state['\''actual_flush_calls'\''] += 1\\n                state['\''deferred'\''] = False\\n            assert not state['\''deferred'\''] and not probe.writer.pending_layers\\n            state['\''forward_calls'\''] += 1\\n            return logits, layers, sampled\\n\\n        def pair(initial_token, routes, retain):\\n            first = decode_step(initial_token, routes[0], retain)\\n            # The second input is the actual first sample tensor, not a forced\\n            # token, cached output, precomputed draft or replayed hidden state.\\n            first_token = first[2]\\n            if not retain:\\n                # The production lifecycle needs only the sampled token for\\n                # the next step. Do not pin the first 33MB logits buffer across\\n                # the second step merely to make post-hoc graph inspection easy.\\n                del first\\n            second = decode_step(first_token, routes[1], retain)\\n            assert state['\''forward_calls'\''] == state['\''actual_flush_calls'\''] == 2\\n            assert probe.projections == 2 * L and probe.recipient_calls == 68 and probe.weight_bytes == 0\\n            return (first, second) if retain else (first_token, second)\\n\\n        try:\\n            for name, base, expected_refresh in CASES:\\n                # One actual preceding step conditions the ENTRY boundary with\\n                # the same arm'\''s flush ordering. Only the following two steps\\n                # are timed. No restore/sync/D2H is inserted between these graphs.\\n                begin('\''attention_tail'\'')\\n                prefix_route, _, token, _ = initialize(probe, base - 1)\\n                route0 = probe.route(prefix_route[0] + 1)\\n                route1 = probe.route(prefix_route[0] + 2)\\n                routes = (route0, route1)\\n                all_routes = (prefix_route, *routes)\\n                indices = probe.indices(*all_routes)\\n                initial = probe.snapshot(0, indices)\\n                expected_epoch = initial[1][0]\\n                snapshots, wanted_full, refresh_rows = [], [], []\\n                probe.restore(initial, indices)\\n                begin('\''attention_tail'\'')\\n                next_token = token\\n                for step, route in enumerate(all_routes):\\n                    observed = decode_step(next_token, route, True)\\n                    wanted_full.append(observed)\\n                    snapshot = probe.snapshot(0, indices)\\n                    epoch = snapshot[1][0]\\n                    changed = (epoch != expected_epoch).sum(dim=1).tolist()\\n                    expected_count = (0, *expected_refresh)[step]\\n                    assert changed == [expected_count] * len(X.ANCHORS), (name, step, changed)\\n                    refresh_rows.append(changed)\\n                    expected_epoch = epoch\\n                    snapshots.append(snapshot)\\n                    next_token = observed[2]\\n                assert state['\''forward_calls'\''] == state['\''actual_flush_calls'\''] == 3\\n                terminal = snapshots[-1]\\n                probe.restore(initial, indices)\\n                begin('\''sample_tail'\'')\\n                next_token = token\\n                for step, route in enumerate(all_routes):\\n                    observed = decode_step(next_token, route, True)\\n                    wanted = wanted_full[step]\\n                    assert bits(observed[0], wanted[0]) and bits(observed[2], wanted[2]), (name, step, '\''logits/sample'\'')\\n                    assert len(observed[1]) == len(wanted[1]) == L\\n                    assert all(bits(a,b) for actual, expected in zip(observed[1], wanted[1], strict=True)\\n                               for a,b in zip(actual, expected, strict=True)), (name, step, '\''layer_trace'\'')\\n                    diff = probe.state_diff(snapshots[step], 0, indices)\\n                    assert not diff, (name, step, '\''KV/selection/tags'\'', diff)\\n                    next_token = observed[2]\\n                wanted_prefix_token = wanted_full[0][2].clone()\\n                wanted_minimal = [(None, wanted_full[1][2].clone()),\\n                                  (wanted_full[2][0].clone(), wanted_full[2][2].clone())]\\n                # Full three-step traces and logits were checked above. Keep\\n                # only small boundary tokens and the final logits for graph\\n                # validation; timed current-step layer/logits retention is off.\\n                del wanted_full, observed, wanted, next_token\\n                snapshots.clear()\\n                torch.cuda.synchronize()\\n\\n                def prefix_forward():\\n                    result = decode_step(token, prefix_route, False)\\n                    assert state['\''forward_calls'\''] == state['\''actual_flush_calls'\''] == 1\\n                    assert probe.projections == L and probe.recipient_calls == 34 and probe.weight_bytes == 0\\n                    return result[2]\\n\\n                def verify(prefix_token, output):\\n                    assert bits(prefix_token, wanted_prefix_token), (name, '\''conditioner sample'\'')\\n                    first_token, (last_logits, layers, last_token) = output\\n                    assert not layers, '\''Timed graph must not retain layer trace'\''\\n                    assert bits(first_token, wanted_minimal[0][1]), (name, 0, '\''graph sample'\'')\\n                    assert bits(last_logits, wanted_minimal[1][0]) and bits(last_token, wanted_minimal[1][1]), (name, 1, '\''graph output'\'')\\n                    diff = probe.state_diff(terminal, 0, indices)\\n                    assert not diff, (name, '\''graph terminal KV'\'', diff)\\n\\n                graphs, conditioners, outputs, prefix_tokens, markers = {}, {}, {}, {}, {}\\n                for arm in ARMS:\\n                    probe.restore(initial, indices)\\n                    begin(arm)\\n                    eager_prefix_token = prefix_forward()\\n                    begin(arm)\\n                    eager = pair(eager_prefix_token, routes, False)\\n                    verify(eager_prefix_token, eager)\\n                    del eager, eager_prefix_token\\n\\n                    probe.restore(initial, indices)\\n                    begin(arm)\\n                    conditioner = torch.cuda.CUDAGraph()\\n                    with torch.cuda.graph(conditioner):\\n                        prefix_token = prefix_forward()\\n                    prefix_capture = dict(forward_calls=state['\''forward_calls'\''], actual_flush_calls=state['\''actual_flush_calls'\''])\\n                    # This synchronization belongs only to setup/capture, never\\n                    # to the timed conditioner -> start-event -> pair sequence.\\n                    probe.restore(initial, indices)\\n                    conditioner.replay()\\n                    torch.cuda.synchronize()\\n                    begin(arm)\\n                    graph = torch.cuda.CUDAGraph()\\n                    with torch.cuda.graph(graph):\\n                        output = pair(prefix_token, routes, False)\\n                    markers[arm] = dict(prefix_capture=prefix_capture,\\n                        timed_capture_forward_calls=state['\''forward_calls'\''],\\n                        timed_capture_actual_flush_calls=state['\''actual_flush_calls'\''],\\n                        captured_pending_layers=list(probe.writer.pending_layers),\\n                        timed_projections=probe.projections, timed_recipients=probe.recipient_calls,\\n                        weight_replay_bytes=probe.weight_bytes)\\n                    probe.restore(initial, indices)\\n                    counter_before = int(probe.writer.counter.item())\\n                    conditioner.replay()\\n                    graph.replay()\\n                    torch.cuda.synchronize()\\n                    delta = int(probe.writer.counter.item()) - counter_before\\n                    assert delta == 3, (name, arm, '\''one prefix plus two timed flushes'\'', delta)\\n                    markers[arm]['\''actual_conditioned_trial_flush_counter_delta'\''] = delta\\n                    verify(prefix_token, output)\\n                    graphs[arm], conditioners[arm] = graph, conditioner\\n                    outputs[arm], prefix_tokens[arm] = output, prefix_token\\n\\n                raw = {arm: [] for arm in ARMS}\\n                timed_flush_before = int(probe.writer.counter.item())\\n                start, end = torch.cuda.Event(enable_timing=True), torch.cuda.Event(enable_timing=True)\\n                start.record(); end.record(); end.synchronize()\\n                for group in range(args.groups):\\n                    order = ARMS if group % 2 == 0 else ARMS[::-1]\\n                    for arm in order:\\n                        samples = []\\n                        for _ in range(args.samples_per_group):\\n                            probe.restore(initial, indices)\\n                            conditioners[arm].replay()\\n                            # CRITICAL BOUNDARY: only an external timing event\\n                            # lies between the same-arm actual prefix graph and\\n                            # the timed actual two-step graph. No D2H, restore,\\n                            # synchronization, parity check, or kernel intervenes.\\n                            start.record()\\n                            graphs[arm].replay()\\n                            end.record()\\n                            end.synchronize()\\n                            samples.append(start.elapsed_time(end))\\n                        verify(prefix_tokens[arm], outputs[arm])\\n                        raw[arm].append(samples)\\n                timed_flush_delta = int(probe.writer.counter.item()) - timed_flush_before\\n                expected_counter_delta = 3 * len(ARMS) * args.groups * args.samples_per_group\\n                assert timed_flush_delta == expected_counter_delta, (name, '\''conditioned trial flush count'\'', timed_flush_delta)\\n                group_medians = {arm: [median(values) for values in groups] for arm, groups in raw.items()}\\n                paired = [(a-b)/2 for a,b in zip(group_medians['\''attention_tail'\''], group_medians['\''sample_tail'\''], strict=True)]\\n                entry = dict(parity=True, retained_trace_layers_per_step=L, parity_steps=3,\\n                    base=base, prefix_positions=prefix_route[0].tolist(), positions=[r[0].tolist() for r in routes],\\n                    expected_refresh_per_step=list(expected_refresh),\\n                    actual_epoch_changed_rows_by_anchor_including_prefix=refresh_rows,\\n                    true_prefix_sample_feeds_first_timed_step=True,\\n                    true_next_token_from_first_sample=True, no_cross_step_write_debt=True,\\n                    timing_unit='\''two complete consecutive decode steps, immediately after a same-arm real prefix graph'\'',\\n                    prefix_graph_timed=False, prefix_to_timed_pair_interventions=['\''external start event only'\''],\\n                    timed_record=False, timed_first_logits_retained=False,\\n                    all_trials_prefix_plus_pair_flush_counter_delta=timed_flush_delta,\\n                    expected_all_trials_flush_counter_delta=expected_counter_delta,\\n                    capture_and_actual_flush_markers=markers,\\n                    groups_pair_ms=raw, group_median_pair_ms=group_medians,\\n                    median_pair_ms={arm:median(group_medians[arm]) for arm in ARMS},\\n                    mean_pair_ms={arm:mean([v for group in raw[arm] for v in group]) for arm in ARMS},\\n                    paired_group_saving_ms_per_step=paired,\\n                    median_paired_saving_ms_per_step=median(paired),\\n                    mean_paired_saving_ms_per_step=mean(paired),\\n                    minimum_group_saving_ms_per_step=min(paired), maximum_group_saving_ms_per_step=max(paired))\\n                result['\''cases'\''][name] = entry\\n                write(args.out / '\''result.json'\'', result)\\n                print(json.dumps(dict(case=name, parity=True, conditioned_entry=True,\\n                    median_pair_ms=entry['\''median_pair_ms'\''], paired_saving_ms_per_step=paired,\\n                    median_saving_ms_per_step=median(paired))), flush=True)\\n                del graphs, conditioners, outputs, prefix_tokens, output, prefix_token\\n                del wanted_minimal, wanted_prefix_token, terminal, initial\\n            ordinary = result['\''cases'\'']['\''ordinary_pair'\'']['\''median_paired_saving_ms_per_step'\'']\\n            refresh = result['\''cases'\'']['\''cross_refresh1_pair'\'']['\''median_paired_saving_ms_per_step'\'']\\n            passed = ordinary >= .10 and refresh >= 0\\n            result.update(complete=True, cost_gate_pass=passed,\\n                decision='\''CONSIDER_SERVICE_VALIDATION_ONLY'\'' if passed else '\''NO_GAIN_OR_BELOW_GATE_DO_NOT_CHANGE_PRODUCTION'\'',\\n                note='\''This remains an isolated real-math graph. No official service throughput or math qualification is claimed. A zero result also constrains the post-flush-interference hypothesis.'\'')\\n        except Exception as exc:\\n            result['\''errors'\''].append(dict(error=repr(exc), traceback=traceback.format_exc()))\\n            result['\''decision'\''] = '\''STOP_EARLIEST_MISSING_MARKER'\''\\n            raise\\n        finally:\\n            probe.writer.flush = original_flush\\n            result['\''elapsed_wall_s'\''] = time.monotonic() - started\\n            write(args.out / '\''result.json'\'', result)\\n\\n\\nif __name__ == '\''__main__'\'':\\n    main()\\n\"},{\"remote\":\"/root/e245/p2_row_a3/run_p2.py\",\"sha256\":\"e4f1682158de23d856fb37531d899daf71fb0008cb3cbc0d44757a399d1d90fe\",\"content\":\"\\\"\\\"\\\"One owned E214 service: real-text W8a/W8b self-control then row-W4.\\n\\nThis diagnostic changes sampled outputs to a fixed real-text continuation and\\nholds admission to obtain a reproducible B64. It is not a benchmark command.\\nFrozen source files and dispatch registrations remain untouched on disk.\\n\\\"\\\"\\\"\\nfrom __future__ import annotations\\nimport argparse\\nfrom hashlib import sha256\\nimport json\\nimport os\\nfrom pathlib import Path\\nimport runpy\\nimport signal\\nimport subprocess\\nimport sys\\nimport time\\n\\nimport numpy as np\\nimport requests\\n\\n\\ndef digest(path):\\n    return sha256(path.read_bytes()).hexdigest()\\n\\n\\ndef write(path, value):\\n    temporary = path.with_suffix(path.suffix + \\\".tmp\\\")\\n    temporary.write_text(json.dumps(value, indent=2) + \\\"\\\\n\\\")\\n    temporary.replace(path)\\n\\n\\ndef build_cases(model, texts):\\n    from transformers import AutoTokenizer\\n    tokenizer = AutoTokenizer.from_pretrained(model, local_files_only=True, trust_remote_code=True)\\n    books, hashes = {}, {}\\n    for book in (1342, 1400, 2009):\\n        path = texts / f\\\"{book}.txt\\\"\\n        raw = path.read_bytes()\\n        hashes[str(book)] = sha256(raw).hexdigest()\\n        books[book] = tokenizer.encode(raw.decode(\\\"utf-8\\\"), add_special_tokens=False)\\n    cases = []\\n    # Fixed, uncalibrated real text; unique histories are not fitted to the model.\\n    # 17 generated positions = first prefill prediction + 16 genuine decode steps.\\n    for i in range(8):\\n        book = (1342, 1400, 2009)[i % 3]\\n        end = 65536 + (i // 3) * 8192\\n        prompt, target = books[book][end-4096:end], books[book][end:end+17]\\n        assert len(prompt) == 4096 and len(target) == 17, (book, end, len(books[book]))\\n        cases.append(dict(case_id=f\\\"h{i}\\\", book=book, start=end-4096, stop=end,\\n            text_sha256=hashes[str(book)], prompt_ids=prompt, target_ids=target,\\n            prompt_sha256=sha256(np.asarray(prompt, dtype=\\\"<i4\\\").tobytes()).hexdigest()))\\n    return dict(scope=\\\"real books; 8 unique histories, each replicated 8 times; no calibration\\\",\\n        cases=cases, steps=17, pure_decode_steps=16, batch=64, text_sha256=hashes,\\n        tokenizer_files={p.name: digest(p) for p in Path(model).glob(\\\"tokenizer*\\\") if p.is_file()})\\n\\n\\ndef score(out, first, second, cfg):\\n    rows, exact = [], True\\n    events = [json.loads(line) for line in (out / \\\"events.jsonl\\\").read_text().splitlines()]\\n    meta = {(e[\\\"label\\\"], e[\\\"case_id\\\"], e[\\\"step\\\"]): e for e in events if e[\\\"stage\\\"] == \\\"logits\\\"}\\n    for case in cfg[\\\"cases\\\"]:\\n        records = []\\n        for step in range(cfg[\\\"steps\\\"]):\\n            keys = [(label, case[\\\"case_id\\\"], step) for label in (first, second)]\\n            for key in keys:\\n                m = meta[key]\\n                assert m[\\\"batch_rows\\\"] == 64\\n                assert m[\\\"query_tokens\\\"] == (16 if step == 0 else 1), m\\n                assert m[\\\"scheduled_tokens\\\"] == (1024 if step == 0 else 64), m\\n            a32, b32 = (np.load(out / \\\"logits\\\" / meta[key][\\\"filename\\\"]) for key in keys)\\n            bitwise = bool(np.array_equal(a32.view(np.uint32), b32.view(np.uint32)))\\n            exact &= bitwise\\n            a, b = a32.astype(np.float64), b32.astype(np.float64)\\n            la = a - a.max(); la -= np.log(np.exp(la).sum())\\n            lb = b - b.max(); lb -= np.log(np.exp(lb).sum())\\n            target = case[\\\"target_ids\\\"][step]\\n            records.append(dict(step=step, boundary=\\\"prefill\\\" if step == 0 else \\\"pure_decode_B64\\\",\\n                bitwise=bitwise, max_abs_logits=float(np.max(np.abs(a-b))),\\n                kl_control_to_candidate=float((np.exp(la) * (la-lb)).sum()),\\n                delta_nll=float(la[target]-lb[target]), top1_same=bool(np.argmax(a)==np.argmax(b))))\\n        active = records[1:]\\n        rows.append(dict(case_id=case[\\\"case_id\\\"], book=case[\\\"book\\\"],\\n            mean_kl=float(np.mean([r[\\\"kl_control_to_candidate\\\"] for r in active])),\\n            mean_delta_nll=float(np.mean([r[\\\"delta_nll\\\"] for r in active])),\\n            top1_agreement=float(np.mean([r[\\\"top1_same\\\"] for r in active])), records=records))\\n    return dict(bitwise_all_positions=exact, unique_histories=8, repetitions_per_history=8,\\n        unique_decode_positions=128, scope=\\\"actual E214 A8 and packed KV; 4096 prefixes; teacher forcing\\\",\\n        mean_kl=float(np.mean([r[\\\"mean_kl\\\"] for r in rows])),\\n        mean_delta_nll=float(np.mean([r[\\\"mean_delta_nll\\\"] for r in rows])),\\n        max_history_delta_nll=float(max(r[\\\"mean_delta_nll\\\"] for r in rows)),\\n        top1_agreement=float(np.mean([r[\\\"top1_agreement\\\"] for r in rows])), rows=rows)\\n\\n\\ndef main():\\n    ap = argparse.ArgumentParser()\\n    ap.add_argument(\\\"--out\\\", type=Path, required=True)\\n    ap.add_argument(\\\"--source-control\\\", type=Path, default=Path(\\\"/root/e241\\\"))\\n    ap.add_argument(\\\"--frozen\\\", type=Path, default=Path(\\\"/root/e214/candidate-a1\\\"))\\n    ap.add_argument(\\\"--model\\\", type=Path, default=Path(\\\"/workspace/MiniCPM5-2B\\\"))\\n    ap.add_argument(\\\"--texts\\\", type=Path, default=Path(\\\"/root/e139/texts\\\"))\\n    ap.add_argument(\\\"--url\\\", default=\\\"http://127.0.0.1:9031\\\")\\n    ap.add_argument(\\\"--max-runtime\\\", type=float, default=420)\\n    args = ap.parse_args()\\n    root, out = Path(__file__).resolve().parent, args.out.resolve()\\n    assert not out.exists()\\n    used = subprocess.check_output([\\\"ixsmi\\\", \\\"--query-gpu=memory.used\\\", \\\"--format=csv,noheader\\\"], text=True)\\n    assert int(used.split()[0]) < 256, used\\n    try:\\n        occupied = requests.get(args.url + \\\"/v1/models\\\", timeout=1)\\n        raise RuntimeError(f\\\"A service already owns the pinned port: HTTP {occupied.status_code}\\\")\\n    except requests.RequestException:\\n        pass\\n    out.mkdir(); (out / \\\"logits\\\").mkdir()\\n    cfg = build_cases(args.model, args.texts)\\n    write(out / \\\"cases.json\\\", cfg)\\n    command_path = args.source_control / \\\"frozen_commands.json\\\"\\n    command = json.loads(command_path.read_text())\\n    for relative, expected in command[\\\"candidate_sources\\\"].items():\\n        assert digest(args.frozen / relative) == expected, relative\\n    build_path, bytelevel_path = (args.source_control / name for name in (\\\"build_bytelevel.py\\\", \\\"bytelevel.py\\\"))\\n    build = runpy.run_path(str(build_path))[\\\"build\\\"]\\n    plugin = out / \\\"plugin\\\"\\n    assert build(args.frozen / \\\"plugin\\\", bytelevel_path, plugin) == command[\\\"bytelevel_registration\\\"]\\n    gems = args.frozen / \\\"gems/src\\\"\\n    serve = [\\\"/usr/local/bin/vllm\\\", *command[\\\"serve\\\"][1:]]\\n    assert serve[serve.index(\\\"--port\\\") + 1] == args.url.rsplit(\\\":\\\", 1)[1]\\n    write(out / \\\"phase.json\\\", dict(stage=\\\"idle\\\", arm=\\\"w8\\\", label=\\\"\\\"))\\n    sources = {str(p): digest(p) for p in [*root.glob(\\\"*.py\\\"), root.parent / \\\"codec_controls.py\\\",\\n        command_path, build_path, bytelevel_path]}\\n    result = dict(scope=\\\"ISOLATED_E214_ROW_W4_REALTEXT_P2_NOT_OFFICIAL_MATH_OR_SPEED\\\",\\n        production_unchanged=True, source_sha256=sources, commands=dict(serve=serve),\\n        boundary=\\\"row W4 expanded int8(q4*16), FP32 scale/16, original E214 kernels\\\",\\n        prefill_and_decode_same_candidate_weights=True, fixed_admission_diagnostic_only=True,\\n        arms={}, complete=False)\\n    write(out / \\\"result.json\\\", result)\\n    env = {k: v for k, v in os.environ.items() if k != \\\"PYTHONPATH\\\" and not k.startswith(\\\"VLLM_\\\")}\\n    env.update(VLLM_PLUGINS=\\\"fl\\\", E245_P2_OUT=str(out),\\n        PYTHONPATH=os.pathsep.join(map(str, (root, root.parent, gems, plugin))))\\n    started = time.monotonic()\\n    deadline = started + args.max_runtime\\n    def remaining():\\n        value = deadline - time.monotonic()\\n        if value <= 0:\\n            raise TimeoutError(\\\"P2 owned service runtime budget exhausted\\\")\\n        return value\\n    def post(path, data=None):\\n        r = requests.post(args.url + path, json=data, timeout=min(120, remaining()))\\n        r.raise_for_status()\\n        return r\\n    with (out / \\\"serve.log\\\").open(\\\"w\\\") as log:\\n        child = subprocess.Popen(serve, cwd=\\\"/workspace\\\", env=env,\\n            stdout=log, stderr=subprocess.STDOUT, start_new_session=True)\\n        previous_handlers = {sig: signal.getsignal(sig) for sig in (signal.SIGTERM, signal.SIGINT)}\\n        def interrupted(signum, _frame):\\n            raise TimeoutError(f\\\"P2 driver interrupted by signal {signum}; cleaning owned service\\\")\\n        for sig in previous_handlers:\\n            signal.signal(sig, interrupted)\\n        try:\\n            print(\\\"P2 loading isolated E214 service\\\", flush=True)\\n            while True:\\n                assert child.poll() is None, child.returncode\\n                remaining()\\n                try:\\n                    if requests.get(args.url + \\\"/v1/models\\\", timeout=2).ok:\\n                        break\\n                except requests.RequestException:\\n                    pass\\n                time.sleep(0.5)\\n            for label, arm in ((\\\"w8a\\\", \\\"w8\\\"), (\\\"w8b\\\", \\\"w8\\\"), (\\\"row\\\", \\\"row\\\")):\\n                if label == \\\"row\\\":\\n                    control = score(out, \\\"w8a\\\", \\\"w8b\\\", cfg)\\n                    result[\\\"control_repeat\\\"] = control\\n                    write(out / \\\"result.json\\\", result)\\n                    if not control[\\\"bitwise_all_positions\\\"]:\\n                        result[\\\"decision\\\"] = \\\"INCONCLUSIVE_CONTROL_REPLAY_NOT_BITWISE_NO_ROW_ARM_RUN\\\"\\n                        return\\n                # The isolated scheduler clears stale KV before admitting this\\n                # arm'\''s first seed. No optional developer HTTP route is used.\\n                write(out / \\\"phase.json\\\", dict(stage=\\\"idle\\\", arm=arm, label=label))\\n                write(out / \\\"phase.json\\\", dict(stage=\\\"seed\\\", arm=arm, label=label))\\n                for case in cfg[\\\"cases\\\"]:\\n                    seed = post(\\\"/v1/completions\\\", dict(model=\\\"minicpm\\\", prompt=case[\\\"prompt_ids\\\"], max_tokens=1,\\n                        temperature=0, ignore_eos=True, add_special_tokens=False, return_token_ids=True)).json()\\n                    assert seed[\\\"usage\\\"][\\\"completion_tokens\\\"] == 1 and len(seed[\\\"choices\\\"]) == 1\\n                # One API batch; scheduler diagnostic releases its 64 prompts together.\\n                prompts = [c[\\\"prompt_ids\\\"] for c in cfg[\\\"cases\\\"] for _ in range(8)]\\n                write(out / \\\"phase.json\\\", dict(stage=\\\"eval\\\", arm=arm, label=label))\\n                payload = post(\\\"/v1/completions\\\", dict(model=\\\"minicpm\\\", prompt=prompts,\\n                    max_tokens=cfg[\\\"steps\\\"], temperature=0, ignore_eos=True,\\n                    add_special_tokens=False, return_token_ids=True)).json()\\n                choices = sorted(payload[\\\"choices\\\"], key=lambda v: v[\\\"index\\\"])\\n                assert len(choices) == 64\\n                for i, choice in enumerate(choices):\\n                    assert choice.get(\\\"token_ids\\\") == cfg[\\\"cases\\\"][i // 8][\\\"target_ids\\\"], (label, i, choice)\\n                events = [json.loads(line) for line in (out / \\\"events.jsonl\\\").read_text().splitlines()]\\n                cache = [e for e in events if e[\\\"stage\\\"] == \\\"cache_prefix\\\" and e[\\\"label\\\"] == label]\\n                cold = [e for e in cache if e[\\\"phase\\\"] == \\\"seed\\\"]\\n                warm = [e for e in cache if e[\\\"phase\\\"] == \\\"eval\\\"]\\n                resets = [e for e in events if e[\\\"stage\\\"] == \\\"prefix_cache_reset\\\" and e[\\\"label\\\"] == label]\\n                assert len(resets) == 1 and resets[0][\\\"returned_true\\\"] and resets[0][\\\"running_requests\\\"] == 0\\n                assert len(cold) == 8 and all(e[\\\"computed_tokens\\\"] == 0 for e in cold)\\n                assert len(warm) == 64 and all(e[\\\"computed_tokens\\\"] == 4080 for e in warm)\\n                result[\\\"arms\\\"][label] = dict(forced_tokens_all64_exact=True,\\n                    completion_tokens=payload[\\\"usage\\\"][\\\"completion_tokens\\\"],\\n                    real_cold_prefills=8, seeded_prefix_hits=64, prefix_reset_verified_from_scheduler=True,\\n                    prefix_reset_event=resets[0],\\n                    elapsed_s=time.monotonic()-started)\\n                write(out / \\\"result.json\\\", result)\\n                print(json.dumps(dict(stage=\\\"arm_complete\\\", label=label, **result[\\\"arms\\\"][label])), flush=True)\\n                write(out / \\\"phase.json\\\", dict(stage=\\\"idle\\\", arm=arm, label=label))\\n            result[\\\"row_quality\\\"] = score(out, \\\"w8a\\\", \\\"row\\\", cfg)\\n            result.update(complete=True, decision=\\\"REVIEW_ACTUAL_ROW_W4_P2_OFFICIAL_MATH_STILL_REQUIRED\\\")\\n        except Exception as exc:\\n            result.update(error=dict(type=type(exc).__name__, message=str(exc)),\\n                decision=\\\"STOP_EARLIEST_MISSING_MARKER_REPAIR_REQUIRED\\\")\\n            raise\\n        finally:\\n            result[\\\"elapsed_s\\\"] = time.monotonic() - started\\n            # A second TERM must not interrupt cleanup of the independent PG.\\n            for sig in previous_handlers:\\n                signal.signal(sig, signal.SIG_IGN)\\n            try:\\n                try:\\n                    write(out / \\\"result.json\\\", result)\\n                    write(out / \\\"phase.json\\\", dict(stage=\\\"idle\\\", arm=\\\"w8\\\", label=\\\"\\\"))\\n                finally:\\n                    if child.poll() is None:\\n                        os.killpg(child.pid, signal.SIGTERM)\\n                        try:\\n                            child.wait(timeout=15)\\n                        except subprocess.TimeoutExpired:\\n                            os.killpg(child.pid, signal.SIGKILL)\\n                            child.wait()\\n            finally:\\n                for sig, handler in previous_handlers.items():\\n                    signal.signal(sig, handler)\\n    print(json.dumps(result.get(\\\"row_quality\\\", {})), flush=True)\\n\\n\\nif __name__ == \\\"__main__\\\":\\n    main()\\n\"},{\"remote\":\"/root/e245/p2_row_a3/p2_observer.py\",\"sha256\":\"40c48fe44387be699938f9aa78581bd011f9a7be8c6f7f68af2fe85104078f0d\",\"content\":\"\\\"\\\"\\\"Production E214 arithmetic, row W4 image substitution, fixed real-text replay.\\n\\nNever enabled without E245_P2_OUT. Expanded W4 is a numerical surrogate,\\nnot a memory-saving implementation or performance measurement.\\n\\\"\\\"\\\"\\nfrom functools import wraps\\nfrom hashlib import sha256\\nimport json\\nimport os\\nfrom pathlib import Path\\nimport re\\nimport time\\n\\nROOT = Path(os.environ[\\\"E245_P2_OUT\\\"])\\n\\n\\ndef phase():\\n    return json.loads((ROOT / \\\"phase.json\\\").read_text())\\n\\n\\ndef event(stage, **data):\\n    with (ROOT / \\\"events.jsonl\\\").open(\\\"a\\\") as f:\\n        f.write(json.dumps(dict(stage=stage, pid=os.getpid(), time=time.time(), **data)) + \\\"\\\\n\\\")\\n\\n\\ndef attach_cache(cls):\\n    original = cls.get_computed_blocks\\n\\n    @wraps(original)\\n    def computed(self, request):\\n        result = original(self, request)\\n        p = phase()\\n        if p.get(\\\"stage\\\") in (\\\"seed\\\", \\\"eval\\\"):\\n            expected = 0 if p[\\\"stage\\\"] == \\\"seed\\\" else 4080\\n            event(\\\"cache_prefix\\\", label=p[\\\"label\\\"], phase=p[\\\"stage\\\"],\\n                request_id=request.request_id, prompt_tokens=request.num_prompt_tokens,\\n                computed_tokens=result[1], expected=expected)\\n            assert request.num_prompt_tokens == 4096 and result[1] == expected, (\\n                \\\"P2 prefix reset/seed proof failed\\\", p, result[1], expected)\\n        return result\\n\\n    cls.get_computed_blocks = computed\\n\\n\\ndef attach_scheduler(cls):\\n    \\\"\\\"\\\"Hold only a diagnostic eval admission until its entire B64 is queued.\\n\\n    No blocking wait: an empty ordinary scheduling pass lets EngineCore poll\\n    further requests. Original queues are restored before returning.\\n    \\\"\\\"\\\"\\n    from vllm.v1.core.sched.request_queue import create_request_queue\\n    original = cls.schedule\\n    admitted, first_seen, reset_labels = set(), {}, set()\\n\\n    @wraps(original)\\n    def schedule(self, *args, **kwargs):\\n        p = phase()\\n        label = p.get(\\\"label\\\", \\\"\\\")\\n        if p.get(\\\"stage\\\") == \\\"seed\\\" and label not in reset_labels and self.waiting:\\n            assert label and not self.running, \\\"P2 prefix reset overlapped running requests\\\"\\n            for name in (\\\"kv_holding_waiting\\\", \\\"async_kv_waiting\\\", \\\"deferred_waiting\\\"):\\n                assert not getattr(self, name, ()), (\\\"unexpected deferred queue at reset\\\", name)\\n            # Driver sends each seed synchronously. A queued, unallocated seed\\n            # is allowed; no live request may still own KV blocks.\\n            waiting = len(self.waiting)\\n            assert waiting == 1, (\\\"P2 first seed must be the only queued request\\\", waiting)\\n            reset = self.