name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Read E253 verified capture and eight matrix results
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''E253FINAL'\''
          from pathlib import Path
          import json, gzip, base64, hashlib, subprocess
          r=Path('\''/root/e253/quality'\'')
          names=['\''guard_state.json'\'','\''done.json'\'','\''source_manifest.json'\'','\''capture-a1/result.json'\'','\''capture-a1/copy_precheck/result.json'\'','\''capture-a1/cases_public.json'\'','\''capture-a1/source_manifest.json'\'','\''capture-a1/runtime_sources.json'\'','\''capture-a1/weights.json'\'','\''capture-a1/snapshot_manifest.json'\'','\''capture-a1/raw/calibration/capture.json'\'','\''capture-a1/raw/heldout/capture.json'\'','\''feedback-a1/result.json'\'']
          names += [str(p.relative_to(r)) for p in sorted((r/'\''feedback-a1'\'').glob('\''layer_*/result.json'\''))]
          bundle={}
          for name in names:
           p=r/name
           if p.exists():
            b=p.read_bytes();bundle[name]={'\''sha256'\'':hashlib.sha256(b).hexdigest(),'\''text'\'':b.decode()}
          summary={}
          for name in ('\''done.json'\'','\''capture-a1/result.json'\'','\''feedback-a1/result.json'\''):
           p=r/name
           if p.exists():
            d=json.loads(p.read_text());summary[name]={k:d[k] for k in ('\''status'\'','\''phase'\'','\''decision'\'','\''complete'\'','\''elapsed_host_s'\'','\''service_elapsed_s'\'','\''timings'\'','\''partitions'\'','\''active_matrix'\'','\''mean_heldout_mse_ratio_full_over_rtn'\'','\''max_heldout_mse_ratio_full_over_rtn'\'','\''failure'\'') if k in d}
          p=r/'\''feedback-a1/result.json'\''
          if p.exists():summary['\''matrices'\'']=[{'\''layer'\'':d['\''layer'\''],'\''role'\'':d['\''role'\''],'\''ratios'\'':d['\''heldout_mse_ratios'\'']} for d in json.loads(p.read_text()).get('\''matrices'\'',[])]
          print('\''SUMMARY '\''+json.dumps(summary,sort_keys=True))
          b=json.dumps(bundle,separators=('\'','\'','\'':'\'')).encode();z=gzip.compress(b,mtime=0)
          print('\''BUNDLE_INFO '\''+json.dumps({'\''files'\'':len(bundle),'\''raw_bytes'\'':len(b),'\''gzip_bytes'\'':len(z),'\''sha256'\'':hashlib.sha256(b).hexdigest()}))
          print('\''BUNDLE_GZIP_B64 '\''+base64.b64encode(z).decode())
          print('\''GPU_MEMORY '\''+subprocess.check_output(['\''/usr/local/corex/bin/ixsmi'\'','\''--query-gpu=memory.used'\'','\''--format=csv,noheader'\''],text=True).strip())
          E253FINAL'
