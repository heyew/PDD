name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Run one E253 real text quality service after verified encoding
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''PY'\''
          from pathlib import Path
          import base64,gzip,json,hashlib,subprocess
          quality=Path('\''/root/e253/quality'\'');root=quality/'\''p2'\''
          assert not root.exists() and not (quality/'\''p2-a1'\'').exists()
          parents=json.loads('\''{"capture_contract.py":"ed93d84b0a5c57b17ada34a7016b90578fb41734f6d7bbceea999564dec7a55e","production_pins.json":"73301a8869f95cc169b2602b0c6fd387df5921326d299e4d0c0ebbeafe329438","run_capture.py":"4da673ba86eece06d1f6087de1f0d5431bf44988bd77524ffa17c26964fbc9e5"}'\'')
          for name,h in parents.items():assert hashlib.sha256((quality/name).read_bytes()).hexdigest()==h,name
          encoder=json.loads((quality/'\''encode_guard-a2.json'\'').read_text());assert encoder['\''status'\''] in ('\''STARTING'\'','\''RUNNING'\'','\''COMPLETE'\''),encoder
          payload=json.loads(gzip.decompress(base64.b64decode('\'''\'')))
          root.mkdir()
          for name,v in payload.items():
           b=v['\''text'\''].encode();assert hashlib.sha256(b).hexdigest()==v['\''sha256'\''];(root/name).write_bytes(b)
          print('\''SOURCES '\''+json.dumps({n:v['\''sha256'\''] for n,v in payload.items()}),flush=True)
          with (root/'\''supervisor-a1.log'\'').open('\''xb'\'',buffering=0) as log:
           child=subprocess.Popen(['\''python3'\'',str(root/'\''p2_guard.py'\'')],cwd=root,stdin=subprocess.DEVNULL,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
          print('\''LAUNCHED '\''+json.dumps({'\''guard_pid'\'':child.pid,'\''encoder_status_at_launch'\'':encoder['\''status'\''],'\''one_candidate'\'':True,'\''driver_budget_s'\'':600}),flush=True)
          PY'
