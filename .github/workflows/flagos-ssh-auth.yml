name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Run E253 complete MLP cost screen
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''E253PY'\''
          import base64, hashlib, json, subprocess, sys
          from pathlib import Path
          root=Path("/root/e253")
          assert not root.exists(), "E253 directory already exists; do not overwrite"
          used=subprocess.check_output(["/usr/local/corex/bin/ixsmi","--query-gpu=memory.used","--format=csv,noheader"],text=True).strip()
          assert int(used.split()[0]) < 256, ("GPU not idle; no process stopped",used)
          files=json.loads(base64.b64decode(""))
          root.mkdir()
          manifest={}
          for name,content in files.items():
              assert Path(name).name == name
              (root/name).write_text(content)
              manifest[name]=hashlib.sha256((root/name).read_bytes()).hexdigest()
          (root/"source_manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          log=(root/"guard.log").open("ab",buffering=0)
          p=subprocess.Popen([sys.executable,str(root/"guard.py")],cwd=root,stdin=subprocess.DEVNULL,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
          print(json.dumps({"launched":"E253_P0_A1","guard_pid":p.pid,"gpu_memory_before":used,"source_sha256":manifest},sort_keys=True))
          E253PY'
