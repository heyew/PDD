name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Collect QK8 chain and run frozen all-step service ledger
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''PY'\''
          import json,hashlib,subprocess,sys
          from pathlib import Path
          print("FLAGOS_QK_CHAIN_LEDGER_BEGIN",flush=True)
          for name in ["/root/e246/chain_status.json","/root/e246/chain-a1/result.json"]:
              p=Path(name)
              if p.is_file():print("RESULT_JSON",json.dumps({"path":name,"data":json.loads(p.read_text())}),flush=True)
          p=Path("/root/e246/chain.log")
          if p.is_file():print("QK_CHAIN_LOG_TAIL",json.dumps(p.read_text().splitlines()[-12:]),flush=True)
          status=json.loads(Path("/root/e246/chain_status.json").read_text());assert status["state"]=="completed","QK chain still running"
          used=subprocess.check_output(["/usr/local/corex/bin/ixsmi","--query-gpu=memory.used","--format=csv,noheader"],text=True);assert int(used.split()[0])<256,"Card is not idle"
          root=Path("/root/e244");root.mkdir(exist_ok=False)
          files={"run_ledger.py":"#!/usr/bin/env python3\n\"\"\"One isolated, frozen-E214 service; whole warm-round ledger, all batch sizes.\n\nReads /root/e241/{frozen_commands.json,build_bytelevel.py,bytelevel.py}; never\nmodifies them. Uses the frozen serve argv and the original benchmark subcommand.\nDefault rounds: cold, observer-off warm, warm1 ledger, warm2 ledger, off warm.\nOnly the server process group created by this driver is terminated.\n\nRemote example after copying this directory to a newly assigned experiment dir:\n  python3 run_ledger.py --out ledger_a1\n\"\"\"\nimport argparse\nfrom hashlib import sha256\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport runpy\nimport shutil\nimport signal\nimport subprocess\nimport sys\nimport time\nfrom urllib.error import URLError\nfrom urllib.request import urlopen\n\nROOT = Path(__file__).resolve().parent\n\n\ndef digest(path):\n    return sha256(path.read_bytes()).hexdigest()\n\n\ndef write_json(path, value):\n    path.write_text(json.dumps(value, indent=2) + \"\\n\")\n\n\ndef set_phase(path, value):\n    assert len(value) == 1\n    # Never truncate a file that an EngineCore process has mmap'\''ed.\n    with path.open(\"r+b\", buffering=0) as handle:\n        handle.write(value)\n\n\ndef metrics_snapshot(port):\n    try:\n        with urlopen(f\"http://127.0.0.1:{port}/metrics\", timeout=5) as response:\n            text = response.read().decode()\n        selected = [line for line in text.splitlines() if \"prefix_cache\" in line and not line.startswith(\"#\")]\n        return {\"available\": True, \"prefix_cache_counter_lines\": selected}\n    except (URLError, TimeoutError) as exc:\n        return {\"available\": False, \"error\": repr(exc)}\n\n\ndef main():\n    ap = argparse.ArgumentParser(description=__doc__)\n    ap.add_argument(\"--out\", type=Path, default=Path(\"ledger_a1\"))\n    ap.add_argument(\"--source-control\", type=Path, default=Path(\"/root/e241\"))\n    ap.add_argument(\"--frozen\", type=Path, default=Path(\"/root/e214/candidate-a1\"))\n    ap.add_argument(\"--deadline-seconds\", type=int, default=860,\n                    help=\"Whole driver work deadline; <=880 seconds, then up to 20 seconds to terminate only its own server\")\n    ap.add_argument(\"--short\", action=\"store_true\", help=\"cold/warm1/warm2 only; observer-overhead bracket omitted and explicitly unverified\")\n    args = ap.parse_args()\n    assert 60 <= args.deadline_seconds <= 880\n    job_deadline = time.monotonic() + args.deadline_seconds\n\n    def remaining():\n        seconds = job_deadline - time.monotonic()\n        if seconds <= 0:\n            raise TimeoutError(\"Whole ledger job deadline reached\")\n        return seconds\n    out = args.out if args.out.is_absolute() else ROOT / args.out\n    out.mkdir(parents=False, exist_ok=False)\n    source = args.source_control\n    command_path = source / \"frozen_commands.json\"\n    command = json.loads(command_path.read_text())\n    used = subprocess.check_output([\"ixsmi\", \"--query-gpu=memory.used\", \"--format=csv,noheader\"], text=True)\n    assert int(used.split()[0]) < 256, \"Card is not idle; do not stop or reuse another process\"\n    for rel, sha in command[\"candidate_sources\"].items():\n        assert digest(args.frozen / rel) == sha, rel\n    build_path, bytelevel_path = source / \"build_bytelevel.py\", source / \"bytelevel.py\"\n    build = runpy.run_path(str(build_path))[\"build\"]\n    plugin = out / \"plugin\"\n    assert build(args.frozen / \"plugin\", bytelevel_path, plugin) == command[\"bytelevel_registration\"]\n    benchmark_script = Path(command[\"benchmark\"][1])\n    assert digest(benchmark_script) == command[\"benchmark_sha256\"]\n    benchmark = runpy.run_path(str(benchmark_script))\n    serve = [\"/usr/local/bin/vllm\", *command[\"serve\"][1:]]\n    port = int(serve[serve.index(\"--port\") + 1]) if \"--port\" in serve else 9031\n    assert port == 9031, \"Original E241 subcommand is pinned to port 9031\"\n    try:\n        with urlopen(f\"http://127.0.0.1:{port}/v1/models\", timeout=1):\n            raise RuntimeError(\"A service already owns the frozen port; do not stop it\")\n    except (URLError, TimeoutError):\n        pass\n    client_args = benchmark[\"build_common_args\"](\"/workspace/MiniCPM5-2B\", port, \"minicpm\")\n    client_args.extend([\"--random-input-len\", \"16384\", \"--random-output-len\", \"1024\",\n                        \"--max-concurrency\", \"64\", \"--num-prompts\", \"128\"])\n    observer = out / \"observer\"\n    observer.mkdir()\n    shutil.copyfile(ROOT / \"full_steps.py\", observer / \"full_steps.py\")\n    shutil.copyfile(ROOT / \"observer_sitecustomize.py\", observer / \"sitecustomize.py\")\n    (out / \"phase\").write_bytes(b\"0\")\n    env = {k: v for k, v in os.environ.items()\n           if k != \"PYTHONPATH\" and not k.startswith(\"VLLM_\") and not k.startswith(\"E214_LEDGER\") and k != \"E241_TRACE\"}\n    service_env = dict(env, VLLM_PLUGINS=\"fl\", E214_LEDGER_OUT=str(out),\n                       PYTHONPATH=os.pathsep.join(map(str, (observer, args.frozen / \"gems/src\", plugin))))\n    write_json(out / \"commands.json\", {\n        \"serve\": serve, \"client\": client_args,\n        \"source_control\": str(source), \"frozen\": str(args.frozen),\n        \"control_sha256\": {str(p): digest(p) for p in (command_path, build_path, bytelevel_path)},\n        \"observer_sha256\": {p.name: digest(p) for p in ROOT.glob(\"*.py\")},\n        \"measurement_scope\": \"All actual warm service steps; two stream events per step, sparse stage events; no latency replay, no changed serve or benchmark arguments\",\n        \"cold_trace\": \"Off: first cold request primes preallocated timing event handles outside any measured warm phase\",\n    })\n    phases = [(\"cold\", b\"0\", None)]\n    if not args.short:\n        phases.append((\"warm_off_before\", b\"0\", None))\n    phases.extend([(\"warm1\", b\"1\", \"b1\"), (\"warm2\", b\"2\", \"b2\")])\n    if not args.short:\n        phases.append((\"warm_off_after\", b\"0\", None))\n    rounds = {}\n    with (out / \"serve.log\").open(\"w\") as log:\n        server = subprocess.Popen(serve, env=service_env, cwd=\"/workspace\", stdout=log,\n                                  stderr=subprocess.STDOUT, start_new_session=True)\n        write_json(out / \"owner.json\", {\"driver_pid\": os.getpid(), \"owned_server_pid\": server.pid})\n        try:\n            print(\"loading frozen service\", flush=True)\n            write_json(out / \"stage.json\", {\"stage\": \"loading\", \"wall_time\": time.time()})\n            deadline = min(time.monotonic() + 600, job_deadline)\n            while time.monotonic() < deadline:\n                assert server.poll() is None, server.returncode\n                try:\n                    with urlopen(f\"http://127.0.0.1:{port}/v1/models\", timeout=2):\n                        break\n                except (URLError, TimeoutError):\n                    time.sleep(2)\n            else:\n                raise TimeoutError(\"Frozen service failed to load\")\n            startup = (out / \"serve.log\").read_text()\n            assert \"W8A8: self-check passed\" in startup and \"E157 layers01 anchors denom=8\" in startup\n            assert sorted(map(int, re.findall(r\"E136 deferred writer capture layer=(\\d+)\", startup))) == list(range(42))\n            for name, code, phase in phases:\n                print(name, flush=True)\n                write_json(out / \"stage.json\", {\"stage\": name, \"wall_time\": time.time()})\n                before = metrics_snapshot(port)\n                log_offset = (out / \"serve.log\").stat().st_size\n                set_phase(out / \"phase\", code)\n                client_log = out / f\"{name}.log\"\n                host_start_ns = time.perf_counter_ns()\n                try:\n                    with client_log.open(\"w\") as output:\n                        subprocess.run(client_args, env=env, cwd=\"/workspace\", stdout=output,\n                                       stderr=subprocess.STDOUT, timeout=min(750, remaining()), check=True)\n                finally:\n                    host_end_ns = time.perf_counter_ns()\n                    set_phase(out / \"phase\", b\"0\")\n                if phase is not None:\n                    flush_deadline = min(time.monotonic() + 60, job_deadline)\n                    while not (out / f\"flushed-{phase}.json\").exists():\n                        if (out / \"observer-error.json\").exists():\n                            raise RuntimeError((out / \"observer-error.json\").read_text())\n                        assert server.poll() is None, server.returncode\n                        if time.monotonic() >= flush_deadline:\n                            raise TimeoutError(f\"Observer did not drain {phase}; incomplete trace must not be claimed closed\")\n                        time.sleep(.1)\n                row = benchmark[\"extract_metrics\"](client_log.read_text())\n                assert row[\"successful_requests\"] == 128 and row[\"total_output_tokens\"] == 131072, row\n                with (out / \"serve.log\").open(\"rb\") as handle:\n                    handle.seek(log_offset)\n                    new_log = handle.read().decode(errors=\"replace\")\n                entry = {\"label\": name, \"metrics\": row, \"client_process_host_start_ns\": host_start_ns,\n                         \"client_process_host_end_ns\": host_end_ns,\n                         \"host_boundary_note\": \"Client process span includes startup and dataset work; official benchmark_duration is the authoritative scored window\",\n                         \"prefix_metrics_before\": before, \"prefix_metrics_after\": metrics_snapshot(port),\n                         \"jit_lines\": [line for line in new_log.splitlines() if \"compilations so far\" in line]}\n                rounds[phase or name] = entry\n                write_json(out / f\"{name}_metrics.json\", entry)\n                write_json(out / \"rounds.json\", rounds)\n                print(json.dumps({\"round\": name, \"metrics\": row}), flush=True)\n            subprocess.run([sys.executable, str(ROOT / \"ledger.py\"), str(out / \"steps.jsonl\"),\n                            \"--rounds\", str(out / \"rounds.json\"), \"-o\", str(out / \"ledger.json\")],\n                           env=env, check=True, timeout=min(60, remaining()))\n            overhead = {\"bracket_available\": not args.short}\n            if not args.short:\n                off = [rounds[name][\"metrics\"][\"benchmark_duration\"] for name in (\"warm_off_before\", \"warm_off_after\")]\n                on = [rounds[name][\"metrics\"][\"benchmark_duration\"] for name in (\"b1\", \"b2\")]\n                delta = sum(on) / 2 - sum(off) / 2\n                overhead.update(observer_off_wall_s=off, observer_on_wall_s=on, mean_on_minus_off_s=delta,\n                                relative_mean_delta=delta / (sum(off) / 2),\n                                under_one_percent=abs(delta) <= .01 * (sum(off) / 2),\n                                note=\"Bracketing detects material perturbation but does not isolate arrival/scheduling variation; inspect qlen/refresh composition and JIT before assigning causality\")\n            write_json(out / \"observer_overhead.json\", overhead)\n            write_json(out / \"stage.json\", {\"stage\": \"complete\", \"wall_time\": time.time()})\n        finally:\n            set_phase(out / \"phase\", b\"0\")\n            if server.poll() is None:\n                os.killpg(server.pid, signal.SIGTERM)\n                try:\n                    server.wait(timeout=20)\n                except subprocess.TimeoutExpired:\n                    os.killpg(server.pid, signal.SIGKILL)\n                    server.wait()\n    print(\"complete\", flush=True)\n\n\nif __name__ == \"__main__\":\n    main()\n","full_steps.py":"\"\"\"Optional isolated-service all-step observer; not a production change.\n\nAttach with attach_runner(ModelRunnerFL) and attach_head(sampling_logits).\nE214_LEDGER_OUT must contain a one-byte `phase`: 0/off during initialization,\nthen A/a1, 1/b1, 2/b2, D/a2. Set phase back to 0 after each round and wait for\nflushed-<phase>.json before arming another round. Events are primed during an\nOFF cold request. All event queries, elapsed_time calls, and file writes happen\non a daemon thread only while OFF. No synchronization or D2H is added.\n\nThis module is syntax/CPU-reviewed only; device validation remains required.\nIts own overhead must be measured by paired observer-OFF/ON warm rounds.\n\"\"\"\nfrom collections import deque\nfrom functools import wraps\nimport json\nimport mmap\nimport os\nfrom pathlib import Path\nimport threading\nfrom time import perf_counter_ns\n\nimport torch\n\nROOT = Path(os.environ[\"E214_LEDGER_OUT\"])\nPHASES = {ord(\"A\"): \"a1\", ord(\"1\"): \"b1\", ord(\"2\"): \"b2\", ord(\"D\"): \"a2\"}\nMAX_EVENTS = int(os.environ.get(\"E214_LEDGER_EVENTS\", \"16384\"))\nSTAGE_STRIDE = int(os.environ.get(\"E214_LEDGER_STAGE_STRIDE\", \"31\"))\nACTIVE = None\n\n\nclass Steps:\n    def __init__(self):\n        with (ROOT / \"phase\").open(\"rb\") as switch:\n            self.switch = mmap.mmap(switch.fileno(), 1, access=mmap.ACCESS_READ)\n        if PHASES.get(self.switch[0]) is not None:\n            raise RuntimeError(\"Ledger must first initialize on an OFF cold/warm-up request\")\n        self.pool = deque(torch.cuda.Event(enable_timing=True) for _ in range(MAX_EVENTS))\n        # Eagerly allocate the underlying event handles outside any timed phase.\n        for event in self.pool:\n            event.record()\n        self.phase = None\n        self.count = 0\n        self.previous = None\n        self.origin = None\n        self.pending = []\n        self.finished_phases = set()\n        self.request_aliases = {}\n        self.lock = threading.Lock()\n        self.error = None\n        self.stop = threading.Event()\n        self.thread = threading.Thread(target=self._drain, name=\"e214-ledger-idle-drain\", daemon=True)\n        self.thread.start()\n\n    def event(self):\n        if not self.pool:\n            raise RuntimeError(\"Ledger event pool exhausted; enlarge only for another isolated run\")\n        return self.pool.popleft()\n\n    def select(self, scheduler):\n        if self.error:\n            raise RuntimeError(self.error)\n        phase = PHASES.get(self.switch[0])\n        if phase is None:\n            return None\n        if phase != self.phase:\n            with self.lock:\n                if self.pending:\n                    raise RuntimeError(\"Wait for previous flushed-<phase>.json while phase=0 before arming next round\")\n                if phase in self.finished_phases:\n                    raise RuntimeError(\"Each phase label may be used only once in one observer process\")\n                self.phase, self.count, self.previous, self.origin = phase, 0, None, None\n        qlens = list(scheduler.num_scheduled_tokens.values())\n        n, total = len(qlens), int(scheduler.total_num_scheduled_tokens)\n        self.count += 1\n        detailed = n != 64 or total != 64 or self.count % STAGE_STRIDE == 0\n        row = dict(phase=phase, step_index=self.count, observer_all_steps=True,\n                   requests=n, tokens=total, query_lens=qlens, detailed_stages=detailed,\n                   query_lens_order=\"scheduler_dict_unaligned_until_model_forward\")\n        span = Span(self, row)\n        span.scheduled = dict(scheduler.num_scheduled_tokens)\n        return span\n\n    def finish(self, span, completion):\n        span.mark(\"finish\")\n        span.row[\"completion\"] = completion\n        with self.lock:\n            if self.origin is None:\n                self.origin = span.events[\"start\"]\n            self.pending.append((span.row, span.events, self.previous, self.origin))\n            self.previous = (span.events[\"start\"], span.events[\"finish\"])\n\n    def _drain(self):\n        while not self.stop.wait(.05):\n            try:\n                if PHASES.get(self.switch[0]) is not None:\n                    continue\n                with self.lock:\n                    if not self.pending or not self.pending[-1][1][\"finish\"].query():\n                        continue\n                    pending, self.pending = self.pending, []\n                    phase = self.phase\n                output = []\n                returned = []\n                for row, events, previous, origin in pending:\n                    row[\"start_gpu_ms\"] = origin.elapsed_time(events[\"start\"])\n                    row[\"finish_gpu_ms\"] = origin.elapsed_time(events[\"finish\"])\n                    row[\"whole_gpu_ms\"] = events[\"start\"].elapsed_time(events[\"finish\"])\n                    if previous is not None:\n                        row[\"previous_finish_to_start_gpu_ms\"] = previous[1].elapsed_time(events[\"start\"])\n                        row[\"cadence_gpu_ms\"] = previous[0].elapsed_time(events[\"start\"])\n                    for name, first, last in ((\"prepare\", \"start\", \"model_start\"),\n                                              (\"model\", \"model_start\", \"model_end\"),\n                                              (\"head\", \"head_start\", \"head_end\"),\n                                              (\"sample\", \"sample_start\", \"sample_end\")):\n                        if first in events and last in events:\n                            row[name + \"_gpu_ms\"] = events[first].elapsed_time(events[last])\n                    output.append(row)\n                    returned.extend(events.values())\n                with (ROOT / \"steps.jsonl\").open(\"a\") as handle:\n                    handle.writelines(json.dumps(row) + \"\\n\" for row in output)\n                with self.lock:\n                    self.pool.extend(returned)\n                    self.finished_phases.add(phase)\n                    self.previous = self.origin = None\n                (ROOT / (\"flushed-\" + phase + \".json\")).write_text(json.dumps({\n                    \"phase\": phase, \"rows\": len(output), \"flushed_host_ns\": perf_counter_ns(),\n                    \"observer_all_steps\": True, \"pool_available\": len(self.pool)}) + \"\\n\")\n            except Exception as exc:\n                self.error = repr(exc)\n                (ROOT / \"observer-error.json\").write_text(json.dumps({\"error\": self.error}) + \"\\n\")\n                return\n\n\nclass Span:\n    def __init__(self, steps, row):\n        self.steps, self.row, self.events = steps, row, {}\n        self.mark(\"start\")\n\n    def mark(self, name):\n        self.row[name + \"_host_ns\"] = perf_counter_ns()\n        event = self.steps.event()\n        event.record()\n        self.events[name] = event\n\n\ndef time_call(span, name, function, *args, **kwargs):\n    if span is None or not span.row[\"detailed_stages\"]:\n        return function(*args, **kwargs)\n    span.mark(name + \"_start\")\n    try:\n        return function(*args, **kwargs)\n    finally:\n        span.mark(name + \"_end\")\n\n\ndef attach_head(function):\n    @wraps(function)\n    def head(*args, **kwargs):\n        return time_call(ACTIVE, \"head\", function, *args, **kwargs)\n    return head\n\n\ndef attach_runner(cls):\n    execute, model, sampler, sample_tokens = cls.execute_model, cls._model_forward, cls._sample, cls.sample_tokens\n\n    @wraps(execute)\n    def execute_model(self, scheduler_output, *args, **kwargs):\n        global ACTIVE\n        steps = getattr(self, \"_e214_full_steps\", None)\n        if steps is None:\n            steps = self._e214_full_steps = Steps()\n        span = steps.select(scheduler_output)\n        ACTIVE = span\n        self._e214_full_span = None\n        completed = False\n        try:\n            result = execute(self, scheduler_output, *args, **kwargs)\n            completed = True\n            if span is not None:\n                if self.execute_model_state is not None:\n                    self._e214_full_span = span\n                else:\n                    steps.finish(span, \"execute_without_sample\")\n            return result\n        finally:\n            ACTIVE = None\n            if not completed and span is not None:\n                steps.finish(span, \"execute_exception\")\n\n    @wraps(model)\n    def model_forward(self, *args, **kwargs):\n        span = ACTIVE\n        if span is not None:\n            # Scheduler dict insertion order is NOT the persistent batch order.\n            # Join by request ID after prepare/compaction, and export only aliases.\n            batch = self.input_batch\n            state = self.__dict__.get(\"_i4_state\", {})\n            aliases = span.steps.request_aliases\n            rows = []\n            for index, rid in enumerate(batch.req_ids[:batch.num_reqs]):\n                count = int(span.scheduled.get(rid, 0))\n                if count:\n                    computed = int(batch.num_computed_tokens_cpu[index])\n                    rows.append(dict(batch_row=index, request_alias=aliases.setdefault(rid, len(aliases)),\n                                     window_slot=int(state.get(\"slot\", {}).get(rid, -1)),\n                                     computed_tokens=computed, query_len=count,\n                                     sequence_length=computed + count,\n                                     position_phase=(computed + count) % 16))\n            span.row[\"scheduled_rows\"] = rows\n            span.row[\"batch_schedule_alignment\"] = (\n                len(rows) == span.row[\"requests\"] and\n                sum(row[\"query_len\"] for row in rows) == span.row[\"tokens\"])\n            if span.row[\"batch_schedule_alignment\"]:\n                span.row[\"query_lens_order\"] = \"physical_input_batch_joined_by_request_id\"\n                span.row[\"query_lens\"] = [row[\"query_len\"] for row in rows]\n                span.row[\"num_computed_before\"] = [row[\"computed_tokens\"] for row in rows]\n                if span.row[\"tokens\"] == span.row[\"requests\"]:\n                    span.row[\"position_phases\"] = [row[\"position_phase\"] for row in rows]\n            try:\n                from vllm.forward_context import get_forward_context\n                context = get_forward_context()\n                span.row[\"graph_mode\"] = str(getattr(context, \"cudagraph_runtime_mode\", \"unknown\"))\n            except (ImportError, AttributeError, AssertionError) as exc:\n                span.row[\"graph_mode\"] = \"unobserved:\" + type(exc).__name__\n        return time_call(span, \"model\", model, self, *args, **kwargs)\n\n    @wraps(sampler)\n    def sample(self, *args, **kwargs):\n        return time_call(ACTIVE, \"sample\", sampler, self, *args, **kwargs)\n\n    @wraps(sample_tokens)\n    def sample_call(self, *args, **kwargs):\n        global ACTIVE\n        span = getattr(self, \"_e214_full_span\", None)\n        if span is None:\n            return sample_tokens(self, *args, **kwargs)\n        self._e214_full_span = None\n        ACTIVE = span\n        try:\n            return sample_tokens(self, *args, **kwargs)\n        finally:\n            ACTIVE = None\n            span.steps.finish(span, \"sample_complete\")\n\n    cls.execute_model, cls._model_forward = execute_model, model_forward\n    cls._sample, cls.sample_tokens = sample, sample_call\n\n","observer_sitecustomize.py":"\"\"\"Rename to sitecustomize.py only in an isolated probe overlay, if needed.\n\nThis does not import another experiment'\''s sitecustomize or mutate installed files.\nIf the runner already has an import hook, call the two attach functions there\ninstead, and do not install this second hook.\n\"\"\"\nimport importlib.abc\nimport importlib.machinery\nfrom hashlib import sha256\nimport os\nimport sys\n\nATTACH = {\n    \"vllm_fl.worker.model_runner\": \"attach_runner(ModelRunnerFL)\",\n    \"vllm_fl.patches.head_sampling\": \"sampling_logits = attach_head(sampling_logits)\",\n}\nPINS = {\n    \"vllm_fl.worker.model_runner\": \"be2939853146707288d77a475c6755e942844a557b29d0e8d549dee264ae3aa3\",\n    \"vllm_fl.patches.head_sampling\": \"d45b7513c8129f9f71722b6d77884ad7357ff5fb9da3ed7401e8d91a6077744a\",\n}\n\n\nclass Loader(importlib.machinery.SourceFileLoader):\n    def get_code(self, fullname):\n        data = self.get_data(self.path)\n        assert sha256(data).hexdigest() == PINS[fullname], (fullname, self.path)\n        source = data.decode()\n        source += \"\\nfrom full_steps import attach_runner, attach_head\\n\" + ATTACH[fullname] + \"\\n\"\n        return compile(source, self.path, \"exec\")\n\n\nclass Finder(importlib.abc.MetaPathFinder):\n    def find_spec(self, fullname, path=None, target=None):\n        if fullname not in ATTACH:\n            return None\n        spec = importlib.machinery.PathFinder.find_spec(fullname, path, target)\n        if spec and spec.origin and spec.origin.endswith(\".py\"):\n            spec.loader = Loader(fullname, spec.origin)\n        return spec\n\n\nif os.environ.get(\"E214_LEDGER_OUT\"):\n    sys.meta_path.insert(0, Finder())\n","ledger.py":"#!/usr/bin/env python3\n\"\"\"Close an all-step service ledger; explicitly refuse closure for sampled traces.\n\nCPU only. Reads JSONL from E211-compatible or all-step observers. Does not invent\nmissing timing or multiply medians into a round. Example:\n  python3 ledger.py steps.jsonl --rounds rounds.json --warm-tail-qlen 16 -o ledger.json\n\"\"\"\nimport argparse\nfrom collections import Counter, defaultdict\nimport hashlib\nimport json\nimport math\nfrom pathlib import Path\nfrom statistics import mean, median\n\n\ndef percentile(values, q):\n    values = sorted(values)\n    if not values:\n        return None\n    x = (len(values) - 1) * q\n    a, b = math.floor(x), math.ceil(x)\n    return values[a] * (b - x) + values[b] * (x - a) if a != b else values[a]\n\n\ndef stats(values):\n    values = [float(x) for x in values if x is not None]\n    return {\"n\": len(values), \"sum_ms\": sum(values), \"mean_ms\": mean(values) if values else None,\n            \"median_ms\": median(values) if values else None, \"p95_ms\": percentile(values, .95),\n            \"p99_ms\": percentile(values, .99), \"max_ms\": max(values) if values else None}\n\n\ndef get(row, *keys, default=None):\n    for key in keys:\n        if key in row:\n            return row[key]\n    return default\n\n\ndef category(n, m):\n    if n == 0 or m == 0:\n        return \"empty_or_no_work\"\n    if m > n:\n        return \"prefill_or_mixed\"\n    if m == n:\n        return \"decode_B64\" if n == 64 else (\"decode_B_lt64\" if n < 64 else \"decode_B_gt64\")\n    return \"unclassified\"\n\n\ndef normalize(raw, source, line, tail):\n    n = get(raw, \"requests\", \"num_reqs\", \"nreq\", \"n\")\n    m = get(raw, \"tokens\", \"num_tokens\", \"total_num_scheduled_tokens\", \"M\")\n    if n is None or m is None:\n        return None\n    n, m = int(n), int(m)\n    row = {\"source\": source, \"line\": line, \"phase\": str(get(raw, \"phase\", \"round\", default=\"unknown\")),\n           \"requests\": n, \"tokens\": m, \"category\": category(n, m),\n           \"step_index\": get(raw, \"step_index\", \"execute_index\", \"step_id\"),\n           \"whole_gpu_ms\": get(raw, \"whole_gpu_ms\", \"execute_gpu_ms\", \"elapsed_gpu_ms\", \"gpu_ms\"),\n           \"gap_gpu_ms\": get(raw, \"previous_finish_to_start_gpu_ms\", \"gap_gpu_ms\"),\n           \"start_gpu_ms\": get(raw, \"start_gpu_ms\", \"start_from_origin_gpu_ms\"),\n           \"finish_gpu_ms\": get(raw, \"finish_gpu_ms\", \"finish_from_origin_gpu_ms\"),\n           \"start_host_ns\": get(raw, \"start_host_ns\"), \"finish_host_ns\": get(raw, \"finish_host_ns\"),\n           \"graph_mode\": str(get(raw, \"graph_mode\", \"cudagraph_runtime_mode\", default=\"unknown\")),\n           \"observer_all_steps\": raw.get(\"observer_all_steps\", False)}\n    for stage in (\"prepare\", \"model\", \"head\", \"sample\"):\n        row[stage + \"_gpu_ms\"] = raw.get(stage + \"_gpu_ms\")\n    actual = get(raw, \"actual_refresh_rows\", \"refresh_rows\")\n    if isinstance(actual, list):\n        row[\"refresh_rows_by_anchor\"] = actual\n        row[\"refresh_rows\"] = actual[0] if actual and len(set(actual)) == 1 else None\n        row[\"refresh_provenance\"] = \"observed_device_flags\"\n    elif isinstance(actual, (int, float)):\n        row[\"refresh_rows\"] = actual\n        row[\"refresh_provenance\"] = \"observer_reported\"\n    elif \"position_phases\" in raw and m == n:\n        row[\"refresh_rows\"] = sum(int(x) == 0 for x in raw[\"position_phases\"][:n])\n        row[\"refresh_provenance\"] = \"position_phase0_proxy_not_actual_flags\"\n    else:\n        row[\"refresh_rows\"] = None\n        row[\"refresh_provenance\"] = \"unobserved\"\n    qlens = get(raw, \"query_lens\", \"qlens\", \"scheduled_qlens\")\n    if isinstance(qlens, dict):\n        qlens = list(qlens.values())\n    if qlens is not None:\n        qlens = [int(x) for x in qlens]\n        row[\"query_lens\"] = qlens\n        row[\"qlen_sum_matches\"] = len(qlens) == n and sum(qlens) == m\n        row[\"multiquery_rows\"] = sum(x > 1 for x in qlens)\n        row[\"multiquery_prompt_tokens\"] = sum(x for x in qlens if x > 1)\n        row[\"prefill_count_provenance\"] = \"actual_qlens; qlen1_prefill_cannot_be_distinguished\"\n    elif tail and m > n and (m - n) % (tail - 1) == 0:\n        new = (m - n) // (tail - 1)\n        row[\"multiquery_rows\"] = new\n        row[\"multiquery_prompt_tokens\"] = new * tail\n        row[\"prefill_count_provenance\"] = f\"conditional_all_new_prefill_qlen={tail}_and_old_decode_qlen=1\"\n    return row\n\n\ndef summarize(rows, wall_s):\n    by_category, by_shape, by_refresh = defaultdict(list), defaultdict(list), defaultdict(list)\n    for row in rows:\n        by_category[row[\"category\"]].append(row)\n        by_shape[f\"B{row['\''requests'\'']}:M{row['\''tokens'\'']}:{row['\''graph_mode'\'']}\"] .append(row)\n        if row[\"category\"] == \"decode_B64\":\n            by_refresh[str(row[\"refresh_rows\"])].append(row)\n\n    def aggregate(group):\n        return {\"steps\": len(group), \"scheduled_token_sum\": sum(r[\"tokens\"] for r in group),\n                \"whole\": stats(r[\"whole_gpu_ms\"] for r in group),\n                \"gap_before\": stats(r[\"gap_gpu_ms\"] for r in group),\n                \"stages\": {stage: stats(r[stage + \"_gpu_ms\"] for r in group)\n                           for stage in (\"prepare\", \"model\", \"head\", \"sample\")}}\n\n    whole = stats(row[\"whole_gpu_ms\"] for row in rows)\n    gaps = stats(row[\"gap_gpu_ms\"] for row in rows)\n    ids = [row[\"step_index\"] for row in rows]\n    have_ids = bool(ids) and all(isinstance(x, int) for x in ids)\n    consecutive = have_ids and all(b == a + 1 for a, b in zip(ids, ids[1:]))\n    declared_all = bool(rows) and all(row[\"observer_all_steps\"] for row in rows)\n    all_timing = whole[\"n\"] == len(rows)\n    all_gaps = gaps[\"n\"] == max(0, len(rows) - 1)\n    have_relative = bool(rows) and all(row[\"start_gpu_ms\"] is not None and row[\"finish_gpu_ms\"] is not None for row in rows)\n    direct_span = rows[-1][\"finish_gpu_ms\"] - rows[0][\"start_gpu_ms\"] if have_relative else None\n    sum_span = whole[\"sum_ms\"] + gaps[\"sum_ms\"]\n    closure_error = sum_span - direct_span if direct_span is not None else None\n    closed = bool(consecutive and declared_all and all_timing and all_gaps and direct_span is not None and abs(closure_error) < .1)\n    host_ns = [row[\"start_host_ns\"] for row in rows if row[\"start_host_ns\"] is not None]\n    finish_ns = [row[\"finish_host_ns\"] for row in rows if row[\"finish_host_ns\"] is not None]\n    largest_gaps = sorted((r for r in rows if r[\"gap_gpu_ms\"] is not None), key=lambda r: r[\"gap_gpu_ms\"], reverse=True)[:12]\n    residue = []\n    for r in rows:\n        vals = [r[x + \"_gpu_ms\"] for x in (\"prepare\", \"model\", \"head\", \"sample\")]\n        if r[\"whole_gpu_ms\"] is not None and all(v is not None for v in vals):\n            residue.append(r[\"whole_gpu_ms\"] - sum(vals))\n    return {\"rows\": len(rows), \"categories\": {k: aggregate(v) for k, v in sorted(by_category.items())},\n            \"shapes\": {k: aggregate(v) for k, v in sorted(by_shape.items())},\n            \"B64_refresh_bins\": {k: aggregate(v) for k, v in sorted(by_refresh.items())},\n            \"refresh_provenance_counts\": dict(Counter(r[\"refresh_provenance\"] for r in rows)),\n            \"prompt_count\": {\"multiquery_rows\": sum(r.get(\"multiquery_rows\", 0) for r in rows),\n                             \"multiquery_prompt_tokens\": sum(r.get(\"multiquery_prompt_tokens\", 0) for r in rows),\n                             \"provenance\": dict(Counter(r.get(\"prefill_count_provenance\", \"missing\") for r in rows)),\n                             \"qlen1_prefill_not_identifiable\": True},\n            \"whole\": whole, \"gaps\": gaps,\n            \"matched_row_stage_residual\": stats(residue),\n            \"closure\": {\"closed\": closed, \"consecutive_step_ids\": consecutive,\n                        \"declared_all_steps\": declared_all, \"all_steps_have_timing\": all_timing,\n                        \"all_adjacent_gaps_present\": all_gaps, \"relative_event_span_ms\": direct_span,\n                        \"sum_whole_plus_gaps_ms\": sum_span, \"closure_error_ms\": closure_error,\n                        \"host_submission_first_to_last_ms\": (max(finish_ns) - min(host_ns)) / 1e6 if host_ns and finish_ns else None,\n                        \"benchmark_wall_s\": wall_s,\n                        \"benchmark_wall_minus_event_window_ms\": wall_s * 1000 - direct_span if closed and wall_s is not None else None,\n                        \"note\": \"No whole-round sum is asserted for sampled/incomplete traces. GPU event spans may include host issue starvation. CPU wall and GPU time overlap and must not be added.\"},\n            \"largest_gaps\": [{k: r[k] for k in (\"step_index\", \"requests\", \"tokens\", \"gap_gpu_ms\", \"whole_gpu_ms\", \"category\")} for r in largest_gaps]}\n\n\ndef main():\n    ap = argparse.ArgumentParser(description=__doc__)\n    ap.add_argument(\"inputs\", nargs=\"+\", type=Path)\n    ap.add_argument(\"-o\", \"--output\", required=True, type=Path)\n    ap.add_argument(\"--rounds\", type=Path)\n    ap.add_argument(\"--wall\", action=\"append\", default=[], help=\"phase=seconds; same observed run only\")\n    ap.add_argument(\"--warm-tail-qlen\", type=int, help=\"explicit conditional inference for legacy traces without qlens\")\n    ap.add_argument(\"--pair\", action=\"append\", default=[], help=\"control_phase:treatment_phase\")\n    args = ap.parse_args()\n    wall = {}\n    if args.rounds:\n        obj = json.loads(args.rounds.read_text())\n        obj = obj.get(\"rounds\", obj)\n        for phase, value in obj.items():\n            metrics = value.get(\"metrics\", {}) if isinstance(value, dict) else {}\n            if \"benchmark_duration\" in metrics:\n                wall[phase] = float(metrics[\"benchmark_duration\"])\n    for entry in args.wall:\n        phase, seconds = entry.split(\"=\", 1)\n        wall[phase] = float(seconds)\n    phases, sources, ignored = defaultdict(list), [], 0\n    for path in args.inputs:\n        data = path.read_bytes()\n        sources.append({\"path\": str(path.resolve()), \"sha256\": hashlib.sha256(data).hexdigest()})\n        for line, text in enumerate(data.decode().splitlines(), 1):\n            if not text.strip():\n                continue\n            row = normalize(json.loads(text), str(path), line, args.warm_tail_qlen)\n            if row is None:\n                ignored += 1\n            else:\n                phases[row[\"phase\"]].append(row)\n    result = {\"scope\": \"actual_observed_step_ledger_no_latency_fitting\", \"sources\": sources,\n              \"ignored_nonstep_rows\": ignored,\n              \"phases\": {phase: summarize(rows, wall.get(phase)) for phase, rows in phases.items()}, \"pairs\": {}}\n    for entry in args.pair:\n        control, treatment = entry.split(\":\", 1)\n        a, b = result[\"phases\"][control], result[\"phases\"][treatment]\n        shape = {}\n        for key in sorted(set(a[\"shapes\"]) & set(b[\"shapes\"])):\n            aw, bw = a[\"shapes\"][key][\"whole\"], b[\"shapes\"][key][\"whole\"]\n            if aw[\"n\"] and bw[\"n\"]:\n                shape[key] = {\"control_n\": aw[\"n\"], \"treatment_n\": bw[\"n\"],\n                              \"control_mean_ms\": aw[\"mean_ms\"], \"treatment_mean_ms\": bw[\"mean_ms\"],\n                              \"mean_saved_ms\": aw[\"mean_ms\"] - bw[\"mean_ms\"]}\n        result[\"pairs\"][entry] = {\"both_rounds_closed\": a[\"closure\"][\"closed\"] and b[\"closure\"][\"closed\"],\n            \"observed_wall_saved_s\": wall[control] - wall[treatment] if control in wall and treatment in wall else None,\n            \"common_shape_conditional_means\": shape,\n            \"note\": \"Different step counts/refresh composition can change conditional means; no synthetic 14/1/1 weighting or median-to-round extrapolation is used.\"}\n    args.output.parent.mkdir(parents=True, exist_ok=True)\n    args.output.write_text(json.dumps(result, ensure_ascii=False, indent=2) + \"\\n\")\n    print(json.dumps({\"output\": str(args.output.resolve()), \"phases\": {k: {\"rows\": v[\"rows\"], \"closed\": v[\"closure\"][\"closed\"], \"prompt_tokens\": v[\"prompt_count\"][\"multiquery_prompt_tokens\"], \"whole_observed_sum_ms\": v[\"whole\"][\"sum_ms\"], \"gaps_observed_sum_ms\": v[\"gaps\"][\"sum_ms\"]} for k, v in result[\"phases\"].items()}}, ensure_ascii=False, indent=2))\n\n\nif __name__ == \"__main__\":\n    main()\n","run_ledger_owned.py":"import json,os,signal,subprocess,sys,time\nfrom pathlib import Path\nroot=Path(__file__).resolve().parent\nstatus=root/\"ledger_status.json\"\ncmd=[sys.executable,str(root/\"run_ledger.py\"),\"--out\",\"ledger_a1\",\"--deadline-seconds\",\"860\"]\nenv=os.environ.copy();env[\"OMP_NUM_THREADS\"]=\"4\";env[\"OPENBLAS_NUM_THREADS\"]=\"4\"\nwith (root/\"driver.log\").open(\"w\") as log:\n    proc=subprocess.Popen(cmd,cwd=root,env=env,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\n    data={\"state\":\"running\",\"pid\":proc.pid,\"start_unix\":time.time(),\"task\":\"frozen_E214_all_step_service_ledger\"}\n    status.write_text(json.dumps(data)+\"\\n\")\n    try:rc=proc.wait(timeout=910)\n    except subprocess.TimeoutExpired:\n        owned=root/\"ledger_a1/owner.json\"\n        if owned.is_file():\n            info=json.loads(owned.read_text())\n            if info.get(\"driver_pid\")==proc.pid:\n                pid=info.get(\"owned_server_pid\")\n                try:\n                    command=Path(f\"/proc/{pid}/cmdline\").read_bytes()\n                    if os.getpgid(pid)==pid and b\"vllm\" in command and b\"9031\" in command:os.killpg(pid,signal.SIGTERM)\n                except ProcessLookupError:pass\n                except FileNotFoundError:pass\n        os.killpg(proc.pid,signal.SIGTERM)\n        try:rc=proc.wait(timeout=20)\n        except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);rc=proc.wait()\n        data[\"timed_out\"]=True\n    data.update(state=\"completed\",exit_code=rc,end_unix=time.time());status.write_text(json.dumps(data)+\"\\n\")\n"}
          for name,content in files.items():
              path=root/name;path.write_text(content);print("WRITTEN",str(path),hashlib.sha256(path.read_bytes()).hexdigest(),flush=True)
