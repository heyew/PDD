name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Build exact official baseline and run E256 full graph
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''E256_RESTART'\''
          import base64,gzip,hashlib,json,runpy,shutil,subprocess,sys,time
          from pathlib import Path
          root=Path('\''/root/e256'\'')
          used=subprocess.check_output(['\''/usr/local/corex/bin/ixsmi'\'','\''--query-gpu=memory.used'\'','\''--format=csv,noheader'\''],text=True).strip()
          assert int(used.split()[0])<256, ('\''GPU occupied; no process stopped'\'',used)
          diff=json.loads((root/'\''baseline_differences.json'\'').read_text())
          assert set(diff)=={'\''plugin/vllm_fl/__init__.py'\'','\''plugin/vllm_fl/patches/bytelevel.py'\''}
          assert diff['\''plugin/vllm_fl/__init__.py'\'']['\''actual'\'']=='\''61a446abcb0c012a1260095f252ca467639ad5fe1a2c2af397276533a7f18acd'\''
          assert diff['\''plugin/vllm_fl/patches/bytelevel.py'\'']['\''actual'\''] is None
          base=root/'\''baseline-official'\''
          assert not base.exists()
          builder=Path('\''/root/e241/build_bytelevel.py'\'')
          assert hashlib.sha256(builder.read_bytes()).hexdigest()=='\''ba932ca96489b6932ba044758c5f7cae842bec4bcefa90813665eb627cafb9f6'\''
          base.mkdir()
          shutil.copytree('\''/root/e214/candidate-a1/gems'\'',base/'\''gems'\'',ignore=shutil.ignore_patterns('\''__pycache__'\'','\''*.pyc'\''))
          registration=runpy.run_path(str(builder))['\''build'\''](Path('\''/root/e214/candidate-a1/plugin'\''),Path('\''/root/e241/bytelevel.py'\''),base/'\''plugin'\'')
          pins=json.loads((root/'\''bundle-a1/validation/source_pins.json'\'').read_text())['\''files'\'']
          for name,wanted in pins.items():
           assert hashlib.sha256((base/name).read_bytes()).hexdigest()==wanted,name
          (root/'\''baseline_official_receipt.json'\'').write_text(json.dumps({'\''base'\'':'\''/root/e214/candidate-a1'\'','\''builder_sha256'\'':hashlib.sha256(builder.read_bytes()).hexdigest(),'\''registration'\'':registration,'\''verified_files'\'':len(pins)},indent=2)+'\''\n'\'')
          (root/'\''device_guard_a2.py'\'').write_bytes(base64.b64decode('\'''\''))
          log=(root/'\''guard-a2.log'\'').open('\''ab'\'',buffering=0)
          p=subprocess.Popen([sys.executable,str(root/'\''device_guard_a2.py'\'')],cwd=root,stdin=subprocess.DEVNULL,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
          print('\''E256_A2_LAUNCHED '\''+json.dumps({'\''guard_pid'\'':p.pid,'\''verified_files'\'':len(pins),'\''gpu_before'\'':used}),flush=True)
          deadline=time.monotonic()+50
          while not (root/'\''done-a2.json'\'').exists() and time.monotonic()<deadline:time.sleep(1)
          for name in ('\''guard-a2.json'\'','\''done-a2.json'\''):
              p=root/name
              print(name+'\'' '\''+(p.read_text() if p.exists() else '\''RUNNING'\''))
          p=root/'\''device-a2.log'\''
          print('\''E256_LOG_TAIL\n'\''+(p.read_text(errors='\''replace'\'')[-14000:] if p.exists() else '\''NOT_READY'\''))
          p=root/'\''device-a2/result.json'\''
          if p.exists():
              raw=p.read_bytes(); r=json.loads(raw)
              summary={k:r.get(k) for k in ('\''status'\'','\''complete'\'','\''elapsed_host_s'\'','\''one_load_init_s'\'','\''failure'\'','\''device_preflight'\'')}
              summary['\''scopes'\'']=[{'\''name'\'':s['\''name'\''],'\''cases'\'':{n:{k:c.get(k) for k in ('\''same_code_bitwise'\'','\''production_vs_reference_bitwise'\'','\''mean_saving_ms_per_step'\'','\''mean_ms_per_step'\'','\''paired_group_mean_saving_ms_per_step'\'','\''arms'\'')} for n,c in s['\''cases'\''].items()}} for s in r.get('\''scopes'\'',[])]
              for scope in summary['\''scopes'\'']:
                  for case in scope['\''cases'\''].values():
                      for arm in (case.get('\''arms'\'') or {}).values():
                          arm.pop('\''graph_identity'\'',None)
              print('\''E256_RESULT_SUMMARY '\''+json.dumps(summary,allow_nan=False))
              print('\''E256_RESULT_SHA256 '\''+hashlib.sha256(raw).hexdigest())
          print('\''E256_GPU_MEMORY '\''+subprocess.check_output(['\''/usr/local/corex/bin/ixsmi'\'','\''--query-gpu=memory.used'\'','\''--format=csv,noheader'\''],text=True).strip())
          E256_RESTART'
