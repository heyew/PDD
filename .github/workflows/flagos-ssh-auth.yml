ult\\n        return original(self, *args, **kwargs)\\n\\n    cls.schedule = schedule\\n\\n\\ndef attach_runner(cls):\\n    import numpy as np\\n    import torch\\n    import triton\\n    from flag_gems.fused.minicpm import _h128_basis as H, w8a8 as W\\n    import codec_controls as C\\n\\n    cfg = json.loads((ROOT / \\\"cases.json\\\").read_text())\\n    cases = {c[\\\"prompt_sha256\\\"]: c for c in cfg[\\\"cases\\\"]}\\n    original_load, original_execute, original_sample = cls.load_model, cls.execute_model, cls._sample\\n    cpu_options, quant_defaults = {}, {}\\n    records, steps = set(), {}\\n    req_case = {}\\n\\n    def digest(tensor):\\n        return sha256(tensor.contiguous().numpy().tobytes()).hexdigest()\\n\\n    @wraps(original_load)\\n    def load(self, *args, **kwargs):\\n        original_quant = H.quant_weight\\n\\n        def quant(weight):\\n            q8, s8 = original_quant(weight)\\n            assert tuple(weight.shape) == (2048, 6144)\\n            assert weight.dtype == torch.bfloat16 and q8.dtype == torch.int8 and s8.dtype == torch.float32\\n            rotated = torch.empty_like(weight)\\n            maxima = torch.empty((2048, 48), device=weight.device, dtype=torch.float32)\\n            H.rotate[(32, 48)](weight, W._h128(weight.device), rotated, maxima,\\n                M=2048, K=6144, BM=64, num_warps=4, num_stages=1)\\n            q4 = torch.empty_like(q8)\\n            scale = torch.empty((2048, 1), device=weight.device, dtype=torch.float32)\\n            C.fit_weight[(2048, 1)](rotated, q4, scale, K=6144, WIDTH=6144,\\n                BLOCK=8192, ROW_SCALE=True, num_warps=8)\\n            assert maxima.dtype == scale.dtype == torch.float32 and q4.dtype == torch.int8\\n            options = (q8.cpu(), s8.cpu(), (q4 * 16).cpu(), (scale.flatten() / 16).cpu())\\n            assert [x.dtype for x in options] == [torch.int8, torch.float32, torch.int8, torch.float32]\\n            cpu_options[q8.data_ptr()] = options\\n            quant_