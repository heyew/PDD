name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Resume unchanged E253 CPU encoding within measured budget
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''PY'\''
          from pathlib import Path
          import base64,gzip,hashlib,json,subprocess
          root=Path('\''/root/e253/quality'\'')
          assert json.loads((root/'\''encode_guard-a1.json'\'').read_text())['\''status'\'']=='\''PAUSED_BUDGET'\''
          m=json.loads((root/'\''encoded-block128-a1/manifest.json'\'').read_text());assert m['\''status'\'']=='\''PAUSED_BUDGET'\'' and not m['\''complete'\'']
          assert hashlib.sha256((root/'\''encode_all_cpu.py'\'').read_bytes()).hexdigest()=='\''5a3ee0c4546566f3781202b380c1540609387bad72c0247d5c381d68349644da'\''
          b=gzip.decompress(base64.b64decode('\'''\''));assert hashlib.sha256(b).hexdigest()=='\''fd818144cbab43772635e3135c0ba59579e516ea590ee203dbb6a41aabf4d443'\''
          path=root/'\''encode_resume_guard.py'\'';assert not path.exists();path.write_bytes(b)
          with (root/'\''encode-supervisor-a2.log'\'').open('\''xb'\'',buffering=0) as log:
           child=subprocess.Popen(['\''python3'\'',str(path)],cwd=root,stdin=subprocess.DEVNULL,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
          print('\''LAUNCHED '\''+json.dumps({'\''guard_pid'\'':child.pid,'\''completed_matrices_reused'\'':len(m['\''files'\'']),'\''cpu_budget_s'\'':420,'\''same_encoder_source'\'':True,'\''guard_sha256'\'':'\''fd818144cbab43772635e3135c0ba59579e516ea590ee203dbb6a41aabf4d443'\''}),flush=True)
          PY'
