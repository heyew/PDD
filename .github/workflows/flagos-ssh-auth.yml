name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Read E253 bounded MLP result
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''E253POLL'\''
          from pathlib import Path
          import json, hashlib, gzip, base64, subprocess, time
          r=Path('\''/root/e253'\'')
          deadline=time.monotonic()+40
          while not (r/'\''done.json'\'').exists() and time.monotonic()<deadline:
              time.sleep(1)
          for name in ('\''guard_state.json'\'','\''done.json'\''):
              p=r/name
              print(name+'\'': '\''+(p.read_text() if p.exists() else '\''NOT_READY'\''))
          p=r/'\''child.log'\''
          print('\''CHILD_LOG_TAIL\n'\''+(p.read_text(errors='\''replace'\'')[-18000:] if p.exists() else '\''NOT_READY'\''))
          p=r/'\''p0-a1/result.json'\''
          if p.exists():
              b=p.read_bytes()
              print('\''RESULT_SHA256 '\''+hashlib.sha256(b).hexdigest())
              print('\''RESULT_GZIP_B64 '\''+base64.b64encode(gzip.compress(b,mtime=0)).decode())
          print('\''GPU_MEMORY '\''+subprocess.check_output(['\''/usr/local/corex/bin/ixsmi'\'','\''--query-gpu=memory.used'\'','\''--format=csv,noheader'\''],text=True).strip())
          E253POLL'
