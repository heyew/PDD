name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Collect E256 completed lifecycle evidence
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''E256_STATUS'\''
          import json,time,subprocess,hashlib,base64,gzip
          from pathlib import Path
          out=Path('\''/root/e256/lifecycle-a2'\'');guard=Path(str(out)+'\''.guard.json'\'')
          end=time.monotonic()+45
          while time.monotonic()<end:
           d=json.loads(guard.read_text()) if guard.exists() else {}
           if d.get('\''status'\'') not in ('\''RUNNING'\'','\''STARTING'\'',None):break
           time.sleep(1)
          print('\''E256_STATUS3_BEGIN'\'',flush=True)
          d=json.loads(guard.read_text());print('\''GUARD'\'',json.dumps(d),flush=True)
          x=json.loads((out/'\''result.json'\'').read_text());print('\''RESULT'\'',json.dumps({k:x.get(k) for k in ['\''complete'\'','\''functional_passed'\'','\''decision'\'','\''error'\'','\''timings'\'','\''audit'\'','\''cleanup'\'']}),flush=True)
          for n in ['\''observer_error.json'\'','\''startup_observer_error.json'\'','\''ready63.json'\'','\''released_A.json'\'','\''released_B.json'\'']:
           p=out/n
           if p.exists():print('\''FILE'\'',n,p.read_text(),flush=True)
          print('\''LOGIT_FILES'\'',[(p.name,p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest()) for p in (out/'\''logits'\'').glob('\''*.npz'\'')],flush=True)
          p=out/'\''serve.log'\''
          if p.exists():print('\''SERVE_TAIL'\'',p.read_text(errors='\''replace'\'')[-10000:],flush=True)
          print('\''GPU_MEMORY'\'',subprocess.check_output(['\''ixsmi'\'','\''--query-gpu=memory.used'\'','\''--format=csv,noheader'\''],text=True,timeout=5),flush=True)
          if d.get('\''status'\'') not in ['\''RUNNING'\'','\''STARTING'\'']:
           paths=[p for run in ['\''lifecycle-a1'\'','\''lifecycle-a2'\''] for p in Path('\''/root/e256'\'',run).rglob('\''*'\'') if p.is_file() and p.suffix!='\''.npz'\'']
           paths += [Path('\''/root/e256'\'')/(r+s) for r in ['\''lifecycle-a1'\'','\''lifecycle-a2'\''] for s in ['\''.guard.json'\'','\''.driver.log'\'','\''.outer.log'\'']]
           data={str(p.relative_to('\''/root/e256'\'')):base64.b64encode(p.read_bytes()).decode() for p in paths if p.exists()}
           raw=json.dumps(data,sort_keys=True).encode();compressed=gzip.compress(raw,mtime=0)
           print('\''E256_SERVICE_EVIDENCE_META'\'',json.dumps({'\''files'\'':len(data),'\''raw_bytes'\'':len(raw),'\''gzip_bytes'\'':len(compressed),'\''raw_sha256'\'':hashlib.sha256(raw).hexdigest()}),flush=True)
           print('\''E256_SERVICE_EVIDENCE_B64_BEGIN'\'',flush=True)
           text=base64.b64encode(compressed).decode()
           for i in range(0,len(text),60000):print(text[i:i+60000],flush=True)
           print('\''E256_SERVICE_EVIDENCE_B64_END'\'',flush=True)
          print('\''E256_STATUS3_END'\'',flush=True)
          E256_STATUS'
