name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Audit E256 baseline including missing compatibility files
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''E256_AUDIT2'\''
          import base64,gzip,hashlib,json
          from pathlib import Path
          root=Path('\''/root/e214/candidate-a1'\'')
          pins=json.loads(Path('\''/root/e256/bundle-a1/validation/source_pins.json'\'').read_text())['\''files'\'']
          changed={}
          for name,wanted in pins.items():
           p=root/name
           if not p.is_file():
            changed[name]={'\''expected'\'':wanted,'\''actual'\'':None,'\''text'\'':None}
            continue
           b=p.read_bytes(); got=hashlib.sha256(b).hexdigest()
           if got!=wanted: changed[name]={'\''expected'\'':wanted,'\''actual'\'':got,'\''bytes'\'':len(b),'\''text'\'':b.decode()}
          raw=json.dumps(changed).encode()
          Path('\''/root/e256/baseline_differences.json'\'').write_bytes(raw)
          print('\''E256_BASELINE_DIFF_SUMMARY '\''+json.dumps({n:{k:v for k,v in x.items() if k!='\''text'\''} for n,x in changed.items()}))
          print('\''E256_BASELINE_DIFF_GZIP_B64 '\''+base64.b64encode(gzip.compress(raw,mtime=0)).decode())
          E256_AUDIT2'
