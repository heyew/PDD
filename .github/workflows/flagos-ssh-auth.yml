name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Audit saved E253 full vocabulary outputs and final provenance
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''PY'\''
          from pathlib import Path
          import json,hashlib,gzip,base64,subprocess,os
          q=Path('\''/root/e253/quality'\'');root=q/'\''p2-a1'\''
          assert json.loads((q/'\''p2/done.json'\'').read_text())['\''status'\'']=='\''COMPLETE'\''
          b=gzip.decompress(base64.b64decode('\'''\''));assert hashlib.sha256(b).hexdigest()=='\''2e68953b0b89d1bab6bbf091b5833d75e9c71f62b19a2dbfaa72147d63670c10'\''
          p=q/'\''p2/audit_logits.py'\'';assert not p.exists();p.write_bytes(b)
          env={**os.environ,'\''OPENBLAS_NUM_THREADS'\'':'\''1'\'','\''OMP_NUM_THREADS'\'':'\''1'\'','\''MKL_NUM_THREADS'\'':'\''1'\''}
          r=subprocess.run(['\''python3'\'',str(p),'\''--out'\'',str(root)],cwd=q/'\''p2'\'',env=env,capture_output=True,text=True,timeout=90)
          print(r.stdout);print(r.stderr);assert r.returncode==0,r.returncode
          names=['\''p2/done.json'\'','\''encode_guard-a2.json'\'','\''encoded-block128-a1/manifest.json'\'','\''p2-a1/result.json'\'','\''p2-a1/cases.json'\'','\''p2-a1/cases_public.json'\'','\''p2-a1/source_manifest.json'\'','\''p2-a1/runtime_sources.json'\'','\''p2-a1/weights.json'\'','\''p2-a1/events.jsonl'\'','\''p2-a1/quality_gate.json'\'','\''p2-a1/owned_service.json'\'','\''p2-a1/independent_vocab_audit.json'\'','\''p2-a1/raw_logits_manifest.json'\'','\''p2-a1/encoded_inputs.json'\'','\''p2-a1/serve.log'\'']
          bundle={}
          for name in names:
           b=(q/name).read_bytes();bundle[name]={'\''text'\'':b.decode(),'\''sha256'\'':hashlib.sha256(b).hexdigest()}
          b=json.dumps(bundle,sort_keys=True).encode();print('\''BUNDLE_INFO '\''+json.dumps({'\''files'\'':len(bundle),'\''bytes'\'':len(b),'\''sha256'\'':hashlib.sha256(b).hexdigest()}));print('\''BUNDLE_GZIP_B64 '\''+base64.b64encode(gzip.compress(b,mtime=0)).decode())
          print('\''GPU_MEMORY '\''+subprocess.check_output(['\''/usr/local/corex/bin/ixsmi'\'','\''--query-gpu=memory.used'\'','\''--format=csv,noheader'\''],text=True).strip())
          PY'
