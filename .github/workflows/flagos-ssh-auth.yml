name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Read E253 real text quality completion with bounded wait
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''PY'\''
          from pathlib import Path
          import json,hashlib,gzip,base64,subprocess,time
          q=Path('\''/root/e253/quality'\'');bundle={};summary={}
          wait_until=time.monotonic()+45
          while not (q/'\''p2/done.json'\'').exists() and time.monotonic()<wait_until:time.sleep(1)
          for rel in ('\''encode_guard-a2.json'\'','\''encoded-block128-a1/manifest.json'\'','\''p2/guard_state.json'\'','\''p2/done.json'\'','\''p2-a1/result.json'\'','\''p2-a1/phase.json'\''):
           p=q/rel
           if not p.exists():continue
           b=p.read_bytes();d=json.loads(b);bundle[rel]={'\''text'\'':b.decode(),'\''sha256'\'':hashlib.sha256(b).hexdigest()}
           s={k:d[k] for k in ('\''status'\'','\''complete'\'','\''decision'\'','\''failure'\'','\''error'\'','\''returncode'\'','\''active_matrix'\'','\''last_budget_projection'\'','\''timings'\'','\''arms'\'','\''screen_gate'\'','\''wait_encoder_actual_s'\'','\''driver_elapsed_s'\'','\''elapsed_host_s'\'','\''attempts'\'','\''all_8_existing_32row_sentinels_bitwise'\'','\''gpu_memory_before_service'\'','\''gpu_memory_after'\'','\''stage'\'','\''arm'\'','\''label'\'') if k in d}
           if '\''files'\'' in d:s['\''matrices'\'']=len(d['\''files'\''])
           if '\''quality'\'' in d:s['\''quality_decode'\'']=d['\''quality'\'']['\''decode'\''];s['\''quality_prefill'\'']=d['\''quality'\'']['\''prefill'\'']
           summary[rel]=s
          print('\''SUMMARY '\''+json.dumps(summary))
          b=json.dumps(bundle,sort_keys=True).encode();print('\''BUNDLE_INFO '\''+json.dumps({'\''files'\'':len(bundle),'\''bytes'\'':len(b),'\''sha256'\'':hashlib.sha256(b).hexdigest()}));print('\''BUNDLE_GZIP_B64 '\''+base64.b64encode(gzip.compress(b,mtime=0)).decode())
          for rel in ('\''encode-a2.log'\'','\''p2/driver-a1.log'\'','\''p2-a1/serve.log'\''):
           p=q/rel
           if p.exists():print('\''LOG_TAIL '\''+rel+'\''\\n'\''+'\''\\n'\''.join(p.read_text(errors='\''replace'\'').splitlines()[-14:]))
          print('\''GPU_MEMORY '\''+subprocess.check_output(['\''/usr/local/corex/bin/ixsmi'\'','\''--query-gpu=memory.used'\'','\''--format=csv,noheader'\''],text=True).strip())
          PY'
