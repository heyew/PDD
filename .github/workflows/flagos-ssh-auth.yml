name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Queue isolated profiler and W4 prefetch tests after service exits
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''PY'\''
          import json,hashlib,subprocess,sys
          from pathlib import Path
          print("FLAGOS_SERIAL_QUEUE_BEGIN",flush=True)
          for name in ["/root/e244/ledger_status.json","/root/e244/ledger_a1/stage.json","/root/e244/ledger_a1/rounds.json","/root/e244/ledger_a1/observer-error.json"]:
              p=Path(name)
              if p.is_file():print("RESULT_JSON",json.dumps({"path":name,"data":json.loads(p.read_text())}),flush=True)
          p=Path("/root/e244/driver.log")
          if p.is_file():print("LEDGER_LOG_TAIL",json.dumps(p.read_text().splitlines()[-15:]),flush=True)
          files={"/root/e247/profile_capture_capability.py":"#!/usr/bin/env python3\n\"\"\"Second tiny capability gate: profiler active DURING graph capture/instantiate.\n\nAlso checks preinitialized external graph event nodes against two distinct true\nwork lengths, to reject stale event handles/timestamps. No library/env changes.\nRun only on an idle card: timeout 60s python3 this.py output_dir\n\"\"\"\nimport argparse\nfrom collections import Counter\nimport json\nfrom pathlib import Path\nimport signal\nimport subprocess\nimport time\nimport traceback\n\nimport torch\nimport triton\nimport triton.language as tl\n\n\nclass ProbeDeadline(BaseException):\n    pass\n\n\n@triton.jit\ndef _outside_add(X, Y, N: tl.constexpr, BLOCK: tl.constexpr):\n    i = tl.program_id(0) * BLOCK + tl.arange(0, BLOCK)\n    tl.store(Y + i, tl.load(X + i, i < N, other=0) + 1., i < N)\n\n\n@triton.jit\ndef _outside_mul(Y, Z, N: tl.constexpr, BLOCK: tl.constexpr):\n    i = tl.program_id(0) * BLOCK + tl.arange(0, BLOCK)\n    tl.store(Z + i, tl.load(Y + i, i < N, other=0) * 2., i < N)\n\n\n@triton.jit\ndef _inside_add(X, Y, N: tl.constexpr, BLOCK: tl.constexpr):\n    i = tl.program_id(0) * BLOCK + tl.arange(0, BLOCK)\n    tl.store(Y + i, tl.load(X + i, i < N, other=0) + 2., i < N)\n\n\n@triton.jit\ndef _inside_mul(Y, Z, N: tl.constexpr, BLOCK: tl.constexpr):\n    i = tl.program_id(0) * BLOCK + tl.arange(0, BLOCK)\n    tl.store(Z + i, tl.load(Y + i, i < N, other=0) * 3., i < N)\n\n\ndef main():\n    ap = argparse.ArgumentParser(description=__doc__)\n    ap.add_argument(\"out\", type=Path)\n    args = ap.parse_args()\n    args.out.mkdir(parents=True, exist_ok=False)\n    started = time.monotonic()\n    result = {\"scope\": \"tiny_capture_and_event_capability_not_model_profile\", \"errors\": []}\n\n    def timeout(signum, frame):\n        raise ProbeDeadline(\"50-second internal deadline\")\n\n    signal.signal(signal.SIGALRM, timeout)\n    signal.alarm(50)\n    try:\n        used = subprocess.check_output([\"ixsmi\", \"--query-gpu=memory.used\", \"--format=csv,noheader\"], text=True)\n        assert int(used.split()[0]) < 256, \"Card not idle\"\n        torch.set_num_threads(1)\n        n = 1 << 20\n        x = torch.ones(n, dtype=torch.float32, device=\"cuda\")\n        ya, za, yb, zb = (torch.empty_like(x) for _ in range(4))\n\n        def outside():\n            _outside_add[(triton.cdiv(n, 256),)](x, ya, n, 256, num_warps=4)\n            _outside_mul[(triton.cdiv(n, 256),)](ya, za, n, 256, num_warps=4)\n\n        def inside():\n            _inside_add[(triton.cdiv(n, 256),)](x, yb, n, 256, num_warps=4)\n            _inside_mul[(triton.cdiv(n, 256),)](yb, zb, n, 256, num_warps=4)\n\n        outside()\n        inside()\n        torch.cuda.synchronize()\n        old = torch.cuda.CUDAGraph()\n        with torch.cuda.graph(old):\n            outside()\n        old.replay()\n        torch.cuda.synchronize()\n        zb.fill_(-77.)\n        torch.cuda.synchronize()\n        event_spans = {}\n\n        def timed(name, fn):\n            first, last = torch.cuda.Event(enable_timing=True), torch.cuda.Event(enable_timing=True)\n            with torch.profiler.record_function(name):\n                first.record()\n                fn()\n                last.record()\n                last.synchronize()\n            event_spans[name] = first.elapsed_time(last)\n\n        with torch.profiler.profile(activities=[torch.profiler.ProfilerActivity.CPU, torch.profiler.ProfilerActivity.CUDA],\n                                    record_shapes=False, profile_memory=False, with_stack=False) as profile:\n            timed(\"preexisting_graph\", old.replay)\n            new = torch.cuda.CUDAGraph()\n            with torch.profiler.record_function(\"capture_while_profiler_active\"):\n                with torch.cuda.graph(new):\n                    inside()\n            torch.cuda.synchronize()\n            result[\"capture_did_not_execute_kernels\"] = zb[0].item() == -77.\n            timed(\"new_graph_first_replay\", new.replay)\n            timed(\"new_graph_second_replay\", new.replay)\n        trace_path = args.out / \"capture_inside_profiler.trace.json\"\n        profile.export_chrome_trace(str(trace_path))\n        trace = json.loads(trace_path.read_text())\n        events = trace[\"traceEvents\"]\n        kernels = [e for e in events if e.get(\"ph\") == \"X\" and str(e.get(\"cat\", \"\")).lower() in (\"kernel\", \"gpu_kernel\", \"cuda_kernel\")]\n        old_kernels = [e for e in kernels if \"_outside_add\" in e.get(\"name\", \"\") or \"_outside_mul\" in e.get(\"name\", \"\")]\n        new_kernels = [e for e in kernels if \"_inside_add\" in e.get(\"name\", \"\") or \"_inside_mul\" in e.get(\"name\", \"\")]\n        result[\"profile_capture_gate\"] = {\n            \"external_event_ms\": event_spans, \"preexisting_kernel_records\": len(old_kernels),\n            \"inside_capture_kernel_records\": len(new_kernels),\n            \"expected_preexisting\": 2, \"expected_inside_capture\": 4,\n            \"capture_active_fixed_visibility\": len(new_kernels) == 4 and result[\"capture_did_not_execute_kernels\"],\n            \"category_counts\": dict(Counter(str(e.get(\"cat\", \"\")) for e in events)),\n            \"all_gpu_kernels\": [{\"name\": e.get(\"name\"), \"ts_us\": e.get(\"ts\"), \"dur_us\": e.get(\"dur\"), \"args\": e.get(\"args\", {})} for e in kernels],\n            \"note\": \"Extra gpu_memcpy/aten checks are excluded; only the two target native symbols count. Four new target records correspond to two actual replays, since capture itself was checked not to execute them.\",\n        }\n        assert za[0].item() == 4. and zb[0].item() == 9.\n        result[\"external_graph_event_nodes\"] = {}\n        for pairs in (1, 4):\n            name = f\"{pairs * 2}_kernels\"\n            row = {}\n            result[\"external_graph_event_nodes\"][name] = row\n            try:\n                # Preinitialize event handles before capture: distinguishes lazy\n                # handle creation from unsupported or stale graph event nodes.\n                first = torch.cuda.Event(enable_timing=True, external=True)\n                last = torch.cuda.Event(enable_timing=True, external=True)\n                first.record()\n                last.record()\n                last.synchronize()\n                row[\"preinitialize_elapsed_ms\"] = first.elapsed_time(last)\n                graph = torch.cuda.CUDAGraph()\n                with torch.cuda.graph(graph):\n                    first.record()\n                    for _ in range(pairs):\n                        inside()\n                    last.record()\n                outer_a, outer_b = torch.cuda.Event(enable_timing=True), torch.cuda.Event(enable_timing=True)\n                samples = []\n                for _ in range(3):\n                    outer_a.record()\n                    graph.replay()\n                    outer_b.record()\n                    outer_b.synchronize()\n                    samples.append({\"outer_ms\": outer_a.elapsed_time(outer_b), \"inner_ms\": first.elapsed_time(last)})\n                row[\"samples\"] = samples\n                row[\"basic_valid\"] = all(s[\"inner_ms\"] > .005 and 0 <= s[\"outer_ms\"] - s[\"inner_ms\"] < .2 for s in samples)\n            except Exception as exc:\n                row.update(basic_valid=False, error=repr(exc))\n        small, large = (result[\"external_graph_event_nodes\"][name] for name in (\"2_kernels\", \"8_kernels\"))\n        result[\"external_event_stage_timing_supported\"] = bool(\n            small.get(\"basic_valid\") and large.get(\"basic_valid\") and\n            min(s[\"inner_ms\"] for s in large[\"samples\"]) > 2 * max(s[\"inner_ms\"] for s in small[\"samples\"]))\n        result[\"event_gate_note\"] = \"A valid handle alone is insufficient: inner stamps must track a fourfold true-work increase, fit the outer event span, and not retain the preinitialization timestamp. Even a pass requires overhead/bitwise gates before insertion into a full graph.\"\n    except (ProbeDeadline, Exception) as exc:\n        result[\"errors\"].append({\"error\": repr(exc), \"traceback\": traceback.format_exc()})\n    finally:\n        signal.alarm(0)\n        result[\"elapsed_wall_s\"] = time.monotonic() - started\n        (args.out / \"result.json\").write_text(json.dumps(result, indent=2) + \"\\n\")\n        print(json.dumps(result, indent=2))\n\n\nif __name__ == \"__main__\":\n    main()\n","/root/e245/native_w4_prefetch.py":"\"\"\"Isolated E245 native8 K128 LDS-prefetch variant; not enabled in production.\n\nSame input/output layout, SME copy, 24KiB LDS, arithmetic order and clobbers.\nOnly the within-K128 LDS issue/consume schedule changes. Device validation pending.\n\"\"\"\nimport triton\nimport triton.language as tl\nimport triton.experimental.tle.language.gpu as tleg\nfrom native_w4_down import down, pack_b4, _CONSTRAINTS\n\ndef _assembly8_prefetch(row_scale=False):\n    tile_n = 64\n    lines = []\n    emit = lines.append\n    # A is strided, B is K128 group-major. The wider CTA shares one A\n    # copy between two adjacent warps, which own different N64 tiles.\n    wide = False\n    for index, reg in enumerate((16, 17, 20, 21, 24, 25, 8, 9, 12, 13, 36, 37, 38, 39, 40, 43)):\n        emit(f\"ml_mov_v2s_b32 s{reg}, ${106 + index}, 0x0\")\n    for index, reg in enumerate((48, 49, 36, 37)):\n        emit(f\"ml_mov_b32 v{reg}, ${122 + index}\")\n    for reg in (8, 12, 16, 20, 24):\n        emit(f\"sl_mov_b32 s{reg + 2}, 0x40000000\")\n        stride = {16: \"s43\", 20: \"0x40\"}.get(reg, \"0xffffffff\")\n        emit(f\"sl_mov_b32 s{reg + 3}, {stride}\")\n    emit(\"sl_shl_b32 s44, s37, 0x2\")\n    for reg in (2, 41, 42):\n        emit(f\"sl_mov_b32 s{reg}, 0x0\")\n    for reg in range(16, 24):\n        emit(f\"ml_mov_b32 v{reg}, 0x0\")\n\n    def copy(stage, label):\n        # The first four warps copy the complete A and compressed B tiles once.\n        # All eight warps subsequently consume M16 x N32 output fragments.\n        emit(\"sl_cmp_lt_i32 wcr, s38, 0x4\")\n        emit(f\"sl_cbr_wcrz .Ldown8_skip_copy_{label}\")\n        emit(\"sl_shl_b32 s4, s38, 0xa\")\n        emit(f\"sl_add_i32 s33, s39, {stage}\")\n        emit(\"sl_add_i32 s33, s33, s4\")\n        for half in range(2):\n            emit(\"sl_mov_b32 s32, 0x0\")\n            if half:\n                emit(\"sl_add_i32 s33, s33, 0x1000\")\n            emit(\"sl_sme_load_16x1b64_rowxfb8 s[16:19], s[32:33], 0x0, 0x0, 0x0, 0x1\")\n            emit(\"sl_add_i64 s[16:17], s[16:17], 0x40\")\n        emit(f\"sl_srl_b32 s31, {stage}, 0x1\")\n        emit(\"sl_add_i32 s31, s40, s31\")\n        emit(\"sl_add_i32 s31, s31, s4\")\n        emit(\"sl_mov_b32 s30, 0x0\")\n        emit(\"sl_sme_load_16x1b64_rowxfb8 s[20:23], s[30:31], 0x0, 0x0, 0x0, 0x1\")\n        emit(\"sl_add_i64 s[20:21], s[20:21], 0x1000\")\n        emit(f\".Ldown8_skip_copy_{label}:\")\n\n    copy(\"s2\", \"first\")\n    emit(\".Ldown8_group:\")\n    emit(\"sl_wait g2scnt(0)\")\n    emit(\"sl_barrier\")\n    emit(\"sl_xor_b32 s3, s2, 0x2000\")\n    emit(\"sl_cmp_gt_i32 wcr, s36, 0x1\")\n    emit(\"sl_cbr_wcrz .Ldown8_last\")\n    copy(\"s3\", \"next\")\n    emit(\".Ldown8_last:\")\n    # Scale loads overlap the integer dot and are consumed once per K128.\n    if not row_scale:\n        for fragment in range(2):\n            emit(f\"ml_lsa_load_dword v{44 + fragment}, s[12:15], unsigned v37, s42, #{fragment * 64}, ca\")\n    emit(\"sl_shl_b32 s45, s43, 0x2\")  # 4 output rows per accumulator register\n    emit(\"sl_srl_b32 s45, s45, 0x5\")  # 4 * (K / 128) * sizeof(float)\n    emit(\"sl_mov_b32 s46, s41\")\n    for row in range(4):\n        emit(f\"ml_lsa_load_dword v{40 + row}, s[8:11], unsigned v36, s46, #0, ca\")\n        emit(\"sl_add_i32 s46, s46, s45\")\n    emit(\"sl_srl_b32 s4, s38, 0x1\")\n    emit(\"sl_shl_b32 s4, s4, 0xa\")\n    emit(\"sl_add_i32 s4, s39, s4\")\n    emit(\"sl_add_i32 s4, s4, s2\")\n    emit(\"sl_srl_b32 s5, s2, 0x1\")\n    emit(\"sl_and_b32 s6, s38, 0x1\")\n    emit(\"sl_shl_b32 s6, s6, 0xa\")\n    emit(\"sl_add_i32 s5, s5, s6\")\n    emit(\"sl_add_i32 s5, s5, s40\")\n    emit(\"ml_add_i32 v51, s5, v48\")\n    for reg in range(8):\n        emit(f\"ml_mov_b32 v{reg}, 0x0\")\n    # All operands for this K128 group are fetched before its first MMA.\n    # v8..15 and v24..31 were already declared clobbers in the control.\n    for step in range(4):\n        for word in range(2):\n            kword = 2 * (step % 2) + word\n            emit(f\"ml_add_i32 v50, v48, 0x{kword * 64:x}\")\n            emit(\"ml_and_b32 v50, v50, 0xff\")\n            emit(\"ml_add_i32 v50, s4, v50\")\n            if step >= 2:\n                emit(\"ml_add_i32 v50, v50, 0x1000\")\n            offset = kword * 256\n            emit(f\"ml_slb_load_b32x1 v{8 + 2 * step + word}, v50, noreg, #{offset}, null\")\n        for fragment in range(2):\n            offset = (step // 2) * 2048 + fragment * 512 + (step % 2) * 256\n            emit(f\"ml_add_i32 v52, v51, 0x{offset:x}\")\n            emit(f\"ml_slb_load_b32x1 v{24 + 2 * step + fragment}, v52, noreg, #0, null\")\n    for step in range(4):\n        emit(f\"sl_wait lmcnt({12 - 4 * step})\")\n        for fragment in range(2):\n            packed = 24 + 2 * step + fragment\n            emit(f\"ml_shl_b32 v38, v{packed}, 0x4\")\n            emit(\"ml_and_b32 v38, v38, 0xf0f0f0f0\")\n            emit(f\"ml_and_b32 v39, v{packed}, 0xf0f0f0f0\")\n            acc = f\"v[{4 * fragment}:{4 * fragment + 3}]\"\n            emit(f\"ml_matrix_mad_i32_i8_m16n16k32 {acc}, v[{8 + 2 * step}:{9 + 2 * step}], v[38:39], {acc}\")\n    emit(\"sl_wait vmcnt(0)\")\n    for fragment in range(2):\n        for row in range(4):\n            dot = fragment * 4 + row\n            out = 16 + dot\n            emit(f\"ml_cvt_f32_i32 v{dot}, v{dot}\")\n            if row_scale:\n                emit(f\"ml_fma_f32 v{out}, v{dot}, v{40 + row}, v{out}\")\n            else:\n                emit(f\"ml_mul_f32 v{dot}, v{dot}, v{40 + row}\")\n                emit(f\"ml_fma_f32 v{out}, v{dot}, v{44 + fragment}, v{out}\")\n    emit(\"sl_add_i32 s41, s41, 0x4\")\n    if not row_scale:\n        emit(\"sl_add_i32 s42, s42, s44\")\n    emit(\"sl_add_i32 s36, s36, 0xffffffff\")\n    emit(\"sl_mov_b32 s2, s3\")\n    emit(\"sl_cmp_gt_i32 wcr, s36, 0x0\")\n    emit(\"sl_cbr_wcrnz .Ldown8_group\")\n    for row in range(4):\n        emit(f\"sl_mull_u32 s6, s37, 0x{16 * row:x}\")\n        for fragment in range(2):\n            emit(f\"ml_lsa_store_dword v{16 + 4 * fragment + row}, s[24:27], unsigned v49, s6, #{64 * fragment}, wb\")\n    emit(\"sl_wait vmcnt(0)\")\n    return \";\\n\".join(lines) + \";\\n\"\n\n_ASM8_PREFETCH_ROW = tl.constexpr(_assembly8_prefetch(True))\n_ASM8_PREFETCH_GROUP = tl.constexpr(_assembly8_prefetch(False))\n\n@triton.jit\ndef down8_prefetch(Q, SA, B, SB, P, K: tl.constexpr, N: tl.constexpr, SPLIT: tl.constexpr, TILE_N: tl.constexpr,\n         ROW_SCALE: tl.constexpr = False):\n    pn = tl.program_id(0)\n    split = tl.program_id(1)\n    groups: tl.constexpr = K // 128\n    tl.static_assert(groups % SPLIT == 0)\n    start = split * (groups // SPLIT)\n    tl.static_assert(TILE_N == 64)\n    tid = tl.arange(0, 512)\n    warp, lane = tid // 64, tid % 64\n    row = (warp // 2) * 16 + lane // 16\n    col = (warp % 2) * 32 + lane % 16\n    z = tid * 0\n    buf_a = tleg.alloc((16384,), tl.uint8, scope=tleg.smem, nv_mma_shared_layout=False)\n    buf_b = tleg.alloc((8192,), tl.uint8, scope=tleg.smem, nv_mma_shared_layout=False)\n    ptr_a = tleg.local_ptr(buf_a, (0,))\n    ptr_b = tleg.local_ptr(buf_b, (0,))\n    tl.store(ptr_a, 0)\n    tl.store(ptr_b, 0)\n    asm: tl.constexpr = _ASM8_PREFETCH_ROW if ROW_SCALE else _ASM8_PREFETCH_GROUP\n    tl.debug_barrier()\n    shared_a = ptr_a.to(tl.uint64).to(tl.int32) + z\n    shared_b = ptr_b.to(tl.uint64).to(tl.int32) + z\n\n    a = (Q + (warp % 4) * 16 * K + start * 128).to(tl.uint64)\n    b = (B + (pn * groups + start) * (TILE_N * 64) + (warp % 4) * 1024).to(tl.uint64)\n    output = (P + split * 64 * N + pn * TILE_N + z).to(tl.uint64)\n    sa = (SA + start + z).to(tl.uint64)\n    if ROW_SCALE:\n        sb = z.to(tl.uint64)\n    else:\n        sb = (SB + start * N + pn * TILE_N + z).to(tl.uint64)\n    tl.inline_asm_elementwise(\n        asm, _CONSTRAINTS,\n        [(a & 0xffffffff).to(tl.int32), (a >> 32).to(tl.int32),\n         (b & 0xffffffff).to(tl.int32), (b >> 32).to(tl.int32),\n         (output & 0xffffffff).to(tl.int32), (output >> 32).to(tl.int32),\n         (sa & 0xffffffff).to(tl.int32), (sa >> 32).to(tl.int32),\n         (sb & 0xffffffff).to(tl.int32), (sb >> 32).to(tl.int32),\n         z + groups // SPLIT, z + N, warp, shared_a, shared_b, z + K,\n         lane * 4, (row * N + col) * 4, row * groups * 4, col * 4],\n        dtype=(tl.int32,) * 106, is_pure=False, pack=1,\n    )\n\ndown8 = down8_prefetch\n","/root/e245/smoke_prefetch.py":"\"\"\"Independent small-K CPU integer oracle for native 4/8-warp W4 down.\n\nNo checkpoint, production hook, timing, or quality claim. Execute only on card A.\n\"\"\"\nimport argparse\nimport hashlib\nimport json\nfrom pathlib import Path\nimport sys\n\n\ndef checks(native, N, torch, out):\n    rows = []\n    for groups, split in ((1, 1), (2, 1), (4, 2), (6, 3)):\n        k, n = groups * 128, 128\n        q = torch.randint(-32, 33, (64, k), device=\"cuda\", dtype=torch.int8)\n        w = torch.randint(-8, 8, (n, k), device=\"cuda\", dtype=torch.int8)\n        binary = torch.tensor([0.5, 0.25, 0.125, 0.0625], device=\"cuda\", dtype=torch.float32)\n        sa = binary[torch.randint(0, 4, (64, groups), device=\"cuda\")]\n        sw = binary[torch.randint(0, 4, (groups, n), device=\"cuda\")]\n        packed = torch.empty(n * k // 2, device=\"cuda\", dtype=torch.uint8)\n        native.pack_b4[(n // 64, groups, 4)](w, packed, N.lut(\"cuda\"), K=k, TILE_N=64, num_warps=4)\n        qc, wc, sac, swc = q.cpu().to(torch.int64), w.cpu().to(torch.int64) * 16, sa.cpu(), sw.cpu()\n        for row_scale in (True, False):\n            ref = torch.zeros((split, 64, n), dtype=torch.float32)\n            for g in range(groups):\n                integer = qc[:, g * 128:(g + 1) * 128] @ wc[:, g * 128:(g + 1) * 128].T\n                value = integer.float() * sac[:, g, None]\n                if not row_scale:\n                    value = value * swc[g, None, :]\n                ref[g // (groups // split)] += value\n            for warps, kernel in ((4, native.down), (8, native.down8)):\n                partial = torch.full((split, 64, n), float(\"nan\"), device=\"cuda\")\n                compiled = kernel[(n // 64, split)](q, sa, packed, sw, partial,\n                    K=k, N=n, SPLIT=split, TILE_N=64, ROW_SCALE=row_scale,\n                    num_warps=warps, num_stages=1)\n                actual = partial.cpu()\n                exact = torch.equal(actual, ref)\n                asm = compiled.asm.get(\"asm\", \"\")\n                item = dict(groups=groups, split=split, row_scale=row_scale, warps=warps,\n                    exact=exact, max_abs=float((actual - ref).abs().max()),\n                    regs=compiled.n_regs, spills=compiled.n_spills,\n                    lds=compiled.metadata.shared, asm_present=bool(asm),\n                    sme=asm.count(\"sl_sme_load\"), mma=asm.count(\"ml_matrix_mad_i32_i8\"))\n                print(json.dumps(item), flush=True)\n                rows.append(item)\n                (out / \"tiny_checks.json\").write_text(json.dumps(rows, indent=2) + \"\\n\")\n                (out / f\"tiny_{groups}_{split}_{int(row_scale)}_{warps}.isa\").write_text(asm)\n                if not exact:\n                    torch.save(dict(q=q.cpu(), w=w.cpu(), sa=sac, sw=swc,\n                                    actual=actual, expected=ref), out / \"tiny_mismatch.pt\")\n                assert exact and compiled.n_spills == 0 and asm and item[\"sme\"] > 0 and item[\"mma\"] > 0, item\n                if warps == 8:\n                    assert compiled.metadata.shared <= 32768 and compiled.n_regs <= 128, item\n    return rows\n\n\ndef main():\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"--gems-src\", type=Path, required=True)\n    ap.add_argument(\"--out\", type=Path, required=True)\n    args = ap.parse_args()\n    args.out.mkdir(parents=True, exist_ok=False)\n    sys.path.insert(0, str(args.gems_src))\n    import torch\n    from flag_gems.fused.minicpm import _native_pair_mlp as N\n    import native_w4_prefetch as D\n    torch.set_num_threads(4)\n    torch.manual_seed(244081)\n    result = dict(scope=\"CARD_A_NATIVE_W4_8WARP_TINY_INTEGER_ORACLE_ONLY\",\n                  source_sha256=hashlib.sha256(Path(D.__file__).read_bytes()).hexdigest(),\n                  checks=checks(D, N, torch, args.out))\n    (args.out / \"result.json\").write_text(json.dumps(result, indent=2) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    main()\n","/root/e245/p0_w4_prefetch.py":"\"\"\"Complete production norm/GU + same-code native W4 down ownership P0.\n\nTwo codec families, each with four paired arms: current W8, expanded W4,\nnative8 control, native8 prefetch. Synthetic BF16 layer inputs, original checkpoint\nweights, exact frozen E214 producer. Never a service or quality claim.\n\"\"\"\nfrom __future__ import annotations\nimport argparse\nimport hashlib\nimport json\nfrom pathlib import Path\nfrom statistics import median\nimport sys\n\n\nPINS = {\n    \"_native_pair_mlp.py\": \"f328af93a666468c0460caa2b285a1e6b580fe25b81c28756f9bd06af5632aa8\",\n    \"_group_a8_mlp.py\": \"0e6f3d01553dc828f314d1cee23562a6dabe4aa6a6da2fa3751e241eb2da82ce\",\n    \"w8a8.py\": \"06b113a81633f4c8436627cef857ff533abcd5153588a2471197cfb49014863e\",\n    \"fused_layers.py\": \"095f4437b6d1a47acddcdc12244f09de76f1fc24e4827d489508dd1182884e02\",\n}\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"--gems-src\", type=Path, required=True)\n    parser.add_argument(\"--checkpoint-dir\", type=Path, required=True)\n    parser.add_argument(\"--out\", type=Path, required=True)\n    parser.add_argument(\"--layers\", default=\"0,13,27,41\")\n    parser.add_argument(\"--weight-scales\", choices=(\"row\", \"group\", \"both\"), default=\"both\")\n    parser.add_argument(\"--replays\", type=int, default=20)\n    parser.add_argument(\"--skip-tiny\", action=\"store_true\", help=\"Only after the separate smoke on identical native source passed\")\n    args = parser.parse_args()\n    assert not args.out.exists(), \"Use a fresh output directory\"\n    base = args.gems_src.resolve() / \"flag_gems/fused/minicpm\"\n    for name, sha in PINS.items():\n        assert hashlib.sha256((base / name).read_bytes()).hexdigest() == sha, name\n    sys.path.insert(0, str(args.gems_src.resolve()))\n    import numpy as np\n    import torch\n    import triton\n    from safetensors import safe_open\n    from flag_gems.fused.minicpm import _native_pair_mlp as GU, _group_a8_mlp as G\n    from flag_gems.fused.minicpm import _h128_basis as H, fused_layers as F, w8a8 as W\n    import native_w4_down as D\n    import native_w4_prefetch as DP\n    import codec_controls as C\n    from smoke_native_w4 import checks as tiny_checks\n\n    torch.set_num_threads(4)\n    torch.manual_seed(245081)\n    args.out.mkdir(parents=True)\n    families = (\"row\", \"group\") if args.weight_scales == \"both\" else (args.weight_scales,)\n    layer_ids = [int(x) for x in args.layers.split(\",\")]\n    result = dict(scope=\"CARD_A_COMPLETE_NORM_GU_DOWN_FOUR_REAL_WEIGHT_LAYERS_SYNTHETIC_INPUTS\",\n        official_quality=False, complete_42_layer_graph=False, production_source_pins=PINS,\n        source_sha256={p.name: hashlib.sha256(p.read_bytes()).hexdigest()\n                       for p in (Path(__file__), Path(D.__file__), Path(DP.__file__), Path(C.__file__))},\n        device=torch.cuda.get_device_name(0), torch_version=torch.__version__, triton_version=triton.__version__,\n        layers=layer_ids, families=families, resources={}, parity=[], timings={})\n    def save():\n        (args.out / \"result.json\").write_text(json.dumps(result, indent=2) + \"\\n\")\n    def emit(kind, value):\n        print(json.dumps(dict(kind=kind, value=value)), flush=True)\n    save()\n    if not args.skip_tiny:\n        result[\"tiny\"] = tiny_checks(DP, GU, torch, args.out)\n        save()\n    else:\n        result[\"tiny\"] = \"EXPLICITLY_SKIPPED_REQUIRE_PRIOR_SAME_SHA_SMOKE\"\n\n    index = args.checkpoint_dir / \"model.safetensors.index.json\"\n    if index.exists():\n        mapping = json.loads(index.read_text())[\"weight_map\"]\n        def filename(name): return args.checkpoint_dir / mapping[name]\n    else:\n        shards = list(args.checkpoint_dir.glob(\"*.safetensors\"))\n        assert len(shards) == 1, \"No index and not exactly one safetensors file\"\n        def filename(name): return shards[0]\n    def read(name):\n        with safe_open(str(filename(name)), framework=\"pt\", device=\"cpu\") as shard:\n            return shard.get_tensor(name).to(device=\"cuda\", dtype=torch.bfloat16)\n    config = json.loads((args.checkpoint_dir / \"config.json\").read_text())\n    eps = float(config.get(\"rms_norm_eps\", 1.e-6))\n    data = []\n    arms = (\"w8\", \"expanded\", \"native8_control\", \"native8_prefetch\")\n    for layer in layer_ids:\n        prefix = f\"model.layers.{layer}.\"\n        gate, up = read(prefix + \"mlp.gate_proj.weight\"), read(prefix + \"mlp.up_proj.weight\")\n        gu, sg = GU.prepare_weight(*W.quantize_weight(torch.cat((gate, up), 0), False))\n        raw_down = read(prefix + \"mlp.down_proj.weight\")\n        w8, s8 = H.quant_weight(raw_down)\n        assert tuple(w8.shape) == (2048, 6144)\n        rotated, maxima = torch.empty_like(raw_down), torch.empty((2048, 48), device=\"cuda\")\n        H.rotate[(32, 48)](raw_down, W._h128(\"cuda\"), rotated, maxima,\n            M=2048, K=6144, BM=64, num_warps=4, num_stages=1)\n        a = torch.randn((64, 2048), device=\"cuda\", dtype=torch.bfloat16)\n        d = dict(layer=layer, gu=gu, sg=sg, w8=w8, s8=s8, a=a,\n            b=torch.randn_like(a), nw=read(prefix + \"post_attention_layernorm.weight\"),\n            q=torch.empty((64, 2048), device=\"cuda\", dtype=torch.int8),\n            qs=torch.empty(64, device=\"cuda\"), res=torch.empty_like(a),\n            codes=torch.empty((64, 6144), device=\"cuda\", dtype=torch.int8),\n            scales=torch.empty((64, 48), device=\"cuda\"), ones=torch.ones(2048, device=\"cuda\"), codecs={})\n        for family in families:\n            row = family == \"row\"\n            width, ng = (6144, 1) if row else (128, 48)\n            code = torch.empty_like(w8)\n            scale = torch.empty((2048, ng), device=\"cuda\")\n            C.fit_weight[(2048, ng)](rotated, code, scale, K=6144, WIDTH=width,\n                BLOCK=triton.next_power_of_2(width), ROW_SCALE=row, num_warps=8 if row else 2)\n            packed = torch.empty(2048 * 6144 // 2, device=\"cuda\", dtype=torch.uint8)\n            D.pack_b4[(32, 48, 4)](code, packed, GU.lut(\"cuda\"), K=6144, TILE_N=64, num_warps=4)\n            c = dict(expanded=(code * 16).contiguous(), packed=packed,\n                     scale16=(scale.flatten() * 0.0625 if row else scale.T.contiguous() * 0.0625))\n            d[\"codecs\"][family] = c\n            for arm in arms:\n                d[(family, arm, \"p\")] = torch.empty((2, 64, 2048), device=\"cuda\")\n                d[(family, arm, \"y\")] = torch.empty_like(a)\n        del gate, up, raw_down, rotated, maxima, code, scale\n        data.append(d)\n        emit(\"prepared_layer\", layer)\n\n    def prefix(d):\n        F._nq_kernel[(64,)](d[\"a\"], d[\"b\"], d[\"res\"], d[\"nw\"], d[\"q\"], d[\"qs\"], 64, eps,\n            K=2048, num_warps=8)\n        return GU.run(d[\"q\"], d[\"qs\"], d[\"gu\"], d[\"sg\"], d[\"codes\"], d[\"scales\"])\n    def run(d, family, arm, include_gu=False):\n        if include_gu:\n            prefix(d)\n        p, y = d[(family, arm, \"p\")], d[(family, arm, \"y\")]\n        c, row = d[\"codecs\"][family], family == \"row\"\n        if arm == \"w8\":\n            kernel = G._down[(32, 2)](d[\"codes\"], d[\"scales\"], d[\"w8\"], d[\"s8\"], p,\n                K=6144, N=2048, BM=64, BN=64, SPLIT=2, num_warps=8, num_stages=2)\n            finish_scale = d[\"s8\"]\n        elif arm == \"expanded\":\n            if row:\n                kernel = G._down[(32, 2)](d[\"codes\"], d[\"scales\"], c[\"expanded\"], c[\"scale16\"], p,\n                    K=6144, N=2048, BM=64, BN=64, SPLIT=2, num_warps=8, num_stages=2)\n            else:\n                kernel = C.expanded_group[(32, 2)](d[\"codes\"], d[\"scales\"], c[\"expanded\"], c[\"scale16\"], p,\n                    K=6144, N=2048, num_warps=8, num_stages=2)\n            finish_scale = c[\"scale16\"] if row else d[\"ones\"]\n        else:\n            fn, nw = (D.down8, 8) if arm == \"native8_control\" else (DP.down8, 8)\n            kernel = fn[(32, 2)](d[\"codes\"], d[\"scales\"], c[\"packed\"], c[\"scale16\"], p,\n                K=6144, N=2048, SPLIT=2, TILE_N=64, ROW_SCALE=row, num_warps=nw, num_stages=1)\n            finish_scale = c[\"scale16\"] if row else d[\"ones\"]\n        finish = G._finish[(512,)](p, finish_scale, y, N=2048, M=64, SPLIT=2, BLOCK=256, num_warps=4)\n        return kernel, finish\n    def resource(kernel, name):\n        asm = kernel.asm.get(\"asm\", \"\")\n        (args.out / f\"{name}.isa\").write_text(asm)\n        md = dict(regs=kernel.n_regs, spills=kernel.n_spills, lds=kernel.metadata.shared,\n            sme_row=asm.count(\"sl_sme_load_16x1b64_row\"), sme_col=asm.count(\"sl_sme_load_16x1b64_col\"),\n            mma=asm.count(\"ml_matrix_mad_i32_i8\"), asm_present=bool(asm))\n        result[\"resources\"][name] = md\n        return md\n\n    for d in data:\n        prefix(d)\n        for family in families:\n            for arm in arms:\n                kernel, finish = run(d, family, arm)\n                if d is data[0]:\n                    md = resource(kernel, family + \"_\" + arm)\n                    assert md[\"spills\"] == 0 and md[\"asm_present\"] and md[\"mma\"] > 0, md\n                    if arm in (\"native8_control\", \"native8_prefetch\"):\n                        assert md[\"lds\"] <= 32768 and md[\"regs\"] <= 128 and md[\"sme_row\"] > 0, md\n            torch.cuda.synchronize()\n            ref = d[(family, \"expanded\", \"p\")]\n            refy = d[(family, \"expanded\", \"y\")]\n            for arm in (\"native8_control\", \"native8_prefetch\"):\n                same_p = torch.equal(d[(family, arm, \"p\")], ref)\n                same_y = torch.equal(d[(family, arm, \"y\")], refy)\n                info = dict(layer=d[\"layer\"], family=family, arm=arm,\n                    same_code_partial_bitwise=same_p, same_code_bf16_bitwise=same_y,\n                    max_partial_abs=float((d[(family, arm, \"p\")] - ref).abs().max()))\n                result[\"parity\"].append(info)\n                emit(\"same_code_parity\", info)\n                save()\n                assert same_p and same_y, info\n            stock, stock_residual = G.norm_mlp(d[\"a\"], d[\"b\"], d[\"nw\"], eps, d[\"gu\"], d[\"sg\"], d[\"w8\"], d[\"s8\"])\n            assert torch.equal(stock, d[(family, \"w8\", \"y\")]) and torch.equal(stock_residual, d[\"res\"])\n            y8 = d[(family, \"w8\", \"y\")].float()\n            y4 = refy.float()\n            emit(\"fixture_weight_error_not_model_quality\", dict(layer=d[\"layer\"], family=family,\n                output_relative_l2=float((y4 - y8).norm() / y8.norm().clamp_min(1.e-30))))\n            # Independent full-K CPU integer oracle on 16 distributed columns.\n            columns = np.array([0, 1, 15, 16, 31, 32, 63, 64, 127, 255, 511, 1023, 1535, 1983, 2031, 2047])\n            q = d[\"codes\"].cpu().numpy().astype(np.int64)\n            w = d[\"codecs\"][family][\"expanded\"].cpu().numpy()[columns].astype(np.int64)\n            sa = d[\"scales\"].cpu().numpy()\n            sw = d[\"codecs\"][family][\"scale16\"].cpu().numpy()\n            oracle = np.zeros((2, 64, len(columns)), np.float32)\n            for group in range(48):\n                dot = (q[:, group*128:(group+1)*128] @ w[:, group*128:(group+1)*128].T).astype(np.float32)\n                if family == \"row\":\n                    oracle[group // 24] = (dot.astype(np.float64) * sa[:, group, None].astype(np.float64)\n                                          + oracle[group // 24].astype(np.float64)).astype(np.float32)\n                else:\n                    value = (dot.astype(np.float64) * sa[:, group, None].astype(np.float64)).astype(np.float32)\n                    oracle[group // 24] = (value.astype(np.float64) * sw[group, columns][None, :].astype(np.float64)\n                                          + oracle[group // 24].astype(np.float64)).astype(np.float32)\n            actual = ref.cpu().numpy()[:, :, columns]\n            exact = np.array_equal(actual.view(np.uint32), oracle.view(np.uint32))\n            info = dict(layer=d[\"layer\"], family=family, independent_cpu_columns=columns.tolist(),\n                        cpu_partial_bitwise=exact, max_abs=float(np.max(np.abs(actual-oracle))))\n            result[\"parity\"].append(info)\n            emit(\"cpu_integer_oracle\", info)\n            save()\n            assert exact, info\n\n    for family in families:\n        result[\"timings\"][family] = {}\n        for scope, include_gu in ((\"down_and_finish\", False), (\"complete_norm_GU_down_finish\", True)):\n            graphs = {}\n            for arm in arms:\n                for d in data: run(d, family, arm, include_gu)\n                graph = torch.cuda.CUDAGraph()\n                with torch.cuda.graph(graph):\n                    for d in data: run(d, family, arm, include_gu)\n                graph.replay()\n                graphs[arm] = graph\n            torch.cuda.synchronize()\n            raw = {arm: [] for arm in arms}\n            e0, e1 = torch.cuda.Event(enable_timing=True), torch.cuda.Event(enable_timing=True)\n            for group in range(6):\n                for arm in arms if group % 2 == 0 else arms[::-1]:\n                    graphs[arm].replay()\n                    e0.record()\n                    for _ in range(args.replays): graphs[arm].replay()\n                    e1.record(); e1.synchronize()\n                    raw[arm].append(e0.elapsed_time(e1) * 1000 / (args.replays * len(data)))\n            stats = dict(raw_us_per_layer=raw, median_us_per_layer={a: median(v) for a, v in raw.items()},\n                paired_saved_vs_w8_us_per_layer={a: median(x-y for x,y in zip(raw[\"w8\"],v)) for a,v in raw.items()},\n                paired_saved_prefetch_vs_native8_control_us_per_layer=median(x-y for x,y in zip(raw[\"native8_control\"],raw[\"native8_prefetch\"])))\n            result[\"timings\"][family][scope] = stats\n            emit(family + \"_\" + scope, stats)\n            save()\n    result[\"decision\"] = {family: (\"COST_PASS_NEEDS_REAL_TEXT_AND_COMPLETE_42_LAYER_GRAPH\"\n        if result[\"timings\"][family][\"complete_norm_GU_down_finish\"][\"paired_saved_vs_w8_us_per_layer\"][\"native8_prefetch\"] >= 2.5\n        else \"STOP_THIS_PREFETCH_IMPLEMENTATION\") for family in families}\n    save(); emit(\"decision\", result[\"decision\"])\n\n\nif __name__ == \"__main__\":\n    main()\n","/root/e247/run_serial_followups.py":"import hashlib,json,os,signal,subprocess,sys,time\nfrom pathlib import Path\nroot=Path(\"/root/e247\")\nstatus=root/\"followups_status.json\"\ndata={\"state\":\"waiting_for_e244\",\"start_unix\":time.time(),\"tasks\":[]}\ndef save():status.write_text(json.dumps(data)+\"\\n\")\ndef idle():\n    used=subprocess.check_output([\"/usr/local/corex/bin/ixsmi\",\"--query-gpu=memory.used\",\"--format=csv,noheader\"],tex