name: FlagOS SSH environment probe

on:
  push:
    branches:
      - chatgpt/flagos-ssh-connectivity-20261112
    paths:
      - .github/workflows/flagos-ssh-auth.yml

permissions: {}

jobs:
  ssh-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FLAGOS_SSH_KEY: ${{ secrets.a123 }}
    steps:
      - name: Collect complete W4 chain and time QK8 recipient chain
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLAGOS_SSH_KEY:-}" ]; then
            echo "::error::Secret a123 is missing; add it to Actions repository secrets and rerun this job."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf "%s\n" "$FLAGOS_SSH_KEY" > "$HOME/.ssh/flagos_actions"
          printf "%s\n" "[ssh.flagos.io]:2224 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXHybs2tlTdSKA6PFRjarvdNbIh/YJY9Sy9xZ0UknOA" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/flagos_actions" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/flagos_actions" -p 2224 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=8 -o LogLevel=ERROR \
            lab_inst_01M65FEWSPNR8MP3DS4KNYDQ2C@ssh.flagos.io \
            'python3 - <<'\''PY'\''
          import json,hashlib,subprocess,sys
          from pathlib import Path
          print("FLAGOS_E245_A2_E246_CHAIN_BEGIN",flush=True)
          for name in ["/root/e245/full_a2_status.json","/root/e245/full-a2/result.json"]:
              p=Path(name)
              if p.is_file():print("RESULT_JSON",json.dumps({"path":name,"data":json.loads(p.read_text())}),flush=True)
          p=Path("/root/e245/full_a2.log")
          if p.is_file():print("W4_A2_LOG_TAIL",json.dumps(p.read_text().splitlines()[-35:]),flush=True)
          status=json.loads(Path("/root/e245/full_a2_status.json").read_text());assert status["state"]=="completed","W4 full still running"
          tiny=json.loads(Path("/root/e246/tiny_status.json").read_text());assert tiny["state"]=="completed" and tiny["exit_code"]==0
          used=subprocess.check_output(["/usr/local/corex/bin/ixsmi","--query-gpu=memory.used","--format=csv,noheader"],text=True);assert int(used.split()[0])<256,"Card is not idle"
          root=Path("/root/e246");path=root/"run_chain_owned.py";assert not path.exists()
          path.write_text("import json,os,signal,subprocess,sys,time\nfrom pathlib import Path\nroot=Path(__file__).resolve().parent\nstatus=root/\"chain_status.json\"\ncmd=[sys.executable,str(root/\"probe_qk8.py\"),\"--out\",str(root/\"chain-a1\"),\"--chain\",\"--layers\",\"34\",\"--repeats\",\"20\"]\nenv=os.environ.copy();env[\"PYTHONPATH\"]=\"/root/e214/candidate-a1/gems/src\";env[\"OMP_NUM_THREADS\"]=\"4\";env[\"OPENBLAS_NUM_THREADS\"]=\"4\"\nwith (root/\"chain.log\").open(\"w\") as log:\n    proc=subprocess.Popen(cmd,cwd=root,env=env,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\n    data={\"state\":\"running\",\"pid\":proc.pid,\"start_unix\":time.time(),\"task\":\"cold_QK8_34_independent_KV_layers_full_recipient_chain\"}\n    status.write_text(json.dumps(data)+\"\\n\")\n    try:rc=proc.wait(timeout=300)\n    except subprocess.TimeoutExpired:\n        os.killpg(proc.pid,signal.SIGTERM)\n        try:rc=proc.wait(timeout=15)\n        except subprocess.TimeoutExpired:os.killpg(proc.pid,signal.SIGKILL);rc=proc.wait()\n        data[\"timed_out\"]=True\n    data.update(state=\"completed\",exit_code=rc,end_unix=time.time());status.write_text(json.dumps(data)+\"\\n\")\n")
          print("WRITTEN",str(path),hashlib.sha256(path.read_bytes()).hexdigest(),flush=True)
          with (root/"launcher_chain.log").open("w") as log:
              proc=subprocess.Popen([sys.executable,str(path)],cwd=root,stdin=subprocess.DEVNULL,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
          print("LAUNCHED",json.dumps({"runner_pid":proc.pid,"path":"/root/e246/chain-a1","deadline_seconds":300}),flush=True)
          print("FLAGOS_E245_A2_E246_CHAIN_END",flush=True)
          PY'
