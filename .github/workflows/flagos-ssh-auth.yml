kw):\\n                value = super().attention(layer, *a, **kw)\\n                if self.refresh_ledger is not None and layer in X.ANCHORS:\\n                    self.refresh_ledger.append((layer, self.ws[0].refresh[:B].clone()))\\n                return value\\n\\n        with torch.inference_mode():\\n            probe = Probe()\\n            controller = Controller(X, module, args.out)\\n            for name, base, expected_r, geometry in PHASES:\\n                deadline()\\n                probe.offset = ((torch.arange(B, device=probe.device) == args.refresh_row)\\n                                if geometry == \\\"one_hot\\\" else\\n                                (torch.arange(B, device=probe.device) >= 56)).long()\\n                controller.set_arm(\\\"control\\\")\\n                route, indices, token, initial = initialize(probe, base)\\n\\n                def forward():\\n                    logits, layers = probe.forward(token, (route,), record=True)\\n                    return logits, layers, probe.sample(logits)\\n\\n                probe.restore(initial, indices)\\n                probe.configure(\\\"control\\\")\\n                controller.set_arm(\\\"control\\\")\\n                probe.refresh_ledger = []\\n                wanted = forward()\\n                flags = [(layer, values.tolist()) for layer, values in probe.refresh_ledger]\\n                probe.refresh_ledger = None\\n                assert [layer for layer, _ in flags] == list(X.ANCHORS)\\n                assert [sum(values) for _, values in flags] == [expected_r] * 8, (name, flags)\\n                terminal = probe.snapshot(0, indices)\\n                epoch_changed = [(new != old).nonzero().flatten().tolist()\\n                                 for new, old in zip(terminal[1][0], initial[1][0], strict=True)]\\n                actual_rows = [[row for row, value in enumerate(values) if value] for _, values in flags]\\n                assert epoch_changed == actual_rows, (name, epoch_changed, actual_rows)\\n                graphs, outputs, launches = {}, {}, {}\\n                for arm in ARMS:\\n                    deadline()\\n                    probe.restore(initial, indices)\\n                    probe.configure(\\\"control\\\")\\n                    controller.set_arm(arm)\\n                    warm = forward()\\n                    parity(torch, bits, probe, warm, wanted, terminal, indices, (name, arm, \\\"eager\\\"))\\n                    del warm\\n                    probe.restore(initial, indices)\\n                    probe.configure(\\\"control\\\")\\n                    controller.set_arm(arm)\\n                    graph = torch.cuda.CUDAGraph()\\n                    with torch.cuda.graph(graph):\\n                        output = forward()\\n                    assert controller.calls == {key: 8 for key in SPECS}, controller.calls\\n                    assert (probe.projections, probe.recipient_calls, probe.weight_bytes) == (42, 34, 0)\\n                    launches[arm] = dict(controller.calls)\\n                    probe.restore(initial, indices)\\n                    graph.replay()\\n                    parity(torch, bits, probe, output, wanted, terminal, indices, (name, arm, \\\"graph\\\"))\\n                    graphs[arm], outputs[arm] = graph, output\\n                raw = {arm: [] for arm in ARMS}\\n                first, last = torch.cuda.Event(enable_timing=True), torch.cuda.Event(enable_timing=True)\\n                for group in range(args.groups):\\n                    deadline()\\n                    for arm in (ARMS if group % 2 == 0 else ARMS[::-1]):\\n                        samples = []\\n                        for _ in range(args.replays):\\n                            probe.restore(initial, indices)\\n                            first.record()\\n                            graphs[arm].replay()\\n                            last.record()\\n                            last.synchronize()\\n           